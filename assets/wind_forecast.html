  sel.addEventListener('change', function() {
    const key = sel.value;
    const vis = visibilityMap[key];
    if (vis) {
      Plotly.restyle('plot', {'visible': vis});
    }
    if (subtitleMap[key] !== undefined) {
      subtitleEl.textContent = subtitleMap[key];
    }
  });
</script>
</body>
</html>
