name: Gauge pairs backfill

# One-off, for the verification database's runs from before a run kept its gauge pairs (scripts/verify/gauge_qc.py):
# gauge_<init>.parquet for every run with its sums and none (mverify_scores.gauge_pairs), ens-gauge_<init>.parquet for
# every run with the ensembles' sums and none (ens_verify.gauge_cases, the newest runs first), and the lists of the
# gauge totals of 2024 and 2025 that fail quality control (the nightly, verification.yml, lists its own window's
# years). A run that has its file is skipped, so a dispatch goes on where the last one stopped. Dispatch only.
on:
  workflow_dispatch:

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt
  MVERIFY_DB: ${{ github.workspace }}/.obs/obs.duckdb
  MVERIFY: "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@216746d479a83e61cce1a9d256ec73f9a3aa0d47"

permissions:
  contents: write

concurrency:
  group: verify-gauge-backfill
  cancel-in-progress: false

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        year: [2024, 2025]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: The year's failed gauge totals
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ matrix.year }}
        run: |
          # every station's year is read and checked whole; only its last day is stored
          mverify db init
          mverify db ghcnh --year "$YEAR" --since "$YEAR-12-31" --until "$YEAR-12-31" --failed-totals "$RUNNER_TEMP/failed"
          gh release download verify-gauge-qc -D "$RUNNER_TEMP/held" -p 'failed_totals_*.parquet'
          python scripts/verify/gauge_qc.py "$RUNNER_TEMP/failed" "$RUNNER_TEMP/held"
          gh release upload verify-gauge-qc "$RUNNER_TEMP/held/failed_totals_$YEAR.parquet" --clobber

  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Each run's gauge pairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have="$RUNNER_TEMP/have.txt"
          scripts/verify/verifydb.sh list > "$have"
          runs() { grep -oE "^$1_[0-9]{10}" "$have" | cut -d_ -f2 | sort; }
          comm -23 <(runs stats) <(runs gauge) | xargs -r -n 30 > "$RUNNER_TEMP/due.txt"
          echo "$(wc -w < "$RUNNER_TEMP/due.txt") runs due"
          while read -r inits; do
            names=$(for i in $inits; do echo "sfc_$i.parquet stats_$i.parquet"; done)
            # shellcheck disable=SC2086  # the file names are meant to split
            scripts/verify/verifydb.sh get "$RUNNER_TEMP/src" $names
            python - "$RUNNER_TEMP/src" "$RUNNER_TEMP/db-new" <<'EOF'
          import sys
          from pathlib import Path

          import pandas as pd

          sys.path.insert(0, "scripts/verify")
          import mverify_scores as D

          src, out = map(Path, sys.argv[1:])
          out.mkdir(parents=True, exist_ok=True)
          for f in sorted(src.glob("sfc_*.parquet")):
              init = f.stem[4:]
              pairs, sums = (
                  set(pd.read_parquet(p, columns=["model"])["model"].astype(str)) for p in (f, src / f"stats_{init}.parquet")
              )
              if pairs != sums:  # sums of other pairs than these could not be made again from them
                  print(f"::warning::{init}: pairs of {sorted(pairs)}, sums of {sorted(sums)}: no gauge pairs", flush=True)
                  continue
              D.write_gauges(D.gauge_pairs(f), out, init)
          EOF
            scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            rm -rf "$RUNNER_TEMP"/src "$RUNNER_TEMP"/db-new
          done < "$RUNNER_TEMP/due.txt"

  ensembles:
    needs: deterministic   # one after the other: both spend the hour's API allowance on their uploads
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Each run's gauge cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have="$RUNNER_TEMP/have.txt"
          scripts/verify/verifydb.sh list > "$have"
          runs() { grep -oE "^$1_[0-9]{10}" "$have" | cut -d_ -f2 | sort; }
          comm -23 <(runs ens-stats) <(runs ens-gauge) | sort -r | xargs -r -n 25 > "$RUNNER_TEMP/due.txt"
          echo "$(wc -w < "$RUNNER_TEMP/due.txt") runs due"
          while read -r inits; do
            names=$(for i in $inits; do echo "ens-stats_$i.parquet"; grep -E "^ens-sfc-[a-z]+_$i\.parquet$" "$have" || true; done)
            # shellcheck disable=SC2086  # the file names are meant to split
            scripts/verify/verifydb.sh get "$RUNNER_TEMP/src" $names
            python - "$RUNNER_TEMP/src" "$RUNNER_TEMP/db-new" <<'EOF'
          import sys
          from pathlib import Path

          import pandas as pd

          sys.path.insert(0, "scripts/verify")
          import ens_verify as E

          src, out = map(Path, sys.argv[1:])
          out.mkdir(parents=True, exist_ok=True)
          for sums in sorted(src.glob("ens-stats_*.parquet")):
              init = sums.stem.split("_")[1]
              scored = set(pd.read_parquet(sums, columns=["model"])["model"].astype(str))
              files = [src / E.file_of("sfc", m, init) for m in E.ENSEMBLES if m in scored]
              E.D.write_gauges(E.gauge_cases(files), out, init, "ens-gauge")
          EOF
            scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            rm -rf "$RUNNER_TEMP"/src "$RUNNER_TEMP"/db-new
          done < "$RUNNER_TEMP/due.txt"
