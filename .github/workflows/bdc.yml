name: Brewer-Dobson upwelling (downward control)

# The stratosphere page's Brewer-Dobson product (2026-09-27): tropical upward mass flux at 70/100 hPa and the residual
# streamfunction, by DOWNWARD CONTROL from the EP-flux divergence and gravity-wave drag (scripts/strat/bdc_dc.py; the
# continuity estimate was rejected - it gives no winter maximum in either GEOS FP or MERRA-2). GEOS FP analyses and the
# 00Z forecast from NASA NCCS OPeNDAP; the MERRA-2 climatology and the 2018-19 GEOS FP-MERRA-2 offset from release
# bdc-ref-v1; the rolling analysis cache (one small npz a day) on the frames branch. ~6 minutes a run.
# NCCS posts the 00Z forecast late (not there by 06:35 UTC on 2026-09-27), hence the afternoon slots.
# Same source, same slots: the stratosphere page's isentropic PV loop (scripts/strat/geos_pv.py, 475 K and 850 K, GEOS FP
# analysis + 10-day forecast, ~7 minutes; frames to the frames branch, manifest on main). It runs first and on its own:
# a BDC failure must not hold the PV loop back, nor the other way round.
# Same source again: the stratosphere page's live MOMENTUM BUDGET (scripts/strat/momentum_budget.py, 2026-09-27): the TEM
# zonal-momentum terms from GEOS FP's 3-hourly analyses plus its gravity-wave-drag and analysis-increment tendencies, and
# the resolved terms of the 10-day forecast. It runs last, on its own; one new analysis day is ~3-4 min and a new forecast
# cycle ~10-13 min (81 three-hourly steps), so the 12:30 run still ends before upperstrat.yml's 13:10 NCCS slot and the
# 18:30 run finds the cycle already cached. Its analysis cache (one ~180 KB npz a day, pruned at 150 days) and the newest
# forecast live on the frames branch; a cold cache is seeded from release mbudget-ref-v1 (the laptop backfill).

on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bdc
  cancel-in-progress: false

jobs:
  bdc:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/bdc_dc.py
            scripts/strat/geos_pv.py
            scripts/strat/geosfp_cap.py
            scripts/strat/momentum_budget.py
            scripts/strat/reference/mbudget_clim.npz
            scripts/lib
            assets/sst/anim/geos_pv_manifest.json
            assets/sst/data
            assets/sst/bdc_dc_upwelling.webp
            assets/sst/bdc_dc_section.webp
            assets/sst/mbudget_*.webp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy scipy pandas xarray netCDF4 matplotlib cartopy==0.25.0
      - name: Potential vorticity on 475 K and 850 K (GEOS FP)
        id: pv
        run: |
          if python scripts/strat/geos_pv.py --out assets/sst; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::GEOS FP PV failed; keeping the previous loop"; fi
      # the observed tail of the forecast dripping paint (forecast_drip.py, read by gefs.yml, strat.yml and the laptop
      # GEPS run): GEOS FP polar-cap height at 11 levels, daily mean of 00/06/12/18Z, the last 10 days refreshed
      - name: GEOS FP polar-cap height tail
        if: ${{ !cancelled() }}
        run: |
          python scripts/strat/geosfp_cap.py tail --days 10 --keep 120 --procs 3 \
            --out assets/sst/data/geosfp_cap_history.json || echo "::warning::GEOS FP cap tail failed"
      - name: Publish the PV frames (frames branch)
        if: steps.pv.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/geos_pv_nh assets/sst/anim/geos_pv_sh
      - name: Reference files and the analysis cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=scripts/strat/data/bdc_dc; mkdir -p $D
          gh release download bdc-ref-v1 --repo "$GITHUB_REPOSITORY" -D $D --clobber
          scripts/lib/fetch_frames_ci.sh assets/sst/anim/bdc_tail || true
          mkdir -p $D/fp_tail assets/sst/anim/bdc_tail
          cp assets/sst/anim/bdc_tail/*.npz $D/fp_tail/ 2>/dev/null || true
          # a cold cache (first run, or the frames copy lost) starts from the release's seed (Jun 12 - Sep 26 2026)
          if [ "$(ls $D/fp_tail | wc -l)" -lt 60 ]; then tar xzf $D/fp_tail_seed.tar.gz -C $D && echo "seeded from the release"; fi
          echo "cached analysis days: $(ls $D/fp_tail | wc -l)"
      - name: Live update
        id: live
        run: |
          python scripts/strat/bdc_dc.py live
          D=scripts/strat/data/bdc_dc
          mkdir -p assets/sst/data
          cp $D/bdc_dc_upwelling.webp $D/bdc_dc_section.webp assets/sst/
          cp $D/bdc_dc.json assets/sst/data/bdc_dc.json
          # the cache back to the frames branch: new days merged in, days older than 150 d pruned
          cp $D/fp_tail/*.npz assets/sst/anim/bdc_tail/
          old=$(ls assets/sst/anim/bdc_tail/*.npz | xargs -n1 basename | sed 's/.npz//' | awk -v c=$(date -u -d '150 days ago' +%Y%m%d) '$1 < c' | sed 's#^#assets/sst/anim/bdc_tail/#; s#$#.npz#' | tr '\n' ' ')
          echo "prune=$old" >> "$GITHUB_OUTPUT"
      - name: Publish the cache (frames branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE: ${{ steps.live.outputs.prune }}
        run: scripts/lib/publish_frames_ci.sh +assets/sst/anim/bdc_tail
      - name: Momentum budget (GEOS FP)
        id: mb
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=scripts/strat/data/mbudget; C=assets/sst/anim/mbudget_tail
          mkdir -p $D/tail $D/fcst
          scripts/lib/fetch_frames_ci.sh $C || true
          mkdir -p $C/fcst
          cp $C/2*.npz $D/tail/ 2>/dev/null || true
          cp $C/fcst/*.npz $D/fcst/ 2>/dev/null || true
          # a short cache (first runs, or the frames copy lost) is topped up from the laptop backfill; files already in
          # the cache are never overwritten (they may be newer), so a fuller seed on the release merges in on its own
          if [ "$(ls $D/tail | wc -l)" -lt 90 ]; then
            gh release download mbudget-ref-v1 --repo "$GITHUB_REPOSITORY" -p tail_seed.tar.gz -D $D --clobber \
              && tar xzf $D/tail_seed.tar.gz -C $D --skip-old-files && echo "topped up from the release seed"
          fi
          echo "cached analysis days: $(ls $D/tail | wc -l)"
          if python scripts/strat/momentum_budget.py live; then
            mkdir -p assets/sst/data
            cp $D/figs/mbudget_*.webp assets/sst/
            cp $D/figs/mbudget.json assets/sst/data/mbudget.json
            # back to the frames branch: new days merged in; days older than 150 d and superseded forecasts pruned
            prune=""
            for f in $C/fcst/*.npz; do [ -e "$f" ] || continue; [ -f "$D/fcst/$(basename $f)" ] || prune="$prune $f"; done
            rm -f $C/fcst/*.npz; cp $D/fcst/*.npz $C/fcst/ 2>/dev/null || true
            cp $D/tail/*.npz $C/
            cut=$(date -u -d '150 days ago' +%Y%m%d)
            for f in $C/2*.npz; do b=$(basename $f .npz); if [ "$b" \< "$cut" ]; then prune="$prune $f"; fi; done
            echo "prune=$prune" >> "$GITHUB_OUTPUT"
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::momentum budget failed; keeping the previous figures"
          fi
      - name: Publish the momentum-budget cache (frames branch)
        if: steps.mb.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE: ${{ steps.mb.outputs.prune }}
        run: scripts/lib/publish_frames_ci.sh +assets/sst/anim/mbudget_tail
      - name: Commit & push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d)
          OUTS="assets/sst/bdc_dc_upwelling.webp assets/sst/bdc_dc_section.webp assets/sst/data/bdc_dc.json assets/sst/anim/geos_pv_manifest.json assets/sst/data/geos_pv.json assets/sst/data/geosfp_cap_history.json assets/sst/data/mbudget.json $(ls assets/sst/mbudget_*.webp 2>/dev/null | tr '\n' ' ')"
          for f in $OUTS; do [ -f "$f" ] && git add -f "$f"; done
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            for f in $OUTS; do [ -f "$f" ] && git add -f "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "bdc: Brewer-Dobson upwelling + GEOS FP PV + momentum budget $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || echo "pages dispatch failed; the dispatcher will catch it"
