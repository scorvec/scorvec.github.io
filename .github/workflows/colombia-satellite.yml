name: Colombia/Panama true-colour satellite loop (GOES-East)

# High-res true-colour (visible) GOES-East loop over Colombia/Panama from NASA GIBS GeoColor.
# Hourly: render any new sunlit frame, trim the rolling 2-day window, rebuild the manifest. Night
# frames are skipped (visible is dark), so each run only adds a frame during local daylight.
on:
  # schedule disabled 2026-07-18 (Shawn: pause this job for now) — re-enable by
  # restoring the cron below; manual dispatch still works.
  # schedule:
  #   - cron: '22 * * * *'    # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colombia-satellite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # room for the bounded git-retry loop in Commit & push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pin matplotlib+cartopy: an unpinned upgrade (~2026-06-12) regressed the GeoAxes
      # `bbox_inches="tight"` crop + dropped the title, blowing up the frame geometry.
      - run: pip install --quiet numpy pillow matplotlib==3.10.9 cartopy==0.25.0 shapely xarray netcdf4
      - run: python scripts/sst/colombia_satellite.py
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git add -A assets/sst/anim/colombia assets/sst/anim/colombia_manifest.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Colombia/Panama true-colour loop: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
