name: AAM conservation and drag - rebuild the study page

# Rebuilds model-drag-intercomparison.html from the committed reduced diagnostics (scripts/amdrag/data/**.npz): the
# analysis (study.py, bootstrap + FDR), the figures (studies/model-drag-intercomparison/*.webp) and the page text
# (build_page.py, which words each finding by its significance and re-stamps the site chrome). Nothing is downloaded.
# Runs daily after the collectors (amdrag-gem.yml, amdrag-models.yml) so the sample on the page grows; dispatch any time.

on:
  schedule:
    - cron: "50 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amdrag-page
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/amdrag
            scripts/site
            scripts/mjo/data/reference/drag_cd_field.nc
            scripts/mjo/data/reference/era5_orography.nc
            studies/model-drag-intercomparison
            model-drag-intercomparison.html
            aifs-aam-budget.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy xarray netCDF4 h5netcdf "matplotlib==3.10.9" pillow
      - name: Analyse, plot, write the page
        run: |
          python scripts/amdrag/study.py
          python scripts/amdrag/figures.py --site .
          python scripts/amdrag/build_page.py --site .
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="model-drag-intercomparison.html studies/model-drag-intercomparison scripts/amdrag/data/results.json"
          # snapshot + clean resync each attempt (merge-free: only these generated files are written); never a rebase
          SNAP=$(mktemp -d)
          git add --sparse -A $OUT
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add --sparse -A $OUT
            if git diff --staged --quiet; then echo "No changes."; exit 0; fi
            git commit -q -m "amdrag: study page rebuilt $(date -u +%Y-%m-%d)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing"; sleep 5
          done
          exit 1
