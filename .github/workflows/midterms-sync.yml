# Pulls the results and the frozen forecast from the public model repository (scorvec/midterms-2026, whose results.yml
# reads the count every hour) into the site's midterms/ folder and re-applies the site chrome:
#   * copy web/index.html (the races still out, the front page), results.html (the results), forecast.html (the final
#     forecast), about.html, pollchart.js, mt.css and web/data/{results, results_summary, live, live_history, model,
#     race_history, districts_2026.topo}.json into midterms/ and midterms/data/;
#     legislatures.html, its data/stateleg_seats.json and data/stateleg_geo/ (index.json + the per-state TopoJSON it lists)
#     when published;
#   * drop any robots noindex tag (a guard; the model repo's pages carry none);
#   * stamp the site header/footer: apply_chrome.stamp_all(only={the five midterms pages});
#   * commit only midterms/ (path-limited), snapshot + resync on every push attempt, never rebase;
#   * dispatch pages.yml like the other site workflows.
# results_summary.json (the homepage panel) is written by the model repository (midterms/results_page.py); no text
# substitutions are needed.
# Files are read at the commit SHA of the model repo's main (immutable raw URLs, so no CDN staleness).
name: midterms sync

on:
  schedule:
    - cron: "55 * * * *"        # 15 min after each results.yml run (:40 every hour)
  workflow_dispatch:
  repository_dispatch:
    types: [midterms-updated]   # optional: the model repo can trigger this with a token that may dispatch here

permissions:
  contents: write
  actions: write

concurrency:
  group: midterms-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL_REPO: scorvec/midterms-2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch the published forecast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$MODEL_REPO/commits/main" --jq .sha)
          echo "model repo at $sha"
          base="https://raw.githubusercontent.com/$MODEL_REPO/$sha/web"
          tmp=$(mktemp -d); mkdir -p "$tmp/data"
          for f in index.html results.html forecast.html about.html pollchart.js mt.css; do
            curl -fsSL --retry 3 -o "$tmp/$f" "$base/$f"
          done
          # legislatures.html (state legislative chambers, experimental) - optional
          curl -fsSL --retry 3 -o "$tmp/legislatures.html" "$base/legislatures.html" || rm -f "$tmp/legislatures.html"
          for f in results.json results_summary.json live.json live_history.json model.json race_history.json districts_2026.topo.json; do
            curl -fsSL --retry 3 -o "$tmp/data/$f" "$base/data/$f"
          done
          # legislatures.html district maps: per-seat forecasts + per-state TopoJSON listed in
          # stateleg_geo/index.json "files" (new chambers add states, so the list is read, not hard-coded). Optional as a
          # whole; once the index is there every listed file must arrive (set -e) so a half-copied set is never published.
          curl -fsSL --retry 3 -o "$tmp/data/stateleg_seats.json" "$base/data/stateleg_seats.json" || rm -f "$tmp/data/stateleg_seats.json"
          mkdir -p "$tmp/geo"
          if curl -fsSL --retry 3 -o "$tmp/geo/index.json" "$base/data/stateleg_geo/index.json"; then
            for f in $(python -c "import json,sys; print(' '.join(json.load(open(sys.argv[1]))['files']))" "$tmp/geo/index.json"); do
              [[ "$f" =~ ^[A-Z]{2}\.topo\.json$ ]] || { echo "::error::unexpected geometry file name $f"; exit 1; }
              curl -fsSL --retry 3 -o "$tmp/geo/$f" "$base/data/stateleg_geo/$f"
            done
          else
            rm -rf "$tmp/geo"
          fi
          # refuse to publish broken or older results, or a forecast that is not the frozen one
          python - "$tmp" <<'EOF'
          import json, sys, pathlib
          t = pathlib.Path(sys.argv[1])
          for f in [*(t / "data").glob("*.json"), *(t / "geo").glob("*.json")]: json.loads(f.read_text())
          new = json.loads((t / "data" / "results.json").read_text())
          assert new.get("races") and new.get("frozen"), "results.json lacks its races or the frozen forecast's stamp"
          model = json.loads((t / "data" / "model.json").read_text())
          assert (model.get("final") or {}).get("sha256") == new["frozen"]["sha256"], "model.json is not the frozen forecast"
          old_p = pathlib.Path("midterms/data/results.json")
          if old_p.exists():
              old = json.loads(old_p.read_text())
              assert new["generated"] >= old["generated"], f"model repo results {new['generated']} are older than the site's {old['generated']}"
          print("results", new["generated"], "frozen forecast", new["frozen"]["at"])
          EOF
          mkdir -p midterms/data
          for f in index.html results.html forecast.html about.html legislatures.html; do
            [ -f "$tmp/$f" ] || continue
            sed 's|<meta name="robots" content="noindex">||' "$tmp/$f" > "midterms/$f"
          done
          cp "$tmp/mt.css" midterms/mt.css
          cp "$tmp/pollchart.js" midterms/pollchart.js
          # compact copies (the model repo writes compact JSON already; this keeps the site files minified either way)
          for f in "$tmp"/data/*.json; do
            python -c "import json,sys; json.dump(json.load(open(sys.argv[1])), open(sys.argv[2], 'w'), separators=(',', ':'))" "$f" "midterms/data/$(basename "$f")"
          done
          if [ -d "$tmp/geo" ]; then              # replaced wholesale: a state that drops out of the index goes too
            rm -rf midterms/data/stateleg_geo; mkdir -p midterms/data/stateleg_geo
            for f in "$tmp"/geo/*.json; do
              python -c "import json,sys; json.dump(json.load(open(sys.argv[1])), open(sys.argv[2], 'w'), separators=(',', ':'))" "$f" "midterms/data/stateleg_geo/$(basename "$f")"
            done
          fi

      - name: Stamp the site chrome
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts/site'); import apply_chrome as A; A.stamp_all(only={'midterms/index.html', 'midterms/results.html', 'midterms/forecast.html', 'midterms/about.html', 'midterms/legislatures.html'}, quiet=True)"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt (the site's pattern); path-limited to midterms/
          SNAP=$(mktemp -d)
          git add -A midterms
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          stamp=$(python -c "import json; print(json.load(open('midterms/data/results.json'))['generated'])")
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            # the pages come from the model repo, but their chrome is the site's: re-stamp it from main's CURRENT
            # apply_chrome.py so a menu change pushed during this run is not reverted
            python -c "import sys; sys.path.insert(0, 'scripts/site'); import apply_chrome as A; A.stamp_all(only={'midterms/index.html', 'midterms/results.html', 'midterms/forecast.html', 'midterms/about.html', 'midterms/legislatures.html'}, quiet=True)" || echo "::warning::chrome re-stamp failed"
            git add -A midterms
            if git diff --staged --quiet; then echo "No changes; skipping commit."; echo "PUSHED=0" >> "$GITHUB_ENV"; exit 0; fi
            git commit -q -m "midterms: results $stamp" -- midterms
            if timeout 180 git push; then echo "Pushed on attempt $i."; echo "PUSHED=1" >> "$GITHUB_ENV"; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1

      - name: Deploy the site
        if: success() && env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "site deploy is batched - the dispatcher deploys within 15 min (pages.yml)"
