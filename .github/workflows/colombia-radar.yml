name: Colombia radar (IDEAM)

# Derived radar products for the unlisted /radar page. The IDEAM bucket
# (s3-radaresideam) carries RAW SIGMET volumes only — no QPE, CAPPI or
# composite exists upstream — so everything is built here with Py-ART.
#
# The bucket lands in complete daily batches roughly a day behind, so this
# ingests D-1 and D-2 (D-2 catches days that arrive late) and prunes the
# published tree to a fortnight; anything older is re-derivable on demand.
on:
  schedule:
  # # Paused to Mondays while the rain spike runs its course (user, 2026-08-29).
  # # Nothing is lost: the S3 bucket keeps the raw volumes, so the Monday run
  # # backfills the whole weekend from the wider default window below.
    - cron: '40 9 * * 1'          # ~04:40 Colombia Monday; '40 9 * * *' for daily
  workflow_dispatch:
    inputs:
      date:
        description: 'Single date to (re)build, YYYYMMDD. Blank = the last 5 days.'
        required: false
      radar:
        description: 'Single radar, e.g. Barrancabermeja. Blank = all available.'
        required: false

permissions:
  contents: write
  actions: write      # to dispatch the Pages deploy below

concurrency:
  group: colombia-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # ~100 scans/radar-day, each a 5 MB download + decode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install --quiet numpy scipy matplotlib pillow
          pip install --quiet cartopy arm_pyart
      - name: Ingest
        run: |
          set -e
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATES="${{ github.event.inputs.date }}"
          else
            # D-1 through D-5: enough to backfill a weekend the schedule skipped
            # and to catch dates the bucket published late.
            DATES="$(for n in 1 2 3 4 5; do date -u -d "$n days ago" +%Y%m%d; done)"
          fi
          RADAR="${{ github.event.inputs.radar }}"
          for D in $DATES; do
            echo "::group::$D"
            python scripts/sst/radar_ingest.py --date "$D" \
              ${RADAR:+--radar "$RADAR"} --products ppi --stride 3 --keep 96 || true
            echo "::endgroup::"
          done
      - name: Publish
        run: python scripts/sst/radar_publish.py --max-days 14
      - name: Prune to a fortnight
        run: python scripts/sst/radar_archive.py --prune --keep-days 14
      - name: Commit & push
        id: push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add radar/
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "radar: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 300 git push; then
              echo "pushed (attempt $i)"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after retries"; exit 1
      # A push made with the default GITHUB_TOKEN does NOT trigger `on: push`
      # workflows, so the Pages deploy never fires for a commit this job made:
      # the frames sit in main and the site keeps serving the old index until
      # some other (laptop) push happens to deploy them. Dispatch it directly.
      - name: Deploy to Pages
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
