name: Hadley and Walker forecasts (AIFS-ENS, IFS-ENS, GEFS 00Z, days 0-15)

# Every member of the 00Z AIFS-ENS, IFS-ENS and GEFS runs to day 15, less its model's drift against ERA5 (release
# overturn-ref-v1, built by overturn-ref.yml), as the forecast loops of the Hadley-cell and Walker products
# (scripts/mjo/src/overturn_fc.py -> assets/sst/anim/{mmsf,walker}_fc_<region> + assets/sst/data/overturn_fc.json).
# IFS-ENS day 15 reaches the Google mirror around 08:50 UTC: the dispatcher fires this at 09:40 (backstop 11:40).
on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '00Z run, YYYYMMDD (empty = today)'
        required: false
        default: ''
      force:
        description: 'Run even if this run is already drawn'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: overturn
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  ECMWF_SOURCES: google

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Which run
        id: run
        env:
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          d="${DATE:-$(date -u +%Y%m%d)}"
          echo "date=$d" >> "$GITHUB_OUTPUT"
          have=$(python3 -c "import json; print(json.load(open('assets/sst/anim/mmsf_fc_manifest.json'))['ver'])" 2>/dev/null || echo none)
          if [ "$have" = "${d}00" ] && [ "$FORCE" != "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "run $d 00Z already drawn"; fi
      - uses: actions/setup-python@v7
        if: steps.run.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - name: System libraries
        if: steps.run.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
      - name: Install Python dependencies
        if: steps.run.outputs.skip != 'true'
        run: pip install -r scripts/mjo/requirements-mjo.txt
      - name: Drift reference
        if: steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download overturn-ref-v1 -R "$GITHUB_REPOSITORY" -p overturn_ref.npz -D scripts/mjo/data/reference --clobber
      - name: Forecast loops
        if: steps.run.outputs.skip != 'true'
        run: python scripts/mjo/src/overturn_fc.py --date "${{ steps.run.outputs.date }}"
      - name: Publish the loop frames (frames branch)
        if: steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh $(ls -d assets/sst/anim/mmsf_fc_*/ assets/sst/anim/walker_fc_*/ | sed 's#/$##')
      - name: Commit & push (manifests and series)
        if: steps.run.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot the outputs, then commit them on a clean sync of origin/main each attempt (never a rebase)
          OUT="assets/sst/anim/mmsf_fc_manifest.json assets/sst/anim/walker_fc_manifest.json assets/sst/data/overturn_fc.json"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            for f in $OUT; do [ -e "$f" ] && git add "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "Hadley/Walker forecasts: ${{ steps.run.outputs.date }} 00Z"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
