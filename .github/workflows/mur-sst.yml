name: MUR 1-km equatorial Pacific SST

# NASA JPL MUR v4.1 via NOAA CoastWatch ERDDAP (~1-2 day latency, credential
# free). Independent of PSL, so these maps keep updating through PSL outages
# like 2026-08-22. The daily page restamp (sst.yml / laptop) refreshes the
# cache-buster for these images.
on:
  # CRON-PAUSED 2026-09-01 (restore: uncomment the block below)
  # schedule:
  # - cron: '47 13 * * *'   # 13:47 UTC daily — ERDDAP has the new analysis by mid-morning UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mur-sst
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mur-${{ runner.os }}-v1
      - name: Install cartopy system libs
        run: |
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 && \
               sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                 libgeos-dev libproj-dev proj-bin; then exit 0; fi
            echo "apt attempt $i failed; retrying"; sleep 10
          done
          exit 1
      - name: Install Python dependencies
        run: pip install --quiet numpy pandas xarray netcdf4 matplotlib==3.10.9 "cartopy>=0.22" "shapely>=2.0" "pyproj>=3.5" Pillow
      # The still maps are retired from the page for now — only the event
      # animation runs daily (main() in mur_eqpac.py still renders the stills
      # if they're ever wanted back).
      # Seed from the frames branch: these renderers append only what is
      # missing, and the frames no longer arrive with the checkout.
      - name: Seed existing frames
        run: scripts/lib/fetch_frames_ci.sh assets/sst/anim/mur_ct

      - name: Append event-animation frame
        run: python scripts/sst/mur_eqpac.py --anim
      # Frames go to the orphan branch, never main: 483 frame webp were
      # being rewritten into main's history every cycle while an identical
      # copy already sat on the branch. Only the manifest stays on main, so
      # the page still fetches it same-origin.
      - name: Publish frames to the orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/mur_ct

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sst/anim/mur_manifest.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
