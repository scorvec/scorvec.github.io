name: SSW imprint index - the analysis record (IFS control analyses)

# scripts/strat/ssw_imprint.py, the downward propagation monitor's surface index: the IFS control's analyses (step 0 of
# every 00 and 12 UTC cycle, msl, Google Cloud mirror) from `start` into assets/sst/data/ssw_imprint_history.json, the
# live analysis tail after the ERA5 store stops, with its overlap with ERA5 compared (correlation, mean difference)
# and stored beside it. strat-ifs.yml adds each cycle it runs on; this fills whatever that missed, weekly (Mondays).
# The strat-ifs concurrency group: both workflows write the record.
on:
  # backstop cron: the dispatcher (scripts/lib/dispatch_workflows.sh) fires this on time
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      start:
        description: 'First analysis day (YYYY-MM-DD); the overlap with ERA5 is everything before July 2026'
        default: '2026-01-01'

permissions:
  contents: write

env:
  ECMWF_SOURCES: google
  ECMWF_MULTISOURCE: "0"
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

concurrency:
  group: strat-ifs
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: The analysis record as main has it now
        run: |
          git fetch -q --depth 1 origin main
          git checkout origin/main -- assets/sst/data/ssw_imprint_history.json 2>/dev/null || echo "no record yet"

      - name: Backfill the analyses
        env:
          START: ${{ inputs.start || '2026-01-01' }}
        run: python scripts/strat/ssw_imprint.py backfill --start "$START"

      # Never rebase: snapshot, reset to a fresh origin/main each attempt, lay the snapshot back on, commit, push.
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          for f in assets/sst/data/ssw_imprint_history.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          FILES=$(git diff --staged --name-only)
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            for f in $FILES; do git add "$f"; done
            if git diff --staged --quiet; then echo "no changes after resync"; exit 0; fi
            git commit -q -m "ssw imprint: analysis record $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
