name: SSW imprint index - analysis record and model drift (IFS control analyses, archived control runs)

# scripts/strat/ssw_imprint.py, the downward propagation monitor's surface index. Two references it needs that the
# reanalysis cannot give it:
#   backfill       the IFS control's analyses (step 0 of every 00 and 12 UTC cycle, msl, Google Cloud mirror) from
#                  `start`, into assets/sst/data/ssw_imprint_history.json, the live analysis tail after ERA5's store
#                  stops; the overlap with ERA5 is compared (correlation, mean difference) and stored beside it.
#   measure-drift  each model's mean index error by lead: its control's archived 00Z runs (AIFS-ENS control and IFS
#                  control from the Google Cloud mirror, GEFS gec00 from NOAA's S3), one every `every` days, verified
#                  against those analyses -> scripts/strat/reference/ssw_imprint_drift.json. GEPS has no archive.
# ~1 GB in all. The strat-ifs concurrency group: both workflows write the analysis record.
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First analysis day (YYYY-MM-DD); the overlap with ERA5 is everything before July 2026'
        default: '2026-01-01'
      drift:
        description: 'Models to measure the drift of (space-separated: aifs hres gefs; blank = none)'
        default: 'aifs hres gefs'
      cycles:
        description: 'Past runs per model'
        default: '30'

permissions:
  contents: write

env:
  ECMWF_SOURCES: google
  ECMWF_MULTISOURCE: "0"
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

concurrency:
  group: strat-ifs
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: The analysis record as main has it now
        run: |
          git fetch -q --depth 1 origin main
          git checkout origin/main -- assets/sst/data/ssw_imprint_history.json 2>/dev/null || echo "no record yet"

      - name: Backfill the analyses
        env:
          START: ${{ inputs.start }}
        run: python scripts/strat/ssw_imprint.py backfill --start "$START"

      - name: Measure the drift
        env:
          MODELS: ${{ inputs.drift }}
          CYCLES: ${{ inputs.cycles }}
        run: |
          for m in $MODELS; do
            python scripts/strat/ssw_imprint.py measure-drift --model "$m" --cycles "$CYCLES" \
              || echo "::warning::$m drift not measured"
          done

      # Never rebase: snapshot, reset to a fresh origin/main each attempt, lay the snapshot back on, commit, push.
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          for f in assets/sst/data/ssw_imprint_history.json scripts/strat/reference/ssw_imprint_drift.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          FILES=$(git diff --staged --name-only)
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            for f in $FILES; do git add "$f"; done
            if git diff --staged --quiet; then echo "no changes after resync"; exit 0; fi
            git commit -q -m "ssw imprint: analysis record and model drift $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
