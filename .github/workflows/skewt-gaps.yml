name: skewt-gaps
on:
  schedule:
  # Weekly (was Tue+Fri): the grade needs each US station's IGRA year-to-date file
  # (~90 files, ~0.1 GB), and twice a week re-downloaded mostly unchanged data.
  - cron: "40 8 * * 2"        # Tue 08:40 UTC (IGRA y2d lags ~2 days)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skewt-gaps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild US sounding gap record
        run: python scripts/skewt/sounding_gaps.py
      - name: Commit if changed
        run: |
          git config user.name "gaps-bot"
          git config user.email "actions@github.com"
          git add skewt/gaps.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data update"
          for i in 1 2 3; do
            if timeout 120 git pull --no-rebase --no-edit origin main && timeout 180 git push origin main; then echo "pushed (attempt $i)"; exit 0; fi
            git merge --abort 2>/dev/null || true    # a timed-out pull can strand a half-done merge
            sleep 5
          done
          echo "push failed after retries"; exit 1
