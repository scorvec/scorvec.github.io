name: qbo-tracker
on:
  schedule:
    - cron: "15 7 * * 1"        # Mondays 07:15 UTC — QBO is a monthly beast
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qbo-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update recent months from IGRA year-to-date
        run: python scripts/qbo/qbo_tracker.py update
      - name: Commit if changed
        run: |
          git config user.name "qbo-bot"
          git config user.email "actions@github.com"
          git add qbo/qbo.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "QBO tracker: weekly update"
          git pull --rebase origin main
          git push origin main
