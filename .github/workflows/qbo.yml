name: qbo-tracker
on:
  schedule:
  - cron: "15 7 * * 1"        # Mondays 07:15 UTC — QBO is a monthly beast
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qbo-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install plotting dependencies
        run: pip install -q numpy pandas matplotlib pillow

      - name: Update recent months from IGRA year-to-date
        run: python scripts/qbo/qbo_tracker.py update

      # The page is static now - no Plotly, no client-side redraw. These four
      # figures ARE the charts, so they have to be rebuilt whenever the data is.
      - name: Render the figures
        run: python scripts/qbo/render_qbo.py --out-dir assets/qbo
      - name: Commit if changed
        run: |
          git config user.name "qbo-bot"
          git config user.email "actions@github.com"
          # Snapshot the outputs, then commit on a clean sync of origin/main each attempt (the mjo.yml pattern), never
          # a rebase: a collided rebase can drop the build.
          OUT="qbo/qbo.json assets/qbo"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add $OUT
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -m "data update (weekly)"
            if timeout 180 git push origin main; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after retries"; exit 1
