name: SST event comparisons (weekly)

# These El Niño event-comparison products compare the current ENSO evolution
# against the 1997/2015/2023 analogs at 7-day (weekly) resolution, built from
# the OISST daily-anomaly per-year files for just the event years (~3 GB of
# downloads). They change slowly, so a weekly refresh is enough — kept out of
# the daily SST workflow to avoid the bulk download.
on:
  schedule:
    - cron: '41 18 * * 1'      # Mondays ~18:41 UTC — after PSL's ~16:30 UTC update, with slack for scheduler delay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sst-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sst-${{ runner.os }}-${{ hashFiles('scripts/sst/requirements-sst.txt') }}
          restore-keys: |
            pip-sst-${{ runner.os }}-
      # The analog-year OISST files and the 1991-2020 climatology are STATIC —
      # cache them (~4.3 GB) so each weekly run only pulls the current-year file
      # (~260 MB) from PSL. Cuts the PSL transfer ~95%: repeated runner kills /
      # corrupt downloads all happened inside these long bulk pulls (2026-07-17).
      # download() probe-opens every cached .nc, so a bad cache self-heals.
      - uses: actions/cache@v6
        with:
          path: |
            scripts/sst/data/sst.day.mean.1997.nc
            scripts/sst/data/sst.day.mean.1998.nc
            scripts/sst/data/sst.day.mean.2015.nc
            scripts/sst/data/sst.day.mean.2016.nc
            scripts/sst/data/sst.day.mean.2023.nc
            scripts/sst/data/sst.day.mean.2024.nc
            scripts/sst/data/sst.day.mean.ltm.1991-2020.nc
          key: oisst-static-event-years-v1
      - name: Install cartopy system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgeos-dev libproj-dev proj-bin
      - name: Install Python dependencies
        run: pip install -r scripts/sst/requirements-sst.txt

      - name: Build event-comparison products (downloads OISST daily-anom event years)
        run: python scripts/sst/sst_events.py

      - name: Build subsurface analog comparison (TAO moorings, 1997/2015/2023)
        working-directory: scripts/sst
        run: python sst_subsurface_events.py || echo "subsurface analog build failed; continuing"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot the built outputs, then commit on a clean sync of origin/main each
          # attempt. The old rebase recovery could silently DISCARD the build: leftover
          # unstaged files failed the rebase, and its reset --hard fallback reverted the
          # webps before re-adding them (bit us 2026-07-17 — ran "successfully", pushed
          # nothing). Snapshot+restore makes losing the outputs structurally impossible.
          OUT="assets/sst/events_nino34.webp assets/sst/events_bars.webp assets/sst/events_maps.webp \
               assets/sst/subsurface_events_hc.webp assets/sst/subsurface_events_xsec.webp"
          SNAP=$(mktemp -d)
          for f in $OUT; do [ -f "$f" ] && install -D "$f" "$SNAP/$f"; done
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi   # falling through would hit "no changes" and fake success
            git reset --hard origin/main
            (cd "$SNAP" && find . -type f -exec install -D {} "$GITHUB_WORKSPACE/{}" \;)
            git add $OUT
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -m "SST event comparisons: weekly refresh"
            if timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed"; exit 1
