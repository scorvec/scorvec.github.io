name: Datamart throughput probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Same 16 GEPS files from the Datamart and from HPFX, 4 at a time
        run: |
          for host in https://dd.weather.gc.ca https://hpfx.collab.science.gc.ca; do
            t0=$(date +%s.%N)
            printf '%s\n' 792 798 804 810 816 822 828 834 768 774 780 786 744 750 756 762 | \
              xargs -P 4 -I{} curl -s -o /dev/null -w "%{size_download} %{time_total}\n" \
              "$host/20261026/WXO-DD/ensemble/geps/grib2/raw/00/{}/CMC_geps-raw_UGRD_ISBL_0200_latlon0p5x0p5_2026102600_P{}_allmbrs.grib2" > /tmp/r.txt
            t1=$(date +%s.%N)
            awk -v h="$host" -v w="$(echo "$t1 - $t0" | bc)" '{b+=$1; s+=$2; n++} END {printf "%s: %d files, %.1f MB in %.1f s wall = %.2f MB/s; per file %.1f s, %.2f MB/s each\n", h, n, b/1e6, w, b/1e6/w, s/n, b/1e6/s}' /tmp/r.txt
          done
