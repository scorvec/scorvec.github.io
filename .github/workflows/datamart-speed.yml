name: Datamart throughput probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 48 GEPS files at 4 and at 12 connections, HTTP codes counted
        run: |
          for p in 4 12; do
            t0=$(date +%s.%N)
            for v in UGRD_ISBL_0200 VGRD_ISBL_0200 TMP_TGL_2m; do for L in 600 606 612 618 624 630 636 642 648 654 660 666 672 678 684 690; do echo "$v $L"; done; done | \
              xargs -P $p -n 2 sh -c 'curl -s -o /dev/null -w "%{http_code} %{size_download} %{time_total}\n" "https://dd.weather.gc.ca/20261026/WXO-DD/ensemble/geps/grib2/raw/00/$1/CMC_geps-raw_$0_latlon0p5x0p5_2026102600_P$1_allmbrs.grib2"' > /tmp/r$p.txt
            t1=$(date +%s.%N)
            echo "== $p connections: $(echo "$t1 - $t0" | bc) s wall"; awk '{c[$1]++; b+=$2; s+=$3} END {for (k in c) printf "  HTTP %s x%d\n", k, c[k]; printf "  %.0f MB, mean %.1f s a file\n", b/1e6, s/NR}' /tmp/r$p.txt
          done
