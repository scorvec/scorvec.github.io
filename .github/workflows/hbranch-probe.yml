name: probe (temporary) - IFS HRES streams and fields on the Google mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Index entries
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts/ecmwf")
          import rangefetch as rf
          for date in ("20240301", "20250101", "20250702", "20261016"):
              for hh in ("00", "06", "12", "18"):
                  for stream in ("oper", "scda"):
                      try:
                          idx = rf.fetch_index(date, hh, "ifs", 0, "fc", stream=stream)
                      except Exception as e:
                          print(date, hh, stream, "-", type(e).__name__, str(e)[:60]); continue
                      pl = [e for e in idx if e.get("levtype") == "pl"]
                      params = sorted({e["param"] for e in pl})
                      levs = sorted({int(e["levelist"]) for e in pl}, reverse=True)
                      sfc = sorted({e["param"] for e in idx if e.get("levtype") == "sfc"})
                      w = [e for e in pl if e["param"] == "w"]
                      size = sum(int(e["_length"]) for e in pl if e["param"] in ("u", "v", "w", "t"))
                      print(date, hh, stream, len(idx), "pl", params, levs, "w msgs", len(w), "uvwt MB", round(size / 1e6, 1), "msl" in sfc)
          PY
