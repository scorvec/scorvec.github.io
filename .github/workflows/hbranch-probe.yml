name: probe (temporary) - timing of the HRES and ARCO reads

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt
  ECMWF_SOURCES: google

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt
      - name: Timings
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, "scripts/mjo/src")
          import pandas as pd, numpy as np
          import hadley_branch_maps as M
          for t in (pd.Timestamp("2025-03-02 06:00"), pd.Timestamp("2026-10-15 12:00")):
              t0 = time.time(); H = M.hres_time(t); print("hres", t, f"{time.time()-t0:.1f}s", float(H["w"][5].std()), flush=True)
          t = pd.Timestamp("2025-03-02 06:00")
          ds = M._arco()
          for k in ("v_component_of_wind", "temperature"):
              t0 = time.time(); ds[k].sel(time=t, level=[1000, 500]).load(); print("arco", k, f"{time.time()-t0:.1f}s", flush=True)
          t0 = time.time(); E = M.era5_time(t); print("era5_time", f"{time.time()-t0:.1f}s", flush=True)
          m = M.day_mean([H, H]); t0 = time.time(); M.derived(m); print("derived", f"{time.time()-t0:.1f}s", flush=True)
          S = M._empty_sums(); t0 = time.time(); np.savez_compressed("/tmp/s.npz", **S); print("save sums", f"{time.time()-t0:.1f}s", flush=True)
          print("chunks", ds["temperature"].encoding.get("chunks"), ds["temperature"].encoding.get("preferred_chunks"))
          PY
