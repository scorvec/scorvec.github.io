name: Eddy feedback (ERA5, CMIP6)

# Is the models' tropospheric eddy feedback too weak, and does that weaken the surface response to sudden stratospheric
# warmings? One job per CMIP6 historical run (up to `members` per model, 1950-2014) and per span of ERA5 winters
# (WeatherBench 2, 1958/59-2022/23) reduces daily u, v and sea-level pressure (scripts/strat/eddy_extract.py), October
# to May: zonal means and eddy momentum flux by latitude, the NAO and the North Atlantic barotropic energy generation
# rate. Each CMIP6 run streams ~10-40 GB (the plev8 day stores carry all eight levels). Extracts are kept as artifacts
# (90 days). A final job tests ERA5 against the models (scripts/strat/eddy_feedback.py) and commits
# scripts/strat/reference/eddy_feedback.json; `from_run` re-tests finished runs' extracts instead. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated source_ids (blank = every model with day ua, va and psl)'
        default: ''
      members:
        description: 'Historical members per model'
        default: '5'
      era5:
        description: 'Reduce ERA5 too'
        default: 'true'
      analyse:
        description: 'Run the tests and commit them (false = extracts only)'
        default: 'true'
      from_run:
        description: 'Finished run ids (comma-separated) whose extracts to test, together (blank = extract now)'
        default: ''

permissions:
  contents: write

concurrency:
  group: eddy-feedback
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/eddy_extract.py
            scripts/strat/cmip6_coupling_extract.py
            scripts/strat/ssw_imprint.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas xarray pyproj
      - name: Catalogue
        run: curl -sSf --retry 3 -o /tmp/pangeo-cmip6.csv https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
      - id: m
        env:
          MODELS: ${{ inputs.models }}
          MEMBERS: ${{ inputs.members }}
          ERA5: ${{ inputs.era5 }}
        run: |
          jobs=$(python scripts/strat/eddy_extract.py plan --catalog /tmp/pangeo-cmip6.csv --models "$MODELS" --members "$MEMBERS")
          echo "$jobs" | ERA5="$ERA5" python3 -c "
          import json, os, sys
          j = [x for x in json.load(sys.stdin) if x['source'] == 'cmip6' or os.environ['ERA5'] == 'true']
          print(len(j), 'jobs'); [print(' ', x) for x in j]
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'include': j[:256]}) + '\n')"

  extract:
    needs: plan
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/eddy_extract.py
            scripts/strat/cmip6_coupling_extract.py
            scripts/strat/ssw_imprint.py
            scripts/strat/reference/ssw_imprint.nc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas xarray "zarr>=3" gcsfs cftime scipy netCDF4 pyproj dask
      - name: Catalogue
        if: ${{ matrix.source == 'cmip6' }}
        run: curl -sSf --retry 3 -o /tmp/pangeo-cmip6.csv https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
      - name: Reduce ${{ matrix.source }} ${{ matrix.model }}${{ matrix.winters }} ${{ matrix.member }}
        run: |
          if [ "${{ matrix.source }}" = era5 ]; then
            python scripts/strat/eddy_extract.py era5 --winters "${{ matrix.winters }}" --out out
          else
            python scripts/strat/eddy_extract.py cmip6 --catalog /tmp/pangeo-cmip6.csv --model "${{ matrix.model }}" \
              --member "${{ matrix.member }}" --out out
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eddy_${{ matrix.source }}_${{ matrix.model }}${{ matrix.winters }}_${{ matrix.member }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore

  analyse:
    needs: extract
    if: ${{ !cancelled() && inputs.analyse == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/eddy_feedback.py
            scripts/strat/eddy_extract.py
            scripts/strat/cmip6_coupling.py
            scripts/strat/cmip6_coupling_extract.py
            scripts/strat/ssw_imprint.py
            scripts/strat/reference/strat_history.nc
            scripts/strat/reference/eddy_feedback.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas scipy xarray netCDF4
      # every listed run's extracts (a later run's file replaces an earlier one's)
      - name: Collect the extracts
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ inputs.from_run || github.run_id }}
        run: |
          mkdir -p runs
          for id in ${IDS//,/ }; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'eddy_*' -D "dl/$id"
            find "dl/$id" -type f \( -name '*.npz' -o -name '*_log.json' \) -exec cp {} runs/ \;
          done
          ls runs/*.npz | wc -l
          grep -h -o '"status": "[^"]*"' runs/*_log.json | sort | uniq -c
      - name: Tests
        run: |
          set -o pipefail
          python scripts/strat/eddy_feedback.py --runs runs --strat scripts/strat/reference/strat_history.nc \
            --out scripts/strat/reference/eddy_feedback.json | tee /tmp/eddy.log
      # Never rebase: snapshot, reset to a fresh origin/main each attempt, lay the snapshot back on, commit, push.
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          OUTS="scripts/strat/reference/eddy_feedback.json"
          git add $OUTS
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add $OUTS
            if git diff --staged --quiet; then echo "no changes after resync"; exit 0; fi
            git commit -q -m "strat: eddy feedback tests, ERA5 against CMIP6 $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
