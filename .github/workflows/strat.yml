name: Stratosphere (vortex, wave-1, E-P flux)

# The stratospheric products that appear on enso-atmosphere.html, moved off the
# laptop on 2026-08-29 and split into parallel jobs on 2026-08-30:
#
#   nh_vortex.py      -> assets/sst/nh_vortex.webp        60N winds + polar-cap height
#   wave1_maps.py     -> assets/sst/wave1_{100,500}.webp  one still per level
#                     -> assets/sst/anim/wave1_{100,500}/ 16-step loop per level
#   vortex_winds.py   -> assets/sst/vortex_{10,100}.webp   one still per level
#                     -> assets/sst/anim/vortex_{10,100}/  31-step 12-hourly loop
#   qbo_duct.py       -> assets/sst/anim/epflux/          E-P flux loop
#
# WHY FOUR JOBS. As one job this took ~70 min, and 23 of those were ens_cycle
# populating a 10 GB shared cache that only HALF the products read:
#
#   nh_vortex, qbo_duct       GLOB the cache        -> need ens_cycle
#   wave1_maps, vortex_winds  call ecmwf.ensure     -> fetch their own, few hundred MB
#
# So the light pair no longer waits on a fetch it never touches, and the two
# render jobs run concurrently. A failure in one no longer hides or blocks the
# other, which matters because every render is wrapped in `|| echo ::warning::`
# so that one upstream outage cannot sink the rest.
#
# The cycle is resolved ONCE, in its own job, and passed to both. Resolving it
# per-job would let a cycle published between them put the two halves of the
# page on different initialisations.
#
# Publishing is likewise a SINGLE job. Both the frames push and the commit to
# main are force-push / rebase operations on shared refs: two render jobs
# publishing concurrently would race, and on the frames branch the loser
# silently deletes the winner's frames (clone-swap-reorphan reads the branch
# before it writes it).
on:
  schedule:
    # AIFS-ENS 00Z/12Z land on open data around 06-07Z and 18-19Z. These are
    # daily products, so two firings is the right size - deliberately not more.
    - cron: '35 7,19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = latest AIFS-ENS)'
        default: ''
      time:
        description: 'Cycle hour 00 or 12 (blank = latest)'
        default: ''
      publish:
        description: 'Commit the figures (false = render + artifacts only)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: strat
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- cycle ---
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.cyc.outputs.date }}
      time: ${{ steps.cyc.outputs.time }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      # The full requirements, not just ecmwf-opendata: download_aifs imports
      # the shared store module at module scope, so a targeted install would
      # break on its transitive imports. ~1 min against the pip cache.
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Resolve cycle
        id: cyc
        working-directory: scripts/mjo/src
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; T="${{ github.event.inputs.time }}"
          if [ -z "$D" ] || [ -z "$T" ]; then
            # Written to a file, not stdout: newer ecmwf-opendata emits a progress
            # bar with no trailing newline and corrupts stdout parsing (same trick
            # mjo.yml uses).
            python -c "from download_aifs import latest_run; d,t=latest_run(); open('/tmp/cyc','w').write(f'{d} {t}')" \
              >/dev/null 2>/tmp/probe.err || true
            D=$(awk '{print $1}' /tmp/cyc 2>/dev/null || true)
            T=$(awk '{print $2}' /tmp/cyc 2>/dev/null || true)
          fi
          if ! echo "$D" | grep -qE '^[0-9]{8}$' || ! echo "$T" | grep -qE '^(00|12)$'; then
            echo "ERROR: bad cycle (D='$D' T='$T')" >&2; tail -40 /tmp/probe.err >&2 || true; exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "time=$T" >> "$GITHUB_OUTPUT"
          echo "cycle: $D ${T}Z"

  # ------------------------------------------------- light: self-fetching ---
  # wave1_maps and vortex_winds pull exactly the fields they plot through the
  # shared ecmwf store, so they skip ens_cycle entirely. ~25 min, most of it the
  # 31-frame vortex loop.
  light:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 libgeos-dev libproj-dev proj-bin

      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Wave-1 maps + forecast loop
        run: |
          python scripts/strat/wave1_maps.py \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --out-dir assets/sst \
            --anim-dir assets/sst/anim \
            --manifest assets/sst/anim/wave1_maps_manifest.json \
            || echo "::warning::wave1_maps failed; keeping the previous figure"

      - name: Vortex winds, 10 and 100 hPa
        run: |
          python scripts/strat/vortex_winds.py \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --out-dir assets/sst \
            --anim-dir assets/sst/anim \
            --manifest assets/sst/anim/vortex_winds_manifest.json \
            || echo "::warning::vortex_winds failed; keeping the previous figure"

      - name: What was produced
        if: always()
        run: |
          for f in assets/sst/wave1_100.webp assets/sst/wave1_500.webp assets/sst/vortex_10.webp assets/sst/vortex_100.webp; do
            if [ -f "$f" ]; then
              printf '  %-38s %s  (mtime %s)\n' "$f" "$(du -h "$f" | cut -f1)" "$(date -r "$f" -u +%H:%MZ)"
            else
              printf '  %-38s MISSING\n' "$f"
            fi
          done
          for d in assets/sst/anim/wave1_100 assets/sst/anim/wave1_500 assets/sst/anim/vortex_10 assets/sst/anim/vortex_100; do
            printf '  %-38s %s frames\n' "$d" "$(ls "$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')"
          done

      # Handed to the publish job rather than pushed here: see the header note
      # on why publishing is single-threaded.
      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-light
          path: |
            assets/sst/wave1_100.webp
            assets/sst/wave1_500.webp
            assets/sst/vortex_10.webp
            assets/sst/vortex_100.webp
            assets/sst/anim/wave1_100/**
            assets/sst/anim/wave1_500/**
            assets/sst/anim/vortex_10/**
            assets/sst/anim/vortex_100/**
            assets/sst/anim/wave1_maps_manifest.json
            assets/sst/anim/vortex_winds_manifest.json
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------ heavy: needs the cache ---
  # nh_vortex globs pf_u_10-* (the 25-member AIFS pull) and qbo_duct globs
  # cf_u_10-*; both READ the cache rather than fetching, so ens_cycle is not
  # optional here. Without it the first run logged "no AIFS-ENS cycle ... in the
  # cache", produced nothing, and still exited green.
  heavy:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 libgeos-dev libproj-dev proj-bin

      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Populate the ENS cycle cache
        working-directory: scripts/mjo
        timeout-minutes: 60
        env:
          MJO_HEAVY_ATMOS: '1'
        run: |
          python src/ens_cycle.py --date "${{ needs.cycle.outputs.date }}" \
                                  --time "${{ needs.cycle.outputs.time }}" \
            || echo "::warning::ens_cycle had issues; downstream uses whatever cached"
          du -sh data 2>/dev/null || true

      # --cycle is matched against the cache directory name, which carries a
      # trailing "z"; nh_vortex accepts it with or without.
      - name: NH polar vortex
        run: |
          python scripts/strat/nh_vortex.py --models aifs,geps,gdps,ifs --ifs-members 5 \
            --cycle "${{ needs.cycle.outputs.date }}${{ needs.cycle.outputs.time }}" \
            --out assets/sst/nh_vortex.webp \
            || echo "::warning::nh_vortex failed; keeping the previous figure"

      - name: E-P flux loop
        run: |
          python scripts/strat/qbo_duct.py \
            || echo "::warning::E-P flux loop failed; keeping the previous frames"

      - name: What was produced
        if: always()
        run: |
          if [ -f assets/sst/nh_vortex.webp ]; then
            printf '  %-38s %s  (mtime %s)\n' assets/sst/nh_vortex.webp \
              "$(du -h assets/sst/nh_vortex.webp | cut -f1)" \
              "$(date -r assets/sst/nh_vortex.webp -u +%H:%MZ)"
          else
            printf '  %-38s MISSING\n' assets/sst/nh_vortex.webp
          fi
          printf '  %-38s %s frames\n' assets/sst/anim/epflux \
            "$(ls assets/sst/anim/epflux/*.webp 2>/dev/null | wc -l | tr -d ' ')"

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-heavy
          path: |
            assets/sst/nh_vortex.webp
            assets/sst/anim/epflux/**
            assets/sst/anim/epflux_manifest.json
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------- publish ---
  # always(): one render job failing must not strip the other's output from the
  # site. Whatever arrived in the artifacts is published; a product that did not
  # render simply is not in them, and both steps below leave its existing copy
  # alone.
  publish:
    needs: [cycle, light, heavy]
    if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Collect the render jobs' output
        uses: actions/download-artifact@v7
        with:
          pattern: strat-*
          merge-multiple: true
          path: .

      - name: What arrived
        run: |
          for f in assets/sst/nh_vortex.webp assets/sst/wave1_100.webp assets/sst/wave1_500.webp assets/sst/vortex_10.webp assets/sst/vortex_100.webp; do
            if [ -f "$f" ]; then printf '  %-38s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else printf '  %-38s (not produced this run)\n' "$f"; fi
          done
          for d in assets/sst/anim/epflux assets/sst/anim/wave1_100 assets/sst/anim/wave1_500 assets/sst/anim/vortex_10 assets/sst/anim/vortex_100; do
            printf '  %-38s %s frames\n' "$d" "$(ls "$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')"
          done

      # The loops render ~63 frames per cycle. Those must reach the frames
      # branch or the manifests committed below point at images that exist only
      # on the laptop - which is exactly what happened while this step was
      # missing. Same clone-swap-reorphan dance ecape.yml uses: the branch also
      # carries OISST, satellite, GDPS, ASCAT and ECAPE frames, and a plain
      # force-push of our tree alone would delete every one of them. Only the
      # strat subdirectories that actually rendered are swapped, never
      # assets/sst/anim wholesale.
      - name: Publish loop frames to the orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # count_frames, not a bare find: under `set -euo pipefail` a find over
          # a MISSING directory exits non-zero, pipefail carries that through the
          # pipe, and set -e kills the step before it prints anything. The
          # 13:11Z run died exactly that way - exit 1, zero output - because a
          # product this job had not received simply has no directory here. In
          # the old single job the render step always created them in the same
          # workspace, so the bug could not show.
          count_frames() {
            [ -d "$1" ] || { echo 0; return 0; }
            find "$1" -name '*.webp' 2>/dev/null | wc -l | tr -d ' '
          }
          n=0
          for d in epflux wave1_100 wave1_500 vortex_10 vortex_100; do
            c=$(count_frames "assets/sst/anim/$d")
            echo "  $d: $c frames"; n=$((n + c))
          done
          if [ "$n" -eq 0 ]; then
            echo "::warning::no loop frames rendered; leaving the frames branch alone"; exit 0
          fi
          TMP=$(mktemp -d)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch frames --single-branch -q "$URL" "$TMP/f"; then
            echo "  cloned frames branch ($(du -sh "$TMP/f" | cut -f1))"
          else
            echo "  no frames branch yet - creating one"
            mkdir -p "$TMP/f" && git -C "$TMP/f" init -q && git -C "$TMP/f" remote add origin "$URL"
          fi
          for d in epflux wave1_100 wave1_500 vortex_10 vortex_100; do
            # A product that did not render must not blank its directory on the
            # branch, so an empty one is skipped rather than swapped in.
            c=$(count_frames "assets/sst/anim/$d")
            if [ "$c" -eq 0 ]; then
              echo "  $d: nothing rendered, leaving the branch copy"; continue
            fi
            rm -rf "$TMP/f/assets/sst/anim/$d"
            mkdir -p "$TMP/f/assets/sst/anim"
            cp -r "assets/sst/anim/$d" "$TMP/f/assets/sst/anim/"
            # manifests live on main for the same-origin fetch
            find "$TMP/f/assets/sst/anim/$d" -name '*_manifest.json' -delete
          done
          cd "$TMP/f"
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git checkout -q --orphan fresh
          git add -A
          if git diff --cached --quiet; then echo "no frame changes"; exit 0; fi
          git commit -q -m "animation frames $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force -q origin fresh:frames
          echo "  pushed $(find assets -name '*.webp' | wc -l) frames total"

      # Only the static figures and the manifests are committed to main.
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git add assets/sst/nh_vortex.webp assets/sst/wave1_100.webp \
                  assets/sst/wave1_500.webp assets/sst/vortex_10.webp \
                  assets/sst/vortex_100.webp \
                  assets/sst/anim/*_manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
