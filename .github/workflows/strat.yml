name: Stratosphere (vortex, wave-1, E-P flux)

# The stratospheric products that appear on enso-atmosphere.html, moved off the
# laptop on 2026-08-29:
#
#   nh_vortex.py      -> assets/sst/nh_vortex.webp        60N winds + polar-cap height
#   wave1_maps.py     -> assets/sst/wave1_maps.webp       wave-1 maps + 16-step loop
#   qbo_duct.py       -> assets/sst/anim/epflux/          E-P flux loop
#   vortex_winds.py   -> assets/sst/vortex_winds.webp     10/100 hPa, both hemispheres
#                     -> assets/sst/anim/vortex_winds/    31-step 12-hourly loop
#
# Everything else in scripts/strat is proprietary and stays local; it writes to
# assets/strat/, which is gitignored and only feeds a local page.
#
# Cost: ens_cycle populates the shared ECMWF cache (~19 min, ~1.1 GB peak) and
# nh_vortex pulls GEPS/GDPS/IFS members (~250 MB at --ifs-members 5). That cache
# step is not optional - qbo_duct and nh_vortex GLOB the cache
# rather than fetching, so without it they find nothing and produce nothing.
#
# Cycle-following is deliberately NOT used: unlike HRRR, an AIFS-ENS cycle is
# either published or it is not, and the store's mirror rotation already handles
# a partial one by falling through.
on:
  schedule:
    # AIFS-ENS 00Z/12Z land on open data around 06-07Z and 18-19Z. These are
    # daily products, so two firings is the right size — deliberately not more.
    - cron: '35 7,19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = latest AIFS-ENS)'
        default: ''
      time:
        description: 'Cycle hour 00 or 12 (blank = latest)'
        default: ''
      publish:
        description: 'Commit the figures (false = render + artifacts only)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: strat
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 120, not 90: ens_cycle is ~23 min and the vortex loop adds ~18 min of
    # rendering measured locally (31 frames x 4 polar panels). A GitHub runner
    # has 4 vCPU against this laptop's 10, so the loop can run longer there and
    # the old 90 left no headroom for a slow ENS fetch on top.
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 libgeos-dev libproj-dev proj-bin

      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Resolve cycle
        id: cyc
        working-directory: scripts/mjo/src
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; T="${{ github.event.inputs.time }}"
          if [ -z "$D" ] || [ -z "$T" ]; then
            # Written to a file, not stdout: newer ecmwf-opendata emits a progress
            # bar with no trailing newline and corrupts stdout parsing (same trick
            # mjo.yml uses).
            python -c "from download_aifs import latest_run; d,t=latest_run(); open('/tmp/cyc','w').write(f'{d} {t}')" \
              >/dev/null 2>/tmp/probe.err || true
            D=$(awk '{print $1}' /tmp/cyc 2>/dev/null || true)
            T=$(awk '{print $2}' /tmp/cyc 2>/dev/null || true)
          fi
          if ! echo "$D" | grep -qE '^[0-9]{8}$' || ! echo "$T" | grep -qE '^(00|12)$'; then
            echo "ERROR: bad cycle (D='$D' T='$T')" >&2; tail -40 /tmp/probe.err >&2 || true; exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "time=$T" >> "$GITHUB_OUTPUT"
          echo "cycle: $D ${T}Z"

      # Each product is independent and non-fatal. One upstream outage should not
      # take the others down, and the previous figure stays on the site until the
      # next successful run replaces it. `|| echo` rather than `set +e` so a
      # failure is visible in the log instead of being swallowed by a green step
      # (the AAM trial reported success while all three products had failed).
      # qbo_duct and nh_vortex read the shared ECMWF cache by
      # GLOBBING it - they do not fetch. On the laptop run_local.sh populates it
      # with ens_cycle first; a fresh runner's cache is empty, which is why the
      # first run here logged "no AIFS-ENS cycle with the needed files in the
      # cache" and produced 0 E-P flux and 0 QBO strip frames while still
      # exiting green.
      - name: Populate the ENS cycle cache
        working-directory: scripts/mjo
        timeout-minutes: 60
        env:
          MJO_HEAVY_ATMOS: '1'
        run: |
          python src/ens_cycle.py --date "${{ steps.cyc.outputs.date }}" \
                                  --time "${{ steps.cyc.outputs.time }}" \
            || echo "::warning::ens_cycle had issues; downstream uses whatever cached"
          du -sh data 2>/dev/null || true

      - name: NH polar vortex
        run: |
          python scripts/strat/nh_vortex.py --models aifs,geps,gdps,ifs --ifs-members 5 \
            --cycle "${{ steps.cyc.outputs.date }}${{ steps.cyc.outputs.time }}" \
            --out assets/sst/nh_vortex.webp \
            || echo "::warning::nh_vortex failed; keeping the previous figure"

      # wave1_maps.py renders the static figure AND the 16-step AIFS-ENS
      # forecast loop. It replaced wave1_monitor.py, which was deleted on
      # 2026-08-30: its amplitude figure had already been retired and its
      # wave1_nh/wave1_sh loops were rendering to a page that never showed them.
      - name: Wave-1 maps + forecast loop
        run: |
          python scripts/strat/wave1_maps.py \
            --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" \
            --out assets/sst/wave1_maps.webp \
            --anim-dir assets/sst/anim/wave1_maps \
            --manifest assets/sst/anim/wave1_maps_manifest.json \
            || echo "::warning::wave1_maps failed; keeping the previous figure"

      - name: Vortex winds, 10 and 100 hPa
        run: |
          python scripts/strat/vortex_winds.py \
            --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" \
            --out assets/sst/vortex_winds.webp \
            --anim-dir assets/sst/anim/vortex_winds \
            --manifest assets/sst/anim/vortex_winds_manifest.json \
            || echo "::warning::vortex_winds failed; keeping the previous figure"

      - name: E-P flux loop
        run: |
          python scripts/strat/qbo_duct.py \
            || echo "::warning::E-P flux loop failed; keeping the previous frames"

      - name: What was produced
        if: always()
        run: |
          for f in assets/sst/nh_vortex.webp assets/sst/wave1_maps.webp assets/sst/vortex_winds.webp; do
            if [ -f "$f" ]; then
              printf '  %-38s %s  (mtime %s)\n' "$f" "$(du -h "$f" | cut -f1)" "$(date -r "$f" -u +%H:%MZ)"
            else
              printf '  %-38s MISSING\n' "$f"
            fi
          done
          for d in assets/sst/anim/epflux assets/sst/anim/wave1_maps assets/sst/anim/vortex_winds; do
            printf '  %-38s %s frames\n' "$d" "$(ls "$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')"
          done

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-${{ steps.cyc.outputs.date }}-${{ steps.cyc.outputs.time }}z
          path: |
            assets/sst/nh_vortex.webp
            assets/sst/wave1_maps.webp
            assets/sst/vortex_winds.webp
          if-no-files-found: warn
          retention-days: 7

      # The three loops render ~63 frames per cycle. Those must reach the frames
      # branch or the manifests committed below point at images that exist only
      # on the laptop - which is exactly what happened while this step was
      # missing. Same clone-swap-reorphan dance ecape.yml uses: the branch also
      # carries OISST, satellite, GDPS, ASCAT and ECAPE frames, and a plain
      # force-push of our tree alone would delete every one of them. Only the
      # three strat subdirectories are swapped, never assets/sst/anim wholesale.
      - name: Publish loop frames to the orphan branch
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n=0
          for d in epflux wave1_maps vortex_winds; do
            c=$(find "assets/sst/anim/$d" -name '*.webp' 2>/dev/null | wc -l | tr -d ' ')
            echo "  $d: $c frames"; n=$((n + c))
          done
          if [ "$n" -eq 0 ]; then
            echo "::warning::no loop frames rendered; leaving the frames branch alone"; exit 0
          fi
          TMP=$(mktemp -d)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch frames --single-branch -q "$URL" "$TMP/f"; then
            echo "  cloned frames branch ($(du -sh "$TMP/f" | cut -f1))"
          else
            echo "  no frames branch yet - creating one"
            mkdir -p "$TMP/f" && git -C "$TMP/f" init -q && git -C "$TMP/f" remote add origin "$URL"
          fi
          for d in epflux wave1_maps vortex_winds; do
            [ -d "assets/sst/anim/$d" ] || continue
            rm -rf "$TMP/f/assets/sst/anim/$d"
            mkdir -p "$TMP/f/assets/sst/anim"
            cp -r "assets/sst/anim/$d" "$TMP/f/assets/sst/anim/"
            # manifests live on main for the same-origin fetch
            find "$TMP/f/assets/sst/anim/$d" -name '*_manifest.json' -delete
          done
          cd "$TMP/f"
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git checkout -q --orphan fresh
          git add -A
          if git diff --cached --quiet; then echo "no frame changes"; exit 0; fi
          git commit -q -m "animation frames $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force -q origin fresh:frames
          echo "  pushed $(find assets -name '*.webp' | wc -l) frames total"

      # Only the static figures and the manifests are committed to main.
      - name: Commit & push
        if: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git add assets/sst/nh_vortex.webp assets/sst/wave1_maps.webp \
                  assets/sst/vortex_winds.webp \
                  assets/sst/anim/*_manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
