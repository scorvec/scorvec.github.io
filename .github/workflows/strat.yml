name: Stratosphere (vortex, wave-1, E-P flux)

# The stratospheric products that appear on stratosphere.html, moved off the
# laptop on 2026-08-29 and split into parallel jobs on 2026-08-30:
#
#   wave1_maps.py     -> assets/sst/anim/wave1_{nh,sh}/    loop only, no still
#   vortex_winds.py   -> assets/sst/vortex_10.webp         still (loop covers 100)
#                     -> assets/sst/anim/vortex_{10,100}/  31-step 12-hourly loop
#   qbo_duct.py       -> assets/sst/anim/epflux/          E-P flux loop
#   qbo_zeroline.py   -> assets/sst/qbo_zeroline_{70,50,30,10}.webp + data/qbo_zeroline{,_aifs}.json   (heavy job)
#
# IFS-ENS (all 50 members) and nh_vortex live in strat-ifs.yml (09:05/21:05) since 2026-09-27: IFS day 15 reaches
# the Google mirror ~08:50Z/20:55Z, after these slots, and nh_vortex carries all four models in one figure.
#
# WHY FOUR JOBS. As one job this took ~70 min, and 23 of those were ens_cycle
# populating a 10 GB shared cache that only HALF the products read:
#
#   qbo_duct                  GLOBS the cache       -> needs ens_cycle
#   wave1_maps, vortex_winds  call ecmwf.ensure     -> fetch their own, few hundred MB
#
# So the light pair no longer waits on a fetch it never touches, and the two
# render jobs run concurrently. A failure in one no longer hides or blocks the
# other, which matters because every render is wrapped in `|| echo ::warning::`
# so that one upstream outage cannot sink the rest.
#
# The cycle is resolved ONCE, in its own job, and passed to both. Resolving it
# per-job would let a cycle published between them put the two halves of the
# page on different initialisations.
#
# Publishing is likewise a SINGLE job. Both the frames push and the commit to
# main are force-push / rebase operations on shared refs: two render jobs
# publishing concurrently would race, and on the frames branch the loser
# silently deletes the winner's frames (clone-swap-reorphan reads the branch
# before it writes it).
on:
  # # AIFS-ENS 00Z/12Z land on open data around 06-07Z and 18-19Z. These are
  # # daily products, so two firings is the right size - deliberately not more.
  workflow_call:
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = latest AIFS-ENS)'
        default: ''
      time:
        description: 'Cycle hour 00 or 12 (blank = latest)'
        default: ''
      publish:
        description: 'Commit the figures (false = render + artifacts only)'
        default: 'false'

# Frame store (Cloudflare R2, S3 API). Absent secrets leave these empty and the
# publishers fall back to the orphan `frames` branch - see scripts/lib/frames_env.sh.
env:
  # ECMWF open data from the Google Cloud mirror ONLY (user rule 2026-09-06), for every job and step: the
  # shared store rotates google/aws/azure/ecmwf unless ECMWF_SOURCES is set, and the wave-1, cycle-probe,
  # ens_cycle and E-P flux steps had no pin (found 2026-09-27).
  ECMWF_SOURCES: google
  ECMWF_MULTISOURCE: "0"
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACL: ${{ secrets.FRAMES_S3_ACL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}

permissions:
  contents: write

concurrency:
  group: strat
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- cycle ---
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.cyc.outputs.date }}
      time: ${{ steps.cyc.outputs.time }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      # The full requirements, not just ecmwf-opendata: download_aifs imports
      # the shared store module at module scope, so a targeted install would
      # break on its transitive imports. ~1 min against the pip cache.
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Resolve cycle
        id: cyc
        working-directory: scripts/mjo/src
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; T="${{ github.event.inputs.time }}"
          if [ -z "$D" ] || [ -z "$T" ]; then
            # Written to a file, not stdout: newer ecmwf-opendata emits a progress
            # bar with no trailing newline and corrupts stdout parsing (same trick
            # mjo.yml uses).
            python -c "from download_aifs import latest_run; d,t=latest_run(); open('/tmp/cyc','w').write(f'{d} {t}')" \
              >/dev/null 2>/tmp/probe.err || true
            D=$(awk '{print $1}' /tmp/cyc 2>/dev/null || true)
            T=$(awk '{print $2}' /tmp/cyc 2>/dev/null || true)
          fi
          if ! echo "$D" | grep -qE '^[0-9]{8}$' || ! echo "$T" | grep -qE '^(00|12)$'; then
            echo "ERROR: bad cycle (D='$D' T='$T')" >&2; tail -40 /tmp/probe.err >&2 || true; exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "time=$T" >> "$GITHUB_OUTPUT"
          echo "cycle: $D ${T}Z"

  # ------------------------------------------------- light: self-fetching ---
  # wave1_maps and vortex_winds pull exactly the fields they plot through the
  # shared ecmwf store, so they skip ens_cycle entirely. ~25 min, most of it the
  # 31-frame vortex loop.
  light:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 libgeos-dev libproj-dev proj-bin

      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Wave-1 maps + forecast loop
        run: |
          python scripts/strat/wave1_maps.py \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --anim-dir assets/sst/anim \
            --manifest assets/sst/anim/wave1_maps_manifest.json \
            || echo "::warning::wave1_maps failed; keeping the previous loop"

      # 100 hPa eddy heat flux: v and T for 25 members, daily steps, ~0.5 GB. Google mirror only.
      - name: Eddy heat flux, 100 hPa
        env:
          ECMWF_SOURCES: google
          ECMWF_MULTISOURCE: "0"
        run: |
          python scripts/strat/heatflux100.py \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --out-dir assets/sst \
            || echo "::warning::heatflux100 failed; keeping the previous figure"

      # Forecast dripping paint: polar-cap height 1000-10 hPa, GEOS FP tail (bdc.yml keeps
      # assets/sst/data/geosfp_cap_history.json) + AIFS-ENS control and 10 members to day 15,
      # drift measured against GEOS FP (reference/aifs_capdrift.json). ~1.7 GB. Google mirror only.
      - name: Forecast dripping paint
        env:
          ECMWF_SOURCES: google
          ECMWF_MULTISOURCE: "0"
        run: |
          python scripts/strat/forecast_drip.py --model aifs \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --out-dir assets/sst \
            || echo "::warning::forecast_drip failed; keeping the previous figure"

      # Weather regimes from the AIFS-ENS 500 hPa members the two steps above already cached (wave1_maps' 25 perturbed
      # members + forecast_drip's control): no fetch of its own. 00Z cycles only (a 12Z cycle is a no-op). ->
      # assets/regimes/data, read by the multi-model regime view (regimes.yml).
      - name: Weather regimes (AIFS-ENS members)
        run: |
          python scripts/regimes/regimes_ecmwf.py --model aifs \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            || echo "::warning::AIFS-ENS regimes failed"

      # 25 perturbed members of u and v at 10/100 hPa every 12 h (~1.9 GB) for the
      # ensemble-mean maps (member 0 until 2026-09-26). Google mirror only.
      - name: Vortex winds, 10 and 100 hPa
        env:
          ECMWF_SOURCES: google
          ECMWF_MULTISOURCE: "0"
        run: |
          python scripts/strat/vortex_winds.py \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --out-dir assets/sst \
            --anim-dir assets/sst/anim \
            --manifest assets/sst/anim/vortex_winds_manifest.json \
            || echo "::warning::vortex_winds failed; keeping the previous figure"

      # FAILS the job when a product rendered nothing. Every render is wrapped in
      # `|| echo ::warning::` so one upstream outage cannot sink the others - but
      # that also turned a wave1_maps run that died in TWO SECONDS on an argparse
      # error into a green step (2026-08-30: strat.yml still passed --out-dir
      # after the script dropped it). A green tick that published nothing has now
      # hidden four separate faults in one day. Publishing still happens: the
      # publish job runs under always(), so the products that DID render reach
      # the site and the run simply goes red so the failure is visible.
      - name: What was produced
        if: always()
        run: |
          bad=0
          for f in assets/sst/vortex_10.webp; do
            if [ -f "$f" ]; then
              printf '  %-38s %s  (mtime %s)\n' "$f" "$(du -h "$f" | cut -f1)" "$(date -r "$f" -u +%H:%MZ)"
            else
              printf '  %-38s MISSING\n' "$f"; bad=$((bad + 1))
            fi
          done
          for d in assets/sst/anim/wave1_nh assets/sst/anim/wave1_sh assets/sst/anim/vortex_10 assets/sst/anim/vortex_100; do
            n=$(ls "$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')
            printf '  %-38s %s frames\n' "$d" "$n"
            [ "$n" -eq 0 ] && bad=$((bad + 1))
          done
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad light product(s) produced nothing - see the warnings above"
            exit 1
          fi

      # Handed to the publish job rather than pushed here: see the header note
      # on why publishing is single-threaded.
      #
      # TARRED, not uploaded as a path list. upload-artifact strips the
      # least-common-ancestor of the paths it is given: a mixed list of
      # assets/sst/wave1_100.webp and assets/sst/anim/** arrives rooted at
      # `wave1_100.webp` and `anim/`, so publish - which looks under
      # assets/sst/anim - found nothing, published an empty set and still went
      # green. Worse, that root MOVES with whichever files happen to exist, so
      # simply downloading into assets/sst would break the first time a product
      # failed to render. A tarball keeps the paths exactly as they are.
      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/light.list
          for p in assets/sst/vortex_10.webp assets/sst/heatflux100_nh.webp assets/sst/heatflux100_sh.webp assets/sst/data/heatflux100.json assets/sst/data/heatflux100_history.json \
                   assets/sst/aifs_drip.webp assets/sst/data/aifs_drip.json \
                   assets/regimes/data/regimes_members_aifs.json assets/regimes/data/regimes_drift_aifs.json \
                   assets/sst/anim/wave1_nh assets/sst/anim/wave1_sh \
                   assets/sst/anim/vortex_10 assets/sst/anim/vortex_100 \
                   assets/sst/anim/wave1_maps_manifest.json \
                   assets/sst/anim/vortex_winds_manifest.json; do
            [ -e "$p" ] && echo "$p" >> /tmp/light.list
          done
          if [ ! -s /tmp/light.list ]; then
            echo "::warning::light produced nothing to hand off"; : > /tmp/strat-light.tgz; exit 0
          fi
          tar -czf /tmp/strat-light.tgz -T /tmp/light.list
          echo "  packed $(tar -tzf /tmp/strat-light.tgz | grep -c '\.webp$') webp"

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-light
          path: /tmp/strat-light.tgz
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------ heavy: needs the cache ---
  # qbo_duct globs cf_u_10-*; it READS the cache rather than fetching, so
  # ens_cycle is not optional here. Without it the first run logged "no AIFS-ENS
  # cycle ... in the cache", produced nothing, and still exited green.
  # (nh_vortex moved to strat-ifs.yml on 2026-09-27.)
  # Budget: populate ~5 + E-P flux ~30 (10 of it fetching v/t).
  heavy:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 libgeos-dev libproj-dev proj-bin

      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      # --only strat (2026-09-06): the four AIFS-ENS u files these two renderers
      # glob, and nothing else. The full ens_cycle also pulled the Hovmöller/SOI
      # surface batches AND IFS-ENS, and at the 07:35Z dispatch IFS 00Z is not
      # on open data yet - two attempts at that one missing file ate the whole
      # 60-min budget on 2026-09-05 and 2026-09-06 (E-P flux: 0 frames). The
      # subset is ~5 min against ~19; the budget below is sized to that.
      - name: Populate the ENS cycle cache
        working-directory: scripts/mjo
        timeout-minutes: 30
        run: |
          python src/ens_cycle.py --only strat \
                                  --date "${{ needs.cycle.outputs.date }}" \
                                  --time "${{ needs.cycle.outputs.time }}" \
            || echo "::warning::ens_cycle had issues; downstream uses whatever cached"
          du -sh ../ecmwf/cache 2>/dev/null || true

      - name: E-P flux loop
        run: |
          python scripts/strat/qbo_duct.py \
            || echo "::warning::E-P flux loop failed; keeping the previous frames"

      # QBO zero-wind line (2026-09-28): the per-member zonal-mean u at 50/10 hPa that qbo_duct just computed
      # (data/zmu_members_aifs.npz - no extra download), the GEOS FP analysis tail from the BDC product's cache on the
      # frames branch (read-only here; bdc.yml owns it), the committed MERRA-2 reference. The IFS-ENS half is added by
      # strat-ifs.yml, which re-renders the same figures with both models.
      - name: QBO zero-wind line
        run: |
          scripts/lib/fetch_frames_ci.sh assets/sst/anim/bdc_tail || true
          python scripts/strat/qbo_zeroline.py forecast --model aifs \
            || echo "::warning::zero-line AIFS-ENS forecast failed; the figure keeps the analysis"
          python scripts/strat/qbo_zeroline.py render \
            || echo "::warning::zero-line render failed; keeping the previous figures"

      - name: What was produced
        if: always()
        run: |
          bad=0
          n=$(ls assets/sst/anim/epflux/*.webp 2>/dev/null | wc -l | tr -d ' ')
          printf '  %-38s %s frames\n' assets/sst/anim/epflux "$n"
          [ "$n" -eq 0 ] && bad=$((bad + 1))
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad heavy product(s) produced nothing - see the warnings above"
            exit 1
          fi

      # Tarred for the same reason as light: see the note there.
      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/heavy.list
          for p in assets/sst/anim/epflux \
                   assets/sst/anim/epflux_manifest.json \
                   assets/sst/qbo_zeroline_70.webp assets/sst/qbo_zeroline_50.webp assets/sst/qbo_zeroline_30.webp \
                   assets/sst/qbo_zeroline_10.webp assets/sst/data/qbo_zeroline.json assets/sst/data/qbo_zeroline_aifs.json; do
            [ -e "$p" ] && echo "$p" >> /tmp/heavy.list
          done
          if [ ! -s /tmp/heavy.list ]; then
            echo "::warning::heavy produced nothing to hand off"; : > /tmp/strat-heavy.tgz; exit 0
          fi
          tar -czf /tmp/strat-heavy.tgz -T /tmp/heavy.list
          echo "  packed $(tar -tzf /tmp/strat-heavy.tgz | grep -c '\.webp$') webp"

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-heavy
          path: /tmp/strat-heavy.tgz
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------- publish ---
  # always(): one render job failing must not strip the other's output from the
  # site. Whatever arrived in the artifacts is published; a product that did not
  # render simply is not in them, and both steps below leave its existing copy
  # alone.
  publish:
    needs: [cycle, light, heavy]
    if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Collect the render jobs' output
        uses: actions/download-artifact@v7
        with:
          pattern: strat-*
          merge-multiple: true
          path: /tmp/art

      - name: Unpack into the workspace
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for t in /tmp/art/*.tgz; do
            [ -s "$t" ] || { echo "  $(basename "$t"): empty, skipped"; continue; }
            tar -xzf "$t" -C .
            c=$(tar -tzf "$t" | grep -c '\.webp$' || true)
            echo "  $(basename "$t"): $c webp restored"; n=$((n + c))
          done
          echo "  $n frames unpacked"

      - name: What arrived
        run: |
          for f in assets/sst/vortex_10.webp assets/sst/heatflux100_nh.webp assets/sst/heatflux100_sh.webp; do
            if [ -f "$f" ]; then printf '  %-38s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else printf '  %-38s (not produced this run)\n' "$f"; fi
          done
          for d in assets/sst/anim/epflux assets/sst/anim/wave1_nh assets/sst/anim/wave1_sh assets/sst/anim/vortex_10 assets/sst/anim/vortex_100; do
            printf '  %-38s %s frames\n' "$d" "$(ls "$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')"
          done

      # The loops render ~63 frames per cycle. Those must reach the frame
      # store or the manifests committed below point at images that exist only
      # on the laptop - which is exactly what happened while this step was
      # missing. The shared publisher swaps in only the directories that
      # rendered; an empty one is left alone rather than blanked.
      - name: Publish loop frames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/lib/publish_frames_ci.sh assets/sst/anim/epflux assets/sst/anim/wave1_nh \
            assets/sst/anim/wave1_sh assets/sst/anim/vortex_10 assets/sst/anim/vortex_100

      # Only the static figures and the manifests are committed to main.
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          # one path at a time: `git add a b c` adds NOTHING when any one of them is missing (a product that failed)
          for f in assets/sst/vortex_10.webp \
                   assets/sst/heatflux100_nh.webp assets/sst/heatflux100_sh.webp assets/sst/data/heatflux100.json assets/sst/data/heatflux100_history.json \
                   assets/sst/aifs_drip.webp assets/sst/data/aifs_drip.json assets/sst/anim/*_manifest.json \
                   assets/regimes/data/regimes_members_aifs.json assets/regimes/data/regimes_drift_aifs.json \
                   assets/sst/qbo_zeroline_*.webp assets/sst/data/qbo_zeroline.json assets/sst/data/qbo_zeroline_aifs.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          # Never rebase (project rule 2026-09-09): snapshot the staged outputs, then on each attempt reset to a
          # fresh origin/main, lay the snapshot back on and commit - the sst.yml / mjo.yml pattern.
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          FILES=$(git diff --staged --name-only)
          git reset -q
          MSG="data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            for f in $FILES; do git add "$f"; done
            if git diff --staged --quiet; then echo "no changes after resync"; exit 0; fi
            git commit -q -m "$MSG"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
