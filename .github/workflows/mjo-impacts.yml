name: MJO impacts by phase and season (static CMIP6 reference)

# The "MJO impacts by phase and season" section of mjo.html: CMIP6 composites for RMM phases 1-8 x season (DJF, MAM,
# JJA, SON, NDJFM, single months), days -2..+2 and +8..+12, with the observed record (BoM RMM with ERA5 t2m / z500 and
# GPCP rain) for comparison. STATIC product: the analysis runs
# once on the laptop (scripts/mjo/src/cmip6_mjo_extract.py streams the Pangeo CMIP6 daily stores, mjo_obs_prepare.py
# the observations, mjo_impacts.py screens the models and builds the composites and tests) and commits one small
# reference; this job only draws it. Frames (8 phases per selection + an all-phase strip) go to the frames branch, the
# manifest to main. Runs when the renderer or the reference changes, or on dispatch - never on a schedule.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/mjo/src/mjo_impacts_render.py
      - scripts/mjo/data/reference/mjo_impacts_site.npz
      - scripts/mjo/data/reference/mjo_impacts_site.json
      - .github/workflows/mjo-impacts.yml

env:
  MPLBACKEND: Agg

permissions:
  contents: write
  actions: write

concurrency:
  group: mjo-impacts
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sst-${{ runner.os }}-${{ hashFiles('scripts/sst/requirements-sst.txt') }}
          restore-keys: |
            pip-sst-${{ runner.os }}-
      - name: Install
        run: pip install -r scripts/sst/requirements-sst.txt
      - name: Render the MJO impact frames
        run: python scripts/mjo/src/mjo_impacts_render.py --procs 4

      - name: Publish the frames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/mjo/impacts/anim

      # Only the manifest is committed to main (the frames are on the frames branch; .gitignore keeps the webps off main).
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d)
          cp assets/mjo/impacts/anim/mjo_impacts_manifest.json "$SNAP/"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            mkdir -p assets/mjo/impacts/anim
            cp "$SNAP/mjo_impacts_manifest.json" assets/mjo/impacts/anim/
            git add assets/mjo/impacts/anim/mjo_impacts_manifest.json
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "mjo impacts: render $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || echo "pages dispatch failed; the dispatcher will catch it"
