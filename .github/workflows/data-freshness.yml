name: data-freshness
on:
  schedule:
  - cron: "25 2 * * *"        # twice daily: the report on the status page is
  - cron: "25 14 * * *"       # what catches a product that froze overnight
  workflow_dispatch:

permissions:
  contents: write            # commits assets/status/freshness.json
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check every data product's last update
        id: fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_freshness.py || echo "stale=1" >> "$GITHUB_OUTPUT"
      # The same report the issue is built from, as data: status.html renders it
      # as "server-verified file ages", so a frozen product is visible on the
      # site itself (and to the laptop dispatcher, which notifies) rather than
      # only in an issue nobody reads.
      - name: Publish the report to the status page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/check_freshness.py >/dev/null 2>&1 || true
            git add assets/status/freshness.json
            if git diff --staged --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "status: freshness report $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q; then exit 0; fi
            sleep 5
          done
          echo "::warning::could not push the freshness report"
      - name: Open/update the stale-data issue
        if: steps.fresh.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Data pipeline stale — freshness sentinel"
          body="$(cat stale_report.md)"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body";
          else gh issue create --title "$title" --body "$body"; fi
      - name: Close the issue when everything is fresh again
        if: steps.fresh.outputs.stale != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh issue list --state open --search "Data pipeline stale — freshness sentinel in:title" --json number --jq '.[0].number // empty')
          [ -n "$n" ] && gh issue close "$n" --comment "All data products fresh again." || true
