name: Global ensemble maps — GEFS

# Caller for ensmaps.yml (ens-anomalies.html). A GEFS run (00, 06, 12 or 18Z) reaches +384 h on noaa-gefs-pds ~6 h
# after the start; the dispatcher fires 06:20 / 18:20 for the 00/12Z runs with a backup an hour later. These crons are
# the backstop; a firing with nothing new exits in about a minute.
on:
  schedule:
  - cron: '30 8 * * *'
  - cron: '30 14 * * *'
  - cron: '30 20 * * *'
  - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDHH (blank = plan the newest unpublished; skipped when it or a newer one is published)"
        required: false
        default: ""
      follow:
        description: "Follow the run as it lands, publishing days 1-5 and 6-10 as they complete"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    uses: ./.github/workflows/ensmaps.yml
    with:
      model: gefs
      cycle: ${{ inputs.cycle }}
      follow: ${{ inputs.follow || false }}
    secrets: inherit
