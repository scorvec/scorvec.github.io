name: Global ensemble maps — GEFS

# Caller for ensmaps.yml (ens-anomalies.html). The GEFS 00/12Z run reaches +360 h on noaa-gefs-pds ~6 h after the
# start; the dispatcher fires 06:20 / 18:20 with a backup an hour later. These crons are the backstop; a firing with
# nothing new exits in about a minute.
on:
  schedule:
  - cron: '30 8 * * *'
  - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDHH (blank = plan the newest unpublished; skipped when it or a newer one is published)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  run:
    uses: ./.github/workflows/ensmaps.yml
    with:
      model: gefs
      cycle: ${{ inputs.cycle }}
    secrets: inherit
