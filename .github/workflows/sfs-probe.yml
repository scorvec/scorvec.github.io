name: SFS daily-store probe

# NOAA publishes an SFS issue's DAILY stores (atm_daily / ocn_daily) days to weeks after the
# monthly ones. sfs.yml runs on the 17th (monthly stores) and the 24th, so between those the
# subseasonal loops sat on the previous issue: on 2026-09-18 they were the August issue's
# days 16-46 (Aug 17 - Sep 16), all already in the past. This probe checks once a day,
# from the 18th to the end of the month, and dispatches sfs.yml the first time a daily issue
# newer than the one on the site appears. One curl and one small JSON read a day.
on:
  schedule:
    - cron: '10 16 18-31 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is there a daily issue newer than the site's?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          ROOT=https://noaa-oar-sfsdev-pds.s3.amazonaws.com/experiments/beta1/forecast
          I=$(date -u +%Y%m)
          have=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/sfs/data/sfs_daily.json" \
                 | python3 -c "import json,sys; print(json.load(sys.stdin).get('issue','').replace('-',''))" 2>/dev/null || echo "")
          c=$(curl -s -o /dev/null -w '%{http_code}' "$ROOT/$I/atm_daily.zarr/.zmetadata")
          echo "site daily issue: ${have:-unknown} · $I atm_daily -> $c"
          if [ "$c" = "200" ] && [ "$have" != "$I" ]; then
            echo "newer daily stores are out: dispatching sfs.yml for $I"
            gh workflow run sfs.yml -R "${{ github.repository }}" -f issue="$I"
          else
            echo "nothing new"
          fi
