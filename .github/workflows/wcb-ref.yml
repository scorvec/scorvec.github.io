name: Warm conveyor belts (ELIAS 2.0 models)

# Dispatch-only mirror of the published models that identify warm conveyor belts from gridded fields: ELIAS 2.0
# (Quinting and Grams 2022, Geosci. Model Dev. 15, 715-730), convolutional networks for the inflow, the ascent and
# the outflow of the belts trained on trajectories in ERA-Interim, with their decision thresholds and the 30-day
# climatology. Archive: Zenodo, doi:10.5281/zenodo.5154980 (CC BY 4.0; its code under the MIT licence), checked
# against its published checksum and kept unmodified as
#   release wcb-ref-v1   wcbmetric_v2.zip
# The mirror job also lists the archive, prints the layout of its model, threshold and climatology files and keeps its
# code, text and notebook files as an artifact.
#
# The check job holds scripts/wcb/elias.py - the site's own arithmetic for the predictors and the networks - to the
# archive: it runs the archive's code on the archive's example under Keras, in a conda environment (tensorflow,
# windspharm), and fails on any difference (scripts/wcb/check_elias.py).
on:
  workflow_dispatch:
    inputs:
      job:
        description: check elias.py against the archive, or mirror the archive again
        type: choice
        options: [check, mirror]
        default: check

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  mirror:
    if: inputs.job == 'mirror'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/constraints.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch the archive
        run: |
          set -euo pipefail
          UA="scorvec.com warm conveyor belts (+https://scorvec.com)"
          curl -fsSL --retry 3 -A "$UA" -o wcbmetric_v2.zip "https://zenodo.org/records/5154980/files/wcbmetric_v2.zip?download=1"
          echo "dbea2b2f3d836fb3190b3ca2b2e0c0bc  wcbmetric_v2.zip" | md5sum -c -
          mkdir archive && unzip -q wcbmetric_v2.zip -d archive
          (cd archive && find . -type f -printf '%10s  %p\n' | sort -k2 | grep -vE '/(hit|ocv)_(0[2-9]|1[0-2])')
      - name: Layout of the model, threshold and climatology files
        run: |
          set -euo pipefail
          pip install --quiet numpy netCDF4 h5py
          python - <<'EOF'
          from pathlib import Path

          import h5py
          from netCDF4 import Dataset

          root = next(p.parent for p in Path("archive").rglob("calc_wcbmetric_v2.py"))
          for name in ("thresholds/ocv_0115", "data/hit_0115", "data/Z20161004_00"):
              with Dataset(root / name) as nc:
                  print(name, {k: len(d) for k, d in nc.dimensions.items()})
                  for k, v in nc.variables.items():
                      edge = [float(v[0]), float(v[-1])] if v.ndim == 1 and v.size > 1 else ""
                      print(f"  {k} {v.dimensions} {v.dtype} {getattr(v, 'units', '')} {edge}")
          for name in sorted((root / "models").glob("*.h5")):
              with h5py.File(name) as f:
                  print(name.name, dict(f.attrs.items()).keys())
                  f.visititems(lambda k, o: print(f"  {k} {o.shape}") if isinstance(o, h5py.Dataset) else None)
          EOF
      - name: Keep the code, text and notebook files
        run: |
          set -euo pipefail
          mkdir text
          (cd archive && find . -type f -size -4000k \( -name '*.py' -o -name '*.md' -o -name '*.txt' -o -name '*.sh' \
            -o -name '*.json' -o -name '*.yml' -o -name '*.yaml' -o -name '*.cfg' -o -name '*.ipynb' -o -name 'README*' \
            -o -name 'LICEN*' \) -print0 | xargs -0 -r cp --parents -t ../text)
      - uses: actions/upload-artifact@v7
        with:
          name: wcb-elias-text
          path: text
          retention-days: 7
      - name: Mirror the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view wcb-ref-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create wcb-ref-v1 -R "$GITHUB_REPOSITORY" --title "Warm conveyor belts: ELIAS 2.0 models" \
              --notes "Unmodified copy of wcbmetric_v2.zip from Zenodo, doi:10.5281/zenodo.5154980 (CC BY 4.0; code under the MIT licence): the ELIAS 2.0 convolutional networks, decision thresholds and climatology of Quinting and Grams (2022), Geosci. Model Dev. 15, 715-730, doi:10.5194/gmd-15-715-2022."
          gh release upload wcb-ref-v1 wcbmetric_v2.zip -R "$GITHUB_REPOSITORY" --clobber

  check:
    if: inputs.job == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/wcb
          sparse-checkout-cone-mode: false
      - name: The archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download wcb-ref-v1 -R "$GITHUB_REPOSITORY" -p wcbmetric_v2.zip
          echo "dbea2b2f3d836fb3190b3ca2b2e0c0bc  wcbmetric_v2.zip" | md5sum -c -
          mkdir archive && unzip -q wcbmetric_v2.zip -d archive
      - name: Environment (Keras 2 and windspharm beside the module's own imports)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: wcb
          condarc: |
            channels: [conda-forge]
          create-args: >-
            python=3.11 numpy=1.26 tensorflow=2.15 windspharm pyshtools h5py netcdf4 xarray scipy matplotlib-base
      - name: Offline tests
        shell: micromamba-shell {0}
        run: |
          python -c "import keras, tensorflow, windspharm, pyshtools, numpy; print(keras.__version__, tensorflow.__version__, pyshtools.__version__, numpy.__version__)"
          python scripts/wcb/test_elias.py
      - name: elias.py against the archive
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          root=$(dirname "$(find archive -name calc_wcbmetric_v2.py | head -1)")
          TF_CPP_MIN_LOG_LEVEL=2 python scripts/wcb/check_elias.py "$root"
