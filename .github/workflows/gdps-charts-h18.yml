name: GDPS charts — 18Z

# One of 2 schedule-only callers for gdps-charts.yml. Each asks GitHub for a
# SINGLE firing per day - the frequency band measured as honoured far more often
# than one workflow asking for several. All the work lives in the reusable
# workflow; this file is only the schedule.
on:
  # CRON-PAUSED 2026-09-01 (restore: uncomment the block below)
  # schedule:
  # - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/gdps-charts.yml
    with:
      cycle: '12'
    secrets: inherit
