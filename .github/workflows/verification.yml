name: Model verification scores

# GFS, IFS, AIFS and GDPS against surface stations, radiosondes and Stage IV, scored with mverify
# (github.com/scorvec/nwp_verification) for verification.html. Each night it builds an observation
# database from GHCNh (every station, the window's weeks only), IGRA2 and Stage IV, scores the ten most
# recent 00Z runs whose day 10 has been observed, and commits the scorecard and station maps
# (assets/verification/). HPFX keeps GDPS for about 50 days, so a window further back than that loses GDPS.
#
# The database: each run, once 14 days old, joins the verification database for good (scripts/verify/verifydb.sh:
# every pair against the stations, radiosondes and Stage IV, and their sums, in the monthly release
# verify-db-YYYY-MM). The newest 30, 90 and 365 runs of the database and all of it are scored from the sums
# (scores_30.json ... scores_all.json, stations_30.json, stations_90.json), and its newest year of rain is mapped
# (precip_maps.json). The ensembles' runs (verify-ens.yml) are scored the same way from their sums
# (ens_scores_30.json ... ens_scores_all.json, scripts/verify/ens_verify.py windows).
# verify-backfill.yml fills the database for earlier runs and catches up any it missed. Every
# file is copied to the site's object store as well (verifydb.sh mirror), so the database is kept in two places.
#
# Time: about 25 min for the surface and 13 min per run for every pressure level, plus the database. The
# radiosonde pairs of each run are kept between nights (Actions cache), so a night downloads the pressure
# levels of its two newest runs only (their last soundings can still arrive): about 1 h instead of 3. Disk: each run's pressure levels are deleted once
# matched, and --clean drops the surface files once scored, so the runner's ~14 GB holds.
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      first:
        description: 'First 00Z run, YYYYMMDD (blank = 20 days ago)'
        default: ''
      last:
        description: 'Last 00Z run, YYYYMMDD (blank = 11 days ago, the latest whose day 10 is observed)'
        default: ''

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  MVERIFY_DB: ${{ github.workspace }}/.obs/obs.duckdb   # outside the committed paths

permissions:
  contents: write

concurrency:
  group: verification
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-verification-${{ runner.os }}-v1
      - name: Install mverify
        # pinned to a commit so a change upstream cannot alter the scores without a commit here
        run: pip install --quiet "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@783fd7fbf55047a59566b575d15c7e319d18567d"
      - name: Window
        id: w
        env:
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
        run: |
          FIRST=${FIRST:-$(date -u -d '20 days ago' +%Y%m%d)}
          LAST=${LAST:-$(date -u -d '11 days ago' +%Y%m%d)}
          # observations from the first init to day 10 of the last
          END=$(date -u -d "$LAST + 10 days" +%Y-%m-%d)
          YEARS=$(seq "${FIRST:0:4}" "${END:0:4}" | tr '\n' ' ')
          echo "runs ${FIRST} to ${LAST} 00Z, observations to ${END}, GHCNh years ${YEARS}"
          { echo "first=$FIRST"; echo "last=$LAST"; echo "end=$END"; echo "years=$YEARS"; } >> "$GITHUB_OUTPUT"
      - name: Observation database
        run: |
          F=${{ steps.w.outputs.first }}
          mverify db init
          mverify db ghcnh --year ${{ steps.w.outputs.years }} --since "${F:0:4}-${F:4:2}-${F:6:2}" --until "${{ steps.w.outputs.end }}"
          mverify db igra --since "${F:0:4}-${F:4:2}-${F:6:2}"
          mverify db precip --product stageiv --start "${F:0:4}-${F:4:2}-${F:6:2}" --end "${{ steps.w.outputs.end }}"
          mverify db status
      # the radiosonde pairs of the runs earlier nights matched (Parquet), from the same script and mverify pin
      - name: Radiosonde pairs from earlier nights
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/fc/pairs
          key: verification-pairs-${{ hashFiles('scripts/verify/mverify_scores.py', '.github/workflows/verification.yml') }}-
          restore-keys: |
            verification-pairs-${{ hashFiles('scripts/verify/mverify_scores.py', '.github/workflows/verification.yml') }}-
      - name: The database's runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          scripts/verify/verifydb.sh fetch stats all "$RUNNER_TEMP/derived"
          scripts/verify/verifydb.sh fetch stn 90 "$RUNNER_TEMP/derived"
          scripts/verify/verifydb.sh fetch rain 365 "$RUNNER_TEMP/derived"
          scripts/verify/verifydb.sh fetch ens-stats all "$RUNNER_TEMP/derived"
          scripts/verify/verifydb.sh fetch ens-rel all "$RUNNER_TEMP/derived"
      - name: Score
        run: |
          python scripts/verify/mverify_scores.py --db "$MVERIFY_DB" --clean --work "$RUNNER_TEMP/fc" \
            --inits "${{ steps.w.outputs.first }}00" "${{ steps.w.outputs.last }}00" \
            --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new" --derived "$RUNNER_TEMP/derived"
          python scripts/verify/ens_verify.py windows --derived "$RUNNER_TEMP/derived"
      - name: Add the runs to the database
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
          FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
          FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
          FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
          FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
        run: |
          scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
          # the second copy; verify-backfill.yml makes it too, so a failure here waits a day, not for good
          scripts/verify/verifydb.sh mirror || echo "::warning::the database's second copy waits for the next pass"
      - name: Keep the radiosonde pairs for the next night
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/fc/pairs
          key: verification-pairs-${{ hashFiles('scripts/verify/mverify_scores.py', '.github/workflows/verification.yml') }}-${{ github.run_id }}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PATHS="assets/verification/scores.json assets/verification/stations.json assets/verification/precip_maps.json assets/verification/wind_dist.json"
          PATHS="$PATHS $(echo assets/verification/scores_{30,90,365,all}.json assets/verification/stations_{30,90}.json)"
          PATHS="$PATHS $(echo assets/verification/ens_scores_{30,90,365,all}.json)"
          for i in 1 2 3 4 5; do
            timeout 120 git fetch origin main || { sleep 5; continue; }
            git reset -q FETCH_HEAD
            git add $(ls $PATHS 2>/dev/null)   # a window's files once the database holds that many runs
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data update: verification scores $(date -u +%Y-%m-%d)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            git reset -q --soft HEAD^   # undo the commit; refetch and rebuild it
            sleep 5
          done
          echo "push failed after retries"; exit 1
