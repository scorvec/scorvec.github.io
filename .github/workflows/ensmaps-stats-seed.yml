name: Global ensemble maps — seed the statistics release

# One-off: copies the runs' statistics held in the Actions cache into the release ensmaps-stats
# (scripts/ensmaps/stats_store.sh), which keeps them from here on.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      keys: ${{ steps.list.outputs.keys }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keys=$(gh cache list -R "$GITHUB_REPOSITORY" --key ensmaps- --limit 100 --json key -q '[.[].key | select(test("-stats-[0-9]{10}"))]')
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
          echo "$keys"
  seed:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        key: ${{ fromJSON(needs.list.outputs.keys) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ensmaps/stats_store.sh
      - uses: actions/cache/restore@v6
        with:
          path: ${{ startsWith(matrix.key, 'ensmaps-super-') && 'super_stats' || 'ensmaps_stats' }}
          key: ${{ matrix.key }}
          fail-on-cache-miss: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          model=$(echo "$KEY" | cut -d- -f2)
          cyc=$(echo "$KEY" | grep -oE '[0-9]{10}' | head -1)
          dir=ensmaps_stats; if [ "$model" = super ]; then dir=super_stats; fi
          scripts/ensmaps/stats_store.sh put "$dir/$cyc.npz" "$model" "$cyc"
