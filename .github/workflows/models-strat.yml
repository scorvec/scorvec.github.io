name: Stratosphere model maps (GFS data)

# strat-models.html: the GFS 00/12Z run on every pressure level from 100 to 0.4 hPa (temperature, height, wind) and on
# seven isentropic surfaces (Ertel potential vorticity, computed here), both hemispheres, every 12 h to +384 h, each
# field and step one lossless WebP on the 0.5 deg grid (scripts/models/strat_maps.py has the details).
#
# Each run: read the CURRENT manifest from main, plan (the newest complete 00/12Z cycle not yet published), fetch +
# compute + encode, publish the cycle directory to the FRAMES STORE ONLY (FRAMES_BRANCH=off on the publish step: this
# product never touches the git `frames` branch; the old cycle is pruned in the store), THEN commit the manifest to
# main - never the other way round, or the page would point at data that is not there yet. A cycle that lost a step is
# not published.
#
# Source: NOAA's AWS bucket noaa-gfs-bdp-pds only (never NOMADS), byte ranges of the wanted messages via the .idx
# files: ~110 of the ~740 messages of each 0.5 deg step (u, v, T and height on 27 levels, 400-0.4 hPa), ~25 MB a step,
# ~0.85 GB a cycle. +384 h is on the bucket ~5 h 15 min after the start (measured 2026-10-23/24); the dispatcher fires
# 05:30 and 17:30 with a backup an hour later, these crons are the backstop, and a firing with nothing new exits in
# about a minute.

on:
  schedule:
  - cron: '40 5 * * *'
  - cron: '40 17 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDHH (blank = plan the newest unpublished; skipped when it or a newer one is published)"
        required: false
        default: ""
      force:
        description: "Rebuild the given cycle even when it is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: models-strat
  cancel-in-progress: false

env:
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). The publish step sets FRAMES_BRANCH=off: the
  # store is this product's only copy, and with the store unconfigured the publish fails rather than use the branch.
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/models/
            /scripts/snowband/
            /scripts/lib/
            /assets/models/
            /scripts/constraints.txt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy pillow eccodes
      - name: Plan
        id: plan
        env:
          CYCLE: ${{ inputs.cycle }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          set -euo pipefail
          mkdir -p assets/models
          # main's CURRENT manifest, not the checkout's (a run queued behind another checks out an older commit)
          if timeout 60 git fetch -q --depth 1 origin main && git show FETCH_HEAD:assets/models/strat_gfs.json > /tmp/strat_gfs.json 2>/dev/null; then
            cp /tmp/strat_gfs.json assets/models/strat_gfs.json
          else echo "no manifest on main yet"; rm -f assets/models/strat_gfs.json; fi
          python scripts/models/strat_maps.py plan --manifests assets/models ${CYCLE:+--cycle "$CYCLE"} $FORCE > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          echo "n=$(wc -l < "$RUNNER_TEMP/plan.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Boundaries (once)
        if: steps.plan.outputs.n != '0'
        run: |
          set -euo pipefail
          if timeout 60 git show FETCH_HEAD:assets/models/geo_polar.json > /dev/null 2>&1 && timeout 60 git show FETCH_HEAD:assets/models/geo_polar_coarse.json > /dev/null 2>&1; then
            echo "geo_polar.json and geo_polar_coarse.json are on main"; exit 0
          fi
          python scripts/models/build_geo.py --region polar --out assets/models/geo_polar.json
      - name: Fetch, compute, publish
        id: run
        if: steps.plan.outputs.n != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRAMES_BRANCH: "off"
        run: |
          set -euo pipefail
          done=0
          while read -r cyc; do
            [ -n "$cyc" ] || continue
            echo "::group::GFS $cyc"
            L="$RUNNER_TEMP/lists_$cyc"
            python scripts/models/strat_maps.py run --cycle "$cyc" --site . --procs 4 --lists "$L" --manifest-in assets/models/strat_gfs.json
            PR=$(tr '\n' ' ' < "$L/prune.txt")
            if [ ! -s "$L/publish.txt" ]; then echo "::warning::$cyc is older than the cycle on the page - not published"; continue; fi
            SRC=. PRUNE="$PR" PRUNE_OLDER="$(cat "$L/floor.txt")" scripts/models/publish_data.sh $(cat "$L/publish.txt") > /dev/null
            rm -rf "assets/models/data/strat/gfs/$cyc"       # in the store now; keep the runner disk free
            done=$((done + 1))
            echo "::endgroup::"
          done < "$RUNNER_TEMP/plan.txt"
          echo "done=$done" >> "$GITHUB_OUTPUT"
      - name: Commit & push the manifest
        if: steps.run.outputs.done != '' && steps.run.outputs.done != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d)
          outs() { ls assets/models/strat_gfs.json assets/models/geo_polar.json assets/models/geo_polar_coarse.json 2>/dev/null; }
          for f in $(outs); do git add -f "$f"; done
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            for f in $(outs); do git add -f "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "models-strat: GFS $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          exit 1
