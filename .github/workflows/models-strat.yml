name: Stratosphere model maps (data)

# strat-models.html: the GFS, the GDPS, the AIFS single and GEOS FP runs (00/12Z; the AIFS single's 00/06/12/18Z) on
# their pressure levels from 100 hPa up
# (temperature, height, wind and, for the GFS, the smoothed vertical motion) and, for the GFS, the GDPS and GEOS FP, on
# the isentropic surfaces their levels support (Ertel potential vorticity, computed here; GEOS FP's own), both
# hemispheres, every 12 h (GFS to +384 h, GDPS to +240 h, AIFS single to +360 h, GEOS FP to +240 h from 00Z and +120 h
# from 12Z), each field and step one lossless WebP (scripts/models/strat_maps.py has the details). One model per run;
# the callers models-strat-{gfs,gdps,aifs,geos}.yml fix it, so the dispatcher's "already ran since" check is per model.
#
# Each run: read that model's CURRENT manifest from main, plan (the newest complete cycle not yet published),
# fetch + compute + encode, publish the cycle directory to the FRAMES STORE ONLY (FRAMES_BRANCH=off on the publish
# step: this product never touches the git `frames` branch; the old cycle is pruned in the store), THEN commit the
# manifest to main - never the other way round, or the page would point at data that is not there yet. A cycle that
# lost a step is not published.
#
# Sources and cost per cycle:
#   gfs   NOAA's AWS bucket noaa-gfs-bdp-pds only (never NOMADS), byte ranges of the wanted messages via the .idx files:
#         ~125 of the ~740 messages of each 0.5 deg step, ~950 MB in ~2,350 requests (measured 2026-10-24 12Z)
#   gdps  the MSC Datamart through scripts/geps/datamart.py (honest User-Agent, retries, ledger), 4 files at a time in
#         each of 3 step workers: 64 whole files a step (t, z, u, v on 16 levels, 400-1 hPa, ~0.6-0.9 MB each) and 3
#         more on the check steps, ~1 GB in ~1,350 requests
#   aifs  ECMWF open data from the Google Cloud mirror only (scripts/ecmwf/rangefetch.py, ECMWF_SOURCES=google): t, gh,
#         u, v at 100, 50 and 10 hPa, byte ranges through the index, ~140 MB in ~370 requests
#   geos  NASA NCCS OPeNDAP (GEOS FP fcast/inst3_3d_asm_Np): t, h, epv, u, v on 22 levels 400-0.4 hPa at every second
#         point, one DAP request a step, ~1.9 GB in 21 requests (00Z), half that from 12Z; 3 steps at a time
#
# Dispatch with model=gfs and omega_clim=true (instead of a run) to rebuild the GFS vertical motion's colour ranges,
# scripts/models/strat_omega_ranges.json (strat_maps.py omega-clim: 48 monthly samples of GFS analyses, ~2 GB), which
# the GFS runs read; without the file a GFS run publishes no vertical motion.

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      cycle:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      model:
        description: "gfs, gdps, aifs or geos"
        required: true
        default: gfs
      cycle:
        description: "Cycle YYYYMMDDHH (blank = plan the newest unpublished; skipped when it or a newer one is published)"
        required: false
        default: ""
      force:
        description: "Rebuild the given cycle even when it is already published"
        type: boolean
        default: false
      omega_clim:
        description: "GFS only: rebuild the vertical motion's colour ranges (strat_omega_ranges.json) instead of a run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: models-strat-${{ inputs.model }}
  cancel-in-progress: false

env:
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). The publish step sets FRAMES_BRANCH=off: the
  # store is this product's only copy, and with the store unconfigured the publish fails rather than use the branch.
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  ECMWF_SOURCES: google   # the AIFS single: the Google Cloud mirror only (scripts/ecmwf/rangefetch.py enforces it too)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL: ${{ inputs.model }}
      GEPS_WORK: ${{ github.workspace }}/../datamart-work   # scripts/geps/datamart.py's request ledger, scratch
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/models/
            /scripts/snowband/
            /scripts/geps/datamart.py
            /scripts/geps/paths.py
            /scripts/ecmwf/
            /scripts/lib/
            /assets/models/
            /scripts/constraints.txt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy pillow eccodes requests
      - name: Plan
        id: plan
        env:
          CYCLE: ${{ inputs.cycle }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          OMEGA_CLIM: ${{ inputs.omega_clim && '1' || '' }}
        run: |
          set -euo pipefail
          case "$MODEL" in gfs|gdps|aifs|geos) ;; *) echo "::error::unknown model $MODEL"; exit 1 ;; esac
          if [ -n "$OMEGA_CLIM" ]; then
            [ "$MODEL" = gfs ] || { echo "::error::omega_clim is for the GFS"; exit 1; }
            echo "n=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p assets/models
          # main's CURRENT manifest, not the checkout's (a run queued behind another checks out an older commit)
          if timeout 60 git fetch -q --depth 1 origin main && git show "FETCH_HEAD:assets/models/strat_$MODEL.json" > "/tmp/strat_$MODEL.json" 2>/dev/null; then
            cp "/tmp/strat_$MODEL.json" "assets/models/strat_$MODEL.json"
          else echo "no manifest on main yet for $MODEL"; rm -f "assets/models/strat_$MODEL.json"; fi
          python scripts/models/strat_maps.py plan --model "$MODEL" --manifests assets/models ${CYCLE:+--cycle "$CYCLE"} $FORCE > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          echo "n=$(wc -l < "$RUNNER_TEMP/plan.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Boundaries (once)
        if: steps.plan.outputs.n != '0'
        run: |
          set -euo pipefail
          if timeout 60 git show FETCH_HEAD:assets/models/geo_polar.json > /dev/null 2>&1 && timeout 60 git show FETCH_HEAD:assets/models/geo_polar_coarse.json > /dev/null 2>&1; then
            echo "geo_polar.json and geo_polar_coarse.json are on main"; exit 0
          fi
          python scripts/models/build_geo.py --region polar --out assets/models/geo_polar.json
      - name: Fetch, compute, publish
        id: run
        if: steps.plan.outputs.n != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRAMES_BRANCH: "off"
        run: |
          set -euo pipefail
          # steps worked on at once, each fetching its own: the GFS's S3 and the AIFS's mirror ranges are cheap to serve;
          # the Datamart and NASA's OPeNDAP server are shared public services (the Datamart: 3 workers x datamart.py's 4
          # files at a time; OPeNDAP: one request per worker)
          case "$MODEL" in gdps|geos) PROCS=3 ;; *) PROCS=4 ;; esac
          done=0
          while read -r cyc; do
            [ -n "$cyc" ] || continue
            echo "::group::$MODEL $cyc"
            L="$RUNNER_TEMP/lists_$cyc"
            python scripts/models/strat_maps.py run --model "$MODEL" --cycle "$cyc" --site . --procs "$PROCS" --lists "$L" \
              --manifest-in "assets/models/strat_$MODEL.json"
            PR=$(tr '\n' ' ' < "$L/prune.txt")
            if [ ! -s "$L/publish.txt" ]; then echo "::warning::$MODEL $cyc is older than the cycle on the page - not published"; continue; fi
            SRC=. PRUNE="$PR" PRUNE_OLDER="$(cat "$L/floor.txt")" scripts/models/publish_data.sh $(cat "$L/publish.txt") > /dev/null
            # in the store now: off the site tree, kept for the run's artifact below
            mkdir -p "$RUNNER_TEMP/maps/$MODEL" && mv "assets/models/data/strat/$MODEL/$cyc" "$RUNNER_TEMP/maps/$MODEL/"
            done=$((done + 1))
            echo "::endgroup::"
          done < "$RUNNER_TEMP/plan.txt"
          if [ "$MODEL" = gdps ]; then python scripts/geps/datamart.py; fi    # the run's Datamart requests and bytes
          echo "done=$done" >> "$GITHUB_OUTPUT"
      # Each published cycle's maps as they went to the store, kept 30 days, so the runs stay available for later study
      # after the store prunes them (it keeps the newest cycles only).
      - name: The published cycles as an artifact
        if: steps.run.outputs.done != '' && steps.run.outputs.done != '0'
        uses: actions/upload-artifact@v7
        with:
          name: strat-maps-${{ inputs.model }}
          path: ${{ runner.temp }}/maps
          retention-days: 30
          compression-level: 0  # lossless WebP: already compressed
      - name: Vertical-motion colour ranges (omega_clim dispatch only)
        id: clim
        if: inputs.omega_clim
        run: python scripts/models/strat_maps.py omega-clim --procs 4
      - name: Commit & push the manifest
        if: (steps.run.outputs.done != '' && steps.run.outputs.done != '0') || steps.clim.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d)
          outs() { ls "assets/models/strat_$MODEL.json" assets/models/geo_polar.json assets/models/geo_polar_coarse.json scripts/models/strat_omega_ranges.json 2>/dev/null; }
          for f in $(outs); do git add -f "$f"; done
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            for f in $(outs); do git add -f "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "models-strat: $MODEL $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          exit 1
