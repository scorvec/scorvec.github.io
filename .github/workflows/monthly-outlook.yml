name: Long-range outlook (Claude's statistical forecast + C3S + GEFS, monthly on the 15th)

# monthly-outlook.html (Claude's long-range forecast), issued on the 15th: the next calendar month and the three
# seasons from it (2 m temperature, precipitation and 500 hPa height over the Northern Hemisphere, as anomalies and
# tercile probabilities), and Niño-3.4 for twelve months.
#
# Niño-3.4 (scripts/monthly/enso_fc.py): a regression on ERSSTv6 tropical SST and the TAO moorings' heat content
# (assets/sst/data/subsurface_hc.json, written by sst-events.yml), averaged with the C3S plume (enso_forecast.json,
# c3s.yml) where it reaches. Its hindcast table also feeds the maps' forecast-ENSO component.
# The maps (forecast.py): the statistical forecast from ERA5 alone (mo_method.py: trend, RONI/QBO/vortex regression,
# forecast-ENSO teleconnection, tropical constructed analogue, persistence, analogue years, consolidated on a
# cross-validated 1981-onward hindcast), blended with the C3S multi-system mean (blend.py; its tables come from the
# c3s-em-v1 release, c3s-em.yml, which runs on the 13th-15th) and, for the month, with the whole 35-day GEFS run of
# the 15th (gefs.yml writes gefs_run_<YYYYMMDD>.npz to the frames store; the 00Z run is normally there by ~07Z, hence
# 10:23; the run of the 14th stands in), each stage only where its hindcast shows it beats the forecast before it.
#
# ORDER. build_archive --tail appends the newest ERA5T half-month blocks (ARCO, anonymous Google Cloud reads) to
# scripts/monthly/data/era5_<YYYY>.npz; enso_fc.py issues the Niño-3.4 forecast; forecast.py issues the month and the
# seasons once (an issued outlook is never overwritten unless dispatched with force); verify.py scores every outlook
# whose target is now complete and every Niño-3.4 month observed; render.py draws the figures. The predictors end on
# the 7th of this month, so the run does not depend on the hour ERA5T lands (ARCO trails real time by ~six days).
#
# UPDATE (dispatch with update=true, when the stratosphere changes course after the 15th; scripts/monthly/update.py):
# the newest 00/12Z run that all four ensembles have on ens-anomalies.html gives the target month's first week and
# the predictors' window to its 7th after ERA5 and the IFS analyses (update_data.py: IFS-ENS and AIFS-ENS, z500 and t2m
# from their run statistics in the Actions cache, precipitation from the rows of a few steps) and the lower vortex
# over that week (vortex_window.py: every member of IFS-ENS, AIFS-ENS, GEFS and GEPS), from which the method
# forecasts the rest of the month. ECMWF from the Google Cloud mirror
# only, GEFS from NOAA's S3, GEPS from the MSC Datamart. Written beside the issue it updates (outlook_<YYYYMM>u<DD>).

on:
  schedule:
    - cron: "23 10 15 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "target month YYYY-MM (empty = next month)"
        required: false
        default: ""
      force:
        description: "re-issue the target's outlook even if it exists"
        type: boolean
        default: false
      update:
        description: "re-issue the target as an update: its first week from IFS-ENS/AIFS-ENS, the rest with their vortex"
        type: boolean
        default: false
      seasons_only:
        description: "issue the seasons and the Niño-3.4 forecast alone, the month's outlook standing as issued"
        type: boolean
        default: false
      window:
        description: "run only on the 15th-20th (the dispatcher's daily slot; a done issue exits at once)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-outlook
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  ECMWF_SOURCES: google
  GEPS_WORK: ${{ github.workspace }}/../datamart-work   # scripts/geps/datamart.py's request ledger, scratch

jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/monthly
            scripts/sst/enso_models.py
            scripts/sst/roni_sigma.json
            scripts/sst/reference/reanalysis_hc_monthly.csv
            scripts/sst/c3s_nino34.py
            scripts/sst/c3s_grib.py
            assets/sst/data/subsurface_hc.json
            assets/sst/data/enso_forecast.json
            assets/sst/data/nino_history.json
            scripts/mjo/data/reference/rmm_era5.nc
            assets/geps/data/geps_rmm.json
            scripts/gefs/gefs_reforecast.py
            scripts/ensmaps
            scripts/ecmwf
            scripts/lib
            scripts/geps/datamart.py
            scripts/geps/paths.py
            assets/models/ensmaps_*.json
            assets/monthly
            assets/sst/data/c3s_maps.json
            scripts/constraints.txt
          sparse-checkout-cone-mode: false
      - name: Window
        id: win
        run: |
          D=$((10#$(date -u +%d))); RUN=1
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.window }}" = "true" ]; } && { [ $D -lt 15 ] || [ $D -gt 20 ]; }; then RUN=0; fi
          T=$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y%m)
          if [ "${{ inputs.window }}" = "true" ] && [ -f "assets/monthly/data/outlook_$T.json" ]; then RUN=0; fi
          echo "day $D, target $T -> run=$RUN"; echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.win.outputs.run == '1'
        with:
          python-version: "3.11"
      - if: steps.win.outputs.run == '1'
        run: pip install --quiet numpy scipy pandas xarray zarr gcsfs h5netcdf h5py netCDF4 matplotlib cartopy pillow eccodes requests
      - name: Extend the ERA5 archive
        if: steps.win.outputs.run == '1'
        run: python scripts/monthly/build_archive.py --tail --workers 8
      - name: An update's runs
        id: upd
        if: inputs.update
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "target=${TARGET:-$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m)}" >> "$GITHUB_OUTPUT"
          echo "cycle=$(python -c 'import sys; sys.path.insert(0, "scripts/monthly"); import vortex_window as V; from pathlib import Path; print(V.newest_common(Path("assets/models")))')" >> "$GITHUB_OUTPUT"
      # the two ECMWF ensembles' run statistics (ensmaps.yml), restored one at a time into the path their job saved
      - name: IFS-ENS run statistics
        if: inputs.update
        uses: actions/cache/restore@v6
        with:
          path: ensmaps_stats
          key: ensmaps-ifs-stats-${{ steps.upd.outputs.cycle }}
          restore-keys: ensmaps-ifs-stats-${{ steps.upd.outputs.cycle }}-partial
      - name: Set aside
        if: inputs.update
        run: mkdir -p in/ifs && mv ensmaps_stats/*.npz in/ifs/
      - name: AIFS-ENS run statistics
        if: inputs.update
        uses: actions/cache/restore@v6
        with:
          path: ensmaps_stats
          key: ensmaps-aifs-stats-${{ steps.upd.outputs.cycle }}
      - name: Set aside
        if: inputs.update
        run: mkdir -p in/aifs && mv ensmaps_stats/*.npz in/aifs/
      - name: The update's first week, window and vortex
        if: inputs.update
        env:
          T: ${{ steps.upd.outputs.target }}
          CYC: ${{ steps.upd.outputs.cycle }}
        run: |
          python scripts/monthly/vortex_window.py --target "$T" --cycle "$CYC" --out "$RUNNER_TEMP/vortex.json"
          python scripts/monthly/update_data.py --target "$T" --cycle "$CYC" --stats-dir in --out "$RUNNER_TEMP/upd.npz"
      - name: ERSSTv6 and Claude's Niño-3.4 forecast
        if: steps.win.outputs.run == '1' && !inputs.update
        run: |
          curl -sSfL --retry 4 --retry-delay 20 -o "$RUNNER_TEMP/ersst.nc" https://downloads.psl.noaa.gov/Datasets/noaa.ersst.v6/sst.mnmean.nc
          python scripts/monthly/enso_fc.py --ersst "$RUNNER_TEMP/ersst.nc" ${{ inputs.force && '--force' || '' }}
      - name: C3S ensemble means (release c3s-em-v1)
        if: steps.win.outputs.run == '1' && !inputs.update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C3S_EM_DIR: ${{ runner.temp }}/c3s_em
          TARGET: ${{ inputs.target }}
        run: |
          T=${TARGET:-$(date -u -d "$(date -u +%Y-%m-01) +1 month" +%Y-%m)}
          I=$(date -u -d "${T}-01 -1 month" +%Y%m)
          mkdir -p "$C3S_EM_DIR"
          gh release download c3s-em-v1 --repo "$GITHUB_REPOSITORY" -D "$C3S_EM_DIR" -p "hc_em_*_${I:4:2}.npz" -p "fc_em_*_${I}.npz" \
            || echo "::warning::no C3S tables for the $I issue: the forecast is issued without C3S"
          python scripts/monthly/c3s_em.py --status "$I"
      - name: Issue the outlook
        if: steps.win.outputs.run == '1'
        env:
          C3S_EM_DIR: ${{ runner.temp }}/c3s_em
        run: |
          python scripts/monthly/forecast.py \
            ${{ inputs.target && format('--target {0}', inputs.target) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.seasons_only && '--seasons-only' || '' }} \
            ${{ inputs.update && format('--update {0}/vortex.json --data {0}/upd.npz', runner.temp) || '' }}
      - name: Verify past outlooks
        if: steps.win.outputs.run == '1'
        run: python scripts/monthly/verify.py
      - name: Draw
        if: steps.win.outputs.run == '1'
        run: python scripts/monthly/render.py
      # snapshot + clean resync each attempt (mjo.yml / gefs.yml pattern); never rebase
      - name: Commit & push
        id: commit
        if: steps.win.outputs.run == '1'
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          git add -A scripts/monthly/data assets/monthly 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add -A scripts/monthly/data assets/monthly
            if git diff --staged --quiet; then echo "no changes after resync"; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -q -m "monthly outlook: $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
      - name: Deploy the site
        if: steps.commit.outputs.pushed == '1'
        run: echo "site deploy is batched - the dispatcher deploys within 15 min (pages.yml)"
