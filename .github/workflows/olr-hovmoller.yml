name: Synthetic OLR Hovmöller (GMGSI IR)

# Real-time equatorial OLR Hovmöller derived from the GMGSI global longwave-IR mosaic
# (AWS). Every 6 h it (re)computes the latest day or two and re-renders. Commits only its
# own files (tiny daily store + webp).
on:
  # backstop crons (2026-10-04: moved here from the per-hour caller files, which were deleted; the
  # dispatcher, scripts/lib/dispatch_workflows.sh, fires this on time - these only matter when it is off)
  schedule:
    - cron: '25 1 * * *'
    - cron: '25 7 * * *'
    - cron: '25 13 * * *'
    - cron: '25 19 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olr-hovmoller
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # room for the bounded git-retry loop in Commit & push
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas xarray netcdf4 matplotlib
      - run: python scripts/sst/synthetic_olr.py --out assets/sst/olr_hovmoller.webp
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          # Snapshot the outputs, then commit on a clean sync of origin/main each attempt (the mjo.yml pattern), never
          # a rebase: a collided rebase can drop the build.
          OUT="assets/sst/olr_hovmoller.webp scripts/sst/metar/olr_hov.nc"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add $OUT
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "push failed after retries"; exit 1
