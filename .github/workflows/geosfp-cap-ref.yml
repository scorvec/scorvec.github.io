name: GEOS FP polar-cap height, offset to MERRA-2 and tail (forecast dripping paint)

# scripts/strat/geosfp_cap.py: the GEOS FP minus MERRA-2 polar-cap height offset per level (overlap: 102 days of
# 2024-07..2026-06 from NCCS OPeNDAP against reference/m2_cap_overlap.json) -> scripts/strat/reference/
# geosfp_cap_offset.json, then the observed tail re-fetched at every level for the last 120 days ->
# assets/sst/data/geosfp_cap_history.json (bdc.yml appends to it daily). Dispatch only: once after the drip's levels
# change.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geosfp-cap-ref
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Python dependencies
        run: pip install --quiet numpy pandas xarray netCDF4
      - name: Offset to MERRA-2
        run: python scripts/strat/geosfp_cap.py overlap --procs 3
      - name: Tail, every level
        run: |
          python scripts/strat/geosfp_cap.py tail --days 120 --keep 120 --force --procs 3 \
            --out assets/sst/data/geosfp_cap_history.json
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="scripts/strat/reference/geosfp_cap_offset.json assets/sst/data/geosfp_cap_history.json"
          SNAP=$(mktemp -d); tar cf "$SNAP/outs.tar" $FILES
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add -f $FILES
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "GEOS FP polar-cap height: offset to MERRA-2 and tail to 1 hPa"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
