name: ASOS 5-min dashboard data

# PRECISION OVERLAY ONLY. asos5.html now fetches its data live, client-side, from
# the official NWS API (api.weather.gov) — which serves 5-minute obs for 13 of the
# stations and hourly for KJFK/KNYC — so the page is always current with no server
# job in the loop. This workflow just refreshes the MADIS HFMETAR 0.1 °C feed the
# page layers in for finer precision where it overlaps; if it's delayed or off, the
# page is unaffected. (GitHub cron is unreliable for tight schedules, which is
# exactly why the page no longer depends on it.) Deleting this workflow is safe —
# you'd only lose the 0.1 °C precision bump on ~9 stations.
#
# Each run force-pushes ONE parentless commit to the asos5-data branch (no main
# history growth, no Pages rebuild). The copy of data/asos5/ on main is just the
# page's first-paint fallback.
on:
  schedule:
    - cron: '*/15 * * * *'    # overlay only; every ~15 min is plenty
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asos5-data
  cancel-in-progress: true   # newest data wins; a queued stale run is worthless

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # the repo working tree is huge (satellite loops etc.); the fetcher
          # only needs its own script directory
          sparse-checkout: |
            scripts/asos5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          # must be a path inside the sparse checkout above
          cache-dependency-path: scripts/asos5/asos5_update.py
      - run: pip install --quiet numpy netCDF4

      # parsed per-hour MADIS extracts (a few KB each); with a warm cache the
      # script only downloads the 2-3 not-yet-settled hourly files (~10 MB)
      - uses: actions/cache@v6
        with:
          path: scripts/asos5/cache
          key: asos5-madis-${{ github.run_id }}
          restore-keys: |
            asos5-madis-

      - name: Fetch obs and build JSON
        run: python scripts/asos5/asos5_update.py

      - name: Force-push data branch (single parentless commit)
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          BLOB_JS=$(git hash-object -w data/asos5/asos5_latest.js)
          BLOB_JSON=$(git hash-object -w data/asos5/asos5_latest.json)
          TREE=$(printf '100644 blob %s\tasos5_latest.js\n100644 blob %s\tasos5_latest.json\n' "$BLOB_JS" "$BLOB_JSON" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "asos5 data $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          timeout 180 git push --force origin "$COMMIT:refs/heads/asos5-data"
