name: GLM lightning flash-density loop (GOES-East)

# Hourly South & Central America GLM lightning flash-density loop. Each frame accumulates
# the trailing 3 h of GOES-East GLM flashes (binned 0.1°). Per-hour binned grids are cached
# (actions/cache) so a run only fetches the newest hour (~180 tiny granules); committed webp
# frames carry the rolling 72-hour window across fresh checkouts.
on:
  # re-enabled 2026-07-21 (only the true-color vis job was meant to stay paused)
  schedule:
    - cron: '50 * * * *'    # hourly; offset from the IR loops (':40' / ':25') so they don't collide
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glm-density
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # room for the bounded git-retry loop in Commit & push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Per-hour binned flash grids — restored so a run only fetches the newest hour.
      # The key rotates daily; restore-keys pulls the most recent prior cache.
      - uses: actions/cache@v4
        with:
          path: scripts/sst/data/glm_hourly
          key: glm-hourly-${{ github.run_id }}
          restore-keys: |
            glm-hourly-
      # Pin matplotlib+cartopy to match the IR loops (an unpinned upgrade regressed GeoAxes crops).
      - run: pip install --quiet numpy xarray netcdf4 h5netcdf matplotlib==3.10.9 cartopy==0.25.0 shapely
      - run: python scripts/sst/glm_density.py
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git add -A assets/sst/anim/glm_1h assets/sst/anim/glm_3h assets/sst/anim/glm_24h assets/sst/anim/glmden_manifest.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "GLM lightning flash-density loop: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
