name: AR ensemble probabilities (AIFS-ENS, IFS-ENS, GEFS, GEPS, days 1-15)

# ar.html, second section: P(IVT >= 250 / 500) 6-hourly to +360 h per system and equally weighted across systems, the
# coastal landfall charts, member plumes and AR-scale odds. IVT per member is the proxy k * W * |V850| with k refitted
# every cycle on each system's own exact IVT for one member (scripts/ar/ar_ens.py). A plan job picks each system's
# newest complete 00/12Z cycle (ECMWF from the Google Cloud mirror ONLY; GEFS from AWS S3; GEPS from the MSC Datamart)
# and stops the run when the page already shows all four (a backstop cron hours late); otherwise one job per system,
# then a combine job renders, publishes the frames and commits. Also the precipitable-water loops (AIFS-ENS, IFS-ENS).
# Fired by the dispatcher at 09:05/21:05 (the IFS-ENS cycle lands on the mirror ~08:50/20:55).
on:
  schedule:
    - cron: '5 9 * * *'
    - cron: '5 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-render even when the page already shows every system''s newest cycle'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ar-ens
  cancel-in-progress: false

env:
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). Unset secrets leave these empty and frames go
  # to the `frames` branch alone; the repository variable FRAMES_BRANCH=off retires the branch (frames_env.sh).
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  FRAMES_BRANCH: ${{ vars.FRAMES_BRANCH }}
  ECMWF_SOURCES: google
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AR_WAIT_MIN: '30'
    outputs:
      fresh: ${{ steps.plan.outputs.fresh }}
      aifs: ${{ steps.plan.outputs.aifs }}
      ifs: ${{ steps.plan.outputs.ifs }}
      gefs: ${{ steps.plan.outputs.gefs }}
      geps: ${{ steps.plan.outputs.geps }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas requests
      # main's ar_ens.json as it is now, not the checkout's (a queued run checks out an older commit)
      - name: Each system's cycle, and is any newer than the page's?
        id: plan
        run: |
          set -euo pipefail
          timeout 60 git fetch -q --depth 1 origin main && git show FETCH_HEAD:assets/ar/ar_ens.json > /tmp/ar_ens.json \
            || echo '{}' > /tmp/ar_ens.json
          python scripts/ar/ar_ens.py plan --published /tmp/ar_ens.json ${{ inputs.force == 'true' && '--force' || '' }} \
            | tee -a "$GITHUB_OUTPUT"

  system:
    needs: plan
    if: needs.plan.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sys: [aifs, ifs, gefs, geps]
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt
      - name: Members of ${{ matrix.sys }}
        env:
          CYC: ${{ needs.plan.outputs[matrix.sys] }}
        run: python scripts/ar/ar_ens.py system --sys ${{ matrix.sys }} ${CYC:+--date ${CYC:0:8} --time ${CYC:8:2}} --work out
      - uses: actions/upload-artifact@v7
        with:
          name: ens-${{ matrix.sys }}
          path: out/ens_${{ matrix.sys }}.npz
          retention-days: 2

  publish:
    needs: [plan, system]
    if: ${{ !cancelled() && needs.plan.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: ens-*
          path: out
          merge-multiple: true
      - name: Combine and render
        run: python scripts/ar/ar_ens.py combine --work out --procs 4
      - name: Publish frames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D="assets/ar/anim/ens_mm_p250 assets/ar/anim/ens_mm_p500 assets/ar/anim/ens_data"
          for s in aifs ifs gefs geps; do D="$D assets/ar/anim/ens_${s}_p250"; done
          for s in aifs ifs; do D="$D assets/ar/anim/pwat_${s} assets/ar/anim/pwatanom_${s}"; done
          # the retired AIFS-ENS-only monitor's loops (ar_monitor.py, removed 2026-10-07) are pruned from the branch
          PRUNE="assets/ar/anim/ar_ivt assets/ar/anim/ar_prob assets/ar/anim/ar_ctrl" scripts/lib/publish_frames_ci.sh $D
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="assets/ar/anim/ar_ens_manifest.json assets/ar/ar_ens.json $(ls assets/ar/ens_coast_*.webp 2>/dev/null | tr '\n' ' ')"
          SNAP=$(mktemp -d); tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            for f in $OUT; do [ -e "$f" ] && git add "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "data update: AR ensembles $(date -u +%Y-%m-%dT%H%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          echo "push failed after retries"; exit 1
