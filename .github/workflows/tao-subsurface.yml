name: TAO subsurface (morning refresh)

# The equatorial subsurface cross-section (enso-subsurface.html, tao_section.json,
# equatorial_xsection*.webp, the equatorial animation frames) is built inside
# sst.yml once a day at 19:23 UTC. PMEL's DISDEL delivery posts each day's TAO
# buoy data roughly a day later, so for most of every day the page shows data
# two days old. This light job repeats just the TAO fetch + cross-section in
# the morning (dispatcher slots 09:10 and 14:40 UTC) so the page carries the
# newest DISDEL day as soon as it exists. Everything else stays with sst.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * *'

env:
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACL: ${{ secrets.FRAMES_S3_ACL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}

permissions:
  contents: write
  actions: write

concurrency:
  group: sst-subsurface
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sst-${{ runner.os }}-${{ hashFiles('scripts/sst/requirements-sst.txt') }}
          restore-keys: |
            pip-sst-${{ runner.os }}-
      - name: Install
        run: pip install -r scripts/sst/requirements-sst.txt
      - name: Seed existing frames
        run: scripts/lib/fetch_frames_ci.sh scripts/sst/data/cmems assets/sst/anim/equatorial assets/sst/anim/equatorial_dt
      - name: Fetch TAO equatorial subsurface temperature (recent 120 days)
        run: |
          python scripts/sst/tao_subsurface.py --days 120 \
            --out scripts/sst/data/tao_eq_recent.nc \
            --ascii scripts/sst/data/tao_eq_recent.ascii
      - name: Build equatorial subsurface cross-section + animation
        run: python scripts/sst/sst_subsurface.py
      - name: Publish frames to the orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh scripts/sst/data/cmems scripts/mjo/data/reference_big assets/sst/anim/equatorial assets/sst/anim/equatorial_dt
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enso-subsurface.html assets/sst/
          if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
          git commit -m "data update: subsurface $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            timeout 120 git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              git add enso-subsurface.html assets/sst/
              git diff --staged --quiet || git commit -m "data update: subsurface (re-applied)"
            fi
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || echo "pages dispatch failed; the dispatcher will catch it"
