name: Ensemble verification database

# Adds the ensembles' 00Z runs to the verification database (scripts/verify/ens_verify.py, scripts/verify/verifydb.sh):
# IFS-ENS, AIFS-ENS, GEFS and GEPS, every member, against every GHCNh station, the radiosondes and Stage IV to day 15,
# one row per case (ens-sfc-<m>_, ens-raob-<m>_, ens-rain-<m>_<init>.parquet), then each run's sums once every ensemble
# that can still come is in (ens-stats_, ens-rel_). Runs the database holds are skipped, so a range can be dispatched
# again after a failure.
#
# Each day it catches up the runs 16 to 47 days old: a run's day 15 is observed once it is 16 days old, and HPFX keeps
# GEPS about 50 days. Dispatched with a range it backfills: IFS-ENS and AIFS-ENS stay on the open-data mirror and GEFS
# on NOAA's bucket, GEPS only within HPFX's days, so its runs go first.
#
# One job reads the radiosondes for the whole range (IGRA2, this year's files), then chunks of one ensemble's runs are
# matched side by side, each adding GHCNh and Stage IV for its own weeks and uploading every run as soon as it is done.
on:
  schedule:
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      first:
        description: 'First 00Z run, YYYYMMDD (blank = 47 days ago)'
        default: ''
      last:
        description: 'Last 00Z run, YYYYMMDD (blank = 16 days ago)'
        default: ''
      models:
        description: 'Ensembles (space-separated: IFS-ENS AIFS-ENS GEFS GEPS)'
        default: 'IFS-ENS AIFS-ENS GEFS GEPS'
      chunk:
        description: 'Runs per job'
        default: '6'

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt
  MVERIFY_DB: ${{ github.workspace }}/.obs/obs.duckdb
  MVERIFY: "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@f81968d42a703f0e42eb75acd526fadd3ba567e9"

permissions:
  contents: write

concurrency:
  group: verify-ens
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      first: ${{ steps.p.outputs.first }}
      end: ${{ steps.p.outputs.end }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
          MODELS: ${{ inputs.models || 'IFS-ENS AIFS-ENS GEFS GEPS' }}
          CHUNK: ${{ inputs.chunk || '6' }}
        run: |
          FIRST=${FIRST:-$(date -u -d '47 days ago' +%Y%m%d)}
          LAST=${LAST:-$(date -u -d '16 days ago' +%Y%m%d)}
          scripts/verify/verifydb.sh list > have.txt
          python3 - "$FIRST" "$LAST" "$CHUNK" "$MODELS" have.txt >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          from datetime import date, datetime, timedelta
          first, last = (datetime.strptime(x, "%Y%m%d").date() for x in sys.argv[1:3])
          n, models = max(1, int(sys.argv[3])), sys.argv[4].split()
          have = set(open(sys.argv[5]).read().split())
          code = {"IFS-ENS": "ifs", "AIFS-ENS": "aifs", "GEFS": "gefs", "GEPS": "geps"}  # ens_verify.ENSEMBLES
          hpfx = date.today() - timedelta(days=48)  # ens_verify.HPFX_DAYS
          days = [first + timedelta(d) for d in range((last - first).days + 1)]
          chunks = []
          for m in sorted(models, key=lambda m: m != "GEPS"):  # GEPS first: HPFX deletes it
              todo = [d for d in days if (m != "GEPS" or d >= hpfx)
                      and not all(f"ens-{k}-{code[m]}_{d:%Y%m%d}00.parquet" in have for k in ("sfc", "raob"))]
              for c in (todo[i:i + n] for i in range(0, len(todo), n)):
                  until = c[-1] + timedelta(days=16)  # observations to day 15 of the chunk's last run
                  chunks.append({"model": m, "runs": " ".join(f"{d:%Y%m%d}" for d in c), "since": f"{c[0]:%Y-%m-%d}",
                                 "until": f"{until:%Y-%m-%d}",
                                 "years": " ".join(str(y) for y in range(c[0].year, until.year + 1))})
              print(f"{m}: {len(todo)} runs to add", file=sys.stderr)
          print("chunks=" + json.dumps(chunks))
          if chunks:
              print("first=" + min(c["since"] for c in chunks))
              print("end=" + max(c["until"] for c in chunks))
          EOF
          cat "$GITHUB_OUTPUT"

  radiosondes:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/constraints.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Radiosondes for the whole range
        run: |
          mverify db init
          mverify db igra --archive y2d --since ${{ needs.plan.outputs.first }} --until ${{ needs.plan.outputs.end }}
          mverify db status
      - uses: actions/upload-artifact@v7
        with:
          name: ens-obs-db
          path: .obs/obs.duckdb
          include-hidden-files: true   # .obs is a dot directory
          retention-days: 3
          compression-level: 1

  match:
    needs: [plan, radiosondes]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - uses: actions/download-artifact@v7
        with:
          name: ens-obs-db
          path: .obs
      - name: Surface stations and Stage IV for the chunk's weeks
        run: |
          mverify db ghcnh --year ${{ matrix.chunk.years }} --since ${{ matrix.chunk.since }} --until ${{ matrix.chunk.until }}
          mverify db precip --product stageiv --start ${{ matrix.chunk.since }} --end ${{ matrix.chunk.until }}
          mverify db status
      - name: Match and archive, one run at a time
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.chunk.model }}
          RUNS: ${{ matrix.chunk.runs }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          failed=""
          for d in $RUNS; do   # a run that fails is left for the next pass; the chunk's other runs go on
            if python scripts/verify/ens_verify.py match --db "$MVERIFY_DB" --model "$MODEL" --inits "${d}00" "${d}00" \
                --work "$RUNNER_TEMP/fc" --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"; then
              scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            else
              echo "::warning::$MODEL ${d}00 failed, left for the next pass"; failed="$failed $d"
            fi
            rm -rf "$RUNNER_TEMP"/db-new "$RUNNER_TEMP"/fc
          done
          if [ -n "$failed" ]; then echo "::error::$MODEL runs not archived:$failed"; exit 1; fi

  stats:
    needs: match
    if: ${{ !cancelled() }}   # also when there was nothing to match, or a chunk failed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Each due run's sums, one run at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          python scripts/verify/ens_verify.py stats --list --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new" \
            > "$RUNNER_TEMP/due.txt"
          echo "$(wc -l < "$RUNNER_TEMP/due.txt") runs due"
          while read -r init files; do
            # shellcheck disable=SC2086  # the file names are meant to split
            scripts/verify/verifydb.sh get "$RUNNER_TEMP/cases" $files
            python scripts/verify/ens_verify.py stats --init "$init" --derived "$RUNNER_TEMP/cases" \
              --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"
            scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            rm -rf "$RUNNER_TEMP"/cases "$RUNNER_TEMP"/db-new
          done < "$RUNNER_TEMP/due.txt"

  mirror:
    needs: stats
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
      FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
      FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
      FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
      FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: The database's second copy, in the object store
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify/verifydb.sh mirror
