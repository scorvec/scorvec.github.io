name: Hadley outflow and subtropical descent climatology (ERA5 1991-2020, 6-hourly, with trajectories)

# Builder of scripts/mjo/data/reference/branch_clim.nc (scripts/mjo/src/build_branch_clim.py): the harmonic normals of the
# tracker's six fields and the day-of-year distribution of its indices and trajectory numbers, from WeatherBench2's
# 6-hourly ERA5 (1.5 deg, 13 levels; anonymous GCS). Each part reduces three years to the harmonic sums and the numbers of
# every day's centred 7-day window (a day's 00 UTC releases the back-trajectories); the build job forms the file and
# commits it.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        years: [[1991, 1993], [1994, 1996], [1997, 1999], [2000, 2002], [2003, 2005], [2006, 2008], [2009, 2011],
                [2012, 2014], [2015, 2017], [2018, 2020]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt
      - name: Three years of fields, indices and trajectories
        run: |
          mkdir -p out
          python scripts/mjo/src/build_branch_clim.py fetch --years ${{ matrix.years[0] }} ${{ matrix.years[1] }} \
            --out out/branch_${{ matrix.years[0] }}.npz
      - uses: actions/upload-artifact@v7
        with:
          name: branchclim-${{ matrix.years[0] }}
          path: out/*.npz
          retention-days: 5

  build:
    needs: part
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: branchclim-*
          path: parts
          merge-multiple: true
      - name: The climatology
        run: python scripts/mjo/src/build_branch_clim.py build parts/*.npz
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT=scripts/mjo/data/reference/branch_clim.nc
          SNAP=$(mktemp -d); cp "$OUT" "$SNAP/"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            cp "$SNAP/branch_clim.nc" "$OUT"
            git add "$OUT"
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "Hadley outflow and subtropical descent climatology: ERA5 1991-2020, 6-hourly, with trajectories"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
