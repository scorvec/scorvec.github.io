name: Verification database backfill

# Adds the 00Z runs the verification database lacks (scripts/verify/verifydb.sh, the releases verify-db-YYYY-MM):
# each run's pairs against every GHCNh station, the radiosondes and Stage IV, for every model its source still
# holds, and their sums, matched exactly as the nightly verification.yml matches them
# (scripts/verify/mverify_scores.py --archive-only). GFS reaches back years on AWS; IFS from March 2024 and AIFS
# from 2025 on the ECMWF open-data mirror; GDPS only HPFX's last ~50 days, so a run older than that is archived
# without it. Runs the database holds are skipped, so a range can be dispatched again after a failure.
#
# Each day it also catches up: the runs 21 to 50 days old that the nightly (which archives runs 14-20 days old)
# missed, while HPFX still has their GDPS. With nothing missing it stops after the plan.
#
# One job reads the radiosondes for the whole range (IGRA2: this year's files, or each station's whole record for an
# earlier year), then chunks of runs are matched side by side, each adding GHCNh and Stage IV for its own weeks and
# uploading every run as soon as it is done. Last, every database file the site's object store lacks is copied there,
# the database's second copy (verifydb.sh mirror), whether or not this pass added runs.
on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      first:
        description: 'First 00Z run, YYYYMMDD (blank = 50 days ago)'
        default: ''
      last:
        description: 'Last 00Z run, YYYYMMDD (blank = 21 days ago)'
        default: ''
      chunk:
        description: 'Runs per job'
        default: '12'

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt
  MVERIFY_DB: ${{ github.workspace }}/.obs/obs.duckdb
  MVERIFY: "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@783fd7fbf55047a59566b575d15c7e319d18567d"

permissions:
  contents: write

concurrency:
  group: verify-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      first: ${{ steps.p.outputs.first }}
      end: ${{ steps.p.outputs.end }}
      igra: ${{ steps.p.outputs.igra }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
          CHUNK: ${{ inputs.chunk || '12' }}
        run: |
          FIRST=${FIRST:-$(date -u -d '50 days ago' +%Y%m%d)}
          LAST=${LAST:-$(date -u -d '21 days ago' +%Y%m%d)}
          scripts/verify/verifydb.sh list > have.txt
          python3 - "$FIRST" "$LAST" "$CHUNK" have.txt >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          from datetime import date, datetime, timedelta
          first, last = (datetime.strptime(x, "%Y%m%d").date() for x in sys.argv[1:3])
          n = max(1, int(sys.argv[3]))
          have = set(open(sys.argv[4]).read().split())
          kinds = ("sfc", "raob", "stats", "stn")  # mverify_scores.held
          days = [first + timedelta(d) for d in range((last - first).days + 1)]
          todo = [d for d in days if not all(f"{k}_{d:%Y%m%d}00.parquet" in have for k in kinds)]
          chunks = []
          for c in (todo[i:i + n] for i in range(0, len(todo), n)):
              until = c[-1] + timedelta(days=10)  # observations to day 10 of the chunk's last run
              chunks.append({"runs": " ".join(f"{d:%Y%m%d}" for d in c), "since": f"{c[0]:%Y-%m-%d}",
                             "until": f"{until:%Y-%m-%d}",
                             "years": " ".join(str(y) for y in range(c[0].year, until.year + 1))})
          print("chunks=" + json.dumps(chunks))
          if todo:
              print(f"first={todo[0]:%Y-%m-%d}")
              print(f"end={todo[-1] + timedelta(days=10):%Y-%m-%d}")
              print("igra=" + ("y2d" if todo[0].year == date.today().year else "por"))
          print(f"{len(todo)} of {len(days)} runs to add, in {len(chunks)} jobs", file=sys.stderr)
          EOF
          cat "$GITHUB_OUTPUT"

  radiosondes:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/constraints.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Radiosondes for the whole range
        run: |
          mverify db init
          mverify db igra --archive ${{ needs.plan.outputs.igra }} --since ${{ needs.plan.outputs.first }} --until ${{ needs.plan.outputs.end }}
          mverify db status
      - uses: actions/upload-artifact@v7
        with:
          name: obs-db
          path: .obs/obs.duckdb
          include-hidden-files: true   # .obs is a dot directory
          retention-days: 3
          compression-level: 1

  archive:
    needs: [plan, radiosondes]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - uses: actions/download-artifact@v7
        with:
          name: obs-db
          path: .obs
      - name: Surface stations and Stage IV for the chunk's weeks
        run: |
          mverify db ghcnh --year ${{ matrix.chunk.years }} --since ${{ matrix.chunk.since }} --until ${{ matrix.chunk.until }}
          mverify db precip --product stageiv --start ${{ matrix.chunk.since }} --end ${{ matrix.chunk.until }}
          mverify db status
      - name: Match and archive, one run at a time
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ matrix.chunk.runs }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          failed=""
          for d in $RUNS; do   # a run that fails is left for the next pass; the chunk's other runs go on
            if python scripts/verify/mverify_scores.py --archive-only --db "$MVERIFY_DB" --work "$RUNNER_TEMP/fc" \
                --inits "${d}00" "${d}00" --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"; then
              scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            else
              echo "::warning::${d}00 failed, left for the next pass"; failed="$failed $d"
            fi
            rm -rf "$RUNNER_TEMP"/db-new "$RUNNER_TEMP"/fc
          done
          if [ -n "$failed" ]; then echo "::error::runs not archived:$failed"; exit 1; fi

  mirror:
    needs: archive
    if: ${{ !cancelled() }}   # also when there was nothing to add, or a chunk failed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
      FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
      FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
      FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
      FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: The database's second copy, in the object store
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify/verifydb.sh mirror
