name: GEFS extended outlook

# The GEFS extended page (gefs.html, 2026-09-26): every day's 00Z GEFS run to 35 days (user: daily, once the 00Z
# run comes in. Its days 17-35 are published the FOLLOWING day, 03:00-04:00 UTC every day in the week to
# 2026-09-26, so the first slot is 04:40 UTC), anomalies
# against the GEFSv12 reforecast climatology (release gefs-clim-v1, gefs-reforecast.yml), weekly and change maps and
# the bias-corrected polar-vortex panel, all by scripts/gefs/gefs_live.py. Byte-ranged from NOAA's S3 (us-east-1).
# Several schedule slots because Actions honours only some cron firings; the script exits early once the cycle is
# already rendered.

on:
  schedule:
    - cron: "40 4 * * *"
    - cron: "40 6 * * *"
    - cron: "40 9 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "cycle YYYYMMDD (default: the newest 00Z run that reached day 35)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gefs
  cancel-in-progress: false

jobs:
  gefs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/gefs
            scripts/lib
            assets/gefs
            scripts/strat
            assets/sst/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy scipy eccodes matplotlib cartopy pandas xarray netCDF4
      # yesterday's anomalies for the change maps and the previous-run overlays live on the frames branch, not main
      - name: Seed the run archive
        run: scripts/lib/fetch_frames_ci.sh assets/gefs/anim/runs || true
      # the reforecast climatology centres, the GEFS control-analysis caches (vortex tail, MJO observed track) and
      # the reference files carry over between runs; a cold cache only costs downloads
      - uses: actions/cache@v6
        with:
          path: /tmp/gefs_work/clim
          key: gefs-cache-${{ github.run_id }}
          restore-keys: gefs-cache-
      - name: Reference files (release gefs-ref-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download gefs-ref-v1 --repo "$GITHUB_REPOSITORY" -D /tmp/gefs_work/ref --clobber && ls -la /tmp/gefs_work/ref
      - name: GEFS extended run
        id: run
        run: |
          python scripts/gefs/gefs_live.py --site . --procs 4 --ref /tmp/gefs_work/ref ${{ inputs.date && format('--date {0}', inputs.date) || '' }} | tee /tmp/gefs.log
          if ls /tmp/gefs_work/gefs2_*.npz >/dev/null 2>&1; then
            echo "new=1" >> "$GITHUB_OUTPUT"
            # the operational drift correction gefs_live just estimated; every product below applies it
            echo "drift=$(ls assets/gefs/anim/runs/gefs_drift_*.npz 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
            echo "npz=$(ls /tmp/gefs_work/gefs2_*.npz | tail -1)" >> "$GITHUB_OUTPUT"
            echo "date=$(ls /tmp/gefs_work/gefs2_*.npz | tail -1 | sed 's/.*gefs2_\([0-9]*\).npz/\1/')" >> "$GITHUB_OUTPUT"
          fi
      # the products ported from the GEPS page; each warns rather than failing the run
      - name: MJO (RMM plume, propagation, hindcast skill)
        if: steps.run.outputs.new == '1'
        env:
          GEFS_DRIFT: ${{ steps.run.outputs.drift }}
        run: |
          python scripts/gefs/gefs_mjo.py --npz "${{ steps.run.outputs.npz }}" --date "${{ steps.run.outputs.date }}" --site . \
            --cache /tmp/gefs_work/clim --ref /tmp/gefs_work/ref || echo "::warning::GEFS MJO failed"
      - name: Weekly terciles, raw and hindcast-calibrated
        if: steps.run.outputs.new == '1'
        env:
          GEFS_DRIFT: ${{ steps.run.outputs.drift }}
        run: |
          python scripts/gefs/gefs_probs.py --npz "${{ steps.run.outputs.npz }}" --date "${{ steps.run.outputs.date }}" --site . \
            --cache /tmp/gefs_work/clim --ref /tmp/gefs_work/ref || echo "::warning::GEFS terciles failed"
      # the stratosphere page's eddy heat flux, GEFS days 1-35 (heatflux100.py's product, same climatology and analysed tail)
      - name: 100 hPa eddy heat flux (wave-1 / wave-2)
        if: steps.run.outputs.new == '1'
        run: |
          python scripts/strat/heatflux100_ext.py --model gefs --date "${{ steps.run.outputs.date }}" --out-dir assets/gefs \
            || echo "::warning::GEFS heat flux failed"
      # the forecast dripping paint (forecast_drip.py): polar-cap height 1000-10 hPa, GEOS FP tail + GEFS days 1-35,
      # drift removed at 10/100/500 hPa from the v2 reforecast climatology (the same cache as gefs_live)
      - name: Forecast dripping paint
        if: steps.run.outputs.new == '1'
        env:
          GEFS_CLIM_CACHE: /tmp/gefs_work/clim
        run: |
          python scripts/strat/forecast_drip.py --model gefs --date "${{ steps.run.outputs.date }}" --out-dir assets/gefs \
            || echo "::warning::GEFS dripping paint failed"
      - name: Teleconnections, weather regimes, 500 hPa scenarios
        if: steps.run.outputs.new == '1'
        env:
          GEFS_DRIFT: ${{ steps.run.outputs.drift }}
        run: |
          for p in telecon regimes clusters; do
            python scripts/gefs/gefs_$p.py --npz "${{ steps.run.outputs.npz }}" --date "${{ steps.run.outputs.date }}" --site . \
              --cache /tmp/gefs_work/clim || echo "::warning::GEFS $p failed"
          done
      - name: Publish the loops and the run archive (frames branch)
        if: steps.run.outputs.new == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dirs=$(find assets/gefs/anim -mindepth 1 -maxdepth 1 -type d | sort | tr '\n' ' ')
          echo "publishing: $dirs"
          scripts/lib/publish_frames_ci.sh $dirs
      - name: Commit & push
        if: steps.run.outputs.new == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt (strat-history.yml pattern); frames and the run archive are gitignored
          SNAP=$(mktemp -d)
          git add -A assets/gefs 2>/dev/null || true
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            git add -A assets/gefs
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "gefs: extended outlook $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: success() && steps.run.outputs.new == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || echo "pages dispatch failed; the dispatcher will catch it"
