name: GEFS extended outlook

# The GEFS extended page (gefs.html): every day's 00Z GEFS run to 35 days (its days 17-35 are published the following
# day, 03:00-04:00 UTC, so the first slot is 04:40 UTC), anomalies
# against the GEFSv12 reforecast climatology (release gefs-clim-v3, gefs-reforecast.yml), weekly and change maps and
# the bias-corrected polar-vortex panel, all by scripts/gefs/gefs_live.py. Byte-ranged from NOAA's S3 (us-east-1).
# Several schedule slots because Actions honours only some cron firings; the script exits early once the cycle is
# already rendered.

on:
  schedule:
    - cron: "40 4 * * *"
    - cron: "40 6 * * *"
    - cron: "40 9 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "cycle YYYYMMDD (default: the newest 00Z run that reached day 35)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gefs
  cancel-in-progress: false

# ECMWF open data comes from the Google Cloud mirror only. The shared store already defaults to Google and ignores
# any other mirror name; pinning it here is belt and braces.
env:
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). Unset secrets leave these empty and frames go
  # to the `frames` branch alone; the repository variable FRAMES_BRANCH=off retires the branch (frames_env.sh).
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  FRAMES_BRANCH: ${{ vars.FRAMES_BRANCH }}
  ECMWF_SOURCES: google
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  gefs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/gefs
            scripts/geps
            scripts/regimes
            scripts/lib
            assets/gefs
            scripts/strat
            assets/sst/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install --quiet numpy scipy eccodes matplotlib cartopy pandas xarray netCDF4 zarr gcsfs   # zarr+gcsfs: ARCO ERA5 for the EPO/WPO tail
          pip install --quiet "quantmet @ git+https://github.com/scorvec/quantmet-tools@v0.4.2"   # shared diagnostics (BH-FDR, QBO zero line, PV, ...), pinned to the tag
      # yesterday's anomalies for the change maps and the previous-run overlays live on the frames branch, not main
      - name: Seed the run archive
        run: scripts/lib/fetch_frames_ci.sh assets/gefs/anim/runs || true
      # the reforecast climatology centres, the GEFS control-analysis caches (vortex tail, MJO observed track) and
      # the reference files carry over between runs; a cold cache only costs downloads. Restored from the newest entry,
      # saved under a hash of its files only when the run changed them, older entries deleted (end of the job).
      - name: Restore the run cache
        id: gefs_cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/gefs_work/clim
          key: gefs-cache-
          restore-keys: gefs-cache-
      - name: Reference files (release gefs-ref-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download gefs-ref-v1 --repo "$GITHUB_REPOSITORY" -D /tmp/gefs_work/ref --clobber && ls -la /tmp/gefs_work/ref
      - name: GEFS extended run (the members and the drift estimate)
        id: run
        run: |
          python scripts/gefs/gefs_live.py --stage fetch --site . --procs 4 --ref /tmp/gefs_work/ref ${{ inputs.date && format('--date {0}', inputs.date) || '' }} | tee /tmp/gefs.log
          if ls /tmp/gefs_work/gefs2_*.npz >/dev/null 2>&1; then
            echo "new=1" >> "$GITHUB_OUTPUT"
            # the operational drift correction gefs_live just estimated; every product below applies it
            echo "drift=$(ls assets/gefs/anim/runs/gefs_drift_*.npz 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
            echo "npz=$(ls /tmp/gefs_work/gefs2_*.npz | tail -1)" >> "$GITHUB_OUTPUT"
            echo "date=$(ls /tmp/gefs_work/gefs2_*.npz | tail -1 | sed 's/.*gefs2_\([0-9]*\).npz/\1/')" >> "$GITHUB_OUTPUT"
          fi
      # Everything built on that fetch, all at once (scripts/lib/parallel.sh), each guarded so one failure does not
      # sink the others:
      #   gefs_live --stage draw   the page's weekly maps, change maps, daily loops and vortex diagnostics
      #   forecast_drip            polar-cap height 1000-1 hPa, GEOS FP tail + GEFS days 1-35, drift removed at 10/100/500
      #                            hPa from the v2 reforecast climatology (the cache gefs_live uses)
      #   gefs_telecon, gefs_regimes, gefs_clusters, gefs_probs, gefs_mjo   the products ported from the GEPS page
      #   heatflux100_ext          the stratosphere page's 100 hPa eddy heat flux (wave-1 / wave-2), heatflux100.py's
      #                            product with the same climatology and analysed tail
      - name: Figures, dripping paint, teleconnections, regimes, scenarios, terciles, MJO, heat flux
        if: steps.run.outputs.new == '1'
        env:
          GEFS_DRIFT: ${{ steps.run.outputs.drift }}
          GEFS_CLIM_CACHE: /tmp/gefs_work/clim
          NPZ: ${{ steps.run.outputs.npz }}
          D: ${{ steps.run.outputs.date }}
        run: |
          source scripts/lib/parallel.sh
          par "GEFS page figures and loops" "the previous figures stay" \
            python scripts/gefs/gefs_live.py --stage draw --date "$D" --site . --procs 4 --ref /tmp/gefs_work/ref
          par "GEFS dripping paint" "the previous figure stays" python scripts/strat/forecast_drip.py --model gefs --date "$D" --out-dir assets/gefs
          for p in telecon regimes clusters; do
            par "GEFS $p" "the previous figures stay" python "scripts/gefs/gefs_$p.py" --npz "$NPZ" --date "$D" --site . --cache /tmp/gefs_work/clim \
              --ref /tmp/gefs_work/ref
          done
          par "GEFS terciles" "the previous figures stay" \
            python scripts/gefs/gefs_probs.py --npz "$NPZ" --date "$D" --site . --cache /tmp/gefs_work/clim --ref /tmp/gefs_work/ref
          par "GEFS MJO" "the previous figures stay" \
            python scripts/gefs/gefs_mjo.py --npz "$NPZ" --date "$D" --site . --cache /tmp/gefs_work/clim --ref /tmp/gefs_work/ref
          par "GEFS heat flux" "the previous figure stays" python scripts/strat/heatflux100_ext.py --model gefs --date "$D" --out-dir assets/gefs
          par_wait
      # the cache lives outside the workspace, where hashFiles() cannot see it
      - name: Fingerprint the run cache
        id: gefs_fp
        run: |
          h=""
          if [ -d /tmp/gefs_work/clim ] && [ -n "$(ls -A /tmp/gefs_work/clim)" ]; then
            h=$(cd /tmp/gefs_work/clim && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-40)
          fi
          echo "key=gefs-cache-$h" >> "$GITHUB_OUTPUT"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
      - name: Save the run cache (when it changed)
        if: steps.gefs_fp.outputs.hash != '' && steps.gefs_fp.outputs.key != steps.gefs_cache.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: /tmp/gefs_work/clim
          key: ${{ steps.gefs_fp.outputs.key }}
      - name: Publish the loops and the run archive (frames branch)
        if: steps.run.outputs.new == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dirs=$(find assets/gefs/anim -mindepth 1 -maxdepth 1 -type d | sort | tr '\n' ' ')
          echo "publishing: $dirs"
          scripts/lib/publish_frames_ci.sh $dirs
      - name: Commit & push
        if: steps.run.outputs.new == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt (strat-history.yml pattern); frames and the run archive are gitignored
          SNAP=$(mktemp -d)
          git add -A assets/gefs 2>/dev/null || true
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            git add -A assets/gefs
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "gefs: extended outlook $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: success() && steps.run.outputs.new == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "site deploy is batched - the dispatcher deploys within 15 min (pages.yml)"
          # the multi-model regime view reads gefs_regimes_members.json
          gh workflow run regimes.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::regimes dispatch failed"
      - name: Drop superseded caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/cache_prune.sh gefs-cache-

