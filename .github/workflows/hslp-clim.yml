name: Tropical sea-level pressure normals (ERA5 1991-2020, daily means of 6-hourly fields)

# Builder of scripts/mjo/data/reference/hslp_clim.nc (scripts/mjo/src/build_slp_clim.py): the harmonic normal with its
# linear trend and the harmonic variance of the daily-mean sea-level pressure over 40.5S-40.5N, from WeatherBench2's
# 6-hourly ERA5 (1.5 deg; anonymous GCS). Each part reduces five years to daily means; the build job fits the normals,
# prints its checks and commits the file. parts_run rebuilds from an earlier run's parts (kept 7 days) without fetching.
on:
  workflow_dispatch:
    inputs:
      parts_run:
        description: 'Build from the parts of this earlier run (its id; empty = fetch them)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read   # another run's artifacts (parts_run)

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  part:
    if: inputs.parts_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        years: [[1991, 1995], [1996, 2000], [2001, 2005], [2006, 2010], [2011, 2015], [2016, 2020]]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt
      - name: Five years of daily means
        run: |
          mkdir -p out
          python scripts/mjo/src/build_slp_clim.py fetch --years ${{ matrix.years[0] }} ${{ matrix.years[1] }} \
            --out out/slp_${{ matrix.years[0] }}.npz
      - uses: actions/upload-artifact@v7
        with:
          name: hslpclim-${{ matrix.years[0] }}
          path: out/*.npz
          retention-days: 7

  build:
    needs: part
    if: ${{ !cancelled() && (needs.part.result == 'success' || inputs.parts_run != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: hslpclim-*
          path: parts
          merge-multiple: true
          run-id: ${{ inputs.parts_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The normals
        run: python scripts/mjo/src/build_slp_clim.py build parts/*.npz
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT=scripts/mjo/data/reference/hslp_clim.nc
          SNAP=$(mktemp -d); cp "$OUT" "$SNAP/"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            cp "$SNAP/hslp_clim.nc" "$OUT"
            git add "$OUT"
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "Tropical sea-level pressure normals: ERA5 1991-2020, daily means"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
