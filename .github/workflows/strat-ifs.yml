name: Stratosphere, IFS-ENS, IFS control, GEFS and GEPS (vortex, heat flux, waves 1 and 2, winds, drip, zero line, jet)

# ECMWF IFS-ENS at full membership (all 50 perturbed members; the ensemble files carry no control at pressure levels)
# and the IFS control (its own open-data stream, to day 15) in every stratosphere product that their open data can
# feed, and the days 1-15 GEFS and GEPS versions of the same products (naens job, below):
#
#   nh_vortex.py --record-only -> data/runs/vortex_{ifs,hres,gdps,geosfp}.json (winds), vortex_{gefs,geps}.json (naens)
#                            + (--members) assets/sst/vortex_members_{ifs,gefs,geps}.webp, each ensemble member by member
#   run_record.py capture -> data/runs/{heatflux,drip}_<model>.json + assets/sst/runs/<product>_<model>.webp: each
#                            model's run-to-run record and figure, from the JSON its products just wrote
#   heatflux100_ext.py    -> assets/sst/ifs_heatflux100_{nh,sh}.webp   + data/ifs_heatflux100.json (the control line)
#   forecast_drip.py      -> assets/sst/{ifs,hres}_drip{,_change}.webp + data/{ifs,hres}_drip.json (_change: against the run a day earlier)
#                            (both with the IFS-ENS drift, reference/ifs_capdrift.json)
#   wave_maps.py          -> assets/sst/anim/wave{1,2}_{ifs,hres}_{nh,sh}/ + wave{1,2}_maps_{ifs,hres}_manifest.json
#   vortex_winds.py       -> assets/sst/anim/vortex_{ifs,hres}_{10,100}_{nh,sh}/ + vortex_winds_{ifs,hres}_manifest.json
#   polarcap.py           -> assets/sst/{polarcap,telecon,vshape}_ifs.webp + anim/{polarcap,t10}_ifs/, anim/z100_{ifs,hres}/
#                            + data/runs/{polarcap,telecon,vshape}_{ifs,hres}.json: polar cap, AO/NAO, 100 hPa height,
#                            10 hPa temperature and the vortex's shape (the shared gh, msl and t10 files)
#   polar_descent.py      -> assets/sst/descent{,_sectors}_ifs.webp, descent_gefs.webp + anim/descent_{ifs,hres}/: descent over
#                            the polar cap (the shared w files; GEFS from strat_ens.py part "omega")
#   (hres = the IFS control in file names, as in the code; the pages say "IFS control")
#   ssw_imprint.py        -> assets/sst/ssw_imprint.webp + data/ssw_imprint{,_history,_runs}.json: the downward
#                            propagation monitor (imprint job, after the drips it reads)
#   reflection_index.py   -> assets/sst/reflection_index.webp: the regional reflection index of every ensemble (imprint
#                            job, from the heat-flux JSON of this run and main's AIFS-ENS one)
#   qbo_duct.py --model ifs -> scripts/strat/data/zmu_members_ifs.npz (zero line) + the 250 hPa jet sector (pacjet)
#   qbo_zeroline.py       -> assets/sst/qbo_zeroline_*.webp re-rendered with IFS-ENS + data/qbo_zeroline_ifs.json
#   naens (GEFS, GEPS)    -> assets/sst/{gefs,geps}_heatflux100_{nh,sh}.webp, {gefs,geps}_drip.webp (+ data/*.json),
#                            anim/wave{1,2}_{gefs,geps}_{nh,sh}/, anim/vortex_{gefs,geps}_{10,100}_{nh,sh}/ + manifests,
#                            {polarcap,telecon,vshape}_{gefs,geps}.webp + anim/{polarcap,z100,t10}_{gefs,geps}/
# The upper-stratosphere item cannot have IFS: its open data stops at 10 hPa (GEPS's too).
#
# WHY A SEPARATE WORKFLOW. IFS-ENS lands on the Google mirror after AIFS-ENS is complete (12Z on 2026-10-25: AIFS-ENS
# ~19:42Z, IFS-ENS step 0 19:40Z to day 15 20:31Z), and strat.yml is timed for AIFS-ENS.
#
# AS THE RUN LANDS. The IFS control is on the mirror ~07:36Z / 19:36Z, and IFS-ENS lands over the next ~50 min, a
# 12-hourly step every ~2 min. The cycle job takes the cycle the page is on (AIFS-ENS complete, the rule strat.yml
# uses) and waits only for IFS-ENS to begin landing; winds and heights then take each step the moment it is complete
# on the mirror (ifs_ens.py land), rendering the control meanwhile, so when day 15 lands only its steps are fetched
# and the IFS-ENS products start. A run still incomplete 100 min in fails visibly (the control's products publish). The
# fast lane dispatches this when cycles.py --profile strat-ifs is ready for the cycle (~07:45Z / 19:45Z); the
# dispatcher's 09:05 / 21:05 slots and these crons are the backstop.
#
# EVERY MODEL AS IT LANDS. Each job records only the models it renders (strat.yml AIFS-ENS; winds and heights the
# IFS-ENS, IFS control, GDPS and GEOS FP; naens GEFS and GEPS) into their own files; the figures that hold every model
# (nh_vortex.webp, nh_vortex_runs.webp) and the SSW summary (ssw_summary.json, read by ssw.html) are drawn from each
# model's newest record by strat-combine.yml after every run of this workflow and of strat.yml, so they move model by
# model.
#
# GEPS FAST LANE. GEPS day 16 is on the Datamart ~5 h after the start (05:05Z / 17:15Z on 2026-10-21), hours before
# these slots, so the Canadian fast lane (scripts/lib/canada_fastlane.sh) dispatches this workflow with only=geps the
# moment that run is complete: the naens job alone, for GEPS alone, its vortex record with it. GEFS runs every 6 h,
# each to day 16 (on S3 ~6.5 h after its start: ~06:30Z, 12:30Z, 18:30Z, 00:30-01:00Z); the model fast lane
# dispatches only=gefs with the cycle as soon as its last member's day 16 is there, and dispatcher slots at
# 06:45/12:45/18:45/01:15 run it the same way (no date: the GEFS cycle that started at least 5 h ago, or the one
# before when that is not complete yet). The 06/18Z GEFS runs feed every days 1-15 product but the imprint monitor,
# whose index is on 00/12Z instants. A GEFS or GEPS cycle that main already shows in every product is not fetched
# again (strat_ens.py --skip-shown; force=true re-renders it), so the full run after the fast lane skips GEPS.
#
# DATA. Google Cloud mirror only: ECMWF_SOURCES=google for every step, and ifs_ens.py names the
# Google mirror in every request. A cycle the mirror does not have is skipped with a warning - never fetched elsewhere.
# The IFS-ENS fields are split between two jobs by level, each fetching its own (ifs_ens.py land), so that their
# products render on two runners and nothing is fetched twice:
#   winds    the 10 and 100 hPa fields: u/v 12-hourly (~3.4 GB), gh daily (~0.65 GB) and between the daily steps
#            (~0.6 GB, the vortex-wind loop's own), t at 100 and 10 hPa (~0.45 GB), the IFS control's u/v/gh and t100
#            (~0.1 GB), and for the descent the leading rows only (ifs_ens ROWS, scripts/ecmwf/ccsds.py): v and t on
#            65.0-65.5N at 50-400 hPa (~0.6 GB; at 10 and 100 hPa they are decoded from the whole fields above) and w at
#            9 levels north of 48.25N, kept as 1.5-deg cells (~1.0 GB instead of ~3.8). It hands gh at 10/100 hPa and t
#            at 10 hPa (~0.85 GB, the daily steps) to heights as an artifact the moment they are in.
#   heights  gh at the drip's other 9 levels daily (~3.1 GB), sea-level pressure (~0.4 GB), the control's gh and msl.
#   zmu      u at 10/50/250 hPa and v at 250 hPa, streamed a step at a time and never cached (~2 GB a cycle). The
#            E-P flux comes from GEFS instead (strat.yml), which has levels between 10 and 50 hPa.
#   naens    GEFS from NOAA's S3 (byte-ranged per message) and GEPS from the MSC Datamart, one shared fetch per model
#            (strat_ens.py fetch: every member and step pulled once, reduced on the way in), read by all four products
#            and by the vortex record.
# The ef files hold ~8,500 messages per step in arrival order, so a 50-member selection is a scatter of 0.3-0.7 MB
# ranges: rangefetch's 0.5 MB gap keeps the wasted bytes near 1 %, and winds and heights run at 120 requests/s on the
# Google mirror (scripts/ecmwf/budget.py; a throttle response halves it and is logged as "throttled: HTTP ...").
#
# DEPLOY. The publish job dispatches pages.yml as soon as its commit is on main, rather than leave it to the batched
# deploys (pages.yml explains the batching; its concurrency group serialises the deploys).
on:
  # backstop crons: the fast lane and the dispatcher (scripts/lib/dispatch_workflows.sh) fire this on time; these only
  # matter when they are off
  schedule:
    - cron: '5 9 * * *'
    - cron: '5 21 * * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = the cycle strat.yml is on)'
        default: ''
      time:
        description: 'Cycle hour 00 or 12, or 06/18 with only=gefs (blank = latest)'
        default: ''
      publish:
        description: 'Commit the figures (false = render + artifacts only)'
        default: 'false'
      only:
        description: 'Only this model''s days 1-15 products, gefs or geps (blank = every product)'
        default: ''
      force:
        description: 'Re-render GEFS/GEPS even when the page already shows their cycle'
        default: 'false'

env:
  ECMWF_SOURCES: google
  ECMWF_MULTISOURCE: "0"
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). Unset secrets leave these empty and frames go
  # to the `frames` branch alone; the repository variable FRAMES_BRANCH=off retires the branch (frames_env.sh).
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  FRAMES_BRANCH: ${{ vars.FRAMES_BRANCH }}
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

permissions:
  contents: write

concurrency:
  group: strat-ifs
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- cycle ---
  # The cycle strat.yml is on - the newest 00/12Z whose AIFS-ENS is completely on Google, by the same shared rule
  # (scripts/ecmwf/cycles.py) strat.yml's cycle job uses - then up to 15 min for IFS-ENS to begin landing there.
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.cyc.outputs.date }}
      time: ${{ steps.cyc.outputs.time }}
      ready: ${{ steps.cyc.outputs.ready }}
      fresh: ${{ steps.pub.outputs.fresh }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      # ifs_ens imports the shared store, which imports ecmwf-opendata; the full set is ~1 min against the cache.
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt
      - name: Resolve the cycle and whether IFS-ENS is landing on the Google mirror
        id: cyc
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; T="${{ github.event.inputs.time }}"
          if [ -n "$ONLY" ] && [ -z "$D" ]; then
            # a GEFS/GEPS-only run is on that model's own newest cycle, not the one AIFS-ENS has reached: the start at
            # least 5 h ago, GEFS every 6 h and GEPS every 12 (strat_ens.py falls back when it is not complete yet)
            every=43200; [ "$ONLY" = gefs ] && every=21600
            t=$(( ($(date -u +%s) - 5 * 3600) / every * every ))
            D=$(date -u -d "@$t" +%Y%m%d); T=$(date -u -d "@$t" +%H)
          fi
          wait=15; [ -n "$ONLY" ] && wait=0   # a GEFS/GEPS-only run does not wait for IFS-ENS
          python scripts/strat/ifs_ens.py resolve --date "$D" --time "$T" --wait-min "$wait" --github-output
          if [ -z "$ONLY" ] && grep -q '^ready=false' "$GITHUB_OUTPUT"; then
            echo "::warning::IFS-ENS has not begun to land on the Google mirror for this cycle; the IFS-ENS products and record keep their previous version"
          fi
      # A backstop cron fires hours late and resolves the cycle a dispatcher slot already rendered: when the IFS control
      # products show it, and the IFS-ENS ones too (or IFS-ENS is still not on the mirror), there is nothing new to fetch
      # (~8 GB). Main's manifests as they are now, not the checkout's (a queued run checks out an older commit).
      - name: Already published?
        id: pub
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
          D: ${{ steps.cyc.outputs.date }}
          T: ${{ steps.cyc.outputs.time }}
          READY: ${{ steps.cyc.outputs.ready }}
        run: |
          set -euo pipefail
          fresh=true
          if [ -z "$ONLY" ] && [ "$FORCE" != "true" ] && timeout 60 git fetch -q --depth 1 origin main; then
            ver() {
              git show "FETCH_HEAD:assets/sst/anim/wave1_maps_$1_manifest.json" 2>/dev/null \
                | python -c "import json, sys; print(json.load(sys.stdin).get('ver', ''))" 2>/dev/null || true
            }
            if [ "$(ver hres)" = "$D$T" ] && { [ "$READY" != "true" ] || [ "$(ver ifs)" = "$D$T" ]; }; then
              fresh=false
              echo "cycle $D ${T}Z: the IFS control and IFS-ENS products already show it - nothing to fetch"
            fi
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- winds ---
  # The 10 and 100 hPa fields and every product of theirs: the vortex-wind loops, the heat flux, the polar-vortex run
  # records and the descent (see DATA above). The IFS control renders while IFS-ENS lands; after day 15 lands, ~12 min:
  # the IFS-ENS vortex-wind loop (124 frames) is the longest product of the workflow. Each heavy step has its own cap
  # and continues on error, so a stuck step costs only its cap, the rest still render and publish, and "What was
  # produced" still turns the run red for whatever is missing.
  winds:
    needs: cycle
    if: ${{ !inputs.only && needs.cycle.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      MPLBACKEND: Agg
      D: ${{ needs.cycle.outputs.date }}
      T: ${{ needs.cycle.outputs.time }}
      READY: ${{ needs.cycle.outputs.ready }}
      ECMWF_RPS: "120"
      ECMWF_RPS_GOOGLE: "120"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      # The files are ~6 GB, each joined from its steps once they are all in.
      # Recent runner images have ~100 GB free but older ones had ~14, so the preinstalled SDKs are removed (1-2 min)
      # only when under 25 GB is free.
      - name: Free disk
        run: |
          touch /tmp/t0                                   # stamp: the checkout's copies are older than this
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          if [ "${free:-0}" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup ${AGENT_TOOLSDIRECTORY:+"$AGENT_TOOLSDIRECTORY/CodeQL"} || true
          fi
          df -h / | tail -1

      # A run checks out the commit it was triggered at, and a queued run can start well after main has moved on.
      # The run records accumulate, so they are read from main as it is now, or this run's publish would lay stale
      # copies over them (2026-10-17: a queued run dropped the 14 backfilled runs).
      - name: The run records as main has them now
        run: |
          git fetch -q --depth 1 origin main
          git checkout origin/main -- assets/sst/data/runs || echo "::warning::no run records on main yet"

      # IFS-ENS step by step as it lands (ifs_ens.py land, up to 100 min) and, beside it, the IFS control (on the mirror
      # before the ensemble starts: its files, then its vortex-wind loop) and the GDPS and GEOS FP vortex records (no
      # ECMWF data), all at once (scripts/lib/parallel.sh).
      - name: IFS control, and IFS-ENS as it lands (Google mirror only)
        id: land
        timeout-minutes: 120
        continue-on-error: true
        run: |
          source scripts/lib/parallel.sh
          if [ "$READY" = "true" ]; then
            par "IFS-ENS as it lands" "the IFS-ENS products keep their previous version" \
              bash -c 'python scripts/strat/ifs_ens.py land --date "$D" --time "$T" --wait-min 100 \
                --names uv,gh_wind,gh_mid,t100,t10,edge,w && touch /tmp/ifs-ens.landed'
          fi
          python scripts/strat/ifs_ens.py land --date "$D" --time "$T" --wait-min 30 --names ctrl_wind,ctrl_t100,ctrl_edge,ctrl_w \
            || echo "::warning::the IFS control is not complete on the Google mirror; its products will say so"
          par "IFS control vortex winds" "keeping the previous frames" python scripts/strat/vortex_winds.py --model hres \
            --date "$D" --time "$T" --anim-dir assets/sst/anim --manifest assets/sst/anim/vortex_winds_hres_manifest.json
          par "GDPS and GEOS FP vortex records" "the records keep their previous runs" python scripts/strat/nh_vortex.py \
            --record-only --models gdps,geosfp --cycle "$D$T"
          par_wait
          du -sh scripts/ecmwf/cache 2>/dev/null || true
          df -h / | tail -1
          if [ -f /tmp/ifs-ens.landed ]; then echo "landed=true" >> "$GITHUB_OUTPUT"; fi

      # gh at 10 and 100 hPa and t at 10 hPa, the daily steps, for the heights job's products (their store files, which
      # heights lays into its own cache): handed over before this job's products start, so heights does not wait for them.
      - name: The fields the heights job reads
        id: share
        if: steps.land.outputs.landed == 'true'
        run: |
          { echo "paths<<EOF"; python scripts/strat/ifs_ens.py paths --date "$D" --time "$T" --names gh_wind,t10; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Hand them to heights
        if: steps.land.outputs.landed == 'true'
        continue-on-error: true   # heights then fetches them itself
        uses: actions/upload-artifact@v7
        with:
          name: ifs-fields-for-heights
          path: ${{ steps.share.outputs.paths }}
          compression-level: 0   # GRIB is compressed already
          if-no-files-found: error
          retention-days: 1

      # The IFS-ENS products, all at once (four at a time), the vortex-wind loop first: it is the longest.
      #   vortex_winds    the IFS-ENS loops (u, v and gh at 10 and 100 hPa, every 12 h)
      #   heatflux100_ext 100 hPa eddy heat flux (IFS-ENS)
      #   nh_vortex       the polar-vortex records of IFS-ENS and the IFS control, and IFS-ENS member by member (AIFS-ENS
      #                   is recorded by strat.yml, GEFS and GEPS by the naens job); strat-combine.yml draws every model
      #   polar_descent   descent over the polar cap (the w and edge rows; the ensemble's and the control's)
      - name: IFS-ENS and IFS control products
        timeout-minutes: 45
        continue-on-error: true
        env:
          LANDED: ${{ steps.land.outputs.landed }}
        run: |
          source scripts/lib/parallel.sh
          M=hres; [ "$LANDED" = "true" ] && M=hres,ifs
          if [ "$LANDED" = "true" ]; then
            par "IFS vortex-wind loop" "keeping the previous frames" python scripts/strat/vortex_winds.py --model ifs \
              --date "$D" --time "$T" --anim-dir assets/sst/anim --manifest assets/sst/anim/vortex_winds_ifs_manifest.json
            par "IFS heat flux" "keeping the previous figure" python scripts/strat/heatflux100_ext.py --model ifs --date "$D" \
              --time "$T" --out-dir assets/sst
          fi
          par "NH polar vortex run records" "the records keep their previous runs" python scripts/strat/nh_vortex.py --record-only \
            --members --models "$M" --cycle "$D$T"
          par "IFS descent" "keeping the previous figures" python scripts/strat/polar_descent.py --model ifs --date "$D" --time "$T"
          par_wait

      - name: Run record, heat flux
        if: steps.land.outputs.landed == 'true'
        continue-on-error: true
        run: python scripts/strat/run_record.py capture heatflux --model ifs || echo "::warning::IFS heat-flux record failed"

      # Red when something that should have rendered did not (every render above is `|| ::warning::`, so a green step
      # proves nothing). Publishing still runs under always().
      - name: What was produced
        if: always()
        run: |
          bad=0
          want=""
          [ "$READY" = "true" ] && want="assets/sst/ifs_heatflux100_nh.webp assets/sst/ifs_heatflux100_sh.webp assets/sst/descent_ifs.webp"
          for f in $want; do
            if [ -f "$f" ] && [ "$f" -nt /tmp/t0 ]; then printf '  %-40s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else printf '  %-40s MISSING\n' "$f"; bad=$((bad + 1)); fi
          done
          models=hres; [ "$READY" = "true" ] && models="ifs hres"
          for m in $models; do
            for d in vortex_${m}_10_nh vortex_${m}_10_sh vortex_${m}_100_nh vortex_${m}_100_sh; do
              n=$(ls "assets/sst/anim/$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')
              printf '  %-40s %s frames\n' "$d" "$n"; [ "$n" -eq 0 ] && bad=$((bad + 1))
            done
          done
          [ "$bad" -gt 0 ] && { echo "::error::$bad IFS-ENS / IFS control product(s) produced nothing"; exit 1; } || true

      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/winds.list
          for p in assets/sst/ifs_heatflux100_nh.webp assets/sst/ifs_heatflux100_sh.webp assets/sst/data/ifs_heatflux100.json \
                   assets/sst/data/runs/vortex_{ifs,hres,gdps,geosfp}.json assets/sst/vortex_members_ifs.webp \
                   assets/sst/data/runs/heatflux_ifs.json assets/sst/runs/heatflux_ifs.webp \
                   assets/sst/descent_ifs.webp assets/sst/descent_sectors_ifs.webp assets/sst/anim/descent_{ifs,hres}_manifest.json \
                   assets/sst/data/runs/descent_{ifs,hres}.json assets/sst/runs/descent_{ifs,hres}.webp; do
            [ -e "$p" ] && [ "$p" -nt /tmp/t0 ] && echo "$p" >> /tmp/winds.list
          done
          for d in assets/sst/anim/descent_ifs assets/sst/anim/descent_hres; do
            if [ -d "$d" ] && [ "$d" -nt /tmp/t0 ]; then echo "$d" >> /tmp/winds.list; fi
          done
          for m in ifs hres; do
            for p in assets/sst/anim/vortex_${m}_10_nh assets/sst/anim/vortex_${m}_10_sh assets/sst/anim/vortex_${m}_100_nh \
                     assets/sst/anim/vortex_${m}_100_sh assets/sst/anim/vortex_winds_${m}_manifest.json; do
              [ -e "$p" ] && echo "$p" >> /tmp/winds.list
            done
          done
          if [ ! -s /tmp/winds.list ]; then : > /tmp/strat-ifs-winds.tgz; exit 0; fi
          tar -czf /tmp/strat-ifs-winds.tgz -T /tmp/winds.list
          echo "  packed $(tar -tzf /tmp/strat-ifs-winds.tgz | grep -c '\.webp$') webp"

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-ifs-winds
          path: /tmp/strat-ifs-winds.tgz
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------- heights ---
  # gh at the drip's other levels, sea-level pressure and the control's gh and msl, and every product of theirs: the
  # dripping paint, the wave loops, the polar cap (with the AO/NAO, 100 hPa height, 10 hPa temperature and vortex
  # shape) and the regimes; gh at 10/100 hPa and t at 10 hPa come from the winds job. The IFS control renders while
  # IFS-ENS lands; after day 15 lands, ~10 min.
  heights:
    needs: cycle
    if: ${{ !inputs.only && needs.cycle.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read   # the winds job's fields: this run's artifacts, while that job still runs
    env:
      MPLBACKEND: Agg
      D: ${{ needs.cycle.outputs.date }}
      T: ${{ needs.cycle.outputs.time }}
      READY: ${{ needs.cycle.outputs.ready }}
      ECMWF_RPS: "120"
      ECMWF_RPS_GOOGLE: "120"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Free disk
        run: |
          touch /tmp/t0                                   # stamp: the checkout's copies are older than this
          free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          if [ "${free:-0}" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup ${AGENT_TOOLSDIRECTORY:+"$AGENT_TOOLSDIRECTORY/CodeQL"} || true
          fi
          df -h / | tail -1

      # the run records accumulate, so they are main's as it is now (a queued run checks out an older commit)
      - name: The run records as main has them now
        run: |
          git fetch -q --depth 1 origin main
          git checkout origin/main -- assets/sst/data/runs || echo "::warning::no run records on main yet"

      # IFS-ENS step by step as it lands and, beside it, the IFS control: its files, then its drip and wave loops.
      - name: IFS control, and IFS-ENS as it lands (Google mirror only)
        id: land
        timeout-minutes: 120
        continue-on-error: true
        run: |
          source scripts/lib/parallel.sh
          if [ "$READY" = "true" ]; then
            par "IFS-ENS as it lands" "the IFS-ENS products keep their previous version" \
              bash -c 'python scripts/strat/ifs_ens.py land --date "$D" --time "$T" --wait-min 100 --names gh,msl \
                && touch /tmp/ifs-ens.landed'
          fi
          python scripts/strat/ifs_ens.py land --date "$D" --time "$T" --wait-min 30 --names ctrl_gh,ctrl_msl \
            || echo "::warning::the IFS control is not complete on the Google mirror; its products will say so"
          par "IFS control wave loops" "keeping the previous frames" python scripts/strat/wave_maps.py --model hres \
            --date "$D" --time "$T" --anim-dir assets/sst/anim
          par "IFS control drip" "keeping the previous figure" python scripts/strat/forecast_drip.py --model hres \
            --date "$D" --time "$T" --out-dir assets/sst
          par_wait
          python scripts/strat/run_record.py capture drip --model hres || echo "::warning::IFS control drip record failed"
          du -sh scripts/ecmwf/cache 2>/dev/null || true
          if [ -f /tmp/ifs-ens.landed ]; then echo "landed=true" >> "$GITHUB_OUTPUT"; fi

      # gh at 10/100 hPa and t at 10 hPa from the winds job (its artifact, as soon as it is uploaded) into this job's
      # store cache. Should it not come (the winds job failed first), the products fetch those files from the mirror.
      - name: The winds job's fields
        if: steps.land.outputs.landed == 'true'
        timeout-minutes: 30
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          dir=$(dirname "$(python scripts/strat/ifs_ens.py paths --date "$D" --time "$T" --names t10 | sed -n 1p)")
          start=$(date +%s)
          while :; do
            id=$(gh api "$api/runs/$GITHUB_RUN_ID/artifacts?name=ifs-fields-for-heights" --jq '.artifacts[0].id // ""' || true)
            if [ -n "$id" ]; then
              gh api "$api/artifacts/$id/zip" > /tmp/fields.zip
              unzip -o -q /tmp/fields.zip -d "$dir" && rm /tmp/fields.zip
              echo "  the winds job's fields after $(( $(date +%s) - start )) s:"; ls -la "$dir"
              break
            fi
            state=$(gh api "$api/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "winds" or (.name | endswith("/ winds"))) | .status' || true)
            if [ "$state" = completed ]; then
              echo "::warning::the winds job ended without handing on its fields; the products fetch them from the mirror"
              break
            fi
            sleep 10
          done

      # The IFS-ENS products, all at once (four at a time):
      #   forecast_drip   dripping paint (IFS-ENS)
      #   wave_maps       the IFS-ENS loops
      #   polarcap        polar cap at sea level and 500 hPa, the AO and NAO, the 100 hPa height, the 10 hPa temperature
      #                   and the vortex's shape (gh at 500, 100 and 10 hPa and msl, the IFS control's too; t at 10 hPa,
      #                   the ensemble's only): plumes, maps and the IFS-ENS and IFS control records; the control alone
      #                   when IFS-ENS is not ready
      #   regimes_ecmwf   weather regimes from the 50 IFS-ENS members of the shared gh file (00Z cycles only) ->
      #                   assets/regimes/data, read by the multi-model regime view (regimes.yml)
      - name: IFS-ENS and IFS control products
        timeout-minutes: 45
        continue-on-error: true
        env:
          LANDED: ${{ steps.land.outputs.landed }}
        run: |
          source scripts/lib/parallel.sh
          if [ "$LANDED" = "true" ]; then
            par "IFS drip" "keeping the previous figure" python scripts/strat/forecast_drip.py --model ifs --date "$D" --time "$T" \
              --out-dir assets/sst
            par "IFS wave loops" "keeping the previous frames" python scripts/strat/wave_maps.py --model ifs --date "$D" --time "$T" \
              --anim-dir assets/sst/anim
          fi
          par "IFS polar cap" "keeping the previous figures" python scripts/strat/polarcap.py --model ifs --date "$D" --time "$T"
          if [ "$LANDED" = "true" ]; then
            par "IFS-ENS regimes" "the previous members stay" python scripts/regimes/regimes_ecmwf.py --model ifs --date "$D" --time "$T"
          fi
          par_wait

      - name: Run record, dripping paint
        if: steps.land.outputs.landed == 'true'
        continue-on-error: true
        run: python scripts/strat/run_record.py capture drip --model ifs || echo "::warning::IFS drip record failed"

      - name: What was produced
        if: always()
        run: |
          bad=0
          want="assets/sst/hres_drip.webp"
          [ "$READY" = "true" ] && want="$want assets/sst/ifs_drip.webp assets/sst/polarcap_ifs.webp assets/sst/telecon_ifs.webp assets/sst/vshape_ifs.webp"
          for f in $want; do
            if [ -f "$f" ] && [ "$f" -nt /tmp/t0 ]; then printf '  %-40s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else printf '  %-40s MISSING\n' "$f"; bad=$((bad + 1)); fi
          done
          models=hres; [ "$READY" = "true" ] && models="ifs hres"
          for m in $models; do
            for d in wave1_${m}_nh wave1_${m}_sh wave2_${m}_nh wave2_${m}_sh; do
              n=$(ls "assets/sst/anim/$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')
              printf '  %-40s %s frames\n' "$d" "$n"; [ "$n" -eq 0 ] && bad=$((bad + 1))
            done
          done
          [ "$bad" -gt 0 ] && { echo "::error::$bad IFS-ENS / IFS control product(s) produced nothing"; exit 1; } || true

      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/heights.list
          for p in assets/sst/ifs_drip.webp assets/sst/ifs_drip_change.webp assets/sst/data/ifs_drip.json assets/sst/hres_drip.webp assets/sst/hres_drip_change.webp assets/sst/data/hres_drip.json \
                   assets/regimes/data/regimes_members_ifs.json assets/regimes/data/regimes_drift_ifs.json \
                   assets/sst/data/runs/{drip,waves}_{ifs,hres}.json assets/sst/runs/{drip,waves}_{ifs,hres}.webp \
                   assets/sst/polarcap_ifs.webp assets/sst/telecon_ifs.webp assets/sst/anim/polarcap_ifs_manifest.json \
                   assets/sst/anim/z100_{ifs,hres}_manifest.json assets/sst/vshape_ifs.webp assets/sst/anim/t10_ifs_manifest.json \
                   assets/sst/data/runs/{polarcap,telecon,vshape}_{ifs,hres}.json \
                   assets/sst/runs/{polarcap,telecon,vshape}_{ifs,hres}.webp; do
            [ -e "$p" ] && [ "$p" -nt /tmp/t0 ] && echo "$p" >> /tmp/heights.list
          done
          for d in assets/sst/anim/polarcap_ifs assets/sst/anim/z100_ifs assets/sst/anim/z100_hres assets/sst/anim/t10_ifs; do
            if [ -d "$d" ] && [ "$d" -nt /tmp/t0 ]; then echo "$d" >> /tmp/heights.list; fi
          done
          for m in ifs hres; do
            for p in assets/sst/anim/wave1_${m}_nh assets/sst/anim/wave1_${m}_sh assets/sst/anim/wave1_maps_${m}_manifest.json \
                     assets/sst/anim/wave2_${m}_nh assets/sst/anim/wave2_${m}_sh assets/sst/anim/wave2_maps_${m}_manifest.json; do
              [ -e "$p" ] && echo "$p" >> /tmp/heights.list
            done
          done
          if [ ! -s /tmp/heights.list ]; then : > /tmp/strat-ifs-heights.tgz; exit 0; fi
          tar -czf /tmp/strat-ifs-heights.tgz -T /tmp/heights.list
          echo "  packed $(tar -tzf /tmp/strat-ifs-heights.tgz | grep -c '\.webp$') webp"

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-ifs-heights
          path: /tmp/strat-ifs-heights.tgz
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------- naens ---
  # GEFS and GEPS for the days 1-15 products, on this workflow's cycle (each falls back up to a day to the newest cycle
  # complete to 384 h); it does not wait for IFS-ENS. One shared fetch per model (strat_ens.py: GEFS ~4.5 GB
  # byte-ranged from NOAA's S3, GEPS ~0.7 GB from the MSC Datamart, both reduced as they arrive), then the heat flux,
  # the dripping paint, the wave maps and the vortex winds, the two models side by side. ~35 min (GEPS alone ~15).
  naens:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:  # the cycle each model was rendered on (or skipped), for the imprint job
      gefs_date: ${{ steps.fetch.outputs.gefs_date }}
      gefs_time: ${{ steps.fetch.outputs.gefs_time }}
      gefs_skip: ${{ steps.fetch.outputs.gefs_skip }}
      geps_date: ${{ steps.fetch.outputs.geps_date }}
      geps_time: ${{ steps.fetch.outputs.geps_time }}
      geps_skip: ${{ steps.fetch.outputs.geps_skip }}
    env:
      MPLBACKEND: Agg
      D: ${{ needs.cycle.outputs.date }}
      T: ${{ needs.cycle.outputs.time }}
      MODELS: ${{ inputs.only || 'gefs geps' }}
      GEFS_CLIM_CACHE: /tmp/gefs_clim2   # the GEFSv12 reforecast climatology the GEFS drip's drift comes from
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      # The GEPS dripping paint removes GEPS's drift measured on the S2S reforecasts (strat/geps_s2s of the GEPS
      # reference set); only that directory is kept from the tar.
      - name: GEPS reforecast drift (release geps-ref-v3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch /tmp/t0                                   # stamp: the checkout's copies are older than this
          gh release download geps-ref-v3 --repo "$GITHUB_REPOSITORY" -p geps_ref_v3.tar -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ref" scripts/strat/data
          tar -xf "$RUNNER_TEMP/geps_ref_v3.tar" -C "$RUNNER_TEMP/ref" --wildcards '*strat/geps_s2s/*'
          rm "$RUNNER_TEMP/geps_ref_v3.tar"
          d=$(find "$RUNNER_TEMP/ref" -type d -name geps_s2s | head -1)
          if [ -n "$d" ]; then cp -r "$d" scripts/strat/data/; ls scripts/strat/data/geps_s2s
          else echo "::warning::geps_s2s not in geps_ref_v3.tar; the GEPS drip goes uncorrected (hatched)"; fi

      # The two fetches hit different hosts: run them side by side. Each writes the cycle it used to the step output,
      # and whether main already shows that cycle in every product (then nothing is fetched or rendered).
      - name: Shared GEFS and GEPS fetch
        id: fetch
        timeout-minutes: 45
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
        run: |
          start=$(date +%s)
          git fetch -q --depth 1 origin main   # what the page shows now (a queued run checks out an older commit)
          skip=--skip-shown; [ "$FORCE" = "true" ] && skip=
          pids=()
          for m in $MODELS; do
            python scripts/strat/strat_ens.py fetch --model "$m" --date "$D" --time "$T" $skip --github-output > "/tmp/$m.log" 2>&1 &
            pids+=($!)
          done
          i=0
          for m in $MODELS; do
            wait "${pids[$i]}" || echo "::warning::$m fetch failed; its products keep their previous version"
            echo "---- $m"; tail -6 "/tmp/$m.log"
            i=$((i + 1))
          done
          echo "  fetch wall time $(( $(date +%s) - start )) s"
          du -sh scripts/strat/data/strat_ens 2>/dev/null || true

      # the run records accumulate, so they are main's as it is now (a queued run checks out an older commit)
      - name: The run records as main has them now
        run: git checkout origin/main -- assets/sst/data/runs || echo "::warning::no run records on main yet"
      # Per model: heat flux, dripping paint, wave maps, vortex winds, from the shared file only (no download).
      - name: GEFS and GEPS products
        timeout-minutes: 50
        continue-on-error: true
        env:
          GEFS_D: ${{ steps.fetch.outputs.gefs_date }}
          GEFS_T: ${{ steps.fetch.outputs.gefs_time }}
          GEPS_D: ${{ steps.fetch.outputs.geps_date }}
          GEPS_T: ${{ steps.fetch.outputs.geps_time }}
          GEFS_SKIP: ${{ steps.fetch.outputs.gefs_skip }}
          GEPS_SKIP: ${{ steps.fetch.outputs.geps_skip }}
        run: |
          products() {   # model date hour skip
            m=$1; d=$2; t=$3
            [ "$4" = "true" ] && { echo "::notice::$m $d ${t}Z is already on the page in every product; nothing to render"; return 0; }
            [ -n "$d" ] || { echo "::warning::no $m cycle fetched; its products keep their previous version"; return 0; }
            python scripts/strat/heatflux100_ext.py --model "$m" --days 15 --date "$d" --time "$t" --out-dir assets/sst \
              || echo "::warning::$m heat flux failed; keeping the previous figure"
            python scripts/strat/forecast_drip.py --model "$m" --days 15 --date "$d" --time "$t" --out-dir assets/sst \
              || echo "::warning::$m drip failed; keeping the previous figure"
            python scripts/strat/wave_maps.py --model "$m" --date "$d" --time "$t" --anim-dir assets/sst/anim \
              || echo "::warning::$m wave loops failed; keeping the previous frames"
            python scripts/strat/vortex_winds.py --model "$m" --date "$d" --time "$t" --anim-dir assets/sst/anim \
              --manifest "assets/sst/anim/vortex_winds_${m}_manifest.json" \
              || echo "::warning::$m vortex-wind loops failed; keeping the previous frames"
            python scripts/strat/polarcap.py --model "$m" --date "$d" --time "$t" \
              || echo "::warning::$m polar cap failed; keeping the previous figures"
            if [ "$m" = gefs ]; then  # GEPS publishes no vertical velocity
              python scripts/strat/polar_descent.py --model gefs --date "$d" --time "$t" \
                || echo "::warning::gefs descent failed; keeping the previous figures"
            fi
          }
          for m in $MODELS; do
            M=$(echo "$m" | tr a-z A-Z); dv=${M}_D tv=${M}_T sv=${M}_SKIP
            products "$m" "${!dv}" "${!tv}" "${!sv}" > "/tmp/${m}_products.log" 2>&1 &
          done
          wait
          for m in $MODELS; do
            grep -h "::warning::\|::notice::" "/tmp/${m}_products.log" || true
            echo "---- $m"; grep -v "^    " "/tmp/${m}_products.log" | tail -25
          done
      # Each model's run into its records, from the shared files and the JSON just written (nothing fetched; wave_maps.py
      # recorded the waves itself).
      - name: Run records, polar vortex, heat flux and dripping paint
        continue-on-error: true
        env:
          GEFS_D: ${{ steps.fetch.outputs.gefs_date }}
          GEFS_T: ${{ steps.fetch.outputs.gefs_time }}
          GEPS_D: ${{ steps.fetch.outputs.geps_date }}
          GEPS_T: ${{ steps.fetch.outputs.geps_time }}
          GEFS_SKIP: ${{ steps.fetch.outputs.gefs_skip }}
          GEPS_SKIP: ${{ steps.fetch.outputs.geps_skip }}
        run: |
          for m in $MODELS; do
            M=$(echo "$m" | tr a-z A-Z); dv=${M}_D tv=${M}_T sv=${M}_SKIP
            [ "${!sv}" = "true" ] || [ -z "${!dv}" ] && continue
            python scripts/strat/nh_vortex.py --record-only --members --models "$m" --cycle "${!dv}${!tv}" \
              || echo "::warning::$m vortex record failed"
            for p in heatflux drip; do
              python scripts/strat/run_record.py capture "$p" --model "$m" || echo "::warning::$m $p record failed"
            done
          done

      - name: What was produced
        if: always()
        env:
          GEFS_SKIP: ${{ steps.fetch.outputs.gefs_skip }}
          GEPS_SKIP: ${{ steps.fetch.outputs.geps_skip }}
        run: |
          bad=0
          for m in $MODELS; do
            sv=$(echo "$m" | tr a-z A-Z)_SKIP; [ "${!sv}" = "true" ] && { echo "  $m: this cycle is already on the page"; continue; }
            for f in assets/sst/${m}_heatflux100_nh.webp assets/sst/${m}_heatflux100_sh.webp assets/sst/${m}_drip.webp assets/sst/polarcap_${m}.webp assets/sst/telecon_${m}.webp assets/sst/vshape_${m}.webp; do
              if [ -f "$f" ] && [ "$f" -nt /tmp/t0 ]; then printf '  %-40s %s\n' "$f" "$(du -h "$f" | cut -f1)"
              else printf '  %-40s MISSING\n' "$f"; bad=$((bad + 1)); fi
            done
            for d in wave1_${m}_nh wave1_${m}_sh wave2_${m}_nh wave2_${m}_sh vortex_${m}_10_nh vortex_${m}_10_sh vortex_${m}_100_nh vortex_${m}_100_sh; do
              n=$(ls "assets/sst/anim/$d"/*.webp 2>/dev/null | wc -l | tr -d ' ')
              printf '  %-40s %s frames\n' "$d" "$n"; [ "$n" -eq 0 ] && bad=$((bad + 1))
            done
          done
          [ "$bad" -gt 0 ] && { echo "::error::$bad GEFS/GEPS product(s) produced nothing"; exit 1; } || true

      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/naens.list
          for m in $MODELS; do
            for p in assets/sst/${m}_heatflux100_nh.webp assets/sst/${m}_heatflux100_sh.webp assets/sst/data/${m}_heatflux100.json \
                     assets/sst/${m}_drip.webp assets/sst/${m}_drip_change.webp assets/sst/data/${m}_drip.json \
                     assets/sst/anim/wave1_${m}_nh assets/sst/anim/wave1_${m}_sh assets/sst/anim/wave2_${m}_nh assets/sst/anim/wave2_${m}_sh \
                     assets/sst/anim/wave1_maps_${m}_manifest.json assets/sst/anim/wave2_maps_${m}_manifest.json \
                     assets/sst/anim/vortex_${m}_10_nh assets/sst/anim/vortex_${m}_10_sh assets/sst/anim/vortex_${m}_100_nh \
                     assets/sst/anim/vortex_${m}_100_sh assets/sst/anim/vortex_winds_${m}_manifest.json \
                     assets/sst/polarcap_${m}.webp assets/sst/anim/polarcap_${m} assets/sst/anim/polarcap_${m}_manifest.json \
                     assets/sst/telecon_${m}.webp assets/sst/anim/z100_${m} assets/sst/anim/z100_${m}_manifest.json \
                     assets/sst/vshape_${m}.webp assets/sst/anim/t10_${m} assets/sst/anim/t10_${m}_manifest.json \
                     assets/sst/descent_${m}.webp assets/sst/vortex_members_${m}.webp \
                     assets/sst/data/runs/{vortex,heatflux,drip,waves,polarcap,telecon,vshape,descent}_${m}.json \
                     assets/sst/runs/{heatflux,drip,waves,polarcap,telecon,vshape,descent}_${m}.webp; do
              [ -e "$p" ] && [ "$p" -nt /tmp/t0 ] && echo "$p" >> /tmp/naens.list
            done
          done
          if [ ! -s /tmp/naens.list ]; then : > /tmp/strat-ifs-naens.tgz; exit 0; fi
          tar -czf /tmp/strat-ifs-naens.tgz -T /tmp/naens.list
          echo "  packed $(tar -tzf /tmp/strat-ifs-naens.tgz | grep -c '\.webp$') webp"

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-ifs-naens
          path: /tmp/strat-ifs-naens.tgz
          if-no-files-found: warn
          retention-days: 7


  # ------------------------------------------------------------------ zmu ---
  # u at 10/50/250 and v at 250 hPa for 50 members, ~130 MB a step: streamed step by step (3 at a time), reduced to
  # the per-member zonal-mean u in memory; the 250 hPa jet sector is left in /tmp/pacjet_ifs. Starts when IFS-ENS is
  # complete on the mirror (~2 min of streaming then; the winds job is the last to finish anyway).
  zmu:
    needs: cycle
    if: needs.cycle.outputs.ready == 'true' && !inputs.only && needs.cycle.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MPLBACKEND: Agg
      EPFLUX_IFS_WORKERS: "3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: IFS-ENS complete on the Google mirror
        run: |
          python scripts/strat/ifs_ens.py wait --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            --wait-min 100

      # PACJET_IFS_DIR: the stream also leaves the 250 hPa u/v sector of every member for the North Pacific jet below.
      - name: Zonal-mean u and the 250 hPa jet sector (IFS-ENS, streamed)
        env:
          PACJET_IFS_DIR: /tmp/pacjet_ifs
        run: |
          start=$(date +%s)
          python scripts/strat/qbo_duct.py --model ifs \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            || echo "::warning::IFS-ENS zonal-mean u stream failed"
          echo "  wall time $(( $(date +%s) - start )) s"

      # QBO zero-wind line: qbo_duct's streamed IFS-ENS fields leave the per-member zonal-mean u at 50/10 hPa in
      # data/zmu_members_ifs.npz (no extra download); the AIFS-ENS half is read from main (strat.yml wrote it).
      - name: QBO zero-wind line
        run: |
          scripts/lib/fetch_frames_ci.sh assets/sst/anim/bdc_tail || true
          python scripts/strat/qbo_zeroline.py forecast --model ifs \
            || echo "::warning::zero-line IFS-ENS forecast failed; the figure keeps the analysis"
          python scripts/strat/qbo_zeroline.py render \
            || echo "::warning::zero-line render failed; keeping the previous figures"

      - name: North Pacific jet (IFS-ENS)
        run: |
          python scripts/mjo/src/pacjet.py --model ifs --ifs-dir /tmp/pacjet_ifs \
            --date "${{ needs.cycle.outputs.date }}" --time "${{ needs.cycle.outputs.time }}" \
            || echo "::warning::North Pacific jet (IFS-ENS) failed; keeping the previous figures"

      - name: What was produced
        if: always()
        run: |
          bad=0
          for f in scripts/strat/data/zmu_members_ifs.npz assets/sst/data/qbo_zeroline_ifs.json assets/sst/data/pacjet_ifs.json; do
            if [ -f "$f" ]; then printf '  %-40s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else printf '  %-40s MISSING\n' "$f"; bad=$((bad + 1)); fi
          done
          [ "$bad" -gt 0 ] && { echo "::error::$bad IFS zero-line/jet output(s) missing"; exit 1; } || true

      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/ep.list
          for p in assets/sst/anim/pacjet_ifs assets/sst/anim/pacjet_ifs_manifest.json \
                   assets/sst/pacjet_ifs_wk1.webp assets/sst/pacjet_ifs_wk2.webp assets/sst/pacjet_ifs_axis.webp \
                   assets/sst/pacjet_ifs_phase.webp assets/sst/data/pacjet_ifs.json \
                   assets/sst/qbo_zeroline_70.webp assets/sst/qbo_zeroline_50.webp assets/sst/qbo_zeroline_30.webp \
                   assets/sst/qbo_zeroline_10.webp assets/sst/data/qbo_zeroline.json assets/sst/data/qbo_zeroline_ifs.json; do
            [ -e "$p" ] && echo "$p" >> /tmp/ep.list
          done
          if [ ! -s /tmp/ep.list ]; then : > /tmp/strat-ifs-zmu.tgz; exit 0; fi
          tar -czf /tmp/strat-ifs-zmu.tgz -T /tmp/ep.list

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-ifs-zmu
          path: /tmp/strat-ifs-zmu.tgz
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------- imprint ---
  # The downward propagation monitor (ssw_imprint.py): every model's members' sea-level pressure, daily to day 15,
  # projected on the CMIP6 post-SSW pattern, beside the drips the heights and naens jobs just rendered (their day-15
  # 100 hPa cap drives the outlook) and the winds job's heat flux. IFS-ENS ~0.35 GB and AIFS-ENS ~0.4 GB (the 90-20N
  # rows of each message) from the Google Cloud mirror, GEFS ~0.2 GB byte-ranged from S3, GEPS ~50 MB from the
  # Datamart. Each model on the cycle its drip is on, 00/12Z only (the index is on 00/12Z instants: a 06/18Z GEFS run
  # leaves GEFS's 00/12Z one in the monitor); a GEFS/GEPS cycle main already shows is not fetched again. ~10 min.
  imprint:
    needs: [cycle, winds, heights, naens]
    # nothing to do when no model has a new cycle (a late backstop after the dispatcher slot and the GEPS fast lane)
    if: >-
      ${{ always() && needs.cycle.result == 'success' && (needs.cycle.outputs.fresh == 'true'
      || needs.naens.outputs.gefs_skip != 'true' || needs.naens.outputs.geps_skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
      D: ${{ needs.cycle.outputs.date }}
      T: ${{ needs.cycle.outputs.time }}
      READY: ${{ needs.cycle.outputs.ready }}
      FRESH: ${{ needs.cycle.outputs.fresh }}
      ONLY: ${{ inputs.only }}
      MODELS: ${{ inputs.only || 'gefs geps' }}
      GEFS_D: ${{ needs.naens.outputs.gefs_date }}
      GEFS_T: ${{ needs.naens.outputs.gefs_time }}
      GEFS_SKIP: ${{ needs.naens.outputs.gefs_skip }}
      GEPS_D: ${{ needs.naens.outputs.geps_date }}
      GEPS_T: ${{ needs.naens.outputs.geps_time }}
      GEPS_SKIP: ${{ needs.naens.outputs.geps_skip }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Collect the drips just rendered
        uses: actions/download-artifact@v7
        with:
          pattern: strat-ifs-*
          merge-multiple: true
          path: /tmp/art

      # The record files accumulate, so they are read from main as it is now (a queued run checks out an older commit);
      # the drips this run rendered are laid over main's.
      - name: The records as main has them, and this run's drips
        run: |
          touch /tmp/t0
          git fetch -q --depth 1 origin main
          for f in assets/sst/data/ssw_imprint.json assets/sst/data/ssw_imprint_history.json assets/sst/data/ssw_imprint_runs.json \
                   assets/sst/data/{aifs,ifs,hres,gefs,geps}_drip.json assets/sst/data/{,ifs_,gefs_,geps_}heatflux100.json \
                   assets/sst/data/heatflux100_history.json assets/sst/data/upperstrat.json assets/sst/data/refractive_gefs.json; do
            git checkout origin/main -- "$f" 2>/dev/null || echo "  $f: not on main yet"
          done
          shopt -s nullglob
          for t in /tmp/art/*.tgz; do
            [ -s "$t" ] && tar -xzf "$t" -C . --wildcards 'assets/sst/data/*_drip.json' 'assets/sst/data/*heatflux100.json' \
              2>/dev/null || true
          done
          ls -la assets/sst/data/*_drip.json

      - name: SSW imprint index and the downward propagation monitor
        timeout-minutes: 30
        continue-on-error: true
        run: |
          if [ -z "$ONLY" ] && [ "$FRESH" = "true" ]; then
            m=aifs,hres; [ "$READY" = "true" ] && m=aifs,ifs,hres
            python scripts/strat/ssw_imprint.py run --models "$m" --date "$D" --time "$T" --no-render \
              || echo "::warning::the ECMWF imprint indices failed; keeping their previous runs"
          fi
          for x in $MODELS; do
            X=$(echo "$x" | tr a-z A-Z); dv=${X}_D tv=${X}_T sv=${X}_SKIP
            if [ -z "${!dv}" ]; then echo "  $x: no cycle"; continue; fi
            case "${!tv}" in 06|18) echo "  $x: ${!dv} ${!tv}Z not in the monitor (00/12Z instants only)"; continue ;; esac
            # a cycle the drips already showed may still be missing here (the monitor's first run, a failed one)
            if [ "${!sv}" = "true" ] && python scripts/strat/ssw_imprint.py has --model "$x" --date "${!dv}" --time "${!tv}"; then
              echo "  $x: ${!dv} ${!tv}Z already in the monitor"; continue
            fi
            python scripts/strat/ssw_imprint.py run --models "$x" --date "${!dv}" --time "${!tv}" --no-render \
              || echo "::warning::$x imprint index failed; keeping its previous run"
          done
          python scripts/strat/ssw_imprint.py render || echo "::warning::the monitor did not render; keeping the previous figure"
          python scripts/strat/reflection_index.py || echo "::warning::the reflection index did not render; keeping the previous figure"

      - name: Pack the outputs
        if: always()
        run: |
          set -euo pipefail
          : > /tmp/imprint.list
          for p in assets/sst/ssw_imprint.webp assets/sst/data/ssw_imprint.json assets/sst/data/ssw_imprint_history.json \
                   assets/sst/data/ssw_imprint_runs.json assets/sst/reflection_index.webp; do
            [ -e "$p" ] && [ "$p" -nt /tmp/t0 ] && echo "$p" >> /tmp/imprint.list
          done
          if [ ! -s /tmp/imprint.list ]; then : > /tmp/strat-ifs-imprint.tgz; exit 0; fi
          tar -czf /tmp/strat-ifs-imprint.tgz -T /tmp/imprint.list
          cat /tmp/imprint.list

      - name: Hand off to publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strat-ifs-imprint
          path: /tmp/strat-ifs-imprint.tgz
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------- publish ---
  publish:
    needs: [cycle, winds, heights, naens, zmu, imprint]
    if: >-
      ${{ always() && needs.imprint.result != 'skipped'
      && (github.event_name == 'schedule' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write   # the site deploy (pages.yml) right after the commit
    steps:
      - uses: actions/checkout@v7

      - name: Collect the render jobs' output
        uses: actions/download-artifact@v7
        with:
          pattern: strat-ifs-*
          merge-multiple: true
          path: /tmp/art

      - name: Unpack into the workspace
        run: |
          set -euo pipefail
          shopt -s nullglob
          for t in /tmp/art/*.tgz; do
            [ -s "$t" ] || { echo "  $(basename "$t"): empty, skipped"; continue; }
            tar -xzf "$t" -C .
            echo "  $(basename "$t"): $(tar -tzf "$t" | grep -c '\.webp$' || true) webp restored"
          done

      # Frames to the frame store / frames branch (lease-guarded; only the directories that rendered are swapped).
      # PRUNE: the two-hemisphere vortex-wind loops and the GEFS descent maps (idempotent; also in retired_frames.txt).
      - name: Publish loop frames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRUNE: assets/sst/anim/vortex_ifs_10 assets/sst/anim/vortex_ifs_100 assets/sst/anim/descent_gefs
        run: |
          dirs=""
          for m in ifs hres gefs geps; do
            dirs="$dirs assets/sst/anim/wave1_${m}_nh assets/sst/anim/wave1_${m}_sh assets/sst/anim/wave2_${m}_nh assets/sst/anim/wave2_${m}_sh"
            dirs="$dirs assets/sst/anim/vortex_${m}_10_nh assets/sst/anim/vortex_${m}_10_sh assets/sst/anim/vortex_${m}_100_nh assets/sst/anim/vortex_${m}_100_sh"
          done
          dirs="$dirs assets/sst/anim/polarcap_ifs assets/sst/anim/polarcap_gefs assets/sst/anim/polarcap_geps"
          for m in ifs hres gefs geps; do dirs="$dirs assets/sst/anim/z100_${m}"; done
          for m in ifs gefs geps; do dirs="$dirs assets/sst/anim/t10_${m}"; done
          for m in ifs hres; do dirs="$dirs assets/sst/anim/descent_${m}"; done
          scripts/lib/publish_frames_ci.sh $dirs assets/sst/anim/pacjet_ifs

      # Stills, data and manifests to main. Never rebase: snapshot, reset to a fresh
      # origin/main each attempt, lay the snapshot back on, commit, push.
      - name: Commit & push
        id: commit
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          for f in assets/sst/data/runs/*.json assets/sst/runs/*.webp \
                   assets/sst/ifs_heatflux100_nh.webp assets/sst/ifs_heatflux100_sh.webp assets/sst/data/ifs_heatflux100.json \
                   assets/sst/ifs_drip.webp assets/sst/ifs_drip_change.webp assets/sst/data/ifs_drip.json assets/sst/hres_drip.webp assets/sst/hres_drip_change.webp assets/sst/data/hres_drip.json \
                   assets/sst/anim/wave1_maps_ifs_manifest.json assets/sst/anim/wave2_maps_ifs_manifest.json assets/sst/anim/vortex_winds_ifs_manifest.json \
                   assets/sst/anim/wave1_maps_hres_manifest.json assets/sst/anim/wave2_maps_hres_manifest.json assets/sst/anim/vortex_winds_hres_manifest.json \
                   assets/sst/gefs_heatflux100_*.webp assets/sst/geps_heatflux100_*.webp assets/sst/data/gefs_heatflux100.json assets/sst/data/geps_heatflux100.json \
                   assets/sst/gefs_drip.webp assets/sst/geps_drip.webp assets/sst/gefs_drip_change.webp assets/sst/geps_drip_change.webp assets/sst/data/gefs_drip.json assets/sst/data/geps_drip.json \
                   assets/sst/anim/wave1_maps_gefs_manifest.json assets/sst/anim/wave2_maps_gefs_manifest.json assets/sst/anim/vortex_winds_gefs_manifest.json \
                   assets/sst/anim/wave1_maps_geps_manifest.json assets/sst/anim/wave2_maps_geps_manifest.json assets/sst/anim/vortex_winds_geps_manifest.json \
                   assets/sst/anim/pacjet_ifs_manifest.json assets/sst/pacjet_ifs_*.webp assets/sst/data/pacjet_ifs.json \
                   assets/sst/polarcap_ifs.webp assets/sst/polarcap_gefs.webp assets/sst/polarcap_geps.webp \
                   assets/sst/anim/polarcap_ifs_manifest.json assets/sst/anim/polarcap_gefs_manifest.json \
                   assets/sst/anim/polarcap_geps_manifest.json \
                   assets/sst/telecon_ifs.webp assets/sst/telecon_gefs.webp assets/sst/telecon_geps.webp \
                   assets/sst/anim/z100_ifs_manifest.json assets/sst/anim/z100_hres_manifest.json \
                   assets/sst/anim/z100_gefs_manifest.json assets/sst/anim/z100_geps_manifest.json \
                   assets/sst/vshape_ifs.webp assets/sst/vshape_gefs.webp assets/sst/vshape_geps.webp \
                   assets/sst/anim/t10_ifs_manifest.json assets/sst/anim/t10_gefs_manifest.json \
                   assets/sst/anim/t10_geps_manifest.json \
                   assets/sst/descent_ifs.webp assets/sst/descent_sectors_ifs.webp assets/sst/descent_gefs.webp \
                   assets/sst/anim/descent_{ifs,hres}_manifest.json assets/sst/vortex_members_{ifs,gefs,geps}.webp \
                   assets/regimes/data/regimes_members_ifs.json assets/regimes/data/regimes_drift_ifs.json \
                   assets/sst/qbo_zeroline_*.webp assets/sst/data/qbo_zeroline.json assets/sst/data/qbo_zeroline_ifs.json \
                   assets/sst/ssw_imprint.webp assets/sst/data/ssw_imprint.json assets/sst/data/ssw_imprint_history.json \
                   assets/sst/data/ssw_imprint_runs.json assets/sst/reflection_index.webp; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          FILES=$(git diff --staged --name-only)
          git reset -q
          MSG="data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            for f in $FILES; do git add "$f"; done
            if git diff --staged --quiet; then echo "no changes after resync"; exit 0; fi
            git commit -q -m "$MSG"
            if timeout 180 git push origin HEAD:main; then
              echo "pushed (attempt $i)"; echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1

      # The site deploys this commit now rather than at the next batched deploy (the exception pages.yml notes): a
      # commit pushed with GITHUB_TOKEN does not trigger pages.yml, a dispatch does, and its concurrency group queues
      # it behind a deploy in progress.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::pages.yml dispatch failed; the batched deploy will publish this commit"
