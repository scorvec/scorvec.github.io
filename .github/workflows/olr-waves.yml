name: OLR wave decomposition (Wheeler-Kiladis)

# Real-time Wheeler-Kiladis decomposition of equatorial OLR (MJO / Kelvin / ER / low-freq).
# Daily: append the latest GMGSI day to the rolling store, then re-filter + render. The
# committed climatology (metar/olr_clim.nc, from NOAA interp-OLR 1979-2022) and rolling store
# (metar/olr_rt.nc) travel with the repo, so CI never needs the 19 MB historical backbone.
on:
  schedule:
  - cron: '40 2 * * *'    # daily, after the prior day's GMGSI is complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olr-waves
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas xarray netcdf4 scipy matplotlib
      - run: python scripts/sst/build_olr_realtime.py
      - run: python scripts/sst/olr_waves.py --realtime --out assets/sst/olr_waves.webp
      - run: python scripts/sst/wave_trackers.py --out assets/sst/wave_tracker.webp
      # Wheeler-Kiladis spectrum for tropical-waves.html: ERA5 (ARCO) to ~6 days back, the previous day's 00Z IFS-ENS
      # (today's is not on the Google mirror at this hour) and the GMGSI store above. The 1991-2020 background
      # (reference/wk_clim.nc) is built on the laptop once: `wk_spectrum.py build`.
      - name: Wheeler-Kiladis spectrum
        env:
          ECMWF_SOURCES: google
        working-directory: scripts/mjo/src
        run: |
          pip install --quiet zarr gcsfs eccodes requests
          python wk_spectrum.py now --date "$(date -u -d yesterday +%Y%m%d)" --out ../../../assets/sst/wk_now.webp \
            || echo "::warning::Wheeler-Kiladis spectrum failed; continuing"
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          git add assets/sst/olr_waves.webp assets/sst/wave_tracker.webp scripts/sst/metar/olr_rt.nc
          git add assets/sst/wk_now.webp assets/sst/wk_gmgsi.webp assets/sst/wk_clim.webp assets/sst/data/wk_spectrum.json \
            scripts/mjo/data/reference/wk_olr_recent.nc 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
