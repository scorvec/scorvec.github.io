name: OLR wave decomposition (Wheeler-Kiladis)

# Real-time Wheeler-Kiladis decomposition of equatorial OLR (MJO / Kelvin / ER / low-freq).
# Daily: append the latest GMGSI day to the rolling store, then re-filter + render. The
# committed climatology (metar/olr_clim.nc, from NOAA interp-OLR 1979-2022) and rolling store
# (metar/olr_rt.nc) travel with the repo, so CI never needs the 19 MB historical backbone.
on:
  schedule:
  - cron: '40 2 * * *'    # daily, after the prior day's GMGSI is complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olr-waves
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas xarray netcdf4 scipy matplotlib
      - run: python scripts/sst/build_olr_realtime.py
      - run: python scripts/sst/olr_waves.py --realtime --out assets/sst/olr_waves.webp
      - run: python scripts/sst/wave_trackers.py --out assets/sst/wave_tracker.webp
      # Wheeler-Kiladis spectrum for tropical-waves.html: last 96 days of observed OLR (NASA CERES FLASHFlux, NOAA-20,
      # ~4 days behind; Earthdata login) divided by a background from the whole CERES record (committed
      # scripts/mjo/data/reference/wk_bg_ceres.nc), only bins significant at BH FDR 10 % shaded.
      # The 15S-15N daily OLR ARCHIVE lives on the frames branch (assets/sst/anim/wk_olr, monthly npz, ~1 MB each) and
      # grows every run; it is what the background is rebuilt from (wk_spectrum.py --build-bg, laptop). The publish
      # swaps the directory in WHOLESALE, so a run that could not seed it backfills the whole record first and never
      # publishes a short archive over a long one.
      - name: Seed the OLR archive from the frames branch
        run: scripts/lib/fetch_frames_ci.sh assets/sst/anim/wk_olr || true
      - name: Wheeler-Kiladis spectrum
        id: wk
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          WK_ARCHIVE: ${{ github.workspace }}/assets/sst/anim/wk_olr
          WK_CACHE: /home/runner/wk_flashflux
        working-directory: scripts/mjo/src
        run: |
          pip install --quiet earthaccess
          n=$(python -c "import wk_spectrum as w; print(len(w.archive_read()[0]))" 2>/dev/null || echo 0)
          echo "archive days before: $n"
          if [ "$n" -lt 900 ]; then
            echo "::warning::OLR archive short ($n days); backfilling from 2023-12-01"
            python wk_spectrum.py --backfill 2023-12-01 || { echo "::warning::backfill failed; archive not published"; exit 0; }
          fi
          python wk_spectrum.py --out ../../../assets/sst/wk_spectrum.webp || echo "::warning::Wheeler-Kiladis spectrum failed; continuing"
          m=$(python -c "import wk_spectrum as w; print(len(w.archive_read()[0]))" 2>/dev/null || echo 0)
          echo "archive days after: $m"
          if [ "$m" -ge 900 ] && [ "$m" -ge "$n" ]; then echo "publish=1" >> "$GITHUB_OUTPUT"; fi
      - name: Publish the OLR archive
        if: steps.wk.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/wk_olr || echo "::warning::OLR archive publish failed"
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          git add assets/sst/olr_waves.webp assets/sst/wave_tracker.webp scripts/sst/metar/olr_rt.nc
          git add assets/sst/wk_spectrum.webp assets/sst/data/wk_spectrum.json 2>/dev/null || true
          # earlier versions (2026-10-03): the normalised first one, then raw power; replaced by wk_spectrum.webp
          git rm -q --ignore-unmatch assets/sst/wk_raw.webp assets/sst/wk_now.webp assets/sst/wk_gmgsi.webp assets/sst/wk_clim.webp
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
