name: Verification figures

# Redraws verification.html's figures from the verification database without matching any run: the windows' scores
# and rain maps (mverify_scores.windows), the ensembles' windows (ens_verify.py windows), the 500 hPa anomaly
# correlations and scripts/verify/verify_figs.py, published and committed as the nightly (verification.yml) does. Half
# an hour where the nightly takes hours, for a change to the figures; the nightly keeps doing it all every day. The
# station series are the nightly's alone. Dispatch only; one at a time with the nightly.
on:
  workflow_dispatch:

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt

permissions:
  contents: write

concurrency:
  group: verification
  cancel-in-progress: false

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install mverify
        # the nightly's pin (verification.yml)
        run: pip install --quiet "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@783fd7fbf55047a59566b575d15c7e319d18567d"
      - name: The database's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$RUNNER_TEMP/derived"
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          for k in stats ens-stats ens-rel acc; do scripts/verify/verifydb.sh fetch "$k" all "$D"; done
          scripts/verify/verifydb.sh fetch stn 90 "$D"
          scripts/verify/verifydb.sh fetch rain 365 "$D"
          names=$(python scripts/verify/z500_acc.py recent --have "$RUNNER_TEMP/have.txt")
          # shellcheck disable=SC2086  # the file names are meant to split
          [ -z "$names" ] || scripts/verify/verifydb.sh get "$D" $names
          gh release download verify-clim-z500-v1 -D "$RUNNER_TEMP" -p clim_z500_1p5.npz
      - name: The windows' scores and rain maps
        run: |
          python - "$RUNNER_TEMP/derived" <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/verify")
          import mverify_scores
          mverify_scores.windows(Path(sys.argv[1]))
          EOF
          python scripts/verify/ens_verify.py windows --derived "$RUNNER_TEMP/derived"
      - name: Figures
        run: |
          pip install --quiet matplotlib==3.10.9 cartopy==0.25.0
          python scripts/verify/verify_figs.py --derived "$RUNNER_TEMP/derived" --clim "$RUNNER_TEMP/clim_z500_1p5.npz" \
            --out assets/verification/fig
      - name: Publish the figures
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMES_BRANCH: "off"   # the frames store only, as the nightly
          FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
          FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
          FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
          FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
          FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
        run: scripts/lib/publish_frames_ci.sh assets/verification/fig
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PATHS="assets/verification/precip_maps.json assets/verification/figs.json"
          PATHS="$PATHS $(echo assets/verification/scores_{30,90,365,all}.json assets/verification/stations_{30,90}.json)"
          PATHS="$PATHS $(echo assets/verification/ens_scores_{30,90,365,all}.json)"
          for i in 1 2 3 4 5; do
            timeout 120 git fetch origin main || { sleep 5; continue; }
            git reset -q FETCH_HEAD
            git add $(ls $PATHS 2>/dev/null)   # a window's files once the database holds that many runs
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data update: verification figures $(date -u +%Y-%m-%d)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            git reset -q --soft HEAD^   # undo the commit; refetch and rebuild it
            sleep 5
          done
          echo "push failed after retries"; exit 1
