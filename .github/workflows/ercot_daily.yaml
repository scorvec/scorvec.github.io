name: Daily ERCOT Plot

on:
  schedule:
    - cron: '0 15 * * *'   # 9am CT (UTC-6) every day
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  generate-plot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate ERCOT plot
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/ercot_plot.py

      - name: Commit and push plot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ercot_load_temp.png
          git diff --staged --quiet || git commit -m "chore: update ERCOT load vs temperature plot [skip ci]"
          git push
