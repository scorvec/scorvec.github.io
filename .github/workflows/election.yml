name: Election forecast (daily)

# Refreshes the 2026 midterm forecast at scorvec.com/election-2026/:
# fetches polls (VoteHub), market prices (Kalshi + Polymarket), Bluesky
# signal, and the Silver Bulletin CSV; reruns the Monte Carlo model; rebuilds
# the page; and refreshes the YouGov undecideds crosstab summary. Snapshots
# accumulate under data/election2026/raw/ for backtesting. Safe to delete —
# the page just stops updating.

on:
  schedule:
    - cron: '23 13 * * *'   # 13:23 UTC daily, clear of the other crons' minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: election-forecast
  cancel-in-progress: false   # runs are cheap; let a manual run finish

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/election2026
            data/election2026
            election-2026

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/election2026/run_forecast.py

      - run: pip install --quiet requests numpy pandas openpyxl

      - name: Fetch data and run forecast
        run: python scripts/election2026/run_forecast.py

      - name: Refresh YouGov undecideds crosstabs (weekly tracker; non-fatal)
        run: |
          curl -sf -A "Mozilla/5.0" --max-time 60 \
            "https://api-test.yougov.com/public-data/v5/us/trackers/congressional-ballot-voting-intention/download/" \
            -o /tmp/yougov_tracker.xlsx \
            && python scripts/election2026/crosstabs_analysis.py /tmp/yougov_tracker.xlsx \
            || echo "YouGov tracker unavailable; keeping last summary."

      - name: Rebuild dashboard
        run: python scripts/election2026/build_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAMP=$(date -u +%F)
          git add data/election2026 election-2026
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."; exit 0
          fi
          git commit -m "Election forecast update: ${STAMP}"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; rebasing onto origin/main…"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              git add data/election2026 election-2026
              git diff --staged --quiet || git commit -m "Election forecast update: ${STAMP} (re-applied)"
            fi
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Election forecast $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page: [/election-2026/](https://scorvec.com/election-2026/)" >> "$GITHUB_STEP_SUMMARY"
