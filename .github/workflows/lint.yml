name: Lint (ruff)

# ruff check + format check over the pipeline scripts (config: ruff.toml). Data commits from the other workflows
# touch no .py files, so the path filter keeps this off them.
on:
  push:
    paths: ['**.py', 'ruff.toml', '.github/workflows/lint.yml']
  pull_request:
    paths: ['**.py', 'ruff.toml', '.github/workflows/lint.yml']

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install ruff==0.17.1
      - run: ruff check --output-format=github .
      - run: ruff format --check .
