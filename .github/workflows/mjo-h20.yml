name: MJO RMM — 20Z

# One of 2 schedule-only callers for mjo.yml. Each asks GitHub for a
# SINGLE firing per day - the frequency band measured as honoured far more often
# than one workflow asking for several. All the work lives in the reusable
# workflow; this file is only the schedule.
on:
  schedule:
  - cron: '37 20 * * *'
  workflow_dispatch:

# mjo.yml requests actions:write (it re-opens its own slot on failure). A
# reusable workflow cannot hold MORE permission than its caller, so a caller
# granting only contents:write is rejected at startup - which is exactly how
# the 20Z slot died on 2026-09-01, before any step ran.
permissions:
  contents: write
  actions: write

jobs:
  run:
    uses: ./.github/workflows/mjo.yml
    secrets: inherit
