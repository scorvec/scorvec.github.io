name: NOAA SFS seasonal outlook (monthly)

# sfs.html: the NOAA SFS beta (UFS coupled, 31 members, 12 monthly leads) outlook.
#
# WHY THIS EXISTS. SFS was the last product still rendered by hand on the laptop and pushed
# with ALLOW_LOCAL_ASSET_PUSH, because nobody had written it a workflow. Nothing about it
# needs the laptop: the source is NOAA's public SFS beta zarr on S3, read anonymously, with
# no credentials at all (unlike SEAS5, whose CDS key deliberately stays on the laptop). So it
# runs here like every other product.
#
# WHAT IT BUILDS, AND IN WHICH ORDER. sfs_maps must run before sfs_indices: indices reads the
# SST field climatology that maps caches. The day-16-46 products (MJO, 100 hPa polar view,
# subseasonal loops) were REMOVED 2026-09-19 (user: "that data is completely broken"): they read
# atm_daily/ocn_daily, which NOAA had not published for the September 2026 issue ten days after the
# monthly stores. Their scripts stay in scripts/sfs/ in case the feed is fixed.
#
# THE CLIMATOLOGY. Each month needs its own 30-year x 11-member hindcast pool
# (scripts/sfs/data/clim_*_{MM}.npy, ~10 MB per field, ~20 min to build). It is cached by
# month so a re-run in the same month is quick, and it is never committed.

on:
  schedule:
  - cron: '40 14 17 * *'    # the monthly stores land mid-month (Aug 2026 issue: the 16th)
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue month YYYYMM (empty = current UTC month)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sfs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve the issue month
        id: iss
        run: |
          I="${{ inputs.issue }}"
          [ -n "$I" ] || I=$(date -u +%Y%m)
          echo "issue=$I" >> "$GITHUB_OUTPUT"
          echo "month=${I:4:2}" >> "$GITHUB_OUTPUT"
          echo "Issue $I"

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgeos-dev libproj-dev proj-bin
          # dask is NOT optional: without it xarray.open_zarr loads eagerly, so each 4.8 GB
          # reforecast variable is materialised whole and the climatology step is OOM-killed
          # (exit 143 on z500, the fourth field, 2026-09-10). With dask it streams 11 MB chunks.
          # The full transitive import closure of scripts/sfs, computed with ast rather than
          # discovered one failed run at a time: the chi200 loop reaches wind200_vpot (pyshtools)
          # which reaches the shared ECMWF store (ecmwf-opendata, multiurl, cfgrib/eccodes).
          # dask is NOT optional: without it xarray.open_zarr loads eagerly and the 4.8 GB
          # reforecast variables OOM-kill the climatology step.
          pip install --quiet numpy pandas xarray 'dask[array]' zarr s3fs fsspec \
            matplotlib==3.10.9 cartopy==0.25.0 pyshtools ecmwf-opendata multiurl requests cfgrib eccodes \
            netCDF4 h5netcdf scipy
          # netCDF4/h5netcdf are xarray BACKEND PLUGINS: nothing imports them by name, so an
          # import-closure scan cannot see them, and xr.open_dataset on a .nc dies with
          # "found the following matches ... in xarray's IO backends". The chi200 daily loop
          # reads a committed netCDF climatology, so they are required.

      # The hindcast pool is per calendar month and costs ~20 min to build; keep it between runs.
      - name: Cache the SFS hindcast climatology
        uses: actions/cache@v6
        with:
          path: scripts/sfs/data
          key: sfs-clim-${{ steps.iss.outputs.month }}-v1

      # publish_frames_ci.sh swaps the directories you hand it in WHOLESALE. A run that renders
      # only the monthly loops must therefore start from the branch's existing frames, or it
      # deletes every loop it did not rebuild — which is exactly what the first run did to the
      # five day-16-46 loops on 2026-09-10.
      # Two seeds. The frames, because publish_frames_ci.sh swaps directories in wholesale.
      # And scripts/sfs/data, which carries the ERA5 1991-2020 daily climatology sfs_daily.py
      # needs: it derives that from ~/era5_store, a 103 GB local-only store, and caches it as
      # a 31 MB npz — seeding the cache is what lets the subseasonal loops run off-laptop.
      - name: Seed the SFS frames and the ERA5 climatology cache from the frames branch
        run: scripts/lib/fetch_frames_ci.sh assets/sfs/anim scripts/sfs/data || true

      - name: Which stores has NOAA published for this issue?
        id: stores
        run: |
          ROOT="https://noaa-oar-sfsdev-pds.s3.amazonaws.com/experiments/beta1/forecast"
          B="$ROOT/${{ steps.iss.outputs.issue }}"
          # NB: a bare `[ x = y ] && echo ...` as the last statement returns 1 when the test is
          # false, and the step dies under `bash -e`. Use an if, not a short-circuit.
          for s in atm_monthly ocn_monthly; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$B/$s.zarr/.zmetadata")
            echo "  $s -> $c"
          done

      # ── monthly products: available as soon as the monthly stores land ──
      - name: Monthly anomaly maps (caches the field climatology indices needs)
        run: python scripts/sfs/sfs_maps.py --issue "${{ steps.iss.outputs.issue }}"

      - name: Derived climate indices
        run: python scripts/sfs/sfs_indices.py --issue "${{ steps.iss.outputs.issue }}"

      - name: Niño-3.4 plume
        run: python scripts/sfs/sfs_nino.py --issue "${{ steps.iss.outputs.issue }}"

      - name: Publish the loop frames to the frames branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the day-16-46 products were removed from the page (2026-09-19): their loop dirs came back
          # with the seed step, so drop them before the directory is swapped in wholesale
          rm -rf assets/sfs/anim/sfs_t2md assets/sfs/anim/sfs_z500d assets/sfs/anim/sfs_chid assets/sfs/anim/sfs_prcpd assets/sfs/anim/sfs_z100d
          scripts/lib/publish_frames_ci.sh assets/sfs/anim

      - name: Commit & push (generated outputs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt, the mjo.yml pattern: a rebase recovery that
          # reset --hard could silently discard the render and still report success.
          SNAP=$(mktemp -d)
          git add -A assets/sfs 2>/dev/null || true
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            git add -A assets/sfs
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "data update: SFS ${{ steps.iss.outputs.issue }}"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      - name: Deploy the site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || echo "pages dispatch failed; the dispatcher will catch it"

      - name: Summary
        if: always()
        run: |
          echo "### NOAA SFS ${{ steps.iss.outputs.issue }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page: [/sfs.html](https://scorvec.com/sfs.html)" >> "$GITHUB_STEP_SUMMARY"
