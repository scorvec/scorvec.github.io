name: Columbia basin precipitation

# The Columbia River basin page (columbia/): every model's precipitation on
# the NWRFC water-supply divisions, % of normal, and Stage IV observed.
# Precipitation only, PNW box only, byte-ranged from the AWS/Google mirrors
# (never NOMADS, which rate-limits by request count), so a run is a few
# hundred MB and a few minutes. The archive is ~2 kB per model cycle and lives
# in columbia/data/archive; a partial cycle is never archived.
#
# Scheduling follows what this repo learned the hard way: GitHub honours a
# fraction of cron firings, hours late, and one-firing-per-day workflows are
# honoured far more often than one workflow asking for several. So this file
# holds the WORK (workflow_call + manual dispatch) and four schedule-only
# callers each ask for a single firing: columbia-h06/h09 for the 00Z runs,
# columbia-h18/h21 for the 12Z runs. Every run also backfills the last three
# days from the mirrors and skips what is already archived, so a slot that
# never fires costs nothing but latency: the next one fills the gap.
on:
  workflow_call:
    inputs:
      models:
        description: 'comma list (empty = every model)'
        type: string
        default: ''
      backfill_days:
        description: 'archive every 00Z/12Z cycle of the last N days that is missing'
        type: string
        default: '3'
      obs_days:
        description: 'Stage IV days to backfill'
        type: string
        default: '20'
      obs_extend:
        description: 'oldest missing Stage IV days to add per run (the slow tail to 2002)'
        type: string
        default: '15'
  workflow_dispatch:
    inputs:
      models:
        description: 'comma list (default gfs,ecmwf,aifs,gdps,geps,geps_ext,gefs,ecmwf_ens)'
        default: ''
      backfill_days:
        description: 'also archive every cycle of the last N days (mirrors keep GFS/GEFS/ECMWF; Datamart ~10 days)'
        default: '3'
      obs_days:
        description: 'Stage IV days to backfill'
        default: '20'
      obs_extend:
        description: 'oldest missing Stage IV days to add per run (the slow tail to 2002)'
        default: '15'

# actions:write for the pages dispatch below; a schedule-only caller must
# grant the same or the reusable workflow is rejected at startup.
permissions:
  contents: write
  actions: write

concurrency:
  group: columbia
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            .cache/columbia
          key: columbia-${{ runner.os }}-v1
      - name: Install eccodes
        run: |
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 && \
               sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                 libeccodes0 libeccodes-data; then exit 0; fi
            echo "apt attempt $i failed; retrying"; sleep 10
          done
          exit 1
      - name: Install Python dependencies
        run: pip install --quiet numpy "shapely>=2.0" eccodes ecmwf-opendata requests

      - name: Fetch models and Stage IV, build the page data
        env:
          COLUMBIA_MODELS: ${{ inputs.models }}
          BACKFILL: ${{ inputs.backfill_days }}
          OBS_DAYS: ${{ inputs.obs_days }}
          # The slow tail of the Stage IV record, 2016 back towards 2002. Only
          # the IEM mirror has those years, so it is 15 days a run rather than
          # a sweep -- roughly 60 a day, and the ~5,100 remaining days land
          # over about three months without leaning on a free service.
          OBS_EXTEND: ${{ inputs.obs_extend }}
        run: |
          python scripts/columbia/pipeline.py \
            ${COLUMBIA_MODELS:+--models "$COLUMBIA_MODELS"} \
            --obs-days "${OBS_DAYS:-20}" --backfill "${BACKFILL:-3}" --workers 8 \
            --obs-extend "${OBS_EXTEND:-15}"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PATHS="columbia/data"
          for i in 1 2 3 4 5; do
            timeout 120 git fetch origin main || { sleep 5; continue; }
            git reset -q FETCH_HEAD
            git add -A $PATHS
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data update: $(date -u +%Y-%m-%d)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            git reset -q --soft HEAD^
            sleep 5
          done
          echo "push failed after retries"; exit 1

      # A push made with GITHUB_TOKEN does not trigger pages.yml on its own.
      - name: Deploy pages
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main || echo "pages dispatch skipped"
