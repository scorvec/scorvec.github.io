name: GEFS pattern calibration (reforecast -> gefs_patterns_calib.npz, release gefs-ref-v1)

# Rebuilds the GEFS page's teleconnection fit table and regime hindcast (scripts/gefs/build_gefs_patterns_hindcast.py)
# from the per-member daily reforecast fields of release gefs-clim-v3 (gefs_hind2_MM.npz, 7.2 GB) and the observed side
# committed in scripts/gefs/data/gefs_hindcast_truth.npz (NCEP/NCAR R1 indices and regimes, and the ERA5 normal's
# leave-season-out term, built offline from the stores the patterns were built on). The cluster-test power is carried
# over from the calibration file already published. `publish` replaces that file in gefs-ref-v1, which gefs.yml
# downloads every run; without it the result is only an artifact.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace gefs_patterns_calib.npz in release gefs-ref-v1"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gefs-calib
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/gefs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy scipy
      - name: Inputs (releases gefs-clim-v3, gefs-ref-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download gefs-clim-v3 --repo "$GITHUB_REPOSITORY" -p 'gefs_hind2_*.npz' -D /tmp/hind
          gh release download gefs-ref-v1 --repo "$GITHUB_REPOSITORY" -p gefs_patterns_ref.npz -p gefs_patterns_calib.npz -D /tmp/ref
          mkdir -p /tmp/work /tmp/out
          python -c "import json, numpy as np; m = json.loads(str(np.load('/tmp/ref/gefs_patterns_calib.npz')['meta_json'])); json.dump(m['cluster_power'], open('/tmp/work/cluster_power.json', 'w'), indent=1)"
          ls -la /tmp/hind /tmp/ref; df -h /tmp
      - name: Build
        run: |
          set -o pipefail
          python scripts/gefs/build_gefs_patterns_hindcast.py --hind /tmp/hind --ref /tmp/ref/gefs_patterns_ref.npz \
            --out /tmp/out/gefs_patterns_calib.npz --work /tmp/work --workers 4 --check 266 | tee /tmp/out/build.log
      - uses: actions/upload-artifact@v7
        with:
          name: gefs-patterns-calib
          path: |
            /tmp/out/gefs_patterns_calib.npz
            /tmp/out/build.log
            /tmp/work/hindcast_pairs.npz
          retention-days: 14
      - name: Publish (release gefs-ref-v1)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload gefs-ref-v1 /tmp/out/gefs_patterns_calib.npz --repo "$GITHUB_REPOSITORY" --clobber
