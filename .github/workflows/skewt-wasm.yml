name: Skew-T WebAssembly rebuild

# Rebuilds the Sounding Explorer's SHARPlib module (skewt/sharplib.{js,wasm}) from scripts/skewt/skewt_wasm.cpp with
# scripts/skewt/build_wasm.sh, which also stamps the new hashes into the page (stamp_assets.py), and commits the result.
# Dispatch only: run it after a change to skewt_wasm.cpp. SHARPlib and fmt are cloned at their newest commits, as the
# native builds of the same code (skewt-climo.yml, skewt-gust-verify.yml) clone them.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skewt-wasm
  cancel-in-progress: false

env:
  EMSDK_VERSION: 3.1.74

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Emscripten
        run: |
          git clone -q https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build sharplib.{js,wasm}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/skewt/build_wasm.sh
          git status --short
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt (age-of-air.yml pattern); never rebase
          SNAP=$(mktemp -d)
          OUTS=$(git status --porcelain -- skewt | awk '{print $2}' | tr '\n' ' ')
          [ -n "$OUTS" ] || { echo "No changes; skipping commit."; exit 0; }
          tar cf "$SNAP/outs.tar" $OUTS
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add $OUTS
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "Skew-T: rebuild sharplib.wasm from skewt_wasm.cpp (emsdk $EMSDK_VERSION)"
            if timeout 180 git push origin HEAD:main; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1
