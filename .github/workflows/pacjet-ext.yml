name: North Pacific jet - weeks 3-5 (GEFS)

# scripts/mjo/src/pacjet_ext.py: every member of the previous day's GEFS 00Z run (NOAA publishes its days 16-35 about a
# day later), its weekly-mean 250 hPa zonal wind and Himalayan mountain torque less GEFS's reforecast drift (release
# pacjet-ref-v1, built by pacjet-rf.yml), for the weeks that passed on the reforecast
# (scripts/mjo/data/reference/pacjet_rf_skill.json) -> assets/sst/pacjet_ext.webp and assets/sst/data/pacjet_ext.json.
# The second cron is a backstop: a run already published is skipped.
on:
  schedule:
    - cron: '25 5 * * *'
    - cron: '25 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'The 00Z run, YYYYMMDD (blank = yesterday)'
        default: ''

permissions:
  contents: write

concurrency:
  group: pacjet-ext
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mjo/
            /scripts/gefs/
            /scripts/lib/
            /scripts/ecmwf/
            /scripts/era5/
            /scripts/strat/
            /scripts/constraints.txt
            /assets/sst/data/pacjet_ext.json
      - name: Which run
        id: which
        env:
          DATE: ${{ inputs.date }}
        run: |
          d=${DATE:-$(date -u -d yesterday +%Y%m%d)}
          have=$(python3 -c "import json; print(json.load(open('assets/sst/data/pacjet_ext.json'))['init'][:10].replace('-', ''))" 2>/dev/null || true)
          if [ -z "$DATE" ] && [ "$have" = "$d" ]; then echo "the $d run is already published"; exit 0; fi
          echo "date=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.which.outputs.date
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        if: steps.which.outputs.date
        run: pip install -r scripts/mjo/requirements-mjo.txt
      - name: Weeks 3-5
        if: steps.which.outputs.date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download pacjet-ref-v1 -R "$GITHUB_REPOSITORY" -p pacjet_rf_drift.npz -D scripts/mjo/data/reference --clobber
          python scripts/mjo/src/pacjet_ext.py --date "${{ steps.which.outputs.date }}" --out-dir assets/sst
      - name: Commit & push
        if: steps.which.outputs.date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot the outputs, then commit them on a clean sync of origin/main each attempt (never a rebase)
          OUT="assets/sst/pacjet_ext.webp assets/sst/data/pacjet_ext.json"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch --filter=blob:none origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            git sparse-checkout add /assets/sst/pacjet_ext.webp
            for f in $OUT; do [ -e "$f" ] && git add --sparse "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "North Pacific jet, weeks 3-5: GEFS ${{ steps.which.outputs.date }}"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
