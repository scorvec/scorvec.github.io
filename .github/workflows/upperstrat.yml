name: Upper stratosphere (GEFS, GFS, GEOS FP, GDPS)

# The stratosphere page's "Upper stratosphere" item, comparing GDPS, GEFS, GFS and GEOS FP: u(60) and polar-cap T from
# 100 to 1 hPa, time series, height-time sections and 5/1 hPa polar maps, per model and all four together
# (scripts/strat/upperstrat_data.py fetches, scripts/strat/upperstrat.py renders). ~15-20 minutes a run.
#
# Two updates a day. 00Z: all four models. 12Z: GFS, GDPS and GEFS from their 12Z runs (GEFS reaches day 16 from 12Z,
# day 35 only from 00Z); GEOS FP stays the day's 00Z forecast, carried from the 00Z run in the Actions cache rather than
# read from NCCS again (read there only when the cache has nothing for the day).
#
# Data timing, measured on the object times. 00Z (2026-09-27): GDPS on the MSC Datamart ~04:10 UTC, GFS f384 on S3
# ~05:20, GEFS f840 ~09:05, GEOS FP forecast on NCCS late (not there by 06:35; bdc.yml waits until 12:30 for the same
# reason). 12Z (2026-10-18..20): GDPS f240 ~16:50, GFS f384 ~17:15, GEFS f384 (last member) ~18:30. Slots: 13:10 (00Z,
# after bdc.yml has finished with NCCS) with a 15:10 retry, and 19:40 (12Z) with a 21:40 retry; a retry fetches only the
# models its cycle does not yet show in full (a cut GEFS run, a fallback cycle), the rest coming back from the Actions
# cache the cycle's earlier run left, and exits at once when there are none. The cycle is the newest with GFS f384 on S3.
#
# Sources: NOAA data from the AWS S3 open-data buckets (never NOMADS); GDPS from the dated Datamart tree, which keeps
# ~30 days; GEOS FP by OPeNDAP, read sequentially (parallel reads have returned silently corrupt slices before). No
# ECMWF data. Each model is its own step, wrapped so that one upstream outage leaves the other three on the page.

on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "10 15 * * *"
    - cron: "40 19 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = the newest cycle with GFS f384 on S3)'
        default: ''
      hour:
        description: 'Cycle hour 00 or 12, with a date (blank = 00)'
        default: ''
      force:
        description: 'Re-render even when this cycle is already published with all four models'
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: upperstrat
  cancel-in-progress: false

env:
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). Unset secrets leave these empty and frames go
  # to the `frames` branch alone; the repository variable FRAMES_BRANCH=off retires the branch (frames_env.sh).
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  FRAMES_BRANCH: ${{ vars.FRAMES_BRANCH }}
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  upperstrat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/upperstrat.py
            scripts/strat/upperstrat_data.py
            scripts/strat/run_record.py
            assets/sst/data/runs/upperstrat_*.json
            assets/sst/runs/upperstrat_*.webp
            scripts/strat/reference/upperstrat_clim.nc
            scripts/strat/reference/upperstrat_tail_seed.json
            scripts/lib
            assets/sst/anim/upperstrat_maps_manifest.json
            assets/sst/data/upperstrat.json
            assets/sst/data/upperstrat_tail.json
            assets/sst/upperstrat_*.webp
            scripts/constraints.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pinned as in requirements-sst.txt: matplotlib 3.11 breaks cartopy GeoAxes on CI (2026-08-25), cartopy 0.26
      # collapses some extents (2026-09-18)
      - run: pip install --quiet numpy scipy pandas xarray netCDF4 eccodes matplotlib==3.10.9 cartopy==0.25.0

      # netCDF's DAP client has no transfer timeout by default, so one stalled NCCS read would hold the job to its limit;
      # libcurl timeouts make it raise instead (the reader retries), and `timeout` below bounds each command outright
      - name: DAP client timeouts
        run: printf 'HTTP.TIMEOUT=240\nHTTP.CONNECTTIMEOUT=60\n' | tee ~/.dodsrc > ~/.ncrc

      - name: Cycle
        id: cyc
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; H="${{ github.event.inputs.hour }}"
          if [ -z "$D" ]; then read -r D H <<< "$(python scripts/strat/upperstrat_data.py latest || true)"; fi
          H=${H:-00}
          if ! echo "$D" | grep -qE '^[0-9]{8}$' || ! echo "$H" | grep -qE '^(00|12)$'; then
            echo "::error::no GFS f384 on S3 in the last 3 days (D='$D' H='$H')"; exit 1
          fi
          PREVDAY=$(date -u -d "${D:0:4}-${D:4:2}-${D:6:2} - 1 day" +%Y%m%d)
          # the cycle 12 h earlier: GDPS's fallback
          if [ "$H" = "00" ]; then PD=$PREVDAY; PH=12; else PD=$D; PH=00; fi
          { echo "date=$D"; echo "hour=$H"; echo "prevday=$PREVDAY"; echo "prev_date=$PD"; echo "prev_hour=$PH"; } >> "$GITHUB_OUTPUT"
          # A model is done when main's page (as it is now, not the checkout's) shows it from this cycle in full, not cut
          # where the upload stopped. A retry slot fetches only the others; nothing at all when every model is done.
          if timeout 60 git fetch -q --depth 1 origin main; then
            git show FETCH_HEAD:assets/sst/data/upperstrat.json > /tmp/us.json 2>/dev/null || echo '{}' > /tmp/us.json
            git checkout FETCH_HEAD -- assets/sst/data/upperstrat_tail.json 2>/dev/null || true
            # the run records accumulate: main's, which the render adds this run to
            git checkout FETCH_HEAD -- 'assets/sst/data/runs/upperstrat_*.json' 2>/dev/null || true
          else
            cp assets/sst/data/upperstrat.json /tmp/us.json 2>/dev/null || echo '{}' > /tmp/us.json
          fi
          python - "$D" "$H" "${{ github.event.inputs.force }}" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          d, h, force = sys.argv[1:4]
          shown = json.load(open("/tmp/us.json")).get("models", {})
          init = f"{d[:4]}-{d[4:6]}-{d[6:]} {h}Z"
          models = ("gefs", "gfs", "geos", "gdps") if h == "00" else ("gefs", "gfs", "gdps")
          done = [
              m
              for m in models
              if force != "true"
              and shown.get(m, {}).get("init") == init
              and not shown[m].get("note", "").startswith("cut")
          ]
          print("done=" + " ".join(done))
          print("gefs_shown=" + ("" if shown.get("gefs", {}).get("note", "").startswith("cut") else shown.get("gefs", {}).get("init", "")))
          print("skip=" + ("1" if len(done) == len(models) else "0"))
          print(f"cycle {d} {h}Z: done {' '.join(done) or 'none'}", file=sys.stderr)
          PY
          echo "cycle $D ${H}Z (GDPS fallback $PD ${PH}Z)"

      # the models this cycle already has on the page, as the cycle's earlier run fetched them (Actions cache)
      - name: This cycle's data from its earlier run
        if: steps.cyc.outputs.skip != '1' && steps.cyc.outputs.done != ''
        uses: actions/cache/restore@v6
        with:
          path: scripts/strat/data/upperstrat
          key: upperstrat-data-${{ steps.cyc.outputs.date }}${{ steps.cyc.outputs.hour }}-
          restore-keys: |
            upperstrat-data-${{ steps.cyc.outputs.date }}${{ steps.cyc.outputs.hour }}-

      - name: What to fetch
        id: need
        if: steps.cyc.outputs.skip != '1'
        env:
          DONE: ${{ steps.cyc.outputs.done }}
        run: |
          for m in gefs gfs geos gdps; do
            f=true
            case " $DONE " in *" $m "*) [ -f "scripts/strat/data/upperstrat/$m.npz" ] && f=false ;; esac
            echo "$m=$f" >> "$GITHUB_OUTPUT"; echo "  $m: fetch $f"
          done

      # NCCS is read at the 00Z update only: the tail's newest complete day is already in by 13:10
      - name: GEOS FP analysis tail
        if: steps.need.outputs.geos == 'true' && steps.cyc.outputs.hour == '00'
        run: |
          timeout 900 python scripts/strat/upperstrat_data.py tail --days 5 --keep 120 --seed-too \
            --out assets/sst/data/upperstrat_tail.json || echo "::warning::GEOS FP analysis tail failed; the figures keep the older tail"

      - name: GFS
        if: steps.need.outputs.gfs == 'true'
        run: |
          python scripts/strat/upperstrat_data.py fetch --model gfs --date ${{ steps.cyc.outputs.date }} --hour ${{ steps.cyc.outputs.hour }} \
            || echo "::warning::GFS fetch failed"

      - name: GDPS
        if: steps.need.outputs.gdps == 'true'
        run: |
          python scripts/strat/upperstrat_data.py fetch --model gdps --date ${{ steps.cyc.outputs.date }} --hour ${{ steps.cyc.outputs.hour }} \
            || python scripts/strat/upperstrat_data.py fetch --model gdps --date ${{ steps.cyc.outputs.prev_date }} --hour ${{ steps.cyc.outputs.prev_hour }} \
            || echo "::warning::GDPS fetch failed"

      # GEOS FP: the day's 00Z forecast in both updates. The 00Z update reads NCCS and keeps the result for the 12Z one.
      - name: GEOS FP forecast
        if: steps.need.outputs.geos == 'true' && steps.cyc.outputs.hour == '00'
        run: |
          timeout 1200 python scripts/strat/upperstrat_data.py fetch --model geos --date ${{ steps.cyc.outputs.date }} \
            || timeout 1200 python scripts/strat/upperstrat_data.py fetch --model geos --date ${{ steps.cyc.outputs.prevday }} \
            || echo "::warning::GEOS FP fetch failed"

      - name: Keep the GEOS FP read for the 12Z update
        if: steps.need.outputs.geos == 'true' && steps.cyc.outputs.hour == '00' && hashFiles('scripts/strat/data/upperstrat/geos.npz') != ''
        uses: actions/cache/save@v6
        with:
          path: scripts/strat/data/upperstrat/geos.npz
          key: upperstrat-geos-${{ steps.cyc.outputs.date }}-${{ github.run_id }}

      - name: GEOS FP forecast, as read by the 00Z update
        id: geoscache
        if: steps.cyc.outputs.skip != '1' && steps.cyc.outputs.hour == '12'
        uses: actions/cache/restore@v6
        with:
          path: scripts/strat/data/upperstrat/geos.npz
          key: upperstrat-geos-${{ steps.cyc.outputs.date }}-
          restore-keys: |
            upperstrat-geos-${{ steps.cyc.outputs.date }}-

      - name: GEOS FP forecast (nothing cached for the day)
        if: steps.cyc.outputs.skip != '1' && steps.cyc.outputs.hour == '12' && steps.geoscache.outputs.cache-matched-key == ''
        run: |
          echo "::notice::no cached GEOS FP read for ${{ steps.cyc.outputs.date }} 00Z; reading NCCS"
          timeout 1200 python scripts/strat/upperstrat_data.py fetch --model geos --date ${{ steps.cyc.outputs.date }} \
            || timeout 1200 python scripts/strat/upperstrat_data.py fetch --model geos --date ${{ steps.cyc.outputs.prevday }} \
            || echo "::warning::GEOS FP fetch failed"

      # 00Z: a full 35-day run is preferred: today's, else yesterday's 00Z (seen 2026-09-27: the 00Z extended range was
      # only partly uploaded, control to f384); only when neither is complete is today's run used, cut where it ends.
      # 12Z: the cycle's 16-day run, complete or cut where it ends (a 12Z run never stands in for a 00Z 35-day one).
      - name: GEFS
        if: steps.need.outputs.gefs == 'true'
        timeout-minutes: 45
        env:
          SHOWN: ${{ steps.cyc.outputs.gefs_shown }}
        run: |
          D=${{ steps.cyc.outputs.date }}; H=${{ steps.cyc.outputs.hour }}; P=${{ steps.cyc.outputs.prevday }}
          f() { python scripts/strat/upperstrat_data.py fetch --model gefs --procs 8 "$@"; }
          if [ "$H" = "00" ] && [ "$SHOWN" = "${P:0:4}-${P:4:2}-${P:6:2} 00Z" ] && [ -f scripts/strat/data/upperstrat/gefs.npz ]; then
            # yesterday's 35-day run is on the page and back from the cache: only today's full run would change that
            f --date "$D" --require-full || echo "today's 35-day GEFS is still incomplete; keeping yesterday's"
          elif [ "$H" = "00" ]; then
            f --date "$D" --require-full || f --date ${{ steps.cyc.outputs.prevday }} --require-full || f --date "$D" \
              || echo "::warning::GEFS fetch failed"
          else
            f --date "$D" --hour 12 --require-full || f --date "$D" --hour 12 || echo "::warning::GEFS fetch failed"
          fi

      - name: Render
        id: render
        if: steps.cyc.outputs.skip != '1'
        run: |
          ls -la scripts/strat/data/upperstrat/ || true
          python scripts/strat/upperstrat.py --data scripts/strat/data/upperstrat --out assets/sst
          echo "ok=1" >> "$GITHUB_OUTPUT"
          ls -la assets/sst/upperstrat_*.webp

      - name: Keep this cycle's data for a retry slot
        if: steps.render.outputs.ok == '1'
        uses: actions/cache/save@v6
        with:
          path: scripts/strat/data/upperstrat
          key: upperstrat-data-${{ steps.cyc.outputs.date }}${{ steps.cyc.outputs.hour }}-${{ github.run_id }}

      # The publisher swaps in only directories that rendered; a model that failed leaves its old frames (and its
      # manifest entry, which upperstrat.py keeps) in place rather than blanking them.
      - name: Publish the map frames
        if: steps.render.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIRS=""
          for m in gefs gfs geos gdps all; do for h in nh sh; do DIRS="$DIRS assets/sst/anim/upperstrat_${m}_${h}"; done; done
          scripts/lib/publish_frames_ci.sh $DIRS

      - name: Commit & push
        if: steps.render.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never rebase (project rule 2026-09-09): snapshot the outputs, then on each attempt reset to a fresh
          # origin/main, lay the snapshot back on and commit - the sst.yml / strat.yml pattern.
          SNAP=$(mktemp -d)
          ls assets/sst/upperstrat_*.webp assets/sst/data/upperstrat.json assets/sst/data/upperstrat_tail.json \
             assets/sst/anim/upperstrat_maps_manifest.json assets/sst/data/runs/upperstrat_*.json \
             assets/sst/runs/upperstrat_*.webp 2>/dev/null > "$SNAP/list" || true
          tar cf "$SNAP/outs.tar" -T "$SNAP/list"
          echo "snapshot: $(wc -l < "$SNAP/list") files"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            # --sparse: the outputs sit outside the (file-list) sparse checkout, and a plain add refuses them
            while read -r f; do git add --sparse -f "$f"; done < "$SNAP/list"
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "upperstrat: GEFS/GFS/GEOS FP/GDPS upper stratosphere, ${{ steps.cyc.outputs.date }} ${{ steps.cyc.outputs.hour }}Z cycle"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1

      - name: Deploy the site
        if: steps.render.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "site deploy is batched - the dispatcher deploys within 15 min (pages.yml)"
