name: South Atlantic dipole impacts on South America (CMIP6)
# The negative South Atlantic subtropical dipole (SASD, SW - NE pole, the site's Atlantic-indices convention) in CMIP6
# historical runs: per model, up to `members` members from the public Pangeo CMIP6 Google Cloud mirror (anonymous),
# Amon ts / pr / tas / psl 1950-2014 reduced to the dipole and Nino-3.4 box means and 2.5-degree South American fields
# (scripts/sst/cmip6_satl_extract.py, ~1 GB streamed per member); then the ENSO-controlled responses and their
# robustness across models (scripts/sst/cmip6_satl_impacts.py). Results are kept as the run's artifact. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      members:
        description: 'Historical members per model'
        default: '3'

permissions:
  contents: read

concurrency:
  group: satl-cmip6
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sst/cmip6_satl_extract.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas xarray
      - name: Catalogue
        run: curl -sSf --retry 3 -o /tmp/pangeo-cmip6.csv https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
      - id: m
        run: |
          set -euo pipefail
          m=$(python scripts/sst/cmip6_satl_extract.py plan --catalog /tmp/pangeo-cmip6.csv)
          echo "models: $m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sst/cmip6_satl_extract.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas xarray "zarr>=3" gcsfs cftime scipy
      - run: curl -sSf --retry 3 -o /tmp/pangeo-cmip6.csv https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
      - name: Reduce ${{ matrix.model }}
        run: |
          python scripts/sst/cmip6_satl_extract.py run --catalog /tmp/pangeo-cmip6.csv --model ${{ matrix.model }} \
            --members ${{ inputs.members }} --out out
      - uses: actions/upload-artifact@v7
        with:
          name: satl_${{ matrix.model }}
          path: out/*.npz
          retention-days: 30

  analyse:
    needs: extract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/sst
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy scipy matplotlib "cartopy==0.25.0"
      - uses: actions/download-artifact@v7
        with:
          pattern: satl_*
          path: extracts
      - name: Responses and robustness
        run: python scripts/sst/cmip6_satl_impacts.py --cmip6 extracts --out results
      - uses: actions/upload-artifact@v7
        with:
          name: satl-cmip6-results
          path: results/
          retention-days: 90
