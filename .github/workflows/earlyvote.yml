name: Early vote tracker (midterms)

# scorvec.com/midterms/earlyvote.html (2026-09-27). One polite pass a day: official state files first (NC State Board of
# Elections aggregate counts, Pennsylvania DoS data.pa.gov via SoQL counts), the UF Election Lab CSV for every other
# state. Aggregates only - no voter-level record is written. scripts/election2026/earlyvote.py has the source notes.
# NC refreshes ~08:40 UTC, UF during the US morning, data.pa.gov daily; 14:30 UTC catches all three. The laptop
# dispatcher backs the cron up (Actions honours only part of the scheduled firings).

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: earlyvote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/election2026
            midterms/data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch official state files and the UF Election Lab CSV
        run: python scripts/election2026/earlyvote.py update
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt (mjo.yml / sst.yml pattern)
          SNAP=$(mktemp -d)
          git add -A midterms/data/earlyvote.json 2>/dev/null || true
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            git add -A midterms/data/earlyvote.json
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "midterms: early vote $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::pages dispatch failed; the dispatcher will catch it"
