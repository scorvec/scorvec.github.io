name: Global ensemble maps — IFS-ENS

# Caller for ensmaps.yml (ens-anomalies.html). IFS-ENS is published in two stages: the 0.25-deg files (500 hPa height,
# sea-level pressure, and 2 m temperature at 0.25 deg) of a 00/12Z run are complete ~8 h 30 min after the start, and
# the local fast lane fires stage=first then; the 0.1-deg surface files (2 m temperature) reach day 15 ~13 h 20 min after
# the start (00Z ~13:20Z, 12Z ~01:20Z), when a dispatch without a stage replaces the 2 m maps in the same run. The 06/18Z runs, to +144 h, follow
# the same two stages. These crons are the backstop: a firing plans the 2 m stage when it is due, a whole run when
# nothing of it is on the page, and exits in about a minute when there is nothing new.
on:
  schedule:
  - cron: '50 14 * * *'
  - cron: '0 18 * * *'
  - cron: '50 2 * * *'
  - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle YYYYMMDDHH (blank = plan the newest unpublished; skipped when it or a newer one is published)"
        required: false
        default: ""
      follow:
        description: "Follow the run as it lands, publishing days 1-5 and 6-10 as they complete"
        type: boolean
        default: false
      stage:
        description: "first = the first stage, 2 m from the 0.25-deg files (blank = the whole run, or the 0.1-deg 2 m when due)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  run:
    uses: ./.github/workflows/ensmaps.yml
    with:
      model: ifs
      cycle: ${{ inputs.cycle }}
      follow: ${{ inputs.follow || false }}
      stage: ${{ inputs.stage }}
    secrets: inherit
