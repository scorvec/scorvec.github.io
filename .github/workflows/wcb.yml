name: Warm conveyor belts (IFS-ENS)

# Warm conveyor belts in every IFS-ENS member (scripts/wcb/wcb_fc.py; the identification is scripts/wcb/elias.py, the
# published ELIAS 2.0 networks of Quinting and Grams 2022): the 00 UTC run's 50 perturbed members, 12-hourly to
# last_step, byte-ranged step by step from the Google Cloud mirror of ECMWF open data only and never cached - the
# northern rows of 27 fields per member on the steps shown (10 on the day either side) and the 300 hPa divergence
# whole. The networks, their decision thresholds and the trajectory climatology: release wcb-ref-v1 (wcb-ref.yml),
# checked against the archive's published checksum.
#
# Dispatch only: the map frames of the members' share with a belt's inflow, ascent and outflow (days 1 to
# (last_step - 24) / 24) under assets/sst/anim/wcb_ifs, those of the outflow's advection of 300 hPa potential
# vorticity with the tropopause under assets/sst/anim/wcb_ifs_pv, their manifest and assets/sst/data/wcb_ifs.json,
# the numbers behind them and what the fetch cost. With publish=true the frames are published and the rest committed, otherwise
# all of it is an artifact. Waits up to 45 min for the run on the mirror.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'the 00 UTC run, YYYYMMDD (blank = today)'
        default: ''
      last_step:
        description: 'Last step fetched, in hours (12-hourly from 0); the leads end 24 h before it'
        default: '192'
      members:
        description: 'Perturbed members 1..N'
        default: '50'
      publish:
        description: 'Publish the frames and commit the outputs (false = artifacts only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  ECMWF_SOURCES: google      # Google Cloud mirror only
  ECMWF_MULTISOURCE: "0"
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"  # three worker processes on four cores
  OMP_NUM_THREADS: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: wcb
      cancel-in-progress: false
    env:
      # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). Unset secrets leave these empty and frames go
      # to the `frames` branch alone; the repository variable FRAMES_BRANCH=off retires the branch (frames_env.sh).
      FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
      FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
      FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
      FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
      FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
      FRAMES_BRANCH: ${{ vars.FRAMES_BRANCH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt h5py
      - name: Unit tests
        run: |
          python scripts/wcb/test_elias.py
          python scripts/wcb/test_wcb_fc.py
      - uses: actions/cache@v6
        id: archive
        with:
          path: archive
          key: wcb-ref-v1-dbea2b2f3d836fb3190b3ca2b2e0c0bc
      - name: The networks, thresholds and climatology (release wcb-ref-v1)
        if: steps.archive.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download wcb-ref-v1 -R "$GITHUB_REPOSITORY" -p wcbmetric_v2.zip
          echo "dbea2b2f3d836fb3190b3ca2b2e0c0bc  wcbmetric_v2.zip" | md5sum -c -
          mkdir archive && unzip -q wcbmetric_v2.zip -d archive
          rm wcbmetric_v2.zip
      - name: Fetch, identify and render
        env:
          D: ${{ inputs.date }}
          LAST: ${{ inputs.last_step }}
          N: ${{ inputs.members }}
        run: |
          set -euo pipefail
          [ -n "$D" ] || D=$(date -u +%Y%m%d)
          root=$(dirname "$(find archive -name calc_wcbmetric_v2.py | head -1)")
          start=$(date +%s)
          python scripts/wcb/wcb_fc.py forecast --date "$D" --last-step "$LAST" --members "$N" --wait-min 45 \
            --archive "$root" --out-dir assets/sst --out /tmp/wcb_fc.npz
          echo "  wall time $(( $(date +%s) - start )) s"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wcb-forecast
          path: |
            assets/sst/anim/wcb_ifs
            assets/sst/anim/wcb_ifs_pv
            assets/sst/anim/wcb_ifs_manifest.json
            assets/sst/data/wcb_ifs.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish loop frames
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/wcb_ifs assets/sst/anim/wcb_ifs_pv
      # Never rebase: snapshot, reset to a fresh origin/main each attempt, lay the snapshot back on, commit, push.
      - name: Commit & push
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUTS="assets/sst/anim/wcb_ifs_manifest.json assets/sst/data/wcb_ifs.json"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" $OUTS
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add $OUTS
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "Warm conveyor belts (IFS-ENS): $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push origin HEAD:main; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
