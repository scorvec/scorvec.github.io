name: 500 hPa height database and anomaly correlations

# Adds every model's 500 hPa height to the verification database (scripts/verify/z500_acc.py, scripts/verify/verifydb.sh):
# GFS, the IFS control, AIFS and GDPS to day 10 (z500-<m>_<init>.npz), the IFS-ENS, AIFS-ENS, GEFS and GEPS means and
# members to day 15 (ens-z500-<m>_, ens-z500m-<m>_), ERA5 at 00Z of each day (era5-z500_<day>.npz), and each run's
# anomaly correlations against ERA5 once ERA5 covers its day 15 (acc_<init>.parquet), the anomalies from the ERA5
# 1991-2020 normal at 00Z of release verify-clim-z500-v1 (z500_acc.py clim, built once by verify-clim.yml). Runs
# and days the database holds are skipped, so a range can be dispatched again after a failure.
#
# Each day it catches up the runs 1 to 47 days old (HPFX keeps GDPS about 52 days and GEPS about 48) and the days ERA5
# has added on ARCO (about a week behind). Dispatched with a range it backfills: the ECMWF runs stay on the open-data
# mirror and GFS and GEFS on NOAA's buckets, GDPS and GEPS only within HPFX's days, so their runs go first. Each model
# from its first run in the database (z500_acc.SINCE): the deterministic models and GEPS from 13 May 2026, the other
# ensembles from their archives' starts (2024 and 2025), the teleconnection forecasts' calibration sample.
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
    inputs:
      first:
        description: 'First 00Z run, YYYYMMDD (blank = 47 days ago)'
        default: ''
      last:
        description: 'Last 00Z run, YYYYMMDD (blank = yesterday)'
        default: ''
      models:
        description: 'Models (space-separated: GFS IFS AIFS GDPS IFS-ENS AIFS-ENS GEFS GEPS)'
        default: 'GFS IFS AIFS GDPS IFS-ENS AIFS-ENS GEFS GEPS'
      chunk:
        description: 'Ensemble runs per job (a deterministic job takes eight times as many)'
        default: '6'

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt
  MVERIFY: "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@f81968d42a703f0e42eb75acd526fadd3ba567e9"
  CLIM_TAG: verify-clim-z500-v1

permissions:
  contents: write

concurrency:
  group: verify-z500
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      first: ${{ steps.p.outputs.first }}
      last: ${{ steps.p.outputs.last }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
          MODELS: ${{ inputs.models || 'GFS IFS AIFS GDPS IFS-ENS AIFS-ENS GEFS GEPS' }}
          CHUNK: ${{ inputs.chunk || '6' }}
        run: |
          FIRST=${FIRST:-$(date -u -d '47 days ago' +%Y%m%d)}
          LAST=${LAST:-$(date -u -d '1 day ago' +%Y%m%d)}
          scripts/verify/verifydb.sh list > have.txt
          python3 - "$FIRST" "$LAST" "$CHUNK" "$MODELS" have.txt >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          from datetime import date, datetime, timedelta
          from itertools import zip_longest
          first, last = (datetime.strptime(x, "%Y%m%d").date() for x in sys.argv[1:3])
          n, models = max(1, int(sys.argv[3])), sys.argv[4].split()
          have = set(open(sys.argv[5]).read().split())
          code = {"GFS": "z500-gfs", "IFS": "z500-ifs", "AIFS": "z500-aifs", "GDPS": "z500-gdps", "IFS-ENS": "ens-z500-ifs",
                  "AIFS-ENS": "ens-z500-aifs", "GEFS": "ens-z500-gefs", "GEPS": "ens-z500-geps"}  # z500_acc.file_of
          hpfx = {"GDPS": 52, "GEPS": 48}  # mverify_scores.HPFX_DAYS, ens_verify.HPFX_DAYS
          since = {"IFS-ENS": date(2024, 3, 1), "GEFS": date(2024, 3, 1), "AIFS-ENS": date(2025, 7, 2)}  # z500_acc.SINCE
          start = date(2026, 5, 13)  # z500_acc.START: the deterministic models and GEPS from here
          days = [first + timedelta(d) for d in range((last - first).days + 1)]
          def season(d):  # days from today's day of year, around the year
              x = abs(d.timetuple().tm_yday - date.today().timetuple().tm_yday)
              return min(x, 365 - x)
          hpfx_chunks, per_model = [], []
          for m in sorted(models, key=lambda m: m not in hpfx):  # GDPS and GEPS first: HPFX deletes them
              oldest = max(date.today() - timedelta(days=hpfx.get(m, 100000)), since.get(m, start))
              todo = [d for d in days if d >= oldest and f"{code[m]}_{d:%Y%m%d}00.npz" not in have]
              # the season of the teleconnection forecasts' calibration first (the runs nearest today's day of year in
              # every year, newest first), so their skill can be tested within hours rather than at the backfill's end
              todo.sort(key=lambda d: (season(d) // 15, -d.toordinal()))
              k = n if m.endswith(("ENS", "GEFS", "GEPS")) else 8 * n
              mc = [{"model": m, "runs": " ".join(f"{d:%Y%m%d}" for d in sorted(todo[i:i + k]))}
                    for i in range(0, len(todo), k)]
              (hpfx_chunks.extend if m in hpfx else per_model.append)(mc)
              print(f"{m}: {len(todo)} runs to add", file=sys.stderr)
          # then the other models' chunks taken in turn, so each model's season comes in early
          chunks = hpfx_chunks + [c for row in zip_longest(*per_model) for c in row if c]
          print("chunks=" + json.dumps(chunks))
          print(f"first={first + timedelta(days=1):%Y%m%d}")  # ERA5 from the first run's day 1
          print(f"last={min(last + timedelta(days=15), date.today()):%Y%m%d}")  # to the last run's day 15
          EOF
          cat "$GITHUB_OUTPUT"

  fields:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Fetch and archive, one run at a time
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.chunk.model }}
          RUNS: ${{ matrix.chunk.runs }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          failed=""
          for d in $RUNS; do   # a run that fails is left for the next pass; the chunk's other runs go on
            if python scripts/verify/z500_acc.py fields --model "$MODEL" --inits "${d}00" "${d}00" \
                --work "$RUNNER_TEMP/fc" --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"; then
              scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            else
              echo "::warning::$MODEL ${d}00 failed, left for the next pass"; failed="$failed $d"
            fi
            rm -rf "$RUNNER_TEMP"/db-new "$RUNNER_TEMP"/fc
          done
          if [ -n "$failed" ]; then echo "::error::$MODEL runs not archived:$failed"; exit 1; fi

  truth:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a backfill reads ~110 MB of ARCO a day (one chunk holds all 37 levels)
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY" gcsfs
      - name: ERA5 at 00Z of each day ARCO holds
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFYDB_PACE: "10"   # a backfill's hundreds of days stay within the API's hourly allowance (~360 an hour)
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          FIRST=${{ needs.plan.outputs.first }}; LAST=${{ needs.plan.outputs.last }}
          # a month at a time, each uploaded before the next is read (a job cut short keeps what it read), the months
          # nearest today's in the year first, newest first, as the runs (plan)
          python3 - "$FIRST" "$LAST" > "$RUNNER_TEMP/months.txt" <<'EOF'
          import sys
          from datetime import date, datetime, timedelta
          first, last = (datetime.strptime(x, "%Y%m%d").date() for x in sys.argv[1:3])
          months, m = [], first.replace(day=1)
          while m <= last:
              nxt = (m + timedelta(days=32)).replace(day=1)
              months.append((max(m, first), min(nxt - timedelta(days=1), last)))
              m = nxt
          gap = lambda a: min(abs(a.month - date.today().month), 12 - abs(a.month - date.today().month))
          for a, b in sorted(months, key=lambda r: (gap(r[0]), -r[0].toordinal())):
              print(f"{a:%Y%m%d} {b:%Y%m%d}")
          EOF
          while read -r a b; do
            python scripts/verify/z500_acc.py truth --first "$a" --last "$b" --have "$RUNNER_TEMP/have.txt" \
              --archive-out "$RUNNER_TEMP/db-new"
            scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            rm -rf "$RUNNER_TEMP/db-new"
          done < "$RUNNER_TEMP/months.txt"

  acc:
    needs: [fields, truth]
    # also when there was nothing to fetch; not after a failed fetch, which may still be filled
    if: ${{ !cancelled() && needs.truth.result == 'success' && needs.fields.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Each due run's anomaly correlations, one run at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CLIM_TAG" -D "$RUNNER_TEMP" -p clim_z500_1p5.npz
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          python scripts/verify/z500_acc.py acc --list --have "$RUNNER_TEMP/have.txt" > "$RUNNER_TEMP/due.txt"
          echo "$(wc -l < "$RUNNER_TEMP/due.txt") runs due"
          while read -r init files; do
            # shellcheck disable=SC2086  # the file names are meant to split
            scripts/verify/verifydb.sh get "$RUNNER_TEMP/fields" $files
            python scripts/verify/z500_acc.py acc --init "$init" --derived "$RUNNER_TEMP/fields" \
              --clim "$RUNNER_TEMP/clim_z500_1p5.npz" --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"
            scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"
            rm -rf "$RUNNER_TEMP"/fields "$RUNNER_TEMP"/db-new
          done < "$RUNNER_TEMP/due.txt"

  mirror:
    needs: acc
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
      FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
      FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
      FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
      FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: The database's second copy, in the object store
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify/verifydb.sh mirror
