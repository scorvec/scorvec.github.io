name: SST anomalies & RONI (El Niño monitor)

# NOAA OISST updates daily (1–2 day latency). We rebuild once a day; the script
# always uses the latest available day, so a late update is simply picked up by
# the next run. Manual dispatch with --force re-downloads regardless.
#
# Cron timing matters. Two constraints, both in UTC (GitHub cron is always UTC):
#   1. PSL rewrites sst.day.anom.<YEAR>.nc with the previous day at ~16:30 UTC.
#   2. The laptop primary (run_local_sst.sh) polls until 13:59 America/New_York,
#      which is 17:59 UTC in EDT but 18:59 UTC in EST — the window MOVES with DST.
# 19:23 UTC clears both year-round, so this fallback can only ever see the freshest
# day and never overlaps the laptop (its single-instance lock doesn't span machines).
# The old 16:23 UTC slot sat 8 min ahead of PSL and was saved only by GitHub's
# 1–2 h scheduling delay; an on-time dispatch would have committed stale maps.
on:
  # CRON-PAUSED 2026-09-01 (restore: uncomment the block below)
  # schedule:
  # - cron: '23 19 * * *'   # 19:23 UTC — after PSL publishes OISST (~16:30 UTC). Everything this job builds is daily at most (OISST, TAO, MUR, ASCAT; WWV is monthly-ish), so two firings a day is the right size — deliberately NOT more. The laptop's 15-min cadence was always over-serving it; com.scorvec.sst was unloaded 2026-08-29.
  # (The 23:23 retry slot was removed 2026-08-30. It existed because "the
  # cron fires once a day, so a runner-infra hang at 19:23 loses the whole
  # day" - which is now the dispatcher's job: a failed, timed-out or
  # cancelled run re-opens its slot after 120 min, so the retry happens
  # when it is needed instead of every single night.)
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-download OISST even if cached'
        required: false
        default: 'false'

# Frame store (Cloudflare R2, S3 API). Absent secrets leave these empty and the
# publishers fall back to the orphan `frames` branch - see scripts/lib/frames_env.sh.
env:
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}

permissions:
  contents: write

concurrency:
  group: sst-roni
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 90, not 60. The job legitimately runs ~56 min and one firing already died
    # at 60m21s (2026-08-31 23:14Z). 'MUR 1 km Nino-3.4 vs OISST' alone is
    # 40.3 min of that - 72% of the job - because mur_nino34.py pulls MUR 1 km
    # granules from ERDDAP. It cannot simply move to mur-sst.yml: it reads
    # assets/data/enso_daily.json, which the OISST step earlier in THIS job
    # produces, so splitting it would score MUR against the previous cycle's
    # OISST. Raising the cap is the honest fix until that tradeoff is decided.
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sst-${{ runner.os }}-${{ hashFiles('scripts/sst/requirements-sst.txt') }}
          restore-keys: |
            pip-sst-${{ runner.os }}-

      # OISST cache: the 1.4 GB 1991-2020 climatology exists only on PSL, and
      # the yearly file is ~470 MB per run — cache both so a PSL outage rides
      # on the NCEI day-file fallback (oisst9120) instead of failing outright.
      - uses: actions/cache@v6
        with:
          path: |
            scripts/sst/data/sst.day.mean.ltm.1991-2020.nc
            scripts/sst/data/sst.day.mean.*.nc
          key: oisst-data-${{ github.run_id }}
          restore-keys: |
            oisst-data-

      # ASCAT daily-mean u/v archive: lets a plot-layout change re-render every
      # frame in the window from cached fields instead of refetching Copernicus.
      - uses: actions/cache@v6
        with:
          path: scripts/sst/data/ascat
          key: ascat-data-${{ github.run_id }}
          restore-keys: |
            ascat-data-

      - name: Install cartopy system libs
        run: |
          # Bounded + retried: an apt mirror hang here once ate the full 60-min job budget
          # (2026-08-19 run, killed at timeout during this step).
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 && \
               sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                 libgeos-dev libproj-dev proj-bin; then exit 0; fi
            echo "apt attempt $i failed; retrying"; sleep 10
          done
          exit 1

      - name: Install Python dependencies
        run: pip install -r scripts/sst/requirements-sst.txt

      # Seed from the frames branch before rendering: ascat appends only what
      # is missing, and frames stopped arriving with the checkout when they
      # were taken off main.
      - name: Seed existing frames
        run: scripts/lib/fetch_frames_ci.sh assets/sst/anim/equatorial assets/sst/anim/equatorial_dt assets/sst/anim/anomaly assets/sst/anim/relative assets/sst/anim/absolute assets/sst/anim/tropical_rel assets/sst/anim/eq_cur_map assets/sst/anim/eq_cur_section assets/sst/anim/ascat

      - name: Build SST maps, RONI, and animation (OISST)
        run: |
          FORCE=""
          [ "${{ inputs.force }}" = "true" ] && FORCE="--force"
          python scripts/sst/sst-roni.py $FORCE

      - name: Fetch TAO equatorial subsurface temperature (recent 120 days)
        run: |
          python scripts/sst/tao_subsurface.py --days 120 \
            --out scripts/sst/data/tao_eq_recent.nc \
            --ascii scripts/sst/data/tao_eq_recent.ascii

      - name: Build equatorial subsurface cross-section + animation
        run: python scripts/sst/sst_subsurface.py

      - name: Build daily ASCAT equatorial-Pacific wind map (Copernicus Marine)
        working-directory: scripts/sst
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ]; then
            echo "Copernicus Marine credentials not set; skipping wind map."; exit 0
          fi
          python sst_ascat_winds.py || echo "ASCAT wind map failed; continuing"

      # Products that only the laptop was building, moved here 2026-08-29 so the
      # SST pipeline no longer needs run_local_sst.sh. Each is non-fatal: a
      # single upstream outage should not take the whole cycle down, and the
      # previous figure/JSON stays on the site until the next run succeeds.
      - name: Warm-water volume orbit
        run: python scripts/sst/wwv_orbit.py || echo "WWV orbit failed; continuing"

      # THE MUR SERIES CACHE. Without this the step costs 40 min - 72% of the
      # whole job - and it is not MUR being slow. scripts/sst/data/ is gitignored
      # (.gitignore:15), so nino34_series.json never reaches a runner, and
      # mur_nino34.py falls back to `start = MUR_START if s.empty`: it re-fetches
      # the ENTIRE record from ERDDAP every run. With the series restored it
      # fetches only the days it is missing, which is one or two.
      #
      # run_id in the key so every run writes a fresh entry, restore-keys to fall
      # back to the newest previous one - the read-only pattern, since a fixed key
      # would save once and then never update as the series grows.
      - uses: actions/cache@v6
        with:
          path: scripts/sst/data/mur
          key: mur-nino34-series-${{ github.run_id }}
          restore-keys: |
            mur-nino34-series-

      - name: MUR 1 km Nino-3.4 vs OISST
        run: python scripts/sst/mur_nino34.py || echo "MUR Nino-3.4 failed; keeping previous figure"

      - name: Nino-region history JSON
        env:
          SST_SITE_ROOT: ${{ github.workspace }}
        run: python scripts/sst/build_nino_history.py || echo "nino history failed; keeping previous JSON"

      # WITHOUT THIS THE ANIMATIONS NEVER LEAVE THE RUNNER. .gitignore keeps
      # frame webp off main, and this workflow had no frames-branch publisher
      # at all - so every loop it rendered was discarded when the job ended.
      # It went unnoticed while the laptop still had local copies and pushed
      # them; once those were cleaned up on 2026-08-30 the loops froze on the
      # branch, which is why a fix to the anomaly contours never appeared.
      - name: Publish frames to the orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/equatorial assets/sst/anim/equatorial_dt assets/sst/anim/anomaly assets/sst/anim/relative assets/sst/anim/absolute assets/sst/anim/tropical_rel assets/sst/anim/eq_cur_map assets/sst/anim/eq_cur_section assets/sst/anim/ascat

      - name: Commit & push (generated outputs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sst.html enso-*.html assets/sst/
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."; exit 0
          fi
          DAY=$(python -c "import json; print(json.load(open('assets/sst/manifest.json'))['sst_valid_day'])")
          git commit -m "data update: ${DAY}"
          for i in 1 2 3 4 5; do
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; rebasing onto origin/main (keep our generated files)…"
            timeout 120 git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              git reset --hard origin/main
              git add sst.html enso-*.html assets/sst/
              git diff --staged --quiet || git commit -m "data update: ${DAY} (re-applied)"
            fi
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### SST / RONI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page: [/sst.html](https://scorvec.com/sst.html)" >> "$GITHUB_STEP_SUMMARY"
          [ -f assets/sst/manifest.json ] && \
            echo "- $(python -c "import json;m=json.load(open('assets/sst/manifest.json'));print('OISST',m['sst_valid_day'],'· RONI',m['roni_latest_value'],'°C')" )" >> "$GITHUB_STEP_SUMMARY" || true
