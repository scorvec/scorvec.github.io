name: Hourly SOI estimate (Darwin/Tahiti METAR)

# Near-real-time SOI from the Darwin (YPDN) + Tahiti (NTAA) airport METARs. Light:
# one API call + a small plot. Commits its own files only (rolling CSV + webp), so it
# never collides with the laptop pipelines.
# NO CRON OF ITS OWN. Measured 2026-08-30: GitHub honoured 5 of 24 hourly
# firings for this workflow (21%), and stripping the repo to this single cron
# still only got 2 of 6 over six hours - so the throttle follows the WORKFLOW's
# requested frequency, not repo load. Workflows asking for one firing a day were
# honoured 5 of 5.
#
# So the schedule lives in 24 one-line-per-hour callers (soi-h00.yml ...
# soi-h23.yml), each asking for a single daily firing, and the work stays here
# as a reusable workflow. One copy of the logic, 24 cheap schedules.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soi-hourly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # room for the bounded git-retry loop in Commit & push
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas matplotlib
      - run: python scripts/sst/hourly_soi.py --out assets/sst/soi_hourly.webp
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git add assets/sst/soi_hourly.webp scripts/sst/metar/soi_hourly.csv
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1
