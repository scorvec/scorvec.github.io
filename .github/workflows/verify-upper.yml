name: Upper-air fields database and error maps

# Adds the single runs' upper air to the verification database (scripts/verify/upper_fields.py,
# scripts/verify/verifydb.sh; releases verify-upper-YYYY-MM): GFS, the IFS control, AIFS and GDPS at 00Z, height,
# temperature and wind at 925-50 hPa and humidity at 925-300 hPa, the analysis and days 1, 3, 5, 7 and 10
# (upa-<m>_<init>.npz), and ERA5 at 00Z of each day (era5-upa_<day>.npz). Then the error maps and cross-sections of
# verification.html against ERA5 and each model's own analysis (scripts/verify/upper_maps.py), to the frames store
# with their manifest assets/verification/upper.json on main. Runs and days the database holds are skipped, so a range
# can be dispatched again after a failure.
#
# Each day it catches up the runs 1 to 47 days old (HPFX keeps GDPS about 52 days) and the days ERA5 has added on
# ARCO (about a week behind). Dispatched with a range it backfills: the ECMWF runs from the open-data mirror, GFS from
# NOAA's bucket, GDPS only within HPFX's days, so its runs go first.
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
    inputs:
      first:
        description: 'First 00Z run, YYYYMMDD (blank = 47 days ago)'
        default: ''
      last:
        description: 'Last 00Z run, YYYYMMDD (blank = yesterday)'
        default: ''
      chunk:
        description: 'Runs per job'
        default: '8'
      maps:
        description: 'Make the maps afterwards'
        type: boolean
        default: true

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt
  MVERIFY: "mverify[grib,zarr] @ git+https://github.com/scorvec/nwp_verification@f81968d42a703f0e42eb75acd526fadd3ba567e9"

permissions:
  contents: write

concurrency:
  group: verify-upper
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      first: ${{ steps.p.outputs.first }}
      last: ${{ steps.p.outputs.last }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
          CHUNK: ${{ inputs.chunk || '8' }}
        run: |
          scripts/verify/verifydb.sh list > have.txt
          python scripts/verify/upper_fields.py plan --have have.txt --chunk "$CHUNK" \
            ${FIRST:+--first "$FIRST"} ${LAST:+--last "$LAST"} >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  fields:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY"
      - name: Fetch and archive, one run at a time
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.chunk.model }}
          RUNS: ${{ matrix.chunk.runs }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          failed=""; k=0
          for r in $RUNS; do   # a run that fails is left for the next pass; the chunk's other runs go on
            if ! python scripts/verify/upper_fields.py fields --model "$MODEL" --init "$r" \
                --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"; then
              echo "::warning::$MODEL $r failed, left for the next pass"; failed="$failed $r"
              rm -f "$RUNNER_TEMP"/db-new/*_"$r".npz
            fi
            # four runs to an upload: each upload lists the database first
            if (( ++k % 4 == 0 )) && [ -d "$RUNNER_TEMP/db-new" ]; then
              scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"; rm -rf "$RUNNER_TEMP/db-new"
            fi
          done
          if [ -d "$RUNNER_TEMP/db-new" ]; then scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"; fi
          if [ -n "$failed" ]; then echo "::error::$MODEL runs not archived:$failed"; exit 1; fi

  truth:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY" gcsfs
      - name: ERA5 at 00Z of each day ARCO holds
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFYDB_PACE: "10"
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          python scripts/verify/upper_fields.py truth --first ${{ needs.plan.outputs.first }} \
            --last ${{ needs.plan.outputs.last }} --have "$RUNNER_TEMP/have.txt" --archive-out "$RUNNER_TEMP/db-new"
          scripts/verify/verifydb.sh upload "$RUNNER_TEMP/db-new"

  maps:
    needs: [fields, truth]
    # also when there was nothing to fetch; not after a failed ERA5 pass
    if: ${{ !cancelled() && needs.truth.result == 'success' && needs.fields.result != 'cancelled' && inputs.maps != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            assets/verification
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet "$MVERIFY" matplotlib==3.10.9 cartopy==0.25.0
      - name: Error maps and cross-sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify/verifydb.sh list > "$RUNNER_TEMP/have.txt"
          python scripts/verify/upper_maps.py --list --have "$RUNNER_TEMP/have.txt" > "$RUNNER_TEMP/need.txt"
          echo "$(wc -l < "$RUNNER_TEMP/need.txt") files"
          # shellcheck disable=SC2046  # the file names are meant to split
          scripts/verify/verifydb.sh get "$RUNNER_TEMP/fields" $(cat "$RUNNER_TEMP/need.txt")
          python scripts/verify/upper_maps.py --derived "$RUNNER_TEMP/fields" --out assets/verification/upper \
            --manifest assets/verification/upper.json
      - name: Publish the maps
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMES_BRANCH: "off"   # the frames store only, as the verification figures
          FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
          FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
          FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
          FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
          FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
        run: scripts/lib/publish_frames_ci.sh assets/verification/upper
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            timeout 120 git fetch origin main || { sleep 5; continue; }
            git reset -q FETCH_HEAD
            git add assets/verification/upper.json
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data update: upper-air error maps $(date -u +%Y-%m-%d)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            git reset -q --soft HEAD^   # undo the commit; refetch and rebuild it
            sleep 5
          done
          echo "push failed after retries"; exit 1

  mirror:
    needs: maps
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
      FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
      FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
      FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
      FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: The database's second copy, in the object store
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify/verifydb.sh mirror
