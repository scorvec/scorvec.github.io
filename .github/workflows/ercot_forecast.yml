name: ERCOT Load Forecast

on:
  schedule:
    - cron: '30 2  * * *'   # ~90 min after 00Z HRRR
    - cron: '30 8  * * *'   # ~90 min after 06Z HRRR
    - cron: '30 14 * * *'   # ~90 min after 12Z HRRR
    - cron: '30 20 * * *'   # ~90 min after 18Z HRRR
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas==2.2.2 numpy==1.26.4 matplotlib==3.8.4 lightgbm==4.3.0 scikit-learn==1.4.2 joblib==1.4.0 plotly==5.22.0 gridstatus==0.30.1

      - name: Run forecast
        run: python scripts/ercot_forecast.py

      - name: Commit forecast outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ERCOT load forecast [skip ci]"
          push_options: '--force-with-lease'
          file_pattern: >
            assets/ercot_forecast.png
            assets/ercot_forecast.html
