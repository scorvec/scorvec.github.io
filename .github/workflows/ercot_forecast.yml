name: ERCOT Load Forecast

on:
  schedule:
    - cron: '30 2  * * *'   # ~90 min after 00Z HRRR
    - cron: '30 8  * * *'   # ~90 min after 06Z HRRR
    - cron: '30 14 * * *'   # ~90 min after 12Z HRRR
    - cron: '30 20 * * *'   # ~90 min after 18Z HRRR
  workflow_dispatch:         # manual trigger

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so rebase works cleanly

      - name: Install eccodes (required by Herbie / cfgrib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Verify eccodes linkage
        run: |
          python -c "import cfgrib; print('cfgrib ok:', cfgrib.__version__)"
        env:
          ECCODES_DEFINITION_PATH: /usr/share/eccodes/definitions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/forecast_requirements.txt

      - name: Run forecast
        run: python scripts/ercot_forecast.py
        env:
          ECCODES_DEFINITION_PATH: /usr/share/eccodes/definitions

      - name: Commit forecast chart
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ERCOT load forecast [skip ci]"
          push_options: '--force-with-lease'
          file_pattern: assets/ercot_forecast.png
