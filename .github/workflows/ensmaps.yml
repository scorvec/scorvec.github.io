name: Global ensemble maps (data)

# ens-anomalies.html: one ensemble's run (00, 06, 12 or 18Z; GEPS 00 and 12Z; IFS-ENS 06/18Z to day 5) - 2 m
# temperature, 500 hPa height and sea-level pressure, each member's daily means to day 15 against the 1991-2020 normals
# (where the members agree on the sign) and the change from the runs 12, 6 and 48 h earlier (dotted where significant) - as
# lossless WebP on the model's own grid (scripts/ensmaps/ensmaps.py has the details). One model per run; the callers
# ensmaps-ifs.yml, ensmaps-aifs.yml, ensmaps-gefs.yml and ensmaps-geps.yml fix it, so each lands as soon as its own run
# does. The page keeps each model's four newest runs.
#
# Each run: read that model's CURRENT manifest from main, plan (the newest complete cycle not yet published), fetch +
# compute + encode, publish the cycle directory to the FRAMES STORE ONLY (FRAMES_BRANCH=off: this product never touches
# the git `frames` branch; cycles older than the four kept are pruned in the store), THEN commit the manifest to main -
# never the other way round, or the page would point at data that is not there yet. The earlier runs' statistics (the
# change tests) come from the Actions cache (ensmaps-<model>-stats-<YYYYMMDDHH>; those more than 48 h older than this
# run are deleted: a run needs the runs 6, 12 and 48 h before it). The same run labels each member's weather regime from the 500 hPa
# fields it holds (scripts/ensmaps/ensmaps_regimes.py, no download of its own) and commits the labels
# (assets/regimes/data/ensmaps_members_<model>.json for the newest run and ensmaps_members_<model>_<cycle>.json for each
# of the four, regime_core's members_record format) and, on a 00Z run, its drift archive (ensmaps_drift_<model>.json)
# with the manifest.
#
# Then the four-ensemble clusters (scripts/ensmaps/ensmaps_clusters.py): each model job leaves its members' 2.5-deg
# 500 hPa height and sea-level pressure anomalies in the Actions cache (ensmaps-<model>-fields-<cycle>, its clusters'
# drift archive in ensmaps-<model>-cdrift-<cycle>; the two newest of each kept; an IFS-ENS 06/18Z run, to day 5, leaves
# none), and the `clusters` job - one at a time across the four callers - clusters the newest run of each model there,
# publishes the figures to the frames store and commits assets/models/ensmaps_clusters.json. So the clusters update as
# each model lands, with no download.
#
# Sources per run (the steps of the full days, 6-hourly: 15 or 14, GEFS and GEPS to +384 h one more):
#   ifs   ECMWF open data, Google Cloud mirror only: 2t of the 50 perturbed members from the 0.1-deg surface files,
#         msl and gh 500 from the 0.25-deg files, byte ranges of the wanted messages
#   aifs  the same mirror: 2t, msl and z 500 of the control and 50 perturbed members, 0.25 deg
#   gefs  NOAA's AWS bucket noaa-gefs-pds only (never NOMADS): TMP 2 m, PRMSL and HGT 500 of 31 members through
#         the .idx files, byte ranges
#   geps  the MSC Datamart through scripts/geps/datamart.py (honest User-Agent, retries, ledger): three allmbrs files
#         a step
# The 2 m temperature normals come from release ensmaps-ref-v1 (ensmaps-ref.yml); without them a run publishes the
# other fields' anomalies and every change map.

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      cycle:
        type: string
        default: ""
      fields:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      model:
        description: "ifs, aifs, gefs or geps"
        required: true
        default: ifs
      cycle:
        description: "Cycle YYYYMMDDHH (blank = plan the newest unpublished; skipped when it or a newer one is published)"
        required: false
        default: ""
      force:
        description: "Rebuild the given cycle even when it is already published"
        type: boolean
        default: false
      fields:
        description: "IFS-ENS: z500,msl publishes the first stage only (blank = every field, or the 2 m stage when due)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # delete superseded statistics from the Actions cache

concurrency:
  group: ensmaps-${{ inputs.model }}
  cancel-in-progress: false

env:
  # Frames store (Bunny Storage, S3 API; scripts/lib/frames_store.py). The publish step sets FRAMES_BRANCH=off: the
  # store is this product's only copy, and with the store unconfigured the publish fails rather than use the branch.
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  FRAMES_S3_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  ECMWF_SOURCES: google
  PYTHONUNBUFFERED: '1'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      done: ${{ steps.run.outputs.done }}
      fields: ${{ steps.run.outputs.fields }}
    env:
      MODEL: ${{ inputs.model }}
      GEPS_WORK: ${{ github.workspace }}/../datamart-work   # scripts/geps/datamart.py's request ledger, scratch
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ensmaps/
            /scripts/ecmwf/
            /scripts/lib/
            /scripts/geps/datamart.py
            /scripts/geps/paths.py
            /scripts/models/publish_data.sh
            /scripts/regimes/regime_core.py
            /scripts/regimes/regimes_ecmwf.py
            /scripts/regimes/data/
            /scripts/constraints.txt
            /assets/models/ensmaps_*.json
            /assets/regimes/data/ensmaps_*.json
            /assets/regimes/data/regimes_drift_*.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --quiet numpy scipy pandas requests eccodes pillow 'pyproj>=3.7.2' \
            "quantmet @ git+https://github.com/scorvec/quantmet-tools@v0.4.2"
      - name: Plan
        id: plan
        env:
          CYCLE: ${{ inputs.cycle }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          FIELDS: ${{ inputs.fields }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$MODEL" in ifs|aifs|gefs|geps) ;; *) echo "::error::unknown model $MODEL"; exit 1 ;; esac
          mkdir -p assets/models
          # main's CURRENT manifest, not the checkout's (a run queued behind another checks out an older commit)
          if timeout 60 git fetch -q --depth 1 origin main && git show "FETCH_HEAD:assets/models/ensmaps_$MODEL.json" > "/tmp/ensmaps_$MODEL.json" 2>/dev/null; then
            cp "/tmp/ensmaps_$MODEL.json" "assets/models/ensmaps_$MODEL.json"
          else echo "no manifest on main yet for $MODEL"; rm -f "assets/models/ensmaps_$MODEL.json"; fi
          # and its regime drift archive, which only the 00Z runs extend
          D="assets/regimes/data/ensmaps_drift_$MODEL.json"
          if git show "FETCH_HEAD:$D" > "/tmp/drift_$MODEL.json" 2>/dev/null; then mkdir -p "$(dirname "$D")"; cp "/tmp/drift_$MODEL.json" "$D"; fi
          # a run dispatched as its last step lands is waited for (up to 25 min) when it is due
          # the plan prints the cycle and, for an IFS-ENS stage, its fields: "z500,msl" first, "t2m" added later
          python scripts/ensmaps/ensmaps.py plan --model "$MODEL" --manifests assets/models ${CYCLE:+--cycle "$CYCLE"} $FORCE \
            ${FIELDS:+--fields "$FIELDS"} --wait-min 25 > "$RUNNER_TEMP/plan.txt"
          read -r cyc stage < "$RUNNER_TEMP/plan.txt" || true
          if [ -z "$cyc" ]; then echo "nothing new for $MODEL"; echo "cycle=" >> "$GITHUB_OUTPUT"; exit 0; fi
          prev=$(date -u -d "${cyc:0:8} ${cyc:8:2}:00 12 hours ago" +%Y%m%d%H)
          prev6=$(date -u -d "${cyc:0:8} ${cyc:8:2}:00 6 hours ago" +%Y%m%d%H)
          prev48=$(date -u -d "${cyc:0:8} ${cyc:8:2}:00 48 hours ago" +%Y%m%d%H)
          echo "cycle=$cyc" >> "$GITHUB_OUTPUT"; echo "prev=$prev" >> "$GITHUB_OUTPUT"; echo "prev6=$prev6" >> "$GITHUB_OUTPUT"
          echo "prev48=$prev48" >> "$GITHUB_OUTPUT"; echo "stage=${stage:-}" >> "$GITHUB_OUTPUT"
          held=$(gh release view ensmaps-ref-v1 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          normals=""
          if echo "$held" | grep -qx ensmaps_t2m_normals.npz; then normals=ensmaps_t2m_normals.npz; fi
          if [ "${stage:-}" = z500,msl ]; then normals=""; fi   # a first stage has no 2 m temperature
          echo "normals=$normals" >> "$GITHUB_OUTPUT"
          echo "$MODEL $cyc ${stage:-every field} (the runs 12 h, 6 h and 48 h earlier: $prev, $prev6, $prev48; 2 m normals: ${normals:-none})"
      - name: The statistics of the run 12 h earlier
        if: steps.plan.outputs.cycle != ''
        uses: actions/cache/restore@v6
        with:
          path: ensmaps_stats
          key: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.prev }}
          restore-keys: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.prev }}-partial
      - name: The statistics of the run 6 h earlier
        if: steps.plan.outputs.cycle != '' && inputs.model != 'geps'
        uses: actions/cache/restore@v6
        with:
          path: ensmaps_stats
          key: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.prev6 }}
          restore-keys: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.prev6 }}-partial
      - name: The statistics of the run 48 h earlier (the trend over two days)
        if: steps.plan.outputs.cycle != ''
        uses: actions/cache/restore@v6
        with:
          path: ensmaps_stats
          key: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.prev48 }}
          restore-keys: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.prev48 }}-partial
      - name: This run's first-stage statistics (IFS-ENS, when 2 m temperature is added)
        if: steps.plan.outputs.stage == 't2m'
        uses: actions/cache/restore@v6
        with:
          path: ensmaps_stats
          key: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.cycle }}-partial
      - name: The clusters' drift archive of this model (the newest)
        if: steps.plan.outputs.cycle != ''
        uses: actions/cache/restore@v6
        with:
          path: cdrift
          key: ensmaps-${{ inputs.model }}-cdrift-${{ steps.plan.outputs.cycle }}
          restore-keys: ensmaps-${{ inputs.model }}-cdrift-
      - name: The 2 m temperature normals
        if: steps.plan.outputs.cycle != '' && steps.plan.outputs.normals != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NORMALS: ${{ steps.plan.outputs.normals }}
        run: gh release download ensmaps-ref-v1 -R "$GITHUB_REPOSITORY" -p "$NORMALS" -D ref --clobber
      - name: Fetch, compute, publish
        id: run
        if: steps.plan.outputs.cycle != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRAMES_BRANCH: "off"
          CYC: ${{ steps.plan.outputs.cycle }}
          PREV: ${{ steps.plan.outputs.prev }}
          PREV6: ${{ steps.plan.outputs.prev6 }}
          PREV48: ${{ steps.plan.outputs.prev48 }}
          NORMALS: ${{ steps.plan.outputs.normals }}
          STAGE: ${{ steps.plan.outputs.stage }}
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/lists"
          MERGE=""; if [ "$STAGE" = t2m ]; then MERGE=--merge; fi   # 2 m temperature added to the run on the page
          python scripts/ensmaps/ensmaps.py run --model "$MODEL" --cycle "$CYC" --site . --normals "ref/${NORMALS:-none}" \
            ${STAGE:+--fields "$STAGE"} $MERGE \
            --prev "ensmaps_stats/$PREV.npz" --prev6 "ensmaps_stats/$PREV6.npz" --prev48 "ensmaps_stats/$PREV48.npz" \
            --save "ensmaps_stats/$CYC.npz" --lists "$L" \
            --manifest-in "assets/models/ensmaps_$MODEL.json" --fields-out "clusterfields/$MODEL.npz" --cluster-drift "cdrift/$MODEL.npz"
          rm -f "ensmaps_stats/$PREV.npz" "ensmaps_stats/$PREV6.npz" "ensmaps_stats/$PREV48.npz"   # the cache entry: this run's only
          if [ "$MODEL" = geps ]; then python scripts/geps/datamart.py; fi    # the run's Datamart requests and bytes
          if [ ! -s "$L/publish.txt" ]; then echo "::warning::$MODEL $CYC is older than the run on the page - not published"; exit 0; fi
          SRC=. PRUNE="$(tr '\n' ' ' < "$L/prune.txt")" PRUNE_OLDER="$(cat "$L/floor.txt")" scripts/models/publish_data.sh $(cat "$L/publish.txt") > /dev/null
          rm -rf "assets/models/data/ensmaps/$MODEL/$CYC"       # in the store now; keep the runner disk free
          echo "done=1" >> "$GITHUB_OUTPUT"
          if [ -s "clusterfields/$MODEL.npz" ]; then echo "fields=1" >> "$GITHUB_OUTPUT"; fi
      - name: Keep this run's statistics for the next run
        if: steps.run.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ensmaps_stats
          key: ensmaps-${{ inputs.model }}-stats-${{ steps.plan.outputs.cycle }}${{ steps.plan.outputs.stage == 'z500,msl' && '-partial' || '' }}
      - name: Keep the members' fields for the clusters
        if: steps.run.outputs.fields == '1'
        uses: actions/cache/save@v6
        with:
          path: clusterfields
          key: ensmaps-${{ inputs.model }}-fields-${{ steps.plan.outputs.cycle }}
      - name: Keep the clusters' drift archive
        if: steps.run.outputs.fields == '1' && endsWith(steps.plan.outputs.cycle, '00')
        uses: actions/cache/save@v6
        with:
          path: cdrift
          key: ensmaps-${{ inputs.model }}-cdrift-${{ steps.plan.outputs.cycle }}
      # the statistics of every run of the last 48 h (the runs 6, 12 and 48 h later compare with them), the two newest of
      # the other kinds
      - name: Delete superseded caches
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV48: ${{ steps.plan.outputs.prev48 }}
        run: |
          for kind in stats fields cdrift; do
            gh cache list -R "$GITHUB_REPOSITORY" --key "ensmaps-$MODEL-$kind-" --limit 100 --json id,key -q '.[] | "\(.key) \(.id)"' \
              | sort -r | { if [ "$kind" = stats ]; then awk -v floor="$PREV48" '{ if (match($1, /[0-9]{10}/) && substr($1, RSTART, 10) < floor) print }'; else tail -n +3; fi; } \
              | while read -r k id; do
                gh cache delete "$id" -R "$GITHUB_REPOSITORY" && echo "deleted $k" || echo "::warning::could not delete $k"
              done
          done
      - name: Commit & push the manifest and the regime labels
        if: steps.run.outputs.done == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          R=assets/regimes/data
          outs() { ls "assets/models/ensmaps_$MODEL.json" "$R/ensmaps_members_$MODEL.json" "$R/ensmaps_members_${MODEL}_"*.json "$R/ensmaps_drift_$MODEL.json" 2>/dev/null; }
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" $(outs)
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            rm -f "$R/ensmaps_members_${MODEL}_"*.json   # the runs' records: the snapshot's four, the older ones deleted
            tar xf "$SNAP/outs.tar"
            for f in $(outs); do git add -f "$f"; done
            git ls-files --deleted -- "$R/ensmaps_members_${MODEL}_*.json" | while read -r f; do git rm -q --cached "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "ensmaps: $MODEL ${{ steps.plan.outputs.cycle }}"
            if timeout 180 git push origin HEAD:main; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

  clusters:
    needs: run
    if: needs.run.outputs.fields == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ensmaps-clusters
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ensmaps/
            /scripts/lib/
            /scripts/regimes/regime_core.py
            /scripts/regimes/data/
            /scripts/models/publish_data.sh
            /scripts/constraints.txt
            /assets/models/geo_polar_coarse.json
            /assets/models/ensmaps_clusters.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --quiet numpy scipy pandas pillow 'pyproj>=3.7.2' matplotlib==3.10.9 \
            "quantmet @ git+https://github.com/scorvec/quantmet-tools@v0.4.2"
      - name: The newest IFS-ENS fields
        uses: actions/cache/restore@v6
        with:
          path: clusterfields
          key: ensmaps-ifs-fields-newest
          restore-keys: ensmaps-ifs-fields-
      - name: The newest AIFS-ENS fields
        uses: actions/cache/restore@v6
        with:
          path: clusterfields
          key: ensmaps-aifs-fields-newest
          restore-keys: ensmaps-aifs-fields-
      - name: The newest GEFS fields
        uses: actions/cache/restore@v6
        with:
          path: clusterfields
          key: ensmaps-gefs-fields-newest
          restore-keys: ensmaps-gefs-fields-
      - name: The newest GEPS fields
        uses: actions/cache/restore@v6
        with:
          path: clusterfields
          key: ensmaps-geps-fields-newest
          restore-keys: ensmaps-geps-fields-
      - name: Cluster, draw, publish
        id: cl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRAMES_BRANCH: "off"
        run: |
          set -euo pipefail
          ls -la clusterfields 2>/dev/null || true
          # main's current manifest: the published figures it names are pruned once the new ones are up
          if timeout 60 git fetch -q --depth 1 origin main && git show FETCH_HEAD:assets/models/ensmaps_clusters.json > /tmp/clusters.json 2>/dev/null; then
            cp /tmp/clusters.json assets/models/ensmaps_clusters.json
          fi
          L="$RUNNER_TEMP/lists"
          python scripts/ensmaps/ensmaps_clusters.py run --fields clusterfields/*.npz --site . --lists "$L" \
            --manifest-in assets/models/ensmaps_clusters.json
          if [ ! -s "$L/publish.txt" ]; then echo "nothing to publish"; exit 0; fi
          SRC=. PRUNE="$(tr '\n' ' ' < "$L/prune.txt")" PRUNE_OLDER="$(cat "$L/floor.txt")" scripts/models/publish_data.sh $(cat "$L/publish.txt") > /dev/null
          echo "done=1" >> "$GITHUB_OUTPUT"
      - name: Commit & push the clusters' manifest
        if: steps.cl.outputs.done == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT=assets/models/ensmaps_clusters.json
          SNAP=$(mktemp -d)
          cp "$OUT" "$SNAP/"
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            cp "$SNAP/$(basename "$OUT")" "$OUT"
            git add -f "$OUT"
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "ensmaps: clusters after $MODEL"
            if timeout 180 git push origin HEAD:main; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
        env:
          MODEL: ${{ inputs.model }}
