name: CMIP6 wave reflection and downward propagation (large-sample test)

# Wave reflection and downward propagation tested on CMIP6 (scripts/strat/cmip6_coupling.py). Each model's piControl
# (its first `picontrol_years`) and up to `members` historical runs, from the public Pangeo CMIP6 Google Cloud mirror
# (anonymous): the DynVarMIP zonal means (EdayZ ua, and epfz where published), day psl and tas, and for `regional`
# models day va and ta at 100 hPa. One job per run reduces it to daily series (cmip6_coupling_extract.py); a final job
# finds the events in every run, tests what follows across models and commits the tests and the run log
# (scripts/strat/reference/cmip6_coupling_tests.json, _log.json); the daily series and the event table go to release
# cmip6-coupling-v1. A run streams ~10-150 GB (the regional plev8 stores carry all eight levels). Dispatch only.
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated source_ids (those without EdayZ ua, day psl and day tas are skipped)'
        default: 'AWI-ESM-1-1-LR,CESM2,CESM2-FV2,CESM2-WACCM,CNRM-CM6-1,CNRM-ESM2-1,CanESM5,GFDL-CM4,GFDL-ESM4,HadGEM3-GC31-LL,INM-CM4-8,INM-CM5-0,IPSL-CM6A-LR,MIROC6,MPI-ESM-1-2-HAM,MPI-ESM1-2-HR,MPI-ESM1-2-LR,MRI-ESM2-0,UKESM1-0-LL'
      regional:
        description: 'Models whose day va and ta are read too (the regional reflection index)'
        default: 'CanESM5,CNRM-CM6-1,GFDL-CM4'
      picontrol_years:
        description: 'piControl years per model (from its start)'
        default: '500'
      members:
        description: 'Historical members per model'
        default: '10'
      analyse:
        description: 'Run the tests and commit them (false = extracts only, kept as artifacts)'
        default: 'true'
      from_run:
        description: 'Finished run ids (comma-separated) whose extracts to test, together (blank = extract now)'
        default: ''

permissions:
  contents: write

concurrency:
  group: strat-coupling-cmip6
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/cmip6_coupling_extract.py
            scripts/strat/ssw_imprint.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas xarray pyproj
      - name: Catalogue
        run: curl -sSf --retry 3 -o /tmp/pangeo-cmip6.csv https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
      - id: m
        env:
          MODELS: ${{ inputs.models }}
          MEMBERS: ${{ inputs.members }}
        run: |
          runs=$(python scripts/strat/cmip6_coupling_extract.py plan --catalog /tmp/pangeo-cmip6.csv --models "$MODELS" --members "$MEMBERS")
          echo "$runs" | python3 -c "import json, sys; r = json.load(sys.stdin); print(len(r), 'runs'); [print(' ', x) for x in r]"
          echo "matrix=$(echo "$runs" | python3 -c "import json, sys; print(json.dumps({'include': json.load(sys.stdin)[:256]}))")" >> "$GITHUB_OUTPUT"

  model:
    needs: plan
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/strat/cmip6_coupling_extract.py
            scripts/strat/ssw_imprint.py
            scripts/strat/reference/ssw_imprint.nc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas xarray "zarr>=3" gcsfs cftime scipy netCDF4 pyproj
      - name: Catalogue
        run: curl -sSf --retry 3 -o /tmp/pangeo-cmip6.csv https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
      - name: Reduce ${{ matrix.model }} ${{ matrix.experiment }} ${{ matrix.member }}
        env:
          YEARS: ${{ inputs.picontrol_years }}
          REGIONAL: ${{ inputs.regional }}
        run: |
          reg=; case ",$REGIONAL," in *",${{ matrix.model }},"*) reg=--regional ;; esac
          python scripts/strat/cmip6_coupling_extract.py run --catalog /tmp/pangeo-cmip6.csv --model ${{ matrix.model }} \
            --experiment ${{ matrix.experiment }} --member ${{ matrix.member }} --picontrol-years "$YEARS" $reg --out out
          ls -la out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coupling_${{ matrix.model }}_${{ matrix.experiment }}_${{ matrix.member }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore

  analyse:
    needs: model
    if: ${{ !cancelled() && inputs.analyse == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas scipy
      # every listed run's extracts (a later run of a model replaces an earlier one's file)
      - name: Collect the extracts
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ inputs.from_run || github.run_id }}
        run: |
          mkdir -p runs
          for id in ${IDS//,/ }; do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'coupling_*' -D "dl/$id"
            find "dl/$id" -type f \( -name '*.npz' -o -name '*_log.json' \) -exec cp {} runs/ \;
          done
          ls runs | wc -l
      - name: Events and tests
        run: |
          ls runs | head -80
          python scripts/strat/cmip6_coupling.py --runs runs --out scripts/strat/reference/cmip6_coupling
          python3 -c "import glob, json; json.dump({f.split('/')[-1][:-9]: json.load(open(f)) for f in sorted(glob.glob('runs/*_log.json'))}, open('scripts/strat/reference/cmip6_coupling_log.json', 'w'), indent=1)"
      - name: Daily series to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -cf /tmp/cmip6_coupling_runs.tar -C runs $(cd runs && ls *.npz)
          cp scripts/strat/reference/cmip6_coupling_events.csv.gz /tmp/
          gh release view cmip6-coupling-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create cmip6-coupling-v1 -R "$GITHUB_REPOSITORY" --title "CMIP6 stratosphere-troposphere coupling: daily series v1" \
              --notes "Daily series per CMIP6 run (scripts/strat/cmip6_coupling_extract.py): u(60N) 10/50 hPa, 10/100 hPa polar cap, 100/50 hPa eddy heat flux by wave, Siberia/Canada regional heat flux, the SSW imprint projection, North America / Eurasia 2 m temperature. From the Pangeo CMIP6 mirror (CMIP6 terms of use: cite the models)."
          gh release upload cmip6-coupling-v1 /tmp/cmip6_coupling_runs.tar /tmp/cmip6_coupling_events.csv.gz -R "$GITHUB_REPOSITORY" --clobber
      # Never rebase: snapshot, reset to a fresh origin/main each attempt, lay the snapshot back on, commit, push.
      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "26825570+scorvec@users.noreply.github.com"
          OUTS="scripts/strat/reference/cmip6_coupling_tests.json scripts/strat/reference/cmip6_coupling_log.json"
          git add $OUTS
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          SNAP=$(mktemp -d)
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard origin/main
            tar xf "$SNAP/outs.tar"
            git add $OUTS
            if git diff --staged --quiet; then echo "no changes after resync"; exit 0; fi
            git commit -q -m "strat: CMIP6 reflection and downward-propagation tests $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            echo "push $i rejected; resyncing"; sleep 5
          done
          echo "push failed after retries"; exit 1
