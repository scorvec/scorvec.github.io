name: Wind generation forecast

# Run ~3h after each extended HRRR cycle (00/06/12/18Z) lands on AWS.
on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'HRRR cycle (UTC ISO, e.g. 2026-04-30T18:00). Empty = latest.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: wind-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: scripts
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/requirements-wind.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install eccodes (GRIB decoder)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0

      - name: Install Python dependencies
        run: pip install -r requirements-wind.txt gridstatus gridstatusio

      - name: Download USWTDB
        run: |
          mkdir -p data
          cd data
          if [ -f uswtdb.csv ]; then
            echo "Using committed uswtdb.csv ($(wc -l < uswtdb.csv) rows)"
            exit 0
          fi
          curl -L --fail --silent --show-error \
               -o uswtdbCSV.zip \
               "https://energy.usgs.gov/uswtdb/assets/data/uswtdbCSV.zip"
          unzip -o uswtdbCSV.zip
          shopt -s nullglob nocaseglob
          for f in uswtdb_v*.csv; do
            mv "$f" uswtdb.csv
            break
          done
          ls -lh uswtdb.csv

      - name: Download EIA-860
        run: |
          cd data
          if ls 2___Plant_Y*.xlsx >/dev/null 2>&1; then
            echo "Using committed EIA-860: $(ls 2___Plant_Y*.xlsx)"
            exit 0
          fi
          curl -L --fail --silent --show-error \
               -A "Mozilla/5.0" \
               -o eia860.zip \
               "https://www.eia.gov/electricity/data/eia860/xls/eia8602024.zip"
          unzip -o eia860.zip "2___Plant_Y2024.xlsx"
          ls -lh "2___Plant_Y2024.xlsx"

      - name: Choose HRRR cycle
        id: cycle
        run: |
          if [ -n "${{ inputs.cycle }}" ]; then
            CYCLE="${{ inputs.cycle }}"
            echo "Using manually-specified cycle: $CYCLE"
          else
            CYCLE=$(python find_latest_extended_cycle.py)
            echo "Latest extended cycle: $CYCLE"
          fi
          COMPACT=$(python -c "
          from datetime import datetime
          dt = datetime.fromisoformat('$CYCLE')
          print(dt.strftime('%Y%m%dT%HZ'))
          ")
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT
          echo "compact=$COMPACT" >> $GITHUB_OUTPUT

      - name: Run forecast pipeline
        run: |
          EIA860=$(ls data/2___Plant_Y*.xlsx | head -1)
          echo "Using EIA-860: $EIA860"
          python run.py \
            --uswtdb data/uswtdb.csv \
            --eia860 "$EIA860" \
            --cycle "${{ steps.cycle.outputs.cycle }}" \
            --fxx-end 48 \
            --output-dir output/ \
            -v

      - name: Build dashboard
        run: |
          python dashboard.py \
            "output/forecast_iso_${{ steps.cycle.outputs.compact }}.csv" \
            --plotly-js cdn \
            --theme dark \
            --title "US Wind Generation Forecast" \
            -o ../assets/wind_forecast.html
          ls -lh ../assets/wind_forecast.html

      - name: Archive forecast CSV
        run: |
          mkdir -p ../assets/wind_forecast_data
          cp "output/forecast_iso_${{ steps.cycle.outputs.compact }}.csv" \
             "../assets/wind_forecast_data/forecast_iso_${{ steps.cycle.outputs.compact }}.csv"
          cp "output/forecast_ba_${{ steps.cycle.outputs.compact }}.csv" \
             "../assets/wind_forecast_data/forecast_ba_${{ steps.cycle.outputs.compact }}.csv"
          cp "output/forecast_plant_${{ steps.cycle.outputs.compact }}.csv" \
             "../assets/wind_forecast_data/forecast_plant_${{ steps.cycle.outputs.compact }}.csv" \
             2>/dev/null || true
          cp output/capacity_*_${{ steps.cycle.outputs.compact }}.csv \
             ../assets/wind_forecast_data/ 2>/dev/null || true
          cd ../assets/wind_forecast_data
          ls -t forecast_iso_*.csv   2>/dev/null | tail -n +57 | xargs -r rm
          ls -t forecast_ba_*.csv    2>/dev/null | tail -n +57 | xargs -r rm
          ls -t forecast_plant_*.csv 2>/dev/null | tail -n +57 | xargs -r rm
          ls -t capacity_iso_*.csv   2>/dev/null | tail -n +57 | xargs -r rm
          ls -t capacity_ba_*.csv    2>/dev/null | tail -n +57 | xargs -r rm
          ls -t capacity_plant_*.csv 2>/dev/null | tail -n +57 | xargs -r rm

      - name: Build plant-level map
        run: |
          if [ ! -f "../assets/wind_forecast_data/forecast_plant_${{ steps.cycle.outputs.compact }}.csv" ]; then
            echo "Plant-level CSV not found; skipping map build."
            exit 0
          fi
          python map_dashboard.py \
            "../assets/wind_forecast_data/forecast_plant_${{ steps.cycle.outputs.compact }}.csv" \
            --capacity "../assets/wind_forecast_data/capacity_plant_${{ steps.cycle.outputs.compact }}.csv" \
            --output ../assets/wind_map.html \
            --theme light || {
              echo "Map build failed; continuing anyway."
              exit 0
            }
          ls -lh ../assets/wind_map.html || true

      - name: Update verification dashboard
        env:
          GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
          USE_ISO_DIRECT: "1"
        run: |
          if [ -z "$GRIDSTATUS_API_KEY" ]; then
            echo "GRIDSTATUS_API_KEY not set; direct ISO fetchers will still"
            echo "provide actuals, but curtailment data will be unavailable."
          fi
          python update_verification.py || {
            echo "Verification update failed; continuing anyway."
            exit 0
          }

      - name: Stamp cache-buster into charts.html
        run: |
          CYCLE='${{ steps.cycle.outputs.compact }}'
          TODAY=$(date -u +'%Y-%m-%d %H:%MZ')
          CHARTS="${{ github.workspace }}/charts.html"
          if [ ! -f "$CHARTS" ]; then
            echo "ERROR: $CHARTS not found"
            ls -la "${{ github.workspace }}/" | head -20
            exit 1
          fi
          VER_FILE="${{ github.workspace }}/assets/wind_verification.html"
          if [ -f "$VER_FILE" ]; then
            VER_STAMP=$(md5sum "$VER_FILE" | cut -c1-12)
          else
            VER_STAMP="${CYCLE}"
          fi
          echo "Forecast/map cycle stamp: ${CYCLE}"
          echo "Verification file hash:   ${VER_STAMP}"
          sed -i -E "s|(wind_forecast\.html\?v=)[^\"]*|\1${CYCLE}|g" "$CHARTS"
          sed -i -E "s|(wind_verification\.html\?v=)[^\"]*|\1${VER_STAMP}|g" "$CHARTS"
          sed -i -E "s|(wind_map\.html\?v=)[^\"]*|\1${CYCLE}|g" "$CHARTS"
          sed -i -E "s|(id=\"last-updated-wind\">Cycle )[^<]*|\1${CYCLE}|g" "$CHARTS"
          sed -i -E "s|(id=\"last-updated-verif\">Updated )[^<]*|\1${TODAY}|g" "$CHARTS"
          sed -i -E "s|(id=\"last-updated-map\">Cycle )[^<]*|\1${CYCLE}|g" "$CHARTS"
          N=$(grep -c "?v=" "$CHARTS" || true)
          echo "Total iframe ?v= stamps in $CHARTS: ${N}"
          echo "Charts file head:"
          grep -n "wind_forecast.html\|wind_verification.html\|wind_map.html\|last-updated" "$CHARTS" | head -10

      - name: Commit and push dashboard
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pull first, in case another workflow pushed concurrently
          git pull --rebase || echo "Pull/rebase failed; continuing"
          git add charts.html
          git add assets/wind_forecast.html
          git add assets/wind_forecast_data/
          if [ -f assets/wind_verification.html ]; then
            git add assets/wind_verification.html
            echo "Staged: assets/wind_verification.html"
          else
            echo "WARNING: assets/wind_verification.html not found; skipping"
          fi
          if [ -f assets/wind_map.html ]; then
            git add assets/wind_map.html
            echo "Staged: assets/wind_map.html"
          else
            echo "WARNING: assets/wind_map.html not found; skipping"
          fi
          echo "--- Staged files ---"
          git diff --staged --name-only
          echo "--------------------"
          if git diff --staged --quiet; then
            echo "No changes; skipping commit."
          else
            git commit -m "wind forecast: cycle ${{ steps.cycle.outputs.compact }}"
            # Retry on push conflicts (solar/synoptic workflows may have
            # pushed concurrently and changed the remote)
            for i in 1 2 3; do
              if git push; then
                break
              else
                echo "Push attempt $i failed; pulling and retrying..."
                git pull --rebase
              fi
            done
          fi

      - name: Forecast summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "### Forecast summary" >> $GITHUB_STEP_SUMMARY
          echo "- Cycle: \`${{ steps.cycle.outputs.cycle }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard: [/charts.html](https://scorvec.github.io/charts.html)" >> $GITHUB_STEP_SUMMARY
          CURVE_CSV="scripts/output/curve_assignment_${{ steps.cycle.outputs.compact }}.csv"
          if [ -f "$CURVE_CSV" ]; then
            echo "- Curve assignment summary:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -20 "$CURVE_CSV" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
