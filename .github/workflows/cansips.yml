name: CanSIPS Niño-3.4 forecast (monthly)

# CanSIPS issues a new seasonal forecast on the 1st of each month, so we run on
# the 1st (plus a same-day retry). The model hindcast climatology per start-month
# is cached/committed (cansips_nino34_clim.nc), so only a never-seen start-month
# triggers the ~1.4 GB hindcast download.
on:
  schedule:
    - cron: '23 13 1 * *'     # 1st of month (data lands on the 1st)
    - cron: '23 21 1 * *'     # same-day retry
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cansips
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install eccodes (GRIB decoder)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0
      - name: Install Python dependencies
        run: pip install numpy pandas xarray cfgrib matplotlib netcdf4 h5netcdf

      - name: Build CanSIPS GEM-NEMO Niño-3.4 plume
        working-directory: scripts/sst
        run: python cansips_nino34.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sst/cansips_nino34.webp scripts/sst/cansips_nino34_clim.nc
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "CanSIPS Niño-3.4: monthly refresh"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort||true; git reset --hard origin/main; git add assets/sst/cansips_nino34.webp scripts/sst/cansips_nino34_clim.nc; git diff --staged --quiet || git commit -m "CanSIPS Niño-3.4: monthly refresh (re-applied)"; }
            sleep 5
          done
          echo "push failed"; exit 1
