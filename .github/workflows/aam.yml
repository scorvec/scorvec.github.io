name: Jets (AIFS-ENS) and dynamic tropopause (IFS control)

# The heavy leg of the atmosphere page: the jets figure/loop and the dynamic tropopause. The jets need the ~3 GB
# 14-level AIFS-ENS pull, so they live apart from mjo.yml (RMM + the light products) and are fired by the dispatcher
# ~40 min after it (scripts/lib/dispatch_workflows.sh). The dynamic tropopause is drawn from the IFS control (HRES
# until May 2026; t/u/v on nine levels, byte-ranged, ~1 GB), whose 00/12Z run reaches day 10 on the Google mirror
# ~T+7.5 h, before these slots (T+9.3 h); its step still waits up to 40 min for it. Angular momentum and its torque
# budget moved to IFS-ENS (aam-ifs.yml); the tropical-cyclone products to tc.yml.
on:
  # Backstop crons at the dispatcher's slots, for when it is off. GitHub delivers them hours late when at all, so
  # they set no timing: a scheduled run whose cycle main already carries stops in the check job.
  schedule:
    - cron: '20 9 * * *'
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = latest AIFS-ENS)'
        default: ''
      time:
        description: 'Cycle hour, 00 or 12 (blank = latest)'
        default: ''

permissions:
  contents: write
  actions: write   # dispatch pages.yml after committing

concurrency:
  group: aam
  cancel-in-progress: false

# ECMWF open data comes from the Google Cloud mirror only. The shared store already defaults to Google and ignores
# any other mirror name; pinning it here is belt and braces.
env:
  ECMWF_SOURCES: google
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.cyc.outputs.date }}
      time: ${{ steps.cyc.outputs.time }}
      build: ${{ steps.done.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ecmwf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the resolver's HTTP client
        run: pip install --quiet requests

      - name: Resolve cycle
        id: cyc
        working-directory: scripts/ecmwf
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; T="${{ github.event.inputs.time }}"
          if [ -z "$D" ] || [ -z "$T" ]; then
            # Availability, not the clock: the shared resolver takes the newest cycle whose every step
            # is on the Google mirror (scripts/ecmwf/cycles.py) and logs why it passed over a newer one.
            python cycles.py --profile aifs-ens --out /tmp/cyc || true
            D=$(awk '{print $1}' /tmp/cyc 2>/dev/null || true)
            T=$(awk '{print $2}' /tmp/cyc 2>/dev/null || true)
          fi
          if ! echo "$D" | grep -qE '^[0-9]{8}$' || ! echo "$T" | grep -qE '^(00|12)$'; then
            echo "ERROR: no ready cycle (D='$D' T='$T') - see the resolver's lines above" >&2; exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "time=$T" >> "$GITHUB_OUTPUT"
          echo "cycle: $D ${T}Z"

      # Dispatches always build. A scheduled run builds only when main's dt_manifest.json (written for every cycle this
      # job publishes) is not already this cycle's: the dispatcher got there first.
      - name: Already published?
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          D="${{ steps.cyc.outputs.date }}"; want="${D:0:4}-${D:4:2}-${D:6:2}T${{ steps.cyc.outputs.time }}:00Z"
          have=$(gh api "repos/$GITHUB_REPOSITORY/contents/assets/sst/anim/dt_manifest.json?ref=main" \
                   -H "Accept: application/vnd.github.raw+json" 2>/dev/null \
                 | python -c "import json, sys; print(json.load(sys.stdin).get('init', ''))" 2>/dev/null || true)
          if [ "$have" = "$want" ]; then
            echo "main already carries the $want cycle; nothing to do"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "main has ${have:-no dated dt_manifest.json}; building $want"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      MJO_HEAVY_ATMOS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: Install eccodes (GRIB decoder)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin

      - name: Install Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      - name: Cycle (resolved in the check job)
        id: cyc
        run: |
          echo "date=${{ needs.check.outputs.date }}" >> "$GITHUB_OUTPUT"; echo "time=${{ needs.check.outputs.time }}" >> "$GITHUB_OUTPUT"
          echo "cycle: ${{ needs.check.outputs.date }} ${{ needs.check.outputs.time }}Z"

      # The light pass first (the surface fields), then the 14-level pull the jets read. Non-fatal: the builders use
      # whatever is cached.
      - name: Fetch the ENS cycle (light sfc + the ~3 GB 14-level u)
        working-directory: scripts/mjo
        timeout-minutes: 75
        run: |
          MJO_HEAVY_ATMOS= python src/ens_cycle.py --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" \
            || "$GITHUB_WORKSPACE/scripts/lib/degraded.sh" "ENS cycle fetch (light pass)" "the builders use whatever is cached"
          python src/ens_cycle.py --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" \
            || "$GITHUB_WORKSPACE/scripts/lib/degraded.sh" "ENS cycle fetch (14-level u)" "the builders use whatever is cached"
          du -sh data 2>/dev/null || true

      - name: Jets
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/anim/jets
          python src/jets.py --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" \
            --out ../../assets/sst/jets.webp \
            --anim-dir ../../assets/sst/anim/jets --manifest ../../assets/sst/anim/jets_manifest.json \
            || "$GITHUB_WORKSPACE/scripts/lib/degraded.sh" "Jets"

      - name: Dynamic tropopause (IFS control)
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/anim/dt ../../assets/sst/anim/dt_npac ../../assets/sst/anim/dt_na ../../assets/sst/anim/dt_atl ../../assets/sst/anim/dt_asia ../../assets/sst/anim/dt_pv330 ../../assets/sst/anim/dt_pv330_npac ../../assets/sst/anim/dt_pv330_na ../../assets/sst/anim/dt_pv330_atl ../../assets/sst/anim/dt_pv330_asia ../../assets/sst/anim/dt_pv350 ../../assets/sst/anim/dt_pv350_npac ../../assets/sst/anim/dt_pv350_na ../../assets/sst/anim/dt_pv350_atl ../../assets/sst/anim/dt_pv350_asia ../../assets/sst/anim/dt_sam ../../assets/sst/anim/dt_pv330_sam ../../assets/sst/anim/dt_pv350_sam
          python src/dt_charts.py --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" \
            --anim-dir ../../assets/sst/anim --manifest ../../assets/sst/anim/dt_manifest.json --wait-min 40 \
            || "$GITHUB_WORKSPACE/scripts/lib/degraded.sh" "Dynamic tropopause"

      # The North Pacific jet is built in strat.yml / strat-ifs.yml (it needs 250 hPa v, which only the stratosphere
      # jobs fetch); it reads the torque_ranges.json that aam-ifs.yml writes, from main.

      - name: Cache-bust the rebuilt figures
        run: |
          CB=$(date -u +%Y%m%d%H%M)
          perl -0pi -e "s/(jets\.webp)\?v=\w+/\${1}?v=$CB/g" circulation.html

      - name: Publish loop frames to the frames branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/jets assets/sst/anim/dt assets/sst/anim/dt_npac assets/sst/anim/dt_na assets/sst/anim/dt_atl assets/sst/anim/dt_asia assets/sst/anim/dt_pv330 assets/sst/anim/dt_pv330_npac assets/sst/anim/dt_pv330_na assets/sst/anim/dt_pv330_atl assets/sst/anim/dt_pv330_asia assets/sst/anim/dt_pv350 assets/sst/anim/dt_pv350_npac assets/sst/anim/dt_pv350_na assets/sst/anim/dt_pv350_atl assets/sst/anim/dt_pv350_asia assets/sst/anim/dt_sam assets/sst/anim/dt_pv330_sam assets/sst/anim/dt_pv350_sam

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot outputs, then commit on a clean sync of origin/main each attempt
          # (same pattern as mjo.yml: losing the build to a rebase is structurally impossible).
          # circulation.html is not snapshotted: a run that started before a page push would restore its stale copy
          # over it. The cache-bust is re-applied to main's current page on every attempt instead.
          CB=$(date -u +%Y%m%d%H%M)
          OUT="assets/sst/anim/jets_manifest.json assets/sst/jets.webp assets/sst/anim/dt_manifest.json"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            perl -0pi -e "s/(jets\.webp)\?v=\w+/\${1}?v=$CB/g" circulation.html
            git add circulation.html
            for f in $OUT; do [ -e "$f" ] && git add "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "data update: ${{ steps.cyc.outputs.date }}_${{ steps.cyc.outputs.time }}z (a)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      # A commit pushed with GITHUB_TOKEN does not trigger the Pages deploy; deploys
      # are batched and the dispatcher runs pages.yml within 15 min.
      - name: Deploy the site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "site deploy is batched - the dispatcher deploys within 15 min (pages.yml)"

      - name: Summary
        if: always()
        run: scripts/lib/degraded.sh --summary
