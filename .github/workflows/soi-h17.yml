name: SOI hourly — 17Z

# One of 24 schedule-only callers for soi-hourly.yml. Each asks GitHub for a
# SINGLE firing per day, the frequency band that was honoured 5/5 in the
# 2026-08-30 measurements, instead of one workflow asking for 24 and getting
# five. All the work lives in the reusable workflow; this file is the schedule.
on:
  schedule:
  - cron: '12 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/soi-hourly.yml
    secrets: inherit
