name: HRRR ECAPE (CONUS)

# Gridded entraining CAPE (Peters et al. 2023) over the HRRR CONUS domain, as a
# full 48 h forecast loop from one of the extended cycles.
#
# Only 00/06/12/18Z run past F18 - a 13Z cycle 404s on F24 - so the driver
# resolves ONE extended cycle up front (probing F48, whose tail publishes well
# after the analysis) and pins every forecast hour to it. Re-resolving per hour
# could straddle two model runs midway through a loop.
#
# Cost per cycle, measured rather than assumed:
#   per forecast hour   ~397 MB download, ~2.3 GB scratch, ~100 s kernel on
#                       2 cores (199 s CPU for 1,905,141 columns), ~5 s render
#   29 frames           ~11.5 GB pulled, ~52 min wall (fetch overlaps compute)
# Scratch is deleted between hours, so disk never holds more than one.
#
# Frames go to the orphan `frames` branch, never to main: 29 frames x 4 fields
# is ~29 MB per cycle, and committing that to main is exactly the churn that
# forced the 2026-08-28 history collapse. The manifest (small JSON) stays on
# main so the animator fetches it same-origin.
# THE OPERATIONAL PATH, as of 2026-08-29. Runs here rather than on the laptop so
# the laptop's cores stay free (it is routinely running WRF under mpirun -np 18,
# which was taking ECAPE from ~17 min to ~45). Measured on a runner: 135 s per
# frame on 4 threads, ~70 min for the 29-frame loop - slower than the laptop's
# ~7 min, but it costs nothing that matters and nobody waits on it.
#
# Scheduled just after each extended cycle's analysis lands. Only 00/06/12/18Z
# run to F48, and HRRR writes a run out over ~1.5-2 h one forecast hour at a
# time, so the driver resolves the cycle on F00 and then FOLLOWS the model:
# each hour waits up to 40 min for its own file. The compute rides along behind
# the model instead of idling until F48 is up and then starting.
#
# GitHub honours only a fraction of this repo's cron firings and delivers them
# hours late (see the throttling note in the repo history), so treat this as
# "whenever it fires" - a missed cycle costs freshness, never data.
on:
  schedule:
    - cron: '20 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      fxx:
        description: 'Forecast hours (space-separated). Default: hourly to 18, 3-hourly to 48'
        default: ''
      cycle:
        description: 'Cycle as YYYYMMDDHH (blank = newest extended run with F48 up)'
        default: ''
      publish:
        description: 'Publish to the site (false = render + upload artifacts only)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ecape
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: System libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 libgeos-dev libproj-dev proj-bin

      - run: pip install --quiet numpy matplotlib cartopy eccodes

      - name: Build the SHARPlib kernel
        run: |
          chmod +x scripts/ecape/build.sh
          ./scripts/ecape/build.sh

      - name: Resolve the cycle
        id: cyc
        run: |
          set -euo pipefail
          C="${{ github.event.inputs.cycle || '' }}"
          if [ -z "$C" ]; then
            # Probe F00, not F48: --extended-only already restricts to the 00/06/12/18Z
            # runs, so this picks the newest extended cycle whose ANALYSIS is up
            # and the loop then follows the model as later hours publish.
            C=$(python scripts/ecape/fetch_hrrr.py --print-cycle --extended-only --probe-fxx 0)
          fi
          echo "cycle=$C" >> "$GITHUB_OUTPUT"
          echo "resolved cycle: $C"
          # Already published? Then there is nothing to do. Measured 2026-08-30:
          # the 06:55Z run resolved 2026083000 because the 06Z analysis was not
          # up yet, spent 72 min re-rendering an identical loop and committed
          # "no changes". Skipping costs one file read.
          PUB=$(python -c "import json;print(json.load(open('assets/ecape/anim/ecape_manifest.json'))['ver'])" 2>/dev/null || echo "")
          if [ -n "$PUB" ] && [ "$PUB" = "$C" ] && [ -z "${{ github.event.inputs.cycle }}" ]; then
            echo "cycle $C is already the published one (manifest ver=$PUB) - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute and render the loop
        if: ${{ steps.cyc.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          CYCLE="${{ steps.cyc.outputs.cycle }}"
          FXX="${{ github.event.inputs.fxx }}"
          if [ -z "$FXX" ]; then
            # Hourly where it matters, 3-hourly out to 48 - the extra detail past
            # day 1 is not worth 20 more forecast hours of runtime.
            FXX="$(seq 0 1 18) $(seq 21 3 48)"
          fi
          # A previous cycle's frames MUST go: the manifest is built by globbing
          # this tree, so a leftover F45 from an older run would be published with
          # the new cycle's valid time.
          rm -rf assets/ecape/anim
          mkdir -p assets/ecape/anim
          # seq emits NEWLINES and `read -a` stops at the first one, so this
          # silently produced a single-element array and rendered only F00 while
          # reporting success. Normalise whitespace to spaces before splitting.
          read -r -a HOURS <<< "$(printf '%s' "$FXX" | tr '\n\t' '  ')"
          fetch_one() {   # $1 = forecast hour
            python scripts/ecape/fetch_hrrr.py \
              --date "${CYCLE:0:8}" --hour "${CYCLE:8:2}" --fxx "$1" \
              --out "$RUNNER_TEMP/hrrr_f$1" --quiet --wait-minutes 40
          }
          # The kernel is ~96 s on two cores and the fetch is ~30 s, and they
          # need nothing from each other - so pull hour N+1 while hour N is
          # computing. Costs one extra 2.3 GB scratch on disk (~4.6 GB of ~14 GB)
          # and takes roughly 14 min off a 29-frame run.
          fetch_one "${HOURS[0]}"
          for i in "${!HOURS[@]}"; do
            f="${HOURS[$i]}"
            nxt="${HOURS[$((i+1))]:-}"
            if [ -n "$nxt" ]; then fetch_one "$nxt" & BG=$!; else BG=""; fi
            echo "::group::F$f"
            STEM="$RUNNER_TEMP/hrrr_f$f"
            ./scripts/ecape/ecape_grid "$STEM"
            python scripts/ecape/render_ecape.py "$STEM" --anim-root assets/ecape/anim
            rm -f "$STEM.f32" "${STEM}_ecape.f32" "$STEM.json" "${STEM}_ecape.json"
            df -h "$RUNNER_TEMP" | tail -1
            echo "::endgroup::"
            # A failed prefetch must fail the run, not silently skip an hour.
            if [ -n "$BG" ]; then wait "$BG"; fi
          done
          # Same guard as run_local_ecape.sh. Without it a run that loses a
          # forecast hour still publishes, force-pushing a short loop over the
          # good one on the frames branch and committing a matching manifest.
          # The local first run proved a partial set publishes happily and exits
          # 0 - the frame count is the only thing that catches it.
          want=${#HOURS[@]}
          for fld in ecape_ml ecape_mu ratio_mu; do
            got=$(find "assets/ecape/anim/$fld" -name 'F*.webp' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$got" -ne "$want" ]; then
              echo "::error::$fld has $got frames, expected $want — refusing to publish a partial loop"
              exit 1
            fi
          done
          echo "frame count verified: $want per field across 3 fields"
          python scripts/ecape/build_manifest.py assets/ecape/anim --cycle "$CYCLE"
          # Stills for the page's static panels come from the analysis frame.
          for fld in ecape_ml ecape_mu ratio_mu; do
            [ -f "assets/ecape/anim/$fld/F00.webp" ] && cp "assets/ecape/anim/$fld/F00.webp" "assets/ecape/$fld.webp"
          done
          du -sh assets/ecape/anim

      - name: Publish frames to the orphan branch
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.publish == 'true') && steps.cyc.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The frames branch also carries sst/cptec/brazil/sfs frames. Force-
          # pushing only our tree would DELETE them, so clone the existing branch,
          # swap in just assets/ecape/anim, and re-orphan the combined result.
          TMP=$(mktemp -d)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch frames --single-branch -q "$URL" "$TMP/f"; then
            echo "  cloned existing frames branch ($(du -sh "$TMP/f" | cut -f1))"
          else
            echo "  no frames branch yet - creating one"
            mkdir -p "$TMP/f" && git -C "$TMP/f" init -q && git -C "$TMP/f" remote add origin "$URL"
          fi
          rm -rf "$TMP/f/assets/ecape/anim"
          mkdir -p "$TMP/f/assets/ecape"
          cp -r assets/ecape/anim "$TMP/f/assets/ecape/"
          # The manifest belongs on main (same-origin fetch), not here.
          rm -f "$TMP/f/assets/ecape/anim/ecape_manifest.json"
          cd "$TMP/f"
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git checkout -q --orphan fresh
          git add -A
          if git diff --cached --quiet; then echo "no frame changes"; exit 0; fi
          git commit -q -m "animation frames $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force -q origin fresh:frames
          echo "  pushed $(find assets -name '*.webp' | wc -l) frames"

      - name: Commit manifest & stills to main
        if: ${{ (github.event_name == 'schedule' || github.event.inputs.publish == 'true') && steps.cyc.outputs.skip != 'true' }}
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          # Only the manifest and the stills - never the frame webp.
          git add assets/ecape/anim/ecape_manifest.json assets/ecape/*.webp
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1

      - name: Upload rendered loop (dry runs, and as a record of published ones)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecape-${{ steps.cyc.outputs.cycle }}
          path: |
            assets/ecape/anim/ecape_manifest.json
            assets/ecape/anim/ratio_mu
          if-no-files-found: warn
          retention-days: 7
