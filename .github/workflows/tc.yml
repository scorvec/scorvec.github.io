name: TC board (AIFS-ENS + IFS-ENS tracks, IFS control maps)

# The tropical-cyclone products of circulation.html (scripts/mjo/src/tc_*.py), on their own clock:
#   tc_ens.py    the storm board: ECMWF's tracker on both ensembles' 100 perturbed members, each followed past the
#                tracker on its own ensemble's sea-level pressure; recurvature outcomes, post-tropical timing, depth after
#                transition, pooled odds and the watch (data/tc_board.json, tc/tracks_*.webp, tc/depth_*.webp)
#   tc_phase.py  cyclone phase space on the IFS control (data/tcphase.json, tc/phase_*.webp)
#   tc_maps.py   dynamic-tropopause loops around each storm on the IFS control (frames branch: assets/sst/anim/tcdt/)
# The track record the board quotes is tc-verify.yml's. Cadence: 00 and 12 UTC. IFS-ENS day 10 reaches the Google mirror
# ~T+8.5-8.7 h, so the dispatcher fires at T+8.7 h and again ~1.5 h later; the check job takes the newest cycle whose
# every input is on the mirror (scripts/ecmwf/cycles.py --profile tc) and stops when main already carries it complete
# (an incomplete cycle - one ensemble or its pressure missing - is rebuilt by a later slot).
# Two stages for the maps: the board's run draws them from the IFS control's 0.25-degree run; the IFS control's 0.1-degree
# run reaches the mirror ~2 h later (00Z: day 10 ~09:40Z, 12Z ~21:40Z), and the later slot (10:10 / 22:10) then
# redraws only the maps from it (build=maps), with the board's own member tracks (the tc-members artifact). A run that
# finds the 0.1-degree run already out draws its maps from it directly (cycles.py --profile ifs-0p1), and a 0.25-degree
# run never replaces a cycle's 0.1-degree maps (tc_maps.py).
on:
  # Backstop crons at the dispatcher's later slots, for when it is off.
  schedule:
    - cron: '10 10 * * *'
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Cycle date YYYYMMDD (blank = the newest ready cycle)'
        default: ''
      time:
        description: 'Cycle hour, 00 or 12 (blank = the newest ready cycle)'
        default: ''
      force:
        description: 'rebuild a cycle main already carries'
        type: boolean
        default: false
      resol:
        description: 'Grid of the IFS control maps, 0p25 or 0p1 (blank = 0p1 once that run is complete)'
        default: ''

permissions:
  contents: write
  actions: read   # a maps-only redraw downloads the board run's member tracks (artifact)

concurrency:
  group: tc
  cancel-in-progress: false

# ECMWF open data from the Google Cloud mirror only (the shared store and rangefetch refuse any other host).
env:
  ECMWF_SOURCES: google
  ECMWF_RANGE_GAP_MB: '0.5'   # IFS-ENS msl: 50 messages scattered through each step's ~8,500 (rangefetch.MAX_GAP)
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date: ${{ steps.cyc.outputs.date }}
      time: ${{ steps.cyc.outputs.time }}
      resol: ${{ steps.grid.outputs.resol }}
      build: ${{ steps.done.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ecmwf
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the resolver's HTTP client
        run: pip install --quiet requests

      - name: Resolve cycle
        id: cyc
        working-directory: scripts/ecmwf
        run: |
          set -euo pipefail
          D="${{ github.event.inputs.date }}"; T="${{ github.event.inputs.time }}"
          if [ -z "$D" ] || [ -z "$T" ]; then
            python cycles.py --profile tc --out /tmp/cyc || true
            D=$(awk '{print $1}' /tmp/cyc 2>/dev/null || true)
            T=$(awk '{print $2}' /tmp/cyc 2>/dev/null || true)
          fi
          if ! echo "$D" | grep -qE '^[0-9]{8}$' || ! echo "$T" | grep -qE '^(00|12)$'; then
            echo "ERROR: no ready cycle (D='$D' T='$T') - see the resolver's lines above" >&2; exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "time=$T" >> "$GITHUB_OUTPUT"
          echo "cycle: $D ${T}Z"

      - name: Grid of the IFS control maps (0.1 deg once that run is complete)
        id: grid
        working-directory: scripts/ecmwf
        env:
          WANT: ${{ github.event.inputs.resol }}
        run: |
          if [ "$WANT" = "0p25" ] || [ "$WANT" = "0p1" ]; then
            echo "resol=$WANT" >> "$GITHUB_OUTPUT"
          elif python cycles.py --profile ifs-0p1 --date "${{ steps.cyc.outputs.date }}" --time "${{ steps.cyc.outputs.time }}" --check; then
            echo "resol=0p1" >> "$GITHUB_OUTPUT"
          else
            echo "resol=0p25" >> "$GITHUB_OUTPUT"
          fi

      # build=full: the board, the phase space and the maps; build=maps: the board is published and the 0.1-degree run is
      # now out, so only the maps are redrawn; build=none: nothing new.
      - name: Already published?
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ steps.grid.outputs.resol }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then echo "build=full" >> "$GITHUB_OUTPUT"; exit 0; fi
          D="${{ steps.cyc.outputs.date }}"; want="${D:0:4}-${D:4:2}-${D:6:2}T${{ steps.cyc.outputs.time }}:00Z"
          raw() { gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=main" -H "Accept: application/vnd.github.raw+json" 2>/dev/null; }
          have=$(raw assets/sst/data/tc_board.json \
                 | python -c "import json, sys; b = json.load(sys.stdin); print(b.get('init', ''), b.get('complete', False))" 2>/dev/null || true)
          maps=$(raw assets/sst/anim/tcdt/tcdt_manifest.json \
                 | python -c "import json, sys; m = json.load(sys.stdin); print(m.get('init', ''), m.get('resol', '0p25'), bool(m.get('regions')))" 2>/dev/null || true)
          if [ "$have" != "$want True" ]; then
            echo "main has '${have:-no tc_board.json}'; building $want at $R"; echo "build=full" >> "$GITHUB_OUTPUT"
          elif [ "$R" = "0p1" ] && [ "$maps" = "$want 0p25 True" ]; then
            echo "main carries the $want board with 0.25-degree maps; the 0.1-degree run is out: redrawing the maps"
            echo "build=maps" >> "$GITHUB_OUTPUT"
          else
            echo "main already carries the $want cycle, complete (maps: ${maps:-none}); nothing to do"; echo "build=none" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      D: ${{ needs.check.outputs.date }}
      T: ${{ needs.check.outputs.time }}
      R: ${{ needs.check.outputs.resol }}
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt

      # The board is the product: if it fails, the job fails and nothing is published.
      - name: Storm board (tracks, recurvature, post-tropical, depth, watch)
        if: env.BUILD == 'full'
        working-directory: scripts/mjo
        run: python src/tc_ens.py --date "$D" --time "$T" --out-dir ../../assets/sst --members "$RUNNER_TEMP/tc_members.json"

      # the board's member tracks, for the 0.1-degree redraw of its maps ~2 h later
      - uses: actions/upload-artifact@v7
        if: env.BUILD == 'full'
        with:
          name: tc-members-${{ env.D }}${{ env.T }}
          path: ${{ runner.temp }}/tc_members.json
          retention-days: 2

      - name: Cyclone phase space (Hart 2003, IFS control)
        if: env.BUILD == 'full'
        working-directory: scripts/mjo
        run: |
          python src/tc_phase.py --date "$D" --time "$T" --board ../../assets/sst/data/tc_board.json \
            --out-dir ../../assets/sst --json ../../assets/sst/data/tcphase.json \
            || "$GITHUB_WORKSPACE/scripts/lib/degraded.sh" "TC phase space"

      - name: Member tracks of the published board (maps-only redraw)
        if: env.BUILD == 'maps'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tc-members-$D$T&per_page=10" \
                  --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -z "$run" ]; then echo "::error::no member tracks of the $D ${T}Z board to redraw its maps with"; exit 1; fi
          gh run download "$run" -n "tc-members-$D$T" -D "$RUNNER_TEMP"

      # A full build carries on without its maps (degraded); a maps-only redraw that fails publishes nothing, so the
      # 0.25-degree maps stay.
      - name: Dynamic-tropopause maps around each storm (IFS control)
        working-directory: scripts/mjo
        run: |
          python src/tc_maps.py --date "$D" --time "$T" --board ../../assets/sst/data/tc_board.json \
            --members "$RUNNER_TEMP/tc_members.json" --anim-dir ../../assets/sst/anim/tcdt --resol "$R" \
            || { if [ "$BUILD" = "maps" ]; then exit 1; fi; "$GITHUB_WORKSPACE/scripts/lib/degraded.sh" "TC dynamic-tropopause maps"; }

      # The publisher retries a lost lease itself; a collision can still end it, so the whole publish is tried three
      # times. An empty directory (no storm) is skipped by the publisher and the branch keeps its copy.
      - name: Publish the map frames to the frames branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if bash scripts/lib/publish_frames_ci.sh assets/sst/anim/tcdt; then exit 0; fi
            echo "::warning::frames publish attempt $i failed; retrying"; sleep $((20 * i))
          done
          exit 1

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a maps-only redraw commits only the map manifest: the board files in this checkout may be older than main's
          OUT="assets/sst/anim/tcdt/tcdt_manifest.json"
          if [ "$BUILD" = "full" ]; then OUT="$OUT assets/sst/data/tc_board.json assets/sst/data/tcphase.json assets/sst/tc"; fi
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            # the per-storm figures: the folder is replaced wholesale so departed storms' files go
            if tar tf "$SNAP/outs.tar" 2>/dev/null | grep -q '^assets/sst/tc/'; then rm -rf assets/sst/tc; fi
            tar xf "$SNAP/outs.tar"
            for f in $OUT; do [ -e "$f" ] && git add -A "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            if [ "$BUILD" = "full" ]; then git commit -m "TC board: ${D}_${T}z"; else git commit -m "TC maps at $R: ${D}_${T}z"; fi
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: scripts/lib/degraded.sh --summary
