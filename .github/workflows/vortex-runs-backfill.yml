name: Polar vortex run record, backfill (AIFS-ENS and IFS-ENS past runs -> runs/vortex_{aifs,ifs}.json)

# Adds past 00/12 UTC runs of AIFS-ENS and IFS-ENS to their run-to-run records (scripts/strat/run_record.py) that
# strat.yml and strat-ifs.yml extend every cycle: nh_vortex.py --record-only per run, IFS pulled light (u at 10/100 hPa
# and gh at 100 hPa at the daily steps, ~2 GB a run), ECMWF open data from the Google Cloud mirror only. GEPS keeps no
# archive, so its record starts with the first live run. The records are merged into main's at commit time (a run added
# meanwhile stays); strat-combine.yml redraws the figures after the next stratosphere run.
on:
  workflow_dispatch:
    inputs:
      days:
        description: days of runs to add, ending yesterday
        default: '7'

permissions:
  contents: write

concurrency:
  group: strat-ifs  # one writer of the record at a time
  cancel-in-progress: false

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)
  ECMWF_SOURCES: google
  ECMWF_MULTISOURCE: "0"
  ECMWF_RPS_GOOGLE: "60"
  ECMWF_RPS: "60"
  ECMWF_RANGE_GAP_MB: "0.5"
  MPLBACKEND: Agg

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
          pip install -r scripts/mjo/requirements-mjo.txt

      - name: Past runs
        env:
          DAYS: ${{ inputs.days }}
        run: |
          for k in $(seq "$DAYS" -1 1); do
            d=$(date -u -d "$k days ago" +%Y%m%d)
            for t in 00 12; do
              python scripts/strat/nh_vortex.py --cycle "$d$t" --models aifs,ifs --record-only \
                || echo "::warning::run $d ${t}Z not recorded"
              rm -rf scripts/ecmwf/cache/* scripts/strat/data/vortex_dl  # one run's files at a time
            done
          done
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d); cp assets/sst/data/runs/vortex_aifs.json assets/sst/data/runs/vortex_ifs.json "$SNAP"/
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            python scripts/strat/run_record.py merge "$SNAP"
            git add assets/sst/data/runs/vortex_aifs.json assets/sst/data/runs/vortex_ifs.json
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "Polar vortex run record: backfill"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1
