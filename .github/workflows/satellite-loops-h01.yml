name: IR satellite — 01Z

# One of 6 schedule-only callers for satellite-loops.yml. Each asks GitHub for a
# SINGLE firing per day - the frequency band measured as honoured far more often
# than one workflow asking for several. All the work lives in the reusable
# workflow; this file is only the schedule.
on:
  schedule:
  - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/satellite-loops.yml
    secrets: inherit
