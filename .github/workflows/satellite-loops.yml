name: IR satellite loops (GMGSI)

# Tropical Pacific AND South/Central America enhanced-IR loops from the same
# GMGSI global mosaic, in ONE job.
#
# WHY MERGED. They were two workflows running the same script with a different
# --region, each paying its own checkout and its own cartopy/matplotlib install
# - about two minutes of setup to do roughly one minute of rendering, twice.
# They also asked for 24 firings a day each: 48 of the 102 daily firings this
# repo requested, against a queue that serves about 24. Merging halves the slots
# and pays the setup once.
#
# WHY THE DROP TO 6/day IS FREE. Both renderers append only what is missing
# (`if not fp.exists()`) across a rolling 48/72 h window, so a run four hours
# after the last one simply renders four frames instead of one. Nothing is lost;
# the window just fills in slightly later.
on:
  workflow_call:
  workflow_dispatch:

# Frame store (Cloudflare R2, S3 API). Absent secrets leave these empty and the
# publishers fall back to the orphan `frames` branch - see scripts/lib/frames_env.sh.
env:
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}

permissions:
  contents: write

concurrency:
  group: satellite-loops
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # two regions now, plus the bounded git-retry loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Pin matplotlib+cartopy: an unpinned upgrade (~2026-06-12) regressed the GeoAxes
      # `bbox_inches="tight"` crop + dropped the title, blowing up the frame geometry.
      - run: pip install --quiet numpy xarray netcdf4 matplotlib==3.10.9 cartopy==0.25.0 shapely

      - name: Seed existing frames
        run: scripts/lib/fetch_frames_ci.sh assets/sst/anim/pacsat assets/sst/anim/samsat

      # Regions run independently: a failure fetching one must not cost the other
      # its frames, which is what two separate workflows used to give for free.
      - name: Render tropical Pacific
        id: pac
        continue-on-error: true
        run: python scripts/sst/pacific_satellite.py

      - name: Render South & Central America
        id: sam
        continue-on-error: true
        run: python scripts/sst/pacific_satellite.py --region samsat

      - name: Publish frames to the orphan branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/lib/publish_frames_ci.sh assets/sst/anim/pacsat assets/sst/anim/samsat

      - name: Commit & push
        run: |
          git config user.name "Shawn Corvec"
          git config user.email "shawncorvec@hotmail.com"
          git add -A assets/sst/anim/pacsat_manifest.json assets/sst/anim/samsat_manifest.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data update: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if timeout 120 git pull --rebase --autostash -X theirs origin main && timeout 180 git push; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true   # a timed-out pull can strand a half-done rebase
            sleep 5
          done
          echo "push failed after retries"; exit 1

      # A region that failed must still fail the run, or a silent renderer
      # breakage looks green forever - the exact trap that froze nine loops
      # when sst.yml had no publisher.
      - name: Fail if a region did not render
        if: ${{ steps.pac.outcome != 'success' || steps.sam.outcome != 'success' }}
        run: |
          echo "pacific=${{ steps.pac.outcome }} samerica=${{ steps.sam.outcome }}"
          exit 1
