name: TAO heat-content audit (diagnostic, no commit)

# Validation of the equatorial 0-300 m heat-content index (enso-subsurface.html, the analog
# chart): whole TAO record with quality/source codes, old vs screened index, coverage table,
# GLORYS12 at the 8 moorings, CPC/PMEL GODAS references. Outputs are an ARTIFACT only.
# GLORYS point series are slow (~7 min per mooring per product), so one matrix job per mooring.
on:
  workflow_dispatch:
    inputs:
      glorys_run:
        description: 'reuse the gl-* artifacts of this earlier run id instead of fetching GLORYS again'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: tao-hc-audit
  cancel-in-progress: false

jobs:
  glorys:
    if: inputs.glorys_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lon: [165, 180, 190, 205, 220, 235, 250, 265]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sst-${{ runner.os }}-${{ hashFiles('scripts/sst/requirements-sst.txt') }}
          restore-keys: |
            pip-sst-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: scripts/sst/data/hc_audit_cache/gl_my_${{ matrix.lon }}.nc
          key: glorys-my-${{ matrix.lon }}-v1-${{ github.run_id }}
          restore-keys: |
            glorys-my-${{ matrix.lon }}-v1-
      - name: Install
        run: pip install -r scripts/sst/requirements-sst.txt
      - name: Fetch GLORYS12 (reanalysis + analysis) at this mooring
        working-directory: scripts/sst
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python tao_hc_audit.py --glorys-fetch ${{ matrix.lon }}
      - uses: actions/upload-artifact@v7
        with:
          name: gl-${{ matrix.lon }}
          path: scripts/sst/data/hc_audit_cache/gl_*.nc

  audit:
    needs: glorys
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
      AUDIT_OUT: ${{ github.workspace }}/hc_audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sst-${{ runner.os }}-${{ hashFiles('scripts/sst/requirements-sst.txt') }}
          restore-keys: |
            pip-sst-${{ runner.os }}-
      - name: Install
        run: pip install -r scripts/sst/requirements-sst.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: gl-*
          merge-multiple: true
          path: scripts/sst/data/hc_audit_cache
          run-id: ${{ inputs.glorys_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit
        working-directory: scripts/sst
        run: ls -la data/hc_audit_cache; python tao_hc_audit.py 2>&1 | tee "$AUDIT_OUT.log"; exit ${PIPESTATUS[0]}
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hc-audit
          path: |
            hc_audit/
            hc_audit*.log
