name: MJO RMM (AIFS-ENS)

# THE builder since 2026-09-02 (the laptop's com.scorvec.mjo launchd job is
# unloaded; the laptop only dispatches). The "check" job still skips a cycle
# whose RMM PNG already exists and still honours a fresh laptop claim, so a
# one-off local run cannot double-publish. `force=true` rebuilds regardless.
on:
  # Was 8,11 and 20,23 - a second attempt per cycle, added when a cron
  # firing was a coin flip. The dispatcher now fires each slot on time
  # AND re-opens a slot whose run FAILED after 120 min, so the retry
  # belongs to the trigger rather than to asking for the job twice.
  # date/time MUST be declared HERE, not only under workflow_dispatch. The job
  # body reads ${{ inputs.date }} / ${{ inputs.time }}, and under workflow_call
  # the `inputs` context holds ONLY the workflow_call inputs — an undeclared
  # reference is invalid and the run dies with startup_failure before a single
  # step runs. That is what killed the 20Z caller on 2026-09-01.
  workflow_call:
    inputs:
      date:
        description: 'Init date YYYYMMDD (empty = latest available)'
        type: string
        required: false
        default: ''
      time:
        description: 'Init hour 00 or 12 (empty = latest available)'
        type: string
        required: false
        default: ''
      force:
        description: 'Run even if the cycle is already plotted (rebuild every product)'
        type: string
        required: false
        default: 'false'
  workflow_dispatch:
    inputs:
      date:
        description: 'Init date YYYYMMDD (empty = latest available)'
        required: false
        default: ''
      time:
        description: 'Init hour 00 or 12 (empty = latest available)'
        required: false
        default: ''
      force:
        description: 'Run even if the cycle is already plotted (rebuild every product)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write   # gh run cancel: the u-fetch cancels its own run when ECMWF is too slow

concurrency:
  group: mjo-rmm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      date: ${{ steps.decide.outputs.date }}
      time: ${{ steps.decide.outputs.time }}
      compact: ${{ steps.decide.outputs.compact }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install open-data client
        run: pip install ecmwf-opendata
      - name: Decide target cycle
        id: decide
        run: |
          if [ -n "${{ inputs.date }}" ] && [ -n "${{ inputs.time }}" ]; then
            DATE="${{ inputs.date }}"; TIME="${{ inputs.time }}"
            echo "Manual dispatch: $DATE ${TIME}Z"
          else
            # Write the cycle to a FILE — newer ecmwf-opendata releases write a
            # progress bar to STDOUT without a trailing newline, so stdout
            # parsing (even a prefixed line) gets corrupted mid-line. Keep stderr
            # in a log so a probe failure is diagnosable (a fully-silenced probe
            # plus awk-on-missing-file hid the real error for two weeks).
            (cd scripts/mjo/src && python -c \
              "from download_aifs import latest_run; d,t=latest_run(); open('/tmp/aifs_cycle','w').write(f'{d} {t}')" \
              >/dev/null 2>/tmp/aifs_probe.err) || true
            DATE=$(awk '{print $1}' /tmp/aifs_cycle 2>/dev/null || true)
            TIME=$(awk '{print $2}' /tmp/aifs_cycle 2>/dev/null || true)
            echo "Latest available AIFS-ENS: $DATE ${TIME}Z"
          fi
          if ! echo "$DATE" | grep -qE '^[0-9]{8}$' || ! echo "$TIME" | grep -qE '^(00|12)$'; then
            echo "ERROR: could not determine cycle (DATE='$DATE' TIME='$TIME')" >&2
            echo "--- latest_run stderr (last 40 lines) ---" >&2
            tail -40 /tmp/aifs_probe.err >&2 2>/dev/null || true
            exit 1
          fi
          COMPACT="${DATE}_${TIME}z"
          # Laptop claim: run_local.sh publishes assets/mjo/claim.json before its
          # long u-fetch. A claim on this cycle younger than 3 h means the laptop
          # is alive and mid-run — defer instead of racing the same download
          # (2026-07-25: both fetched in parallel; the Action timed out for
          # nothing). A stale claim (laptop crashed mid-run) is ignored, and a
          # laptop that is down never claims at all, so the fallback still fires.
          # Manual dispatches bypass the claim.
          CLAIM_CYCLE=$(python -c "import json;print(json.load(open('assets/mjo/claim.json')).get('cycle',''))" 2>/dev/null || echo "")
          CLAIM_AGE=$(python -c "import json;from datetime import datetime,timezone;t=datetime.fromisoformat(json.load(open('assets/mjo/claim.json'))['started'].replace('Z','+00:00'));print(int((datetime.now(timezone.utc)-t).total_seconds()//60))" 2>/dev/null || echo 99999)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true — rebuilding ${COMPACT} regardless."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "assets/mjo/rmm_${COMPACT}.png" ]; then
            echo "Already plotted (assets/mjo/rmm_${COMPACT}.png) — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] \
               && [ "$CLAIM_CYCLE" = "$COMPACT" ] \
               && [ "$CLAIM_AGE" -ge -15 ] && [ "$CLAIM_AGE" -lt 180 ]; then
            echo "Laptop claimed ${COMPACT} ${CLAIM_AGE} min ago — deferring to the local run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet plotted, no fresh laptop claim — will run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"
          echo "compact=$COMPACT" >> "$GITHUB_OUTPUT"

  run:
    needs: check
    if: ${{ needs.check.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # step timeouts (45m self-cancelling u-fetch, 20m bulk fetch) bound the slow parts
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mjo-${{ runner.os }}-${{ hashFiles('scripts/mjo/requirements-mjo.txt') }}
          restore-keys: |
            pip-mjo-${{ runner.os }}-
      - name: Install eccodes (GRIB decoder)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 libgeos-dev libproj-dev proj-bin
      - name: Install Python dependencies
        run: pip install -r scripts/mjo/requirements-mjo.txt

      # Two stages like run_local.sh: the light RMM u-wind pull (~1 GB) builds
      # and COMMITS the MJO forecast first; the heavy multi-product ENS fetch
      # (~5 GB) comes after, guarded, so slow mirrors (2026-07-17: ~500 kB/s →
      # 60 m job timeout) or a fetch crash (same day: segfault at interpreter
      # exit AFTER "Cycle cache ready", exit 139) can't take the RMM down too.
      # A healthy u-pull takes ~25 m. If it can't finish in 45 m (slow ECMWF
      # dissemination, 2026-07-25) the run CANCELS itself — grey, not a red
      # failure — and the next scheduled cron retries the cycle from scratch.
      - name: Fetch RMM u-wind (light — self-cancels when ECMWF is too slow)
        timeout-minutes: 55   # backstop only; the 45 m `timeout` below acts first
        working-directory: scripts/mjo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          timeout 45m python src/download_aifs.py --date "${{ needs.check.outputs.date }}" \
                                                  --time "${{ needs.check.outputs.time }}" \
                                                  --out-dir data/aifs
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "u-wind fetch exceeded 45 m — cancelling this run; a later cron retries."
            gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
            sleep 300   # wait to be killed by the cancellation
            exit 1      # safety net if the cancel didn't land
          fi
          exit "$rc"

      - name: Run RMM pipeline (computes + plots from the cached cycle)
        working-directory: scripts/mjo
        run: |
          python run_rmm.py --skip-download \
                            --date "${{ needs.check.outputs.date }}" \
                            --time "${{ needs.check.outputs.time }}"

      - name: Publish plot to assets/mjo
        run: |
          mkdir -p assets/mjo
          cp "scripts/mjo/plots/rmm_${{ needs.check.outputs.compact }}.png" \
             "assets/mjo/rmm_${{ needs.check.outputs.compact }}.png"
          # keep the most recent 60 archived plots
          ls -t assets/mjo/rmm_*z.png 2>/dev/null | tail -n +61 | xargs -r rm

      - name: Regenerate MJO page
        run: python scripts/mjo/generate_page.py

      - name: Commit & push (RMM forecast — goes live before the heavy fetches)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="assets/mjo mjo.html scripts/mjo/data/reference/obs_history.nc scripts/mjo/data/reference/ensmean_history.json"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi   # falling through would hit "No changes" and fake success
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            ls -t assets/mjo/rmm_*z.png 2>/dev/null | tail -n +61 | xargs -r rm
            git add $OUT
            if git diff --staged --quiet; then echo "No changes."; exit 0; fi
            git commit -m "data update: ${{ needs.check.outputs.compact }}"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          echo "ERROR: could not push RMM." >&2
          exit 1

      - name: Fetch remaining ENS cycle (heavy — Hovmöller 10u + SOI msl)
        timeout-minutes: 20
        continue-on-error: true
        working-directory: scripts/mjo
        run: |
          python src/ens_cycle.py --date "${{ needs.check.outputs.date }}" \
                                  --time "${{ needs.check.outputs.time }}" \
            || echo "ens_cycle had issues; downstream builds use whatever cached"

      - name: Build equatorial 10m-wind Hovmöller (El Niño page)
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst
          python src/eq_hovmoller.py \
            --date "${{ needs.check.outputs.date }}" \
            --time "${{ needs.check.outputs.time }}" \
            --data-dir data/u10 \
            --out ../../assets/sst/eq_wind_hovmoller.webp \
            || echo "Hovmöller build failed; continuing"

      - name: Build SOI forecast (El Niño page)
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst
          python src/soi_forecast.py \
            --date "${{ needs.check.outputs.date }}" \
            --time "${{ needs.check.outputs.time }}" \
            --data-dir data/msl \
            --out ../../assets/sst/soi_forecast.webp \
            || echo "SOI build failed; continuing"

      - name: Build 200 hPa velocity potential (El Niño page)
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/anim/wind200
          # Light: u@200 is already cached from the RMM pull above; only v@200 is fetched.
          python src/wind200_vpot.py \
            --date "${{ needs.check.outputs.date }}" \
            --time "${{ needs.check.outputs.time }}" \
            --anim-dir ../../assets/sst/anim/wind200 \
            --manifest ../../assets/sst/anim/wind200_manifest.json \
            --out ../../assets/sst/wind200.webp \
            || echo "200 hPa velocity potential build failed; continuing"

      - name: Build wave-activity flux (same u+v@200, clim is committed)
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/anim/waf
          python src/waf.py \
            --date "${{ needs.check.outputs.date }}" \
            --time "${{ needs.check.outputs.time }}" \
            --anim-dir ../../assets/sst/anim/waf \
            --manifest ../../assets/sst/anim/waf_manifest.json \
            --out ../../assets/sst/waf.webp \
            || echo "WAF build failed; continuing"

      # ── Products that until 2026-09-02 were built ONLY by the laptop's
      # run_local.sh stage "(a)" (its launchd job was never unloaded in the
      # 2026-08-29 offload, so they kept coming from the laptop). Same data the
      # steps above already pulled (ens_cycle light: sfc + step-0 winds); every
      # builder self-fetches anything missing through store.ensure(). Each is
      # non-fatal so one upstream hiccup does not sink the cycle. The AAM /
      # torque / jets heavy leg lives in aam.yml (needs the ~3 GB 14-level pull).
      - name: MSLP + 10 m wind loop
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/anim/mslp_wind
          python src/mslp_wind_anim.py --date "${{ needs.check.outputs.date }}" --time "${{ needs.check.outputs.time }}" \
            --anim-dir ../../assets/sst/anim/mslp_wind --manifest ../../assets/sst/anim/mslp_wind_manifest.json \
            || echo "MSLP/wind loop failed; continuing"

      - name: SOI history
        working-directory: scripts/mjo
        run: python src/soi_history.py --out ../../assets/sst/soi_history.webp || echo "SOI history failed; continuing"

      - name: Walker + MMSF cross-sections
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/anim/walker ../../assets/sst/anim/mmsf
          python src/walker.py --date "${{ needs.check.outputs.date }}" --time "${{ needs.check.outputs.time }}" \
            --anim-dir ../../assets/sst/anim/walker --manifest ../../assets/sst/anim/walker_manifest.json \
            --out ../../assets/sst/walker_anom.webp || echo "Walker failed; continuing"
          python src/mmsf.py --date "${{ needs.check.outputs.date }}" --time "${{ needs.check.outputs.time }}" --data-dir data/mmsf \
            --anim-dir ../../assets/sst/anim/mmsf --manifest ../../assets/sst/anim/mmsf_manifest.json \
            --out ../../assets/sst/mmsf_anom.webp || echo "MMSF failed; continuing"

      - name: Hadley intensity + edge series
        working-directory: scripts/mjo
        run: |
          mkdir -p ../../assets/sst/data
          python src/hadley_timeseries.py --out ../../assets/sst/hadley_timeseries.webp \
            --json-out ../../assets/sst/data/hadley_timeseries.json || echo "Hadley series failed; continuing"

      # RMM low-frequency filter map: ARCO-ERA5 band means, persistent cache
      # arco_uwind_cache.nc is TRACKED so only the new days are read. Was the
      # laptop's com.scorvec.mjo.map120 daily job.
      - name: Refresh the RMM 120-day filter map (ARCO-ERA5)
        working-directory: scripts/mjo
        run: |
          python src/refresh_map120.py || echo "map120 refresh failed; map left untouched"

      # AIFS single vs ENS-control deterministic scores (ERA5 truth via ARCO)
      # and the AIFS comparison loops. Was the laptop's run_local.sh + the
      # com.scorvec.aifsanim 12Z job.
      - name: AIFS deterministic verification + comparison loops
        run: |
          mkdir -p assets/verify assets/sst/anim/aifs_compare assets/sst/anim/aifs_z500
          python scripts/verify/aifs_det_verify.py --collect --verify \
            --date "${{ needs.check.outputs.date }}" --time "${{ needs.check.outputs.time }}" \
            || echo "AIFS det verification failed; continuing"
          python scripts/verify/aifs_compare_anim.py \
            --date "${{ needs.check.outputs.date }}" --time "${{ needs.check.outputs.time }}" \
            || echo "AIFS comparison loops failed; continuing"

      # HRRR vs RRFS KE spectra from the AWS open-data buckets (no ECMWF data).
      - name: KE spectra (HRRR vs RRFS)
        working-directory: scripts/spectra
        run: |
          mkdir -p ../../assets/spectra
          python ke_spectra.py --date "${{ needs.check.outputs.date }}" --cycle "${{ needs.check.outputs.time }}" \
            --fxx 0 6 24 48 --out ../../assets/spectra/ke_spectra.webp || echo "KE spectra failed; continuing"

      # Cache-bust the static <img>s this run rebuilt (sst.html / enso-atmosphere.html
      # only re-stamp their own ?v= on the SST build otherwise).
      - name: Cache-bust the rebuilt figures
        run: |
          CB=$(date -u +%Y%m%d%H%M)
          perl -0pi -e "s/((?:eq_wind_hovmoller|soi_forecast|soi_history)\.webp)\?v=\w+/\${1}?v=$CB/g" sst.html enso-atmosphere.html
          perl -0pi -e "s/((?:mmsf_anom|walker_anom|hadley_timeseries)\.webp)\?v=\w+/\${1}?v=$CB/g" enso-atmosphere.html

      # The loop frames are gitignored on main; without this they never leave
      # the runner (the laptop's publish_frames.sh used to carry them).
      - name: Publish loop frames to the frames branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/lib/publish_frames_ci.sh assets/sst/anim/wind200 assets/sst/anim/waf assets/sst/anim/mslp_wind \
            assets/sst/anim/walker assets/sst/anim/mmsf assets/sst/anim/aifs_compare assets/sst/anim/aifs_z500

      - name: Commit & push (generated outputs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot outputs, then commit on a clean sync of origin/main each attempt.
          # The old rebase recovery could silently DISCARD the build: leftover unstaged
          # files failed the rebase, and its reset --hard fallback reverted the outputs
          # before re-adding them (bit sst-events.yml 2026-07-17 — "succeeded", pushed
          # nothing). Snapshot+restore makes losing the outputs structurally impossible.
          OUT="assets/mjo mjo.html sst.html enso-atmosphere.html \
               scripts/mjo/data/reference/obs_history.nc scripts/mjo/data/reference/ensmean_history.json \
               scripts/mjo/data/reference/wind_map120.nc scripts/mjo/data/reference/arco_uwind_cache.nc \
               scripts/mjo/data/reference/mmsf_vbar_history.nc scripts/mjo/data/reference/walker_ud_history.nc \
               assets/sst/eq_wind_hovmoller.webp assets/sst/soi_forecast.webp assets/sst/soi_history.webp \
               assets/sst/anim/wind200 assets/sst/anim/wind200_manifest.json assets/sst/wind200.webp \
               assets/sst/anim/waf assets/sst/anim/waf_manifest.json assets/sst/waf.webp \
               assets/sst/anim/mslp_wind_manifest.json \
               assets/sst/anim/walker_manifest.json assets/sst/walker_anom.webp \
               assets/sst/anim/mmsf_manifest.json assets/sst/mmsf_anom.webp \
               assets/sst/hadley_timeseries.webp assets/sst/data/hadley_timeseries.json \
               assets/verify/aifs_det_scores.json assets/sst/anim/aifs_compare_manifest.json assets/sst/anim/aifs_z500_manifest.json \
               assets/spectra/ke_spectra.webp"
          SNAP=$(mktemp -d)
          tar cf "$SNAP/outs.tar" --ignore-failed-read $OUT 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi   # falling through would hit "No changes" and fake success
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar"
            ls -t assets/mjo/rmm_*z.png 2>/dev/null | tail -n +61 | xargs -r rm   # re-apply pruning
            for f in $OUT; do [ -e "$f" ] && git add "$f"; done
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -m "data update: ${{ needs.check.outputs.compact }}"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### MJO RMM ${{ needs.check.outputs.compact }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page: [/mjo.html](https://scorvec.com/mjo.html)" >> "$GITHUB_STEP_SUMMARY"
