name: Daily ERCOT Model + Charts

on:
  schedule:
    - cron: '0 15 * * *'   # 9am CT (UTC-6) every day
  workflow_dispatch:        # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Train model and generate charts
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/ercot_plot.py

      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: retrain model and update charts [skip ci]"
          file_pattern: >
            assets/ercot_load_temp.png
            assets/ercot_diurnal.png
            assets/ercot_curves.png
            assets/ercot_feature_importance.png
            assets/lgbm_model.pkl
            assets/model_meta.json
