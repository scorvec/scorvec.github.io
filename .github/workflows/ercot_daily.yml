name: Daily ERCOT Plot

on:
  schedule:
    - cron: '0 15 * * *'   # 9am CT (UTC-6) every day
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  generate-plot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate ERCOT plot
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/ercot_plot.py

      - name: Commit and push plot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ERCOT load vs temperature plot [skip ci]"
          file_pattern: assets/ercot_load_temp.png assets/ercot_curves.png
