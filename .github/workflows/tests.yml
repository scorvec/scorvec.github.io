name: Tests (offline checks)

# The offline checks that live beside their pipelines: synthetic-data tests of the tropical rainfall blend fit, the recon
# decoders against the sample bulletins, and the sounding climatology's split by synoptic hour. No network, no figures.
on:
  push:
    paths: ['scripts/precip_bias/**', 'scripts/recon/**', 'scripts/skewt/**.py', 'scripts/lib/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['scripts/precip_bias/**', 'scripts/recon/**', 'scripts/skewt/**.py', 'scripts/lib/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy scipy pyproj eccodes
      - name: Tropical rainfall blend
        run: python scripts/precip_bias/test_blend.py
      - name: Recon decoders
        run: python scripts/recon/test_recon.py
      - name: Sounding climatology hours
        run: python scripts/skewt/test_climo_hours.py
