name: Tests (offline checks)

# The offline checks that live beside their pipelines: synthetic-data tests of the tropical rainfall blend fit, the recon
# decoders against the sample bulletins, the sounding climatology's split by synoptic hour, the sounding
# station list's positions and WMO indexes, the global ensemble maps' grids, decoding, codes, gates, run-to-run
# statistics, weather regimes, clusters and teleconnection calibration, and the polar vortex's 10 hPa temperature
# reductions and sudden-warming shares. No network, no figures.
on:
  push:
    paths: ['scripts/precip_bias/**', 'scripts/recon/**', 'scripts/skewt/**.py', 'skewt/stations.json', 'scripts/lib/**', 'scripts/ensmaps/**', 'scripts/regimes/**', 'scripts/strat/nh_vortex.py', 'scripts/strat/test_nh_vortex.py', '.github/workflows/tests.yml']
  pull_request:
    paths: ['scripts/precip_bias/**', 'scripts/recon/**', 'scripts/skewt/**.py', 'skewt/stations.json', 'scripts/lib/**', 'scripts/ensmaps/**', 'scripts/regimes/**', 'scripts/strat/nh_vortex.py', 'scripts/strat/test_nh_vortex.py', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy scipy pandas xarray matplotlib pyproj eccodes pillow "quantmet @ git+https://github.com/scorvec/quantmet-tools@v0.4.2"
      - name: Tropical rainfall blend
        run: python scripts/precip_bias/test_blend.py
      - name: Recon decoders
        run: python scripts/recon/test_recon.py
      - name: Sounding climatology hours
        run: python scripts/skewt/test_climo_hours.py
      - name: Sounding station list
        run: python scripts/skewt/test_stations.py
      - name: Global ensemble maps and their regimes
        run: python scripts/ensmaps/test_ensmaps.py
      - name: Polar vortex temperature and sudden-warming shares
        run: python scripts/strat/test_nh_vortex.py
      - name: Wave compass
        run: python scripts/strat/test_wave_compass.py
