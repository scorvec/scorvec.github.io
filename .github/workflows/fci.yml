name: US credit conditions index

# fci.html: weekly US credit conditions index (scripts/fci/fci_build.py) from FRED's public csv endpoint (no key), the Fed
# Board's GZ spread / excess bond premium csv, Shiller's ie_data.xls and the FFIEC Call Report bulk download
# (scripts/fci/callreport.py; quarterly aggregates kept in assets/fci/callreport_ndfi.json, re-pulled weekly), FHFA's National
# Mortgage Database aggregates and the New York Fed household debt workbook (scripts/fci/housing.py; assets/fci/housing_src.json). FRED posts most
# daily rates the next business morning and the weekly H.8 bank loans / CP outstanding on Fridays, so one run a day at
# 21:40 UTC is plenty (dispatcher slot too: GitHub honours only a fraction of this repo's cron firings). Dispatch with
# publish=false (any branch) to build without committing; the json is kept as a run artifact.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Commit and push the build to main (false = build only, upload the json as an artifact)'
        type: boolean
        default: true
  schedule:
    - cron: '40 21 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: fci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --quiet numpy pandas xlrd openpyxl
      - name: Build the index
        run: python scripts/fci/fci_build.py --out assets/fci --cache "$RUNNER_TEMP/fred"
      - name: Keep the build
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: fci-build
          path: assets/fci/
          retention-days: 7
      - name: Check the page (build-only runs)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          for wh in 1400,10000 390,19000; do
            google-chrome --headless=new --no-sandbox --disable-gpu --window-size=$wh --virtual-time-budget=20000 \
              --enable-logging=stderr --v=0 --dump-dom http://localhost:8765/fci.html > "dom_$wh.html" 2> "log_$wh.txt" || true
            echo "== $wh: console"; grep -i "CONSOLE" "log_$wh.txt" | head -20 || true
            python - "dom_$wh.html" <<'PY'
          import re, sys
          t = open(sys.argv[1]).read()
          for cid in ("daily-card", "spr-card", "eq-card", "rt-card", "liq-card", "hs-card", "ctx-card", "pc-card", "cr-wrap", "adm-card"):
              m = re.search(r'<(?:section|div)[^>]*id="%s"[^>]*>' % cid, t)
              print(cid, "MISSING" if not m else ("hidden" if "hidden" in m.group(0) else "shown"))
          print("plots drawn:", len(re.findall(r'class="main-svg"', t)) // 2, "| tiles:", len(re.findall(r'class="tile"', t)),
                "| admission rows:", t.count("<tr", t.find('id="t-adm"'), t.find('</table>', t.find('id="t-adm"'))))
          m = re.search(r'id="adm-note"[^>]*>(.*?)</p>', t, re.S); print("adm-note:", re.sub("<[^>]+>", "", m.group(1))[:900] if m else None)
          m = re.search(r'id="cr-note"[^>]*>(.*?)</p>', t, re.S); print("cr-note:", re.sub("<[^>]+>", "", m.group(1))[-420:] if m else None)
          PY
            google-chrome --headless=new --no-sandbox --disable-gpu --window-size=$wh --virtual-time-budget=20000 \
              --screenshot="shot_${wh%,*}.png" http://localhost:8765/fci.html >/dev/null 2>&1 || true
          done
      - name: Keep the page check
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: fci-page-check
          path: |
            shot_*.png
            log_*.txt
          retention-days: 7
      - name: Commit & push
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # snapshot + clean resync each attempt (the mjo.yml / sst.yml pattern; never a rebase)
          SNAP=$(mktemp -d)
          git add -A assets/fci/ 2>/dev/null || true
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T - 2>/dev/null || true
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch origin main; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset --hard origin/main
            tar xf "$SNAP/outs.tar" 2>/dev/null || true
            git add -A assets/fci/
            if git diff --staged --quiet; then echo "No changes; skipping commit."; exit 0; fi
            git commit -q -m "data update: credit conditions $(date -u +%Y-%m-%dT%H:%MZ)"
            if timeout 180 git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push $i rejected; resyncing and retrying…"
            sleep 5
          done
          exit 1
      - name: Deploy the site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "site deploy is batched - the dispatcher deploys within 15 min (pages.yml)"
