name: Synoptic maps

# Run after both the wind and solar forecast workflows complete, so the
# plant overlay CSVs are up-to-date before we render maps that use them.
# Avoiding the cron-based parallel schedule prevents the three workflows
# from contending for the same charts.html and git push.
on:
  workflow_run:
    workflows: ["US wind generation forecast", "Solar generation forecast"]
    types: [completed]
  workflow_dispatch:
    inputs:
      cycle:
        description: 'HRRR cycle (UTC, YYYY-MM-DD HH). Empty = latest.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: synoptic-maps
  cancel-in-progress: false

jobs:
  render:
    # Only run if the upstream workflow succeeded (skip on failure).
    # Manual workflow_dispatch invocations bypass this check.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scripts/synoptic
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts/synoptic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/synoptic/requirements-synoptic.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 \
            libgeos-dev \
            libproj-dev \
            proj-bin

      - name: Install Python dependencies
        run: pip install -r requirements-synoptic.txt

      - name: Determine cycle
        id: cycle
        run: |
          if [ -n "${{ inputs.cycle }}" ]; then
            CYCLE="${{ inputs.cycle }}"
            echo "Using manually-specified cycle: $CYCLE"
          else
            CYCLE=$(python -c "
          import io, contextlib
          buf = io.StringIO()
          with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
              from herbie import Herbie
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc).replace(minute=0, second=0,
                                                    microsecond=0, tzinfo=None)
          for hours_back in range(2, 24):
              candidate = now - timedelta(hours=hours_back)
              if candidate.hour in (0, 6, 12, 18):
                  try:
                      with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
                          H = Herbie(candidate, model='hrrr', product='sfc', fxx=0)
                          ok = H.grib is not None
                      if ok:
                          print(candidate.strftime('%Y-%m-%d %H'))
                          break
                  except Exception:
                      continue
          ")
            echo "Latest extended cycle: $CYCLE"
          fi
          COMPACT=$(python -c "
          from datetime import datetime
          parts = '$CYCLE'.split()
          dt = datetime.strptime(parts[0] + ' ' + parts[1], '%Y-%m-%d %H')
          print(dt.strftime('%Y%m%dT%HZ'))
          ")
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT
          echo "compact=$COMPACT" >> $GITHUB_OUTPUT

      - name: Render maps
        run: |
          CYCLE='${{ steps.cycle.outputs.cycle }}'
          DATE_PART=$(echo "$CYCLE" | awk '{print $1}')
          HOUR_PART=$(echo "$CYCLE" | awk '{print $2}')
          # Clean up stale outputs before rendering:
          #  - old PNG frames (we now output WebP)
          #  - orphan region dirs from the previous 9-region layout
          # Current regions: national, northwest, southwest, northeast, southeast
          echo "Cleaning stale PNGs and orphan region dirs..."
          find ../../assets/synoptic -name "*.png" -delete 2>/dev/null || true
          for var in wind solar reflectivity visibility ceiling; do
            for old in caiso spp ercot miso pjm newengland bpa nyiso isone se; do
              rm -rf "../../assets/synoptic/$var/$old" 2>/dev/null || true
            done
          done
          # CI runner has ~7 GB RAM and 2-4 CPUs. With spawn-context workers
          # each holding ~800 MB of matplotlib/cartopy state plus the
          # ~2 GB field cache in the main process, we cap at 2 workers
          # to avoid OOM.
          python render_maps.py "$DATE_PART" "$HOUR_PART" --workers 2

      - name: Place viewer page
        run: |
          # The unified viewer lives at the synoptic root and reads
          # variables.json + regions.json to populate its dropdowns.
          cp viewer.html ../../assets/synoptic/viewer.html

      - name: Stamp cycle into charts.html
        run: |
          CYCLE='${{ steps.cycle.outputs.compact }}'
          CHARTS="${{ github.workspace }}/charts.html"
          if [ -f "$CHARTS" ]; then
            sed -i -E "s|(id=\"last-updated-synoptic\">Cycle )[^<]*|\1${CYCLE}|g" "$CHARTS"
          fi

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the freshly-rendered maps FIRST so they're a commit we
          # can rebase. -A captures deletions (e.g. stale PNGs).
          git add -A assets/synoptic/
          git add charts.html
          echo "--- Staged files ---"
          git diff --staged --name-only | head -30
          echo "--------------------"

          if git diff --staged --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "synoptic maps: cycle ${{ steps.cycle.outputs.compact }}"

          # Push with conflict-proof retry. Generated files — keep OUR
          # freshly-rendered version on conflict (`-X theirs` during a
          # rebase keeps the replayed side, i.e. ours). Abort + hard-sync
          # fallback so we never get stuck half-rebased.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i rejected; rebasing onto latest origin/main..."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "Rebase hit an unresolvable state; aborting and retrying."
              git rebase --abort || true
              git reset --hard origin/main
              git add -A assets/synoptic/ || true
              git add charts.html || true
              git diff --staged --quiet || git commit -m "synoptic maps: cycle ${{ steps.cycle.outputs.compact }} (re-applied)"
            fi
            sleep 5
          done
          echo "ERROR: could not push after 5 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "### Synoptic maps summary" >> $GITHUB_STEP_SUMMARY
          echo "- Cycle: \`${{ steps.cycle.outputs.cycle }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- [Viewer](https://scorvec.github.io/assets/synoptic/viewer.html)" >> $GITHUB_STEP_SUMMARY
