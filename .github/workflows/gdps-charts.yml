name: GDPS tropical forecast products

# ECCC GDPS (open Datamart, credential-free): the 10 m wind maps, the 3-hourly
# 150 hPa wind+height loop, and the simulated-IR loop on the Atmosphere page.
# Moved out of the serial run_local_sst.sh (2026-08-25) so a slow or
# skipped run of it can't stall these; the script is idempotent and falls back
# to yesterday's cycle when today's isn't complete yet.
#
# WHEN. A GDPS run reaches day 10 on the Datamart ~4 h 50 min after its start
# (00Z: 04:47-04:49 UTC, 12Z: 16:48-17:09, 10-16 Oct 2026). The laptop's
# readiness dispatcher sends `date` + `cycle` the moment the day-10 file is up;
# the main dispatcher's 06:20/18:20 slots and these crons are the backstop. A
# run whose cycle (or a newer one) is already on the page ends in the check job.
on:
  # backstop crons (2026-10-04: moved here from the per-hour caller files, which were deleted; the
  # dispatcher, scripts/lib/dispatch_workflows.sh, fires this on time - these only matter when it is off)
  schedule:
    - cron: '20 6 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'GDPS cycle, 00 or 12 (blank = derive from the schedule)'
        default: ''
      date:
        description: 'Init date YYYYMMDD (blank = today, else yesterday)'
        default: ''
      force:
        description: 'Rebuild even when the page already shows this run or a newer one'
        type: boolean
        default: false

# Frame store (Cloudflare R2, S3 API). Absent secrets leave these empty and the
# publishers fall back to the orphan `frames` branch - see scripts/lib/frames_env.sh.
env:
  FRAMES_S3_BUCKET: ${{ secrets.FRAMES_S3_BUCKET }}
  FRAMES_S3_ENDPOINT: ${{ secrets.FRAMES_S3_ENDPOINT }}
  FRAMES_S3_REGION: ${{ secrets.FRAMES_S3_REGION }}
  FRAMES_S3_ACL: ${{ secrets.FRAMES_S3_ACL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.FRAMES_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.FRAMES_S3_SECRET_ACCESS_KEY }}
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/constraints.txt   # bounds every pip install (see the file)

permissions:
  contents: write

concurrency:
  group: gdps-charts
  cancel-in-progress: false

jobs:
  # Which run, and is it already on the page? Light: main's CURRENT manifests through the API (a run queued behind
  # another would check out an older commit), no checkout, no installs.
  check:
    runs-on: ubuntu-latest
    outputs:
      cycle: ${{ steps.c.outputs.cycle }}
      shown: ${{ steps.c.outputs.shown }}
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C: ${{ inputs.cycle }}
          D: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          # Which cycle this run is for is decided by WHICH cron fired, not by
          # the clock. GitHub honours only a fraction of this repo's cron
          # firings and delivers them hours late, so a 06:20 job routinely lands
          # after 12:00 - deriving the cycle from the current time would then
          # plot 12Z under the 00Z schedule and vice versa. github.event.schedule
          # identifies the cron itself and is unaffected by the delay.
          if [ -z "$C" ]; then
            case "${{ github.event.schedule }}" in
              '20 18 * * *') C=12 ;;
              *)             C=00 ;;
            esac
          fi
          SHOWN=""
          for m in gdps_wind gdps_outflow gdps_ir; do
            v=$(gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/assets/sst/anim/${m}_manifest.json?ref=main" -q .ver 2>/dev/null) || v=""
            [ -n "$v" ] || { echo "::warning::no $m manifest readable on main: building"; SHOWN=""; break; }
            if [ -z "$SHOWN" ] || [ "$v" -lt "$SHOWN" ]; then SHOWN=$v; fi
          done
          WANT="${D:-$(date -u +%Y%m%d)}$C"
          SKIP=0; [ "$FORCE" != "true" ] && [ -n "$SHOWN" ] && [ "$WANT" -le "$SHOWN" ] && SKIP=1
          echo "GDPS ${D:-(today, else yesterday)} ${C}Z; the page shows ${SHOWN:-nothing yet}; already on the page: $SKIP"
          [ "$FORCE" = "true" ] && SHOWN=""                     # forced: no --newer-than either
          { echo "cycle=$C"; echo "shown=$SHOWN"; echo "skip=$SKIP"; } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.skip != '1'
    runs-on: ubuntu-latest
    # Raised from 55 on 2026-08-29 with the wind maps going 6-hourly: that is
    # 40 leads instead of 10, so ~47% more field fetches on a job whose median
    # was already 34.6 min. 55 would have been uncomfortably close.
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      SST_SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-gdps-${{ runner.os }}-v1
      - name: Install cartopy system libs
        run: |
          for i in 1 2 3; do
            if sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 && \
               sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                 libgeos-dev libproj-dev proj-bin libeccodes0 libeccodes-data; then exit 0; fi
            echo "apt attempt $i failed; retrying"; sleep 10
          done
          exit 1
      - name: Install Python dependencies
        run: pip install --quiet numpy pandas scipy xarray netcdf4 cfgrib eccodes matplotlib==3.10.9 cartopy==0.25.0 "shapely>=2.0" "pyproj>=3.5" Pillow
      # These renderers append only what is missing (`if not fp.exists()`),
      # and the frames stopped arriving with the checkout when they moved off
      # main - without this the whole rolling window rebuilds every run.
      - name: Seed existing frames
        run: scripts/lib/fetch_frames_ci.sh assets/sst/anim/gdps_wind assets/sst/anim/gdps_outflow assets/sst/anim/gdps_ir

      - name: Build GDPS products
        id: build
        env:
          C: ${{ needs.check.outputs.cycle }}
          D: ${{ inputs.date }}
          SHOWN: ${{ needs.check.outputs.shown }}
        run: |
          echo "GDPS cycle ${C}Z"
          # --newer-than: the fallback to yesterday's run must not rebuild the run the page already shows
          python scripts/sst/gdps_eq_charts.py --cycle "$C" ${D:+--date "$D"} ${SHOWN:+--newer-than "$SHOWN"}
      - name: Publish frames to the orphan branch
        if: steps.build.outputs.built == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/lib/publish_frames_ci.sh assets/sst/anim/gdps_wind \
            assets/sst/anim/gdps_outflow assets/sst/anim/gdps_ir

      - name: Commit & push
        if: steps.build.outputs.built == '1'
        # Each run REPLACES the frame sets, so the frame count drifts between
        # builds and a rebase hits modify/delete conflicts that -X theirs
        # cannot resolve (bit the first run, 2026-08-25). Instead: move HEAD to
        # fresh origin/main (mixed reset keeps our rendered working tree),
        # stage only our product paths, commit, push. Retry re-does the whole
        # fetch+reset+commit, so a concurrent push just shifts our base.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Manifests only - the frame webp go to the orphan branch (see the
          # publish step above), so main stops carrying 188 images per cycle.
          PATHS="assets/sst/anim/gdps_wind_manifest.json
                 assets/sst/anim/gdps_outflow_manifest.json
                 assets/sst/anim/gdps_ir_manifest.json"
          for i in 1 2 3 4 5; do
            timeout 120 git fetch origin main || { sleep 5; continue; }
            git reset -q FETCH_HEAD
            git add $PATHS
            if git diff --staged --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data update: $(date -u +%Y-%m-%d)"
            if timeout 180 git push origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            git reset -q --soft HEAD^   # undo the commit; refetch and rebuild it
            sleep 5
          done
          echo "push failed after retries"; exit 1
