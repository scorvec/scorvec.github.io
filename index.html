<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafaf8;
    --ink: #1c1c1a;
    --muted: #888580;
    --accent: #2c4a72;
    --rule: #e4e2dc;
    --serif: 'Lora', Georgia, serif;
    --sans: 'Inter', sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem 3rem;
    background: rgba(250,250,248,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-name {
    font-family: var(--serif); font-weight: 400; font-size: 1rem;
    text-decoration: none; color: var(--ink);
  }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-size: 0.82rem; font-weight: 400; letter-spacing: 0.04em;
    text-decoration: none; color: var(--muted); transition: color 0.2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }

  /* HERO BACKGROUND */
  .home {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 6rem 2rem 4rem;
    position: relative;
    background: url('IMG_2253.JPEG') center center / cover no-repeat;
    min-height: calc(100vh - 57px - 57px);
  }
  .home::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(10,14,20,0.55) 0%,
      rgba(10,14,20,0.65) 60%,
      rgba(10,14,20,0.75) 100%
    );
  }
  .home-inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; max-width: 480px; width: 100%;
  }

  /* PHOTO */
  .photo-wrap {
    width: 160px; height: 160px;
    border-radius: 50%;
    background: #dddbd4;
    overflow: hidden; margin-bottom: 2rem;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4);
  }

  /* TEXT */
  h1 {
    font-family: var(--serif); font-weight: 400;
    font-size: 2rem; margin-bottom: 0.3rem;
    color: #fff;
  }
  .title {
    font-size: 0.78rem; font-weight: 400; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(180,205,235,0.9);
    margin-bottom: 1.4rem;
  }
  .bio {
    font-size: 0.93rem; font-weight: 300; line-height: 1.85;
    color: rgba(255,255,255,0.72); margin-bottom: 2rem;
  }

  /* LINKS */
  .home-links {
    display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.76rem; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none;
    padding: 0.65rem 1.5rem;
    border: 1px solid rgba(255,255,255,0.55); color: #fff;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
    background: rgba(255,255,255,0.07);
  }
  .btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
  .btn svg { flex-shrink: 0; }

  /* FOOTER */
  footer {
    padding: 1.2rem 3rem;
    border-top: 1px solid var(--rule);
    display: flex; justify-content: center; align-items: center;
  }
  .counter {
    font-size: 0.72rem; font-weight: 400; letter-spacing: 0.08em;
    color: var(--muted); text-transform: uppercase;
  }
  .counter span { color: var(--ink); font-weight: 500; }

  @media (max-width: 480px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { gap: 1.2rem; }
    footer { padding: 1rem 1.5rem; }
  }
</style>
</head>
