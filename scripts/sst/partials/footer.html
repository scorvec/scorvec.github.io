
<footer>
  <p class="counter">Visitors: <span id="count">&mdash;</span></p>
</footer>

<script>
  fetch('https://api.counterapi.dev/v1/scorvec/visits/up')
    .then(r => r.json())
    .then(d => { document.getElementById('count').textContent = d.count.toLocaleString(); })
    .catch(() => { document.getElementById('count').textContent = '—'; });
</script>
<script>
  // Size each animation iframe to its embedded content's exact height (image +
  // controls), so the wide plots fill their cards with no letterboxing on any screen.
  addEventListener('message', function (e) {
    var d = e.data; if (!d || d.type !== 'sstAnimHeight') return;
    var fr = document.querySelectorAll('iframe.anim-embed');
    for (var i = 0; i < fr.length; i++) {
      if (fr[i].contentWindow === e.source) {
        fr[i].style.height = d.h + 'px';
        fr[i].style.aspectRatio = 'auto';
      }
    }
  });
  // Hourly-updating images (committed by their own GitHub Actions, not the page build):
  // load with an hour-granular cache-buster so the latest render shows without churning
  // the page HTML. The page's static ?v= can't cover them (they change between page builds).
  ['soi-hourly', 'kiribati-wind'].forEach(function (id) {
    var im = document.getElementById(id);
    if (im && im.dataset.src) im.src = im.dataset.src + '?v=' + new Date().toISOString().slice(0, 13);
  });
</script>
</body>
</html>
