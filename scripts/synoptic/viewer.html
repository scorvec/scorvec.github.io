<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRRR Synoptic Map Viewer</title>
<style>
  :root {
    --bg: #0f0f0d;
    --fg: #f0ebe0;
    --muted: #999088;
    --accent: #f6c453;
    --panel: #1a1a17;
    --border: #2a2a25;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #frame-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg);
    min-height: 0;
  }
  #frame { width: 100%; height: 100%; object-fit: contain; }
  #message { color: var(--muted); text-align: center; padding: 2rem; }
  #controls {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 0.6rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    font-size: 0.85rem;
  }
  .row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
  .row.transport { gap: 0.4rem; }
  button {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--border);
    padding: 0.35rem 0.6rem; border-radius: 4px;
    cursor: pointer; font-size: 0.85rem; font-family: inherit;
    min-height: 38px; min-width: 38px;
  }
  button:hover { border-color: var(--accent); }
  button.play {
    background: var(--accent); color: var(--bg);
    border-color: var(--accent); font-weight: 600; min-width: 3rem;
  }
  select {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--border);
    padding: 0.35rem 0.6rem; border-radius: 4px;
    font-size: 0.85rem; font-family: inherit; cursor: pointer;
    min-height: 38px;
  }
  select:focus { outline: 1px solid var(--accent); }
  input[type=range] {
    flex: 1; min-width: 120px;
    -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--border);
    border-radius: 2px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50%; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50%; cursor: pointer; border: none;
  }
  .label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .valid { color: var(--fg); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
  .help { color: var(--muted); font-size: 0.7rem; }
  .help kbd {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 3px; padding: 0 4px;
    font-family: monospace; font-size: 0.7rem;
  }

  /* MOBILE: stack controls, hide keyboard hints, larger touch targets */
  @media (max-width: 640px) {
    #controls { padding: 0.5rem 0.6rem; gap: 0.45rem; }
    .row { gap: 0.5rem; }
    .row.transport { gap: 0.3rem; justify-content: center; }
    .row.selectors { justify-content: center; }
    .help { display: none; }            /* keyboard hints irrelevant on touch */
    .valid {
      width: 100%; text-align: center;
      font-size: 0.85rem; order: -1;     /* show valid time above controls */
    }
    select { flex: 1; min-width: 0; }    /* dropdowns fill the row evenly */
    .label { display: none; }            /* save space; dropdowns self-evident */
    button { padding: 0.45rem 0.55rem; }
    #speed { flex: 0 0 auto; }
  }
  @media (max-width: 380px) {
    button { min-width: 34px; min-height: 34px; padding: 0.4rem 0.4rem; }
    button.play { min-width: 2.6rem; }
  }
</style>
</head>
<body>

<div id="frame-wrap">
  <img id="frame" alt="">
  <div id="message" style="display: none;">Loading...</div>
</div>

<div id="controls">
  <div class="row transport">
    <button id="rewind" title="First (Home)">⏮</button>
    <button id="back" title="Step back (←)">◀</button>
    <button id="play" class="play" title="Play/Pause (Space)">▶</button>
    <button id="fwd" title="Step forward (→)">▶</button>
    <button id="end" title="Last (End)">⏭</button>
    <input id="scrubber" type="range" min="0" max="48" value="0" step="1">
    <select id="speed" title="Playback speed">
      <option value="2000">0.5x</option>
      <option value="1000" selected>1x</option>
      <option value="500">2x</option>
      <option value="250">4x</option>
      <option value="125">8x</option>
    </select>
  </div>
  <div class="row selectors">
    <span class="label">Variable:</span>
    <select id="variable"></select>
    <span class="label" style="margin-left: 0.5rem;">Region:</span>
    <select id="region"></select>
    <span class="label" style="margin-left: 0.5rem;">—</span>
    <span class="valid" id="valid">—</span>
    <span class="help" style="margin-left: auto;">
      <kbd>←</kbd> <kbd>→</kbd> step ·
      <kbd>Space</kbd> play ·
      <kbd>Home</kbd> <kbd>End</kbd> jump
    </span>
  </div>
</div>

<script>
const frameEl = document.getElementById('frame');
const messageEl = document.getElementById('message');
const variableEl = document.getElementById('variable');
const regionEl = document.getElementById('region');
const validEl = document.getElementById('valid');
const scrubberEl = document.getElementById('scrubber');
const playBtn = document.getElementById('play');
const speedEl = document.getElementById('speed');

let manifest = null;
let currentIdx = 0;
let playing = false;
let playTimer = null;

function setMessage(msg) {
  if (msg) {
    messageEl.textContent = msg;
    messageEl.style.display = 'block';
    frameEl.style.display = 'none';
  } else {
    messageEl.style.display = 'none';
    frameEl.style.display = '';
  }
}

function preloadFrames(varId, regionId, frames) {
  for (const f of frames) {
    const img = new Image();
    img.src = varId + '/' + regionId + '/' + f.file;
  }
}

function updateFrame() {
  if (!manifest || !manifest.frames.length) return;
  const frame = manifest.frames[currentIdx];
  const variable = variableEl.value;
  const region = regionEl.value;
  frameEl.src = variable + '/' + region + '/' + frame.file;
  validEl.textContent = 'F' + String(frame.fxx).padStart(2, '0') + ' · ' + frame.valid_label;
  scrubberEl.value = currentIdx;
}

function step(delta) {
  if (!manifest) return;
  currentIdx = Math.max(0, Math.min(manifest.frames.length - 1, currentIdx + delta));
  updateFrame();
}

function jumpTo(idx) {
  if (!manifest) return;
  currentIdx = Math.max(0, Math.min(manifest.frames.length - 1, idx));
  updateFrame();
}

function setPlaying(on) {
  playing = on;
  playBtn.textContent = on ? '⏸' : '▶';
  if (playTimer) clearInterval(playTimer);
  if (on) {
    const ms = parseInt(speedEl.value, 10);
    playTimer = setInterval(() => {
      if (!manifest) return;
      currentIdx = (currentIdx + 1) % manifest.frames.length;
      updateFrame();
    }, ms);
  }
}

async function loadCurrent() {
  const variable = variableEl.value;
  const region = regionEl.value;
  setMessage('Loading ' + variable + ' · ' + region + '...');
  try {
    const res = await fetch(variable + '/' + region + '/manifest.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    manifest = await res.json();
    if (!manifest.frames || !manifest.frames.length) {
      setMessage('No frames for ' + variable + ' · ' + region);
      return;
    }
    scrubberEl.max = manifest.frames.length - 1;
    if (currentIdx >= manifest.frames.length) currentIdx = 0;
    setMessage('');
    updateFrame();
    preloadFrames(variable, region, manifest.frames);
  } catch (e) {
    setMessage('Could not load ' + region + ': ' + e);
  }
}

async function init() {
  try {
    const [varsRes, regsRes] = await Promise.all([
      fetch('variables.json'),
      fetch('regions.json'),
    ]);
    if (!varsRes.ok) throw new Error('variables.json: ' + varsRes.status);
    if (!regsRes.ok) throw new Error('regions.json: ' + regsRes.status);
    const varsData = await varsRes.json();
    const regsData = await regsRes.json();

    let defaultVar = null;
    for (const v of varsData.variables) {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.label;
      variableEl.appendChild(opt);
      if (v.default) defaultVar = v.id;
    }
    if (defaultVar) variableEl.value = defaultVar;

    let defaultRegion = null;
    for (const r of regsData.regions) {
      const opt = document.createElement('option');
      opt.value = r.id;
      opt.textContent = r.label;
      regionEl.appendChild(opt);
      if (r.default) defaultRegion = r.id;
    }
    if (defaultRegion) regionEl.value = defaultRegion;
  } catch (e) {
    setMessage('Could not load metadata: ' + e);
    return;
  }

  variableEl.addEventListener('change', loadCurrent);
  regionEl.addEventListener('change', loadCurrent);
  scrubberEl.addEventListener('input', (e) => jumpTo(parseInt(e.target.value, 10)));
  document.getElementById('rewind').addEventListener('click', () => jumpTo(0));
  document.getElementById('back').addEventListener('click', () => step(-1));
  document.getElementById('fwd').addEventListener('click', () => step(1));
  document.getElementById('end').addEventListener('click', () => jumpTo(manifest ? manifest.frames.length - 1 : 0));
  playBtn.addEventListener('click', () => setPlaying(!playing));
  speedEl.addEventListener('change', () => { if (playing) setPlaying(true); });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'Home')   { e.preventDefault(); jumpTo(0); }
    else if (e.key === 'End')    { e.preventDefault(); jumpTo(manifest ? manifest.frames.length - 1 : 0); }
    else if (e.key === ' ')      { e.preventDefault(); setPlaying(!playing); }
  });

  await loadCurrent();
}

init();
</script>
</body>
</html>
